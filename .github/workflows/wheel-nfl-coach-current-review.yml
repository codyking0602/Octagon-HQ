name: Wheel NFL Official Current Coach Evidence (staged)

on:
  workflow_dispatch:
  schedule:
    - cron: '25 11 * * 2' # Biweekly editorial cycle gate below
  push:
    branches: [main]
    paths:
      - '.github/workflows/wheel-nfl-coach-current-review.yml'
  workflow_call:
  pull_request:
    paths:
      - 'scripts/wheel-monitor/nfl-coach-current-*.mjs'
      - 'scripts/wheel-monitor/nfl-coach-current-*.nodecheck.mjs'
      - '.github/workflows/wheel-nfl-coach-current-review.yml'

permissions:
  contents: read

concurrency:
  group: wheel-nfl-current-coaches-${{ github.ref }}
  cancel-in-progress: false

jobs:
  current-coaches:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent --no-audit --no-fund
      - name: Verify current official coach extraction and freshness gates
        run: |
          node --check scripts/wheel-monitor/nfl-coach-current-review.mjs
          node --test scripts/wheel-monitor/nfl-coach-current-source.nodecheck.mjs
      - name: Biweekly editorial cycle
        id: editorial-cycle
        shell: bash
        run: |
          week=$(( ($(date -u +%s) - $(date -u -d '2026-10-27' +%s)) / 604800 ))
          if (( week % 2 == 0 )); then echo "due=true" >> "$GITHUB_OUTPUT"; else echo "due=false" >> "$GITHUB_OUTPUT"; fi
      - name: Collect 32 official live NFL team pages
        run: |
          node scripts/wheel-monitor/nfl-coach-current-review.mjs \
            --out=tmp/wheel-monitor/nfl/current-coaches.json
      - name: Prepare 32-coach editorial review sheet every two weeks
        if: steps.editorial-cycle.outputs.due == 'true'
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          const source=JSON.parse(readFileSync('tmp/wheel-monitor/nfl/current-coaches.json','utf8'));
          const grading=JSON.parse(readFileSync('data/generated/football/wheel-nfl-head-coach-grades-2026-10-03.json','utf8'));
          if(grading.grades.length!==32 || source.rows?.length!==32) throw new Error('Missing all-32 coaching coverage');
          const observed=new Map(source.rows.map(row=>[row.team,row]));
          const reviews=grading.grades.map(row=>({
            team:row.team,coach:row.coach,hqGrade:row.grade,
            currentOfficialCoach:observed.get(row.team)?.observed??null,
            officialStatus:observed.get(row.team)?.sourceStatus??'missing',
            priority:row.coach==='Sean McVay'?'owner-requested-grade-review':'routine-biweekly-review',
            reviewDecision:'pending-editorial-judgment'
          }));
          writeFileSync('tmp/wheel-monitor/nfl/biweekly-coach-review.json',
            JSON.stringify({sport:'NFL',observedAt:new Date().toISOString(),reviewCount:32,
              gradesChanged:0,reviews},null,2)+'\n');
          NODE
      - name: Archive 32-coach editorial review queue
        if: steps.editorial-cycle.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wheel-nfl-biweekly-coach-review
          path: tmp/wheel-monitor/nfl/biweekly-coach-review.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve isolated coach-source evidence, never alter authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-nfl-current-coach-evidence
          path: tmp/wheel-monitor/nfl/current-coaches.json
          retention-days: 30
          if-no-files-found: warn
