name: TEMP PR7 gap fill

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/temp-pr7-gap-fill.yml
      - scripts/temp-pr7-gap-fill.mjs

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply canonical gap-fill ownership
        run: node scripts/temp-pr7-gap-fill.mjs
      - name: Commit ownership fix and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/back-room/footballFactualStatsCore.ts
          git rm scripts/temp-pr7-gap-fill.mjs .github/workflows/temp-pr7-gap-fill.yml
          git commit -m 'fix: make PR7 source facts canonical gap-fill only [materialize-pr7-gap-fill]'
          git push origin HEAD:${{ github.head_ref }}
