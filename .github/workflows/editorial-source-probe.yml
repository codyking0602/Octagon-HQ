name: Editorial source discovery diagnostic
on:
  push:
    branches: [preview/football-editorial-20261013]
    paths: [.github/workflows/editorial-source-probe.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: See actual CDN images
        shell: python
        run: |
          import urllib.request,base64
          urls = {
            "CFB": "https://seatgeekimages.com/matchup/v3_4901d84e/5585/5570/600x450.jpg",
            "NFL": "https://seatgeekimages.com/matchup/v3_4901d84e/2066/2083/600x450.jpg",
          }
          for name,url in urls.items():
            with urllib.request.urlopen(url,timeout=15) as r:
              image = r.read(50000)
              print("VISUAL_"+name+"="+base64.b64encode(image).decode(),flush=True)
