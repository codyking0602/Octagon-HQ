name: Temporary Fetch Heavyweight Thumbnails

on:
  push:
    branches:
      - codex/heavyweight-blind-rank-depth

permissions:
  contents: write

jobs:
  fetch-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/heavyweight-blind-rank-depth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Fetch ESPN headshots and build Play thumbnails
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import requests
          from PIL import Image, ImageOps

          fighters = {
              "ben-rothwell": "2473720",
              "travis-browne": "2504648",
              "gabriel-gonzaga": "2354239",
              "matt-mitrione": "2501702",
              "jairzinho-rozenstruik": "4410084",
              "brendan-schaub": "2500160",
              "walt-harris": "3023815",
              "antonio-silva": "2493018",
              "chase-sherman": "3952937",
          }
          out_dir = Path("public/assets/fighters")
          out_dir.mkdir(parents=True, exist_ok=True)

          for slug, espn_id in fighters.items():
              out = out_dir / f"{slug}-thumb.webp"
              if out.exists():
                  print(f"exists: {out}")
                  continue
              url = f"https://a.espncdn.com/i/headshots/mma/players/full/{espn_id}.png"
              response = requests.get(url, timeout=30)
              response.raise_for_status()
              image = Image.open(BytesIO(response.content)).convert("RGB")
              image = ImageOps.fit(image, (160, 160), method=Image.Resampling.LANCZOS, centering=(0.5, 0.42))
              image.save(out, "WEBP", quality=92, method=6)
              print(f"wrote: {out} ({out.stat().st_size} bytes)")
          PY
      - name: Commit thumbnails
        run: |
          if git diff --quiet -- public/assets/fighters; then
            echo "No thumbnail changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/fighters/*-thumb.webp
          git commit -m "Add Heavyweight Blind Rank thumbnails"
          git push origin HEAD:codex/heavyweight-blind-rank-depth
