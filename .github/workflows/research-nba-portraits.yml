name: Research Historical NBA Portraits
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/research_nba_historical_portraits.py"
      - ".github/workflows/research-nba-portraits.yml"
permissions:
  contents: read
jobs:
  research:
    if: ${{ github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover article-identified image candidates
        run: python scripts/research_nba_historical_portraits.py
