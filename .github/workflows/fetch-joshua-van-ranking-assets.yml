name: Fetch Joshua Van ranking assets

on:
  push:
    branches:
      - feature/ufc-rankings-van-pantoja-rda

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Fetch and convert official ESPN headshot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          curl -fsSL --retry 3 \
            "https://a.espncdn.com/i/headshots/mma/players/full/5120301.png" \
            -o /tmp/joshua-van.png
          mkdir -p public/assets/fighters
          cwebp -quiet -q 90 -resize 512 0 /tmp/joshua-van.png \
            -o public/assets/fighters/joshua-van-profile.webp
          cwebp -quiet -q 88 -resize 256 0 /tmp/joshua-van.png \
            -o public/assets/fighters/joshua-van-thumb.webp
          test "$(head -c 4 public/assets/fighters/joshua-van-profile.webp)" = "RIFF"
          test "$(head -c 4 public/assets/fighters/joshua-van-thumb.webp)" = "RIFF"

      - name: Commit assets and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/fighters/joshua-van-profile.webp public/assets/fighters/joshua-van-thumb.webp
          git rm .github/workflows/fetch-joshua-van-ranking-assets.yml
          git commit -m "Add Joshua Van ranking assets"
          git push origin "HEAD:${{ github.ref_name }}"
