name: Temporary Inspect NFL RB Identities

on:
  push:
    branches:
      - stage13-6-finish-nfl-rb

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Find Grange canonical identity
        run: grep -Rni --exclude='tmp-inspect-nfl-rb-ids.yml' 'Grange' src data docs | head -100 || true
