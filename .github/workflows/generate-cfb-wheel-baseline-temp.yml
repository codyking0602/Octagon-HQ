name: TEMP Generate CFB Wheel Baseline

on:
  push:
    branches:
      - feat/cfb-wheel-current-roster-baseline
    paths:
      - ".github/workflows/generate-cfb-wheel-baseline-temp.yml"
      - "scripts/generate-wheel-cfb-ourlads-priorities.mjs"
      - "src/features/back-room/footballCfbCurrentSchoolScope.ts"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate current CFB Wheel baseline
        run: node scripts/generate-wheel-cfb-ourlads-priorities.mjs
      - name: Commit generated baseline to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/football/cfb/wheel-football-current-priorities-2026.json
          git diff --cached --quiet || git commit -m "Generate 2026 CFB Wheel roster baseline"
          git push origin HEAD:feat/cfb-wheel-current-roster-baseline

      - name: Upload generated baseline
        uses: actions/upload-artifact@v4
        with:
          name: cfb-wheel-current-priorities
          path: data/generated/football/cfb/wheel-football-current-priorities-2026.json
          if-no-files-found: error
          retention-days: 1
