name: Temporary Stage 13 Fix Secondary Identities

on:
  push:
    branches:
      - stage13-6-finish-nfl-secondary

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Correct canonical subject ids
        run: |
          sed -i 's/nfl-jimmy-johnson"/nfl-jimmy-johnson-player"/g' src/features/back-room/footballFactualStatsExpansion.ts
          sed -i 's/nfl-morris-claiborne"/morris-claiborne"/g' src/features/back-room/footballFactualStatsExpansion.ts
      - run: npm run generate:football-cfb-player-seasons && npm run generate:football-factual-universe && npm run generate:football-ledger-audit
      - name: Commit canonical corrections, generated audit, and self-clean
        run: |
          rm .github/workflows/tmp-stage13-fix-secondary-ids.yml
          rm .github/workflows/tmp-stage13-secondary-id-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/back-room/footballFactualStatsExpansion.ts docs/football-ledger-stage13-5-review.md .github/workflows/tmp-stage13-fix-secondary-ids.yml .github/workflows/tmp-stage13-secondary-id-diagnostic.yml
          git commit -m 'Correct NFL secondary canonical factual identities'
          git push origin HEAD:stage13-6-finish-nfl-secondary
