name: Apply Picks Import Fetch Resilience

on:
  push:
    branches:
      - agent/repair-picks-event-import
    paths:
      - ".github/workflows/apply-picks-import-fetch-resilience.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-picks-event-import
          fetch-depth: 1
      - name: Preserve bounded candidate fetch resilience
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index_path = Path("supabase/functions/sync-next-ufc-event/index.ts")
          source = index_path.read_text()
          old = "if (error instanceof SyncError) throw error;"
          new = 'if (error instanceof SyncError && error.code === "UFC_EVENT_TIME_REJECTED") throw error;'
          if source.count(old) != 1:
              raise SystemExit(f"Expected one index match, found {source.count(old)}")
          index_path.write_text(source.replace(old, new, 1))

          test_path = Path("src/features/picks-setup/pickEventImportPolicy.test.ts")
          tests = test_path.read_text()
          old_test = 'expect(syncSource).toContain("if (error instanceof SyncError) throw error;");'
          new_test = 'expect(syncSource).toContain(\'error.code === "UFC_EVENT_TIME_REJECTED"\');'
          if tests.count(old_test) != 1:
              raise SystemExit(f"Expected one test match, found {tests.count(old_test)}")
          test_path.write_text(tests.replace(old_test, new_test, 1))
          PY
          rm .github/workflows/apply-picks-import-fetch-resilience.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Preserve UFC import fetch resilience"
          git push origin HEAD:agent/repair-picks-event-import
