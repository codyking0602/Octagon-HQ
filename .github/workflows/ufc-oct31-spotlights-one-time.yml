name: October 31 UFC real-photo Spotlight rebuild one-time
on:
  push:
    branches:
      - assets/ufc-oct31-spotlights-real-20261027
    paths:
      - scripts/ufc_oct31_rebuild_spotlights.py
permissions:
  contents: write
jobs:
  spotlights:
    if: github.event.head_commit.message == 'Generate real UFC October 31 Spotlights for visual review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow requests beautifulsoup4 rembg onnxruntime
      - name: Build exactly two real-fighter Spotlight WebPs
        run: python scripts/ufc_oct31_rebuild_spotlights.py
      - name: Commit new portraits only to review branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/assets/fighters/renato-moicano-spotlight.webp public/assets/fighters/tom-nolan-spotlight.webp
          git diff --cached --quiet && { echo 'Missing new photos'; exit 1; }
          git commit -m 'Generate two real-portrait main-event Spotlights'
          git push origin "HEAD:${GITHUB_REF_NAME}"
