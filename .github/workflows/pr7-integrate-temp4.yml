name: PR7 temporary integration runner

on:
  push:
    branches:
      - tmp-pr7-integrate-run4

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-pr7-integrate-run4
          fetch-depth: 0
      - name: Trace reachable PR7 research history
        run: node scripts/pr7-stage/trace-history.mjs
