name: Diagnose Event Preview

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-event-preview.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev
      EXPECTED_SYNC_SOURCE_SHA: a191a969d37c655e5c52bb437b2015f3dcf7f648
    steps:
      - uses: actions/checkout@v4
      - name: Run authenticated preview diagnostic
        run: node scripts/verify-event-setup-preview-live.mjs
