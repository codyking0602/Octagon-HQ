name: Fast PR Feedback

on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]

permissions:
  contents: write

concurrency:
  group: fast-pr-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  VITE_SUPABASE_URL: https://octagon-validation.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_octagon_validation_only_00000000000000000000
  VITE_EXPECTED_SUPABASE_HOSTNAME: octagon-validation.supabase.co

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  fast-feedback:
    name: fast feedback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: stage13-6-cfb-historical-coach-facts
          fetch-depth: 1

      - name: Set up Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Regenerate and commit canonical Football audit
        run: |
          npm run generate:football-cfb-player-seasons
          npm run generate:football-factual-universe
          npm run generate:football-ledger-audit
          git add docs/football-ledger-stage13-5-review.md
          if git diff --cached --quiet; then
            echo "Audit artifact already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Football ledger audit artifact"
          git push origin HEAD:stage13-6-cfb-historical-coach-facts
