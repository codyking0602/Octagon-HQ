name: Bootstrap Football NFL History V3

on:
  push:
    branches:
      - feature/football-knowledge-nfl-historical-corpus-v3

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate compact historical NFL corpora
        run: node scripts/import-football-nfl-historical-stats.mjs
      - name: Verify generated outputs
        run: |
          test -s data/generated/football/nfl/player-seasons-1999-2025.json
          test -s data/generated/football/nfl/team-seasons-1999-2025.json
          test -s data/generated/football/nfl/historical-stats-1999-2025.manifest.json
          test -s data/generated/football/nfl/historical-stats-1999-2025.coverage.json
      - name: Commit generated corpora to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/generated/football/nfl/player-seasons-1999-2025.json
          git add -f data/generated/football/nfl/team-seasons-1999-2025.json
          git add -f data/generated/football/nfl/historical-stats-1999-2025.manifest.json
          git add -f data/generated/football/nfl/historical-stats-1999-2025.coverage.json
          git commit -m "Generate complete historical NFL regular-season corpora"
          git push origin HEAD:feature/football-knowledge-nfl-historical-corpus-v3
