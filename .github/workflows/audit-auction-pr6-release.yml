name: Audit Auction PR 6 Release

on:
  push:
    branches:
      - audit/auction-pr6-release-proof
    paths:
      - ".github/workflows/audit-auction-pr6-release.yml"

permissions:
  actions: read
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: b68384af0d7f2d4ebb131d414e50c974f76f1fc4
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Poll exact release workflow chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-artifacts/auction-pr6-release-audit
          report_dir=verification-artifacts/auction-pr6-release-audit
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"
          ready=0
          failed=0

          for attempt in $(seq 1 100); do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$api" > "$report_dir/runs.json"

            state=$(python - "$report_dir/runs.json" "$report_dir/selected-runs.json" "$TARGET_SHA" <<'PY'
          import json
          import sys

          source_path, output_path, target_sha = sys.argv[1:]
          data = json.load(open(source_path))
          required = [
              "Deploy Supabase Backend",
              "Deploy Cloudflare Frontend",
              "Verify Live Frontend Delivery",
              "Verify Live Notification Flow",
          ]
          exact = [run for run in data.get("workflow_runs", []) if run.get("head_sha") == target_sha]
          selected = {}
          for name in required:
              matches = sorted(
                  (run for run in exact if run.get("name") == name),
                  key=lambda run: run.get("created_at") or "",
                  reverse=True,
              )
              if matches:
                  selected[name] = matches[0]
          json.dump(selected, open(output_path, "w"), indent=2, sort_keys=True)
          if len(selected) != len(required):
              print("pending")
          elif any(run.get("status") != "completed" for run in selected.values()):
              print("pending")
          elif any(run.get("conclusion") != "success" for run in selected.values()):
              print("failed")
          else:
              print("ready")
          PY
            )

            echo "Release workflow state on attempt $attempt: $state"
            if [ "$state" = "ready" ]; then
              ready=1
              break
            fi
            if [ "$state" = "failed" ]; then
              failed=1
              break
            fi
            sleep 12
          done

          printf '%s\n' "$ready" > "$report_dir/ready.txt"
          printf '%s\n' "$failed" > "$report_dir/failed.txt"

      - name: Collect exact run jobs, logs, and artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report_dir=verification-artifacts/auction-pr6-release-audit
          test -f "$report_dir/selected-runs.json"

          python - "$report_dir/selected-runs.json" <<'PY' > "$report_dir/run-ids.tsv"
          import json
          import re
          import sys

          selected = json.load(open(sys.argv[1]))
          for name, run in selected.items():
              key = re.sub(r"[^a-z0-9]+", "-", name.lower()).strip("-")
              print(f"{key}\t{run['id']}\t{name}")
          PY

          while IFS=$'\t' read -r key run_id name; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              > "$report_dir/${key}-jobs.json"

            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              > "$report_dir/${key}-artifacts.json"

            if curl --fail --location --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/logs" \
              --output "$report_dir/${key}-logs.zip"; then
              unzip -p "$report_dir/${key}-logs.zip" 2>/dev/null \
                | grep -E "Exact deployment source verified|202609030001|PASS: live shell loads deployment|Auction release proof passed|Auction cleanup proof|completed-only|unrelated|temporary Auction|live-auction-release-proof|deployment marker|Verified exact deployed source|Recorded deployed backend source" \
                | tail -n 120 \
                > "$report_dir/${key}-excerpt.txt" || true
              rm -f "$report_dir/${key}-logs.zip"
            fi
          done < "$report_dir/run-ids.tsv"

      - name: Verify exact live frontend independently
        if: always()
        shell: bash
        run: |
          set +e
          report_dir=verification-artifacts/auction-pr6-release-audit
          EXPECTED_SOURCE_SHA="$TARGET_SHA" \
            OCTAGON_PRODUCTION_ORIGIN="$PRODUCTION_ORIGIN" \
            FRONTEND_DELIVERY_ATTEMPTS=12 \
            FRONTEND_DELIVERY_DELAY_MS=5000 \
            node scripts/verify-live-frontend-delivery.mjs \
            > "$report_dir/live-frontend-verifier.txt" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$report_dir/live-frontend-status.txt"
          cat "$report_dir/live-frontend-verifier.txt"

          curl --fail --silent --show-error \
            --header "Cache-Control: no-cache, no-store, max-age=0" \
            --header "Pragma: no-cache" \
            "$PRODUCTION_ORIGIN/deployment.json?audit=$TARGET_SHA" \
            > "$report_dir/live-deployment.json"

      - name: Write release audit report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report_dir=verification-artifacts/auction-pr6-release-audit
          python - "$report_dir" "$TARGET_SHA" <<'PY'
          import json
          import pathlib
          import sys

          report_dir = pathlib.Path(sys.argv[1])
          target_sha = sys.argv[2]
          selected_path = report_dir / "selected-runs.json"
          selected = json.loads(selected_path.read_text()) if selected_path.exists() else {}
          marker_path = report_dir / "live-deployment.json"
          marker = json.loads(marker_path.read_text()) if marker_path.exists() else {}
          live_status_path = report_dir / "live-frontend-status.txt"
          live_status = live_status_path.read_text().strip() if live_status_path.exists() else "missing"
          ready = (report_dir / "ready.txt").read_text().strip() if (report_dir / "ready.txt").exists() else "0"
          failed = (report_dir / "failed.txt").read_text().strip() if (report_dir / "failed.txt").exists() else "0"

          lines = [
              "# Auction PR 6 release audit",
              "",
              f"- Target merge SHA: `{target_sha}`",
              f"- Workflow chain ready: `{ready}`",
              f"- Workflow chain failed: `{failed}`",
              f"- Live deployment marker: `{marker.get('sha', 'missing')}`",
              f"- Independent live frontend verifier exit: `{live_status}`",
              "",
              "## Exact workflow runs",
              "",
              "| Workflow | Run | Event | Status | Conclusion | Head SHA |",
              "|---|---:|---|---|---|---|",
          ]
          for name in [
              "Deploy Supabase Backend",
              "Deploy Cloudflare Frontend",
              "Verify Live Frontend Delivery",
              "Verify Live Notification Flow",
          ]:
              run = selected.get(name, {})
              lines.append(
                  f"| {name} | {run.get('id', 'missing')} | {run.get('event', 'missing')} | "
                  f"{run.get('status', 'missing')} | {run.get('conclusion', 'missing')} | "
                  f"`{run.get('head_sha', 'missing')}` |"
              )

          lines.extend(["", "## Artifacts", ""])
          for name, run in selected.items():
              key = "-".join(part for part in ''.join(ch.lower() if ch.isalnum() else ' ' for ch in name).split())
              artifact_path = report_dir / f"{key}-artifacts.json"
              artifacts = json.loads(artifact_path.read_text()).get("artifacts", []) if artifact_path.exists() else []
              artifact_text = ", ".join(f"`{item.get('name')}` (ID {item.get('id')})" for item in artifacts) or "none"
              lines.append(f"- **{name}:** {artifact_text}")

          lines.extend(["", "## Focused log evidence", ""])
          for name in selected:
              key = "-".join(part for part in ''.join(ch.lower() if ch.isalnum() else ' ' for ch in name).split())
              excerpt_path = report_dir / f"{key}-excerpt.txt"
              excerpt = excerpt_path.read_text().strip() if excerpt_path.exists() else ""
              lines.extend([f"### {name}", "", "```text", excerpt or "No focused lines matched.", "```", ""])

          verifier_path = report_dir / "live-frontend-verifier.txt"
          lines.extend(["## Independent live delivery", "", "```text", verifier_path.read_text().strip() if verifier_path.exists() else "missing", "```", ""])

          passed = (
              ready == "1"
              and failed == "0"
              and live_status == "0"
              and marker.get("sha") == target_sha
              and all(selected.get(name, {}).get("conclusion") == "success" for name in [
                  "Deploy Supabase Backend",
                  "Deploy Cloudflare Frontend",
                  "Verify Live Frontend Delivery",
                  "Verify Live Notification Flow",
              ])
          )
          lines.extend([f"## Result", "", "PASS" if passed else "FAIL", ""])
          (report_dir / "REPORT.md").write_text("\n".join(lines))
          (report_dir / "result.txt").write_text("PASS\n" if passed else "FAIL\n")
          PY

          cat "$report_dir/REPORT.md"

      - name: Commit immutable audit evidence to audit branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-artifacts/auction-pr6-release-audit
          if git diff --cached --quiet; then
            echo "No audit evidence changed."
          else
            git commit -m "Record Auction PR 6 production release audit"
            git push origin HEAD:audit/auction-pr6-release-proof
          fi

      - name: Require complete release proof
        shell: bash
        run: test "$(cat verification-artifacts/auction-pr6-release-audit/result.txt)" = "PASS"
