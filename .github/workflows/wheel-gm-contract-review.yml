name: Wheel GM Contract Source Review (staged)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/wheel-monitor/gm-contract-*.mjs'
      - 'scripts/wheel-monitor/gm-contract-*.nodecheck.mjs'
      - 'scripts/wheel-monitor/test_gm_contract_term.py'
      - 'scripts/wheel-monitor/gm-verified-contract-assets.py'
      - 'scripts/wheel-monitor/test_gm_verified_contract_assets.py'
      - 'scripts/generate-wheel-nfl-gm-contracts.py'
      - '.github/workflows/wheel-gm-contract-review.yml'

permissions:
  contents: read

concurrency:
  group: wheel-gm-contract-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provider-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test no-publish GM comparator
        run: |
          node --check scripts/wheel-monitor/gm-contract-review.mjs
          node --test scripts/wheel-monitor/gm-contract-compare.nodecheck.mjs
          python -m unittest discover -s scripts/wheel-monitor -p 'test_gm_contract_term.py' -v
          python -m unittest discover -s scripts/wheel-monitor -p 'test_gm_verified_contract_assets.py' -v
      - name: Independently inspect nflverse contract asset publication date
        id: provenance
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/wheel-monitor/gm-contract-provenance.mjs
          node --test scripts/wheel-monitor/gm-contract-provenance.nodecheck.mjs
          node scripts/wheel-monitor/gm-contract-provenance.mjs \
            --out=tmp/wheel-monitor/gm/provider-provenance.json
      - name: Install version-pinned read-only nflverse provider
        run: python -m pip install --disable-pip-version-check nflreadpy==0.1.5
      - name: Require exact published provider contract bytes before comparison
        run: |
          python scripts/wheel-monitor/gm-verified-contract-assets.py \\
            --provenance=tmp/wheel-monitor/gm/provider-provenance.json \\
            --out=tmp/wheel-monitor/gm/verified-contracts.parquet \\
            --receipt=tmp/wheel-monitor/gm/contract-byte-receipt.json
      - name: Build ephemeral live-source contract evidence
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/wheel-monitor/gm
          year=$(date -u +%Y)
          set +e
          python scripts/generate-wheel-nfl-gm-contracts.py \
            --snapshot-date="$(date -u +%F)" \
            --window-end-season="$((year+2))" \
            --output=tmp/wheel-monitor/gm/live-contracts.json \
            --report=tmp/wheel-monitor/gm/provider-report.json \\
            --verified-contracts=tmp/wheel-monitor/gm/verified-contracts.parquet
          status=$?
          set -e
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            echo "::error::Provider request failed; keep last published GM snapshot and report explicitly."
            exit "$status"
          fi
      - name: Compare generated evidence with published immutable snapshot
        if: steps.generate.outcome == 'success'
        shell: bash
        run: |
          node scripts/wheel-monitor/gm-contract-review.mjs \
            --generated=tmp/wheel-monitor/gm/live-contracts.json \
            --sourceExit="${{ steps.generate.outputs.exit_status }}" \
            --out=tmp/wheel-monitor/gm/comparison.json
      - name: Archive source/identity review data only, never publish contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-gm-contract-source-review
          path: |
            tmp/wheel-monitor/gm/provider-report.json
            tmp/wheel-monitor/gm/provider-provenance.json
            tmp/wheel-monitor/gm/contract-byte-receipt.json
            tmp/wheel-monitor/gm/comparison.json
          if-no-files-found: warn
          retention-days: 30

  gm-economy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent --no-audit --no-fund
      - name: Run reproducible published-authority GM economy simulations
        run: |
          npx vitest run \
            src/features/back-room/wheelFootballGmEconomy.test.ts \
            src/features/back-room/footballGmOutcomeCalibration.test.ts
