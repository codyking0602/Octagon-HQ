name: Refresh Stage 13.6 Ledger Artifact

on:
  push:
    branches:
      - fix/stage13-6-joe-greene-dedupe

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/stage13-6-joe-greene-dedupe
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Regenerate canonical Football ledger artifacts
        run: |
          npm run generate:football-cfb-player-seasons
          npm run generate:football-factual-universe
          npm run generate:football-ledger-audit
      - name: Commit generated review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/football-ledger-stage13-5-review.md
          if git diff --cached --quiet; then
            echo "No generated artifact change"
            exit 0
          fi
          git commit -m "Refresh Football ledger review after Joe Greene dedupe"
          git push origin HEAD:fix/stage13-6-joe-greene-dedupe
