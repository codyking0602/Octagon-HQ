name: Temporary Stage 9 finalizer

on:
  push:
    branches:
      - games/20q-football-factual-readiness
    paths:
      - .github/workflows/tmp-stage9-factual-batch.yml

permissions:
  contents: write

concurrency:
  group: stage9-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: games/20q-football-factual-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Preserve locked Stage 9 metric label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/features/back-room/footballFactualStatsCore.ts")
          text = path.read_text()
          old = 'metric("nfl-franchise-best-season-win-percentage-since-1999", "Best franchise season win percentage", "percent", 1),'
          new = 'metric("nfl-franchise-best-season-win-percentage-since-1999", "Best franchise season win percentage since 1999", "percent", 1),'
          if old not in text:
              raise SystemExit("Locked metric label source text was not found exactly once")
          if text.count(old) != 1:
              raise SystemExit("Locked metric label source text was not unique")
          path.write_text(text.replace(old, new))
          PY
      - name: Regenerate canonical Football artifacts
        run: |
          node scripts/generate-football-recognizability.mjs
          npm run generate:football-cfb-player-seasons
          npm run generate:football-career-media-context
          npm run generate:football-factual-universe
          npm run generate:football-ledger-audit
      - name: Remove temporary Stage 9 tooling
        run: |
          git checkout origin/main -- .github/workflows/fast-pr-feedback.yml
          rm -f .github/workflows/tmp-stage9-factual-batch.yml
          rm -f .github/scripts/tmp-stage9-factual-batch.py
          rm -f .github/scripts/tmp-stage9-pool-fix.py
          rm -f .github/scripts/tmp-stage9-final-facts.py
          rm -f .github/scripts/tmp-stage9-collision-fix.py
          rm -f .github/scripts/tmp-stage9-collision-values.py
          rm -f src/features/games/twentyQuestionsMetadataCoverage.audit.test.ts
          rm -f src/features/games/twentyQuestionsCandidateCoverage.audit.test.ts
      - name: Create exact candidate head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Stage 9 factual readiness"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify canonical Football ledger
        run: npm run verify:football-ledger-audit
      - name: Typecheck exact candidate head
        run: npm run typecheck
      - name: Run focused Stage 9 verification
        run: npx vitest run src/features/games/twentyQuestionsFactualReadiness.audit.test.ts src/features/back-room/footballCareerAffiliationProjection.test.ts
      - name: Run full test suite
        run: npm test -- --run
      - name: Resolve public Supabase browser configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing build secret::$name is missing or empty."
              exit 1
            fi
          done
          api_keys_file="$RUNNER_TEMP/supabase-api-keys.json"
          public_config_file="$RUNNER_TEMP/octagon-public-config.env"
          trap 'rm -f "$api_keys_file"' EXIT
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" \
            --output "$api_keys_file"
          node - "$api_keys_file" "$public_config_file" <<'NODE'
          const fs = require('fs');
          const keys = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const publicKey = keys.find((key) => key.type === 'publishable')
            ?? keys.find((key) => key.type === 'legacy' && /anon/i.test(key.name ?? ''));
          const projectId = process.env.SUPABASE_PROJECT_ID;
          if (!/^[a-z0-9-]+$/.test(projectId ?? '')) throw new Error('Invalid Supabase project ID.');
          if (!publicKey?.api_key) throw new Error('No public browser key was returned.');
          fs.writeFileSync(process.argv[3], [
            `VITE_SUPABASE_URL=https://${projectId}.supabase.co`,
            `VITE_SUPABASE_PUBLISHABLE_KEY=${publicKey.api_key}`,
            `VITE_EXPECTED_SUPABASE_HOSTNAME=${projectId}.supabase.co`,
            '',
          ].join('\n'), { mode: 0o600 });
          NODE
      - name: Build production bundle
        shell: bash
        run: |
          set -euo pipefail
          config_file="$RUNNER_TEMP/octagon-public-config.env"
          trap 'rm -f "$config_file"' EXIT
          test -s "$config_file"
          set -a
          . "$config_file"
          set +a
          npm run build
      - name: Push exact verified head
        run: |
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git push origin HEAD:games/20q-football-factual-readiness
