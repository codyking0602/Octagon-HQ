name: TEMP Stage 13 Final Repair

on:
  push:
    branches: [feat/football-ledger-stage13-factual-universe]
    paths:
      - scripts/stage13-final-repair.mjs
      - .github/workflows/temp-stage13-final-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/football-ledger-stage13-factual-universe
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Show promoted NFL specialist pool
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const projection = JSON.parse(fs.readFileSync('data/generated/football/recognizability-projection.json', 'utf8'));
          const rows = projection.records.filter((row) => row.tier !== 'D' && row.kind === 'player-career' && row.league === 'NFL' && ['K','P'].includes(row.position));
          console.log(JSON.stringify(rows.map(({id,name,position,sourceId,tier}) => ({id,name,position,sourceId,tier})), null, 2));
          NODE
      - name: Apply narrow final repair
        run: node scripts/stage13-final-repair.mjs
      - name: Regenerate Stage 13 artifacts
        run: npm run generate:football-factual-universe
      - name: Validate Stage 13 factual closure
        run: npx vitest run src/features/back-room/footballFactualUniverse.test.ts src/features/back-room/footballFactualStats.test.ts
      - name: Validate Keep/Cut exposure repair
        run: npx vitest run src/features/back-room/footballGenerationMaturity.test.ts
      - name: Commit permanent repair and remove temporary scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-stage13-final-repair.yml scripts/stage13-final-repair.mjs
          git add scripts/generate-football-factual-universe.mjs data/generated/football/factual-universe-projection.json data/generated/football/factual-coverage-matrix.json src/features/back-room/footballFactualUniverseProjection.ts src/features/back-room/footballFactualStatsCore.ts src/features/back-room/footballComparisonGeneration.ts
          git commit -m "Close Stage 13 factual and exposure gaps"
          git push origin HEAD:feat/football-ledger-stage13-factual-universe
