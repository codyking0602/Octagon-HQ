name: Temporary split App tests

on:
  push:
    branches:
      - agent/split-slow-app-profile-tests
    paths:
      - .github/workflows/tmp-split-app-tests.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/split-slow-app-profile-tests
          fetch-depth: 1

      - name: Split slow App test ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/App.test.tsx')
          source = path.read_text()

          app_start = source.index('describe("Octagon HQ V2"')
          profile_start = source.index('describe("V1-style fighter profile restoration"')
          coverage_start = source.index('function compactNames')
          final_start = source.index('describe("final profile correctness pass"')

          app_block = source[app_start:profile_start].strip()
          profile_block = (source[profile_start:coverage_start] + source[final_start:]).strip()
          coverage_block = source[coverage_start:final_start].strip()

          shared_route = '''afterEach(cleanup);\n\nfunction renderRoute(path: string) {\n  const router = createMemoryRouter(appRoutes, { initialEntries: [path] });\n  render(\n    <AppProviders>\n      <RouterProvider router={router} />\n    </AppProviders>,\n  );\n  return router;\n}\n'''

          app_imports = '''import { cleanup, fireEvent, render, screen, within } from "@testing-library/react";\nimport { createMemoryRouter, RouterProvider } from "react-router-dom";\nimport { afterEach, describe, expect, it } from "vitest";\nimport { AppProviders } from "./providers";\nimport { appRoutes } from "./router";\n'''

          profile_imports = '''import { cleanup, fireEvent, render, screen, within } from "@testing-library/react";\nimport { createMemoryRouter, RouterProvider } from "react-router-dom";\nimport { afterEach, describe, expect, it, vi } from "vitest";\nimport { AppProviders } from "./providers";\nimport { appRoutes } from "./router";\nimport { categoryBoard } from "../features/rankings/rankingControls";\nimport { categoryDisplayRating } from "../features/rankings/rankingDisplay";\nimport { allTime, getFighter } from "../features/rankings/rankingModel";\nimport { categoryBarFillPercent, profileCategories, profileCategoryRows, tierForRating } from "../features/rankings/profilePresentation";\nimport { profileCopy, whyNotProfileCopy } from "../features/rankings/FighterProfilePage";\nimport { resolveProfileWatchAction } from "../features/rankings/rankingPresentation";\n'''

          coverage_imports = '''import { cleanup, render, screen, within } from "@testing-library/react";\nimport { createMemoryRouter, RouterProvider } from "react-router-dom";\nimport { afterEach, describe, expect, it } from "vitest";\nimport { AppProviders } from "./providers";\nimport { appRoutes } from "./router";\nimport { allTime, getFighter } from "../features/rankings/rankingModel";\nimport { profileCategories, profileDisplayName } from "../features/rankings/profilePresentation";\nimport { resolveProfileWatchAction } from "../features/rankings/rankingPresentation";\n'''

          path.write_text(app_imports + '\n' + shared_route + '\n' + app_block + '\n')
          Path('src/app/FighterProfile.test.tsx').write_text(profile_imports + '\n' + shared_route + '\n' + profile_block + '\n')
          Path('src/app/AllFighterProfileCoverage.test.tsx').write_text(coverage_imports + '\n' + shared_route + '\n' + coverage_block + '\n')
          PY

      - name: Commit split
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/App.test.tsx src/app/FighterProfile.test.tsx src/app/AllFighterProfileCoverage.test.tsx
          git commit -m "Split slow app profile tests"
          git push origin HEAD:agent/split-slow-app-profile-tests
