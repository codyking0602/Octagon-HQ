name: Temporary Stage 13 Finish NFL TE

on:
  push:
    branches:
      - stage13-6-finish-nfl-te

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Hydrate historical NFL TE facts
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/back-room/footballFactualStatsExpansion.ts')
          text = path.read_text()
          marker = '  // NFL receivers and tight ends: real career counting stats, not comparison ratings.\n'
          rows = '\n'.join([
              '  wr("nfl-john-mackey", 331, 5236, 38),',
              '  wr("nfl-charlie-sanders", 336, 4817, 31),',
              '  wr("nfl-dave-casper", 378, 5216, 52),',
              '  wr("nfl-jackie-smith", 480, 7918, 40),',
              '  wr("nfl-mike-ditka", 427, 5812, 43),',
          ]) + '\n'
          if 'wr("nfl-john-mackey"' not in text:
              text = text.replace(marker, marker + rows, 1)
          path.write_text(text)
          PY
      - run: npm run generate:football-cfb-player-seasons && npm run generate:football-factual-universe && npm run generate:football-ledger-audit
      - name: Commit canonical source, generated audit, and self-clean
        run: |
          rm .github/workflows/tmp-stage13-finish-nfl-te.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/back-room/footballFactualStatsExpansion.ts docs/football-ledger-stage13-5-review.md .github/workflows/tmp-stage13-finish-nfl-te.yml
          git commit -m 'Finish Stage 13.6 NFL TE factual hydration'
          git push origin HEAD:stage13-6-finish-nfl-te
