# One-time corrective provisioning; remove before merge.
name: Bootstrap UFC transport secret

on:
  push:
    branches:
      - agent/restore-ufc-picks-source
    paths:
      - ".github/workflows/bootstrap-ufc-transport-secret.yml"

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false
      - name: Configure transport secret without exposing Supabase service credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing bootstrap secret::$name is missing or empty."
              exit 1
            fi
          done
          keys="$RUNNER_TEMP/supabase-api-keys.json"
          token_file="$RUNNER_TEMP/ufc-transport-token"
          trap 'rm -f "$keys" "$token_file"' EXIT
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" \
            --output "$keys"
          node - "$keys" "$token_file" <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const keys = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const service = keys.find((key) => key.type === 'secret')
            ?? keys.find((key) => key.type === 'legacy' && /service.role/i.test(key.name ?? ''));
          if (!service?.api_key) throw new Error('No Supabase service key was returned.');
          const token = crypto.createHash('sha256')
            .update(`octagon-ufc-source-v1:${service.api_key}`)
            .digest('hex');
          fs.writeFileSync(process.argv[3], token, { mode: 0o600 });
          NODE
          cat "$token_file" | npx --yes wrangler@4.123.0 secret put UFC_SOURCE_TRANSPORT_TOKEN --config wrangler.jsonc
          npx --yes wrangler@4.123.0 secret list --config wrangler.jsonc | grep -Fq 'UFC_SOURCE_TRANSPORT_TOKEN'
      - name: Record successful bootstrap on the corrective PR
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/493/comments" \
            -f body='<!-- ufc-transport-bootstrap --> UFC.com browser transport secret bootstrap succeeded. No secret value was exposed.'
