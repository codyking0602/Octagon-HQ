name: Temporary Restore Specialist Owner

on:
  push:
    branches:
      - stage13-6-finish-nfl-specialists

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Restore known-good canonical owner and align specialist review date
        run: |
          git show 4c5370f57db52fffb6614ac9cbfa15457dad724d:src/features/back-room/footballFactualStatsExpansion.ts > src/features/back-room/footballFactualStatsExpansion.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/back-room/footballFactualStatsExpansion.ts')
          text = path.read_text()
          old = 'id: "pfr-specialist-career",\n    publisher: "Pro Football Reference",\n    title: "NFL kicker and punter career records",\n    url: "https://www.pro-football-reference.com/players/",\n    reviewedOn: "2026-08-29"'
          new = old.replace('2026-08-29', '2026-08-25')
          if old not in text:
              raise SystemExit('specialist source block not found in known-good owner')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm run generate:football-cfb-player-seasons && npm run generate:football-factual-universe && npm run generate:football-ledger-audit
      - name: Commit restored owner, generated audit, and self-clean
        run: |
          rm .github/workflows/tmp-restore-specialist-owner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/back-room/footballFactualStatsExpansion.ts docs/football-ledger-stage13-5-review.md .github/workflows/tmp-restore-specialist-owner.yml
          git commit -m 'Restore canonical Stage 13.6 specialist owner'
          git push origin HEAD:stage13-6-finish-nfl-specialists
