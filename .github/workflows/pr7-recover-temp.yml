name: PR7 recovery integration

on:
  push:
    branches:
      - feat/who-am-i-nfl-b-person-identity-research
    paths:
      - .github/workflows/pr7-recover-temp.yml
      - scripts/pr7-recover-temp.py

permissions:
  contents: write

jobs:
  recover-integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR7 branch
        uses: actions/checkout@v4
        with:
          ref: feat/who-am-i-nfl-b-person-identity-research
          fetch-depth: 0
      - name: Recover supplied PR7 research and integrate canonical owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr7-recover-temp.py
      - name: Commit only legitimate PR7 files and remove transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/back-room/footballPersonIdentityKnowledge.ts \
                  src/features/back-room/footballPersonIdentityKnowledge.test.ts \
                  docs/who-am-i-pr7-nfl-b-person-identity-audit.md
          git rm .github/workflows/pr7-recover-temp.yml scripts/pr7-recover-temp.py
          git commit -m "Integrate NFL B-tier person identity knowledge"
          git push origin HEAD:feat/who-am-i-nfl-b-person-identity-research
