name: Rename Cloudflare Production Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rename-cloudflare-worker.yml"

permissions:
  contents: read

concurrency:
  group: octagon-hq-cloudflare-worker-rename
  cancel-in-progress: false

jobs:
  rename-production-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is missing or empty."
              exit 1
            fi
          done

      - name: Rename canonical Worker in place
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api_base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          old_response="$RUNNER_TEMP/octagon-worker.json"
          new_response="$RUNNER_TEMP/the-worker.json"
          rename_response="$RUNNER_TEMP/worker-rename.json"

          old_status=$(curl --silent --show-error --output "$old_response" --write-out '%{http_code}' \
            --header "$auth_header" "$api_base/octagon")
          new_status=$(curl --silent --show-error --output "$new_response" --write-out '%{http_code}' \
            --header "$auth_header" "$api_base/the")

          if [ "$old_status" = "200" ] && [ "$new_status" = "200" ]; then
            echo "::error title=Duplicate Cloudflare Workers::Both octagon and the already exist; refusing to choose an owner."
            exit 1
          fi

          if [ "$old_status" = "200" ] && [ "$new_status" = "404" ]; then
            curl --fail --silent --show-error \
              --request PATCH \
              --header "$auth_header" \
              --header "Content-Type: application/json" \
              --data '{"name":"the"}' \
              "$api_base/octagon" \
              --output "$rename_response"
            node -e 'const fs = require("node:fs"); const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (response.success !== true || response.result?.name !== "the") throw new Error("Cloudflare did not confirm the in-place Worker rename to the.");' "$rename_response"
          elif [ "$old_status" = "404" ] && [ "$new_status" = "200" ]; then
            echo "Worker is already named the; continuing with verification."
          else
            echo "::error title=Unexpected Cloudflare Worker state::octagon returned HTTP $old_status and the returned HTTP $new_status."
            exit 1
          fi

          verify_new_status=$(curl --silent --show-error --output "$new_response" --write-out '%{http_code}' \
            --header "$auth_header" "$api_base/the")
          verify_old_status=$(curl --silent --show-error --output "$old_response" --write-out '%{http_code}' \
            --header "$auth_header" "$api_base/octagon")
          if [ "$verify_new_status" != "200" ] || [ "$verify_old_status" != "404" ]; then
            echo "::error title=Worker rename verification failed::Expected the=200 and octagon=404; received the=$verify_new_status octagon=$verify_old_status."
            exit 1
          fi

          node -e 'const fs = require("node:fs"); const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (response.success !== true || response.result?.name !== "the") throw new Error("Canonical Worker verification did not return the.");' "$new_response"
          echo "Canonical Cloudflare Worker identity is now the."
