name: Temporary Stage 13 Finish NFL RB

on:
  push:
    branches:
      - stage13-6-finish-nfl-rb

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Hydrate historical NFL RB facts
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/back-room/footballFactualStatsExpansion.ts')
          text = path.read_text()
          source_marker = '  {\n    id: "pfr-specialist-career",'
          source = '\n'.join([
              '  {',
              '    id: "pfr-rushing-career",',
              '    publisher: "Pro Football Reference",',
              '    title: "NFL rushing career records",',
              '    url: "https://www.pro-football-reference.com/players/",',
              '    reviewedOn: "2026-08-25",',
              '    coverage: "Completed reviewed historical NFL running-back career rushing production used by the canonical Football factual ledger",',
              '  },',
              '',
          ])
          if 'id: "pfr-rushing-career"' not in text:
              if source_marker not in text:
                  raise SystemExit('specialist source marker not found')
              text = text.replace(source_marker, source + source_marker, 1)
          helper_marker = 'const kicker = ('
          helper = '\n'.join([
              'const rb = (subjectId: string, attempts: number, yards: number, touchdowns: number) =>',
              '  record(subjectId, "nfl-player-career", "pfr-rushing-career", [',
              '    ["nfl-career-rushing-attempts", attempts],',
              '    ["nfl-career-rushing-yards", yards],',
              '    ["nfl-career-rushing-touchdowns", touchdowns],',
              '  ]);',
              '',
          ])
          if 'const rb = (' not in text:
              if helper_marker not in text:
                  raise SystemExit('kicker helper marker not found')
              text = text.replace(helper_marker, helper + helper_marker, 1)
          record_marker = '  // NFL specialists: reviewed career kicking and punting facts.\n'
          rows = '\n'.join([
              '  // NFL running backs: reviewed historical career rushing production.',
              '  rb("nfl-bronko-nagurski", 633, 2778, 25),',
              '  rb("nfl-doak-walker", 309, 1520, 12),',
              '  rb("nfl-frank-gifford", 840, 3609, 34),',
              '  rb("nfl-harold-red-grange", 170, 569, 21),',
              '  record("nfl-jim-thorpe", "nfl-player-career", "pfr-rushing-career", [["nfl-career-rushing-touchdowns", 6]]),',
              '  rb("nfl-oj-simpson", 2404, 11236, 61),',
              '  rb("nfl-paul-hornung", 893, 3711, 50),',
              '  rb("nfl-floyd-little", 1641, 6323, 43),',
              '  rb("nfl-larry-csonka", 1891, 8081, 64),',
              '',
          ])
          if 'rb("nfl-bronko-nagurski"' not in text:
              if record_marker not in text:
                  raise SystemExit('specialist record marker not found')
              text = text.replace(record_marker, rows + record_marker, 1)
          path.write_text(text)
          PY
      - run: npm run generate:football-cfb-player-seasons && npm run generate:football-factual-universe && npm run generate:football-ledger-audit
      - name: Commit canonical source, generated audit, and self-clean
        run: |
          rm .github/workflows/tmp-stage13-finish-nfl-rb.yml .github/workflows/tmp-inspect-nfl-rb-ids.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/back-room/footballFactualStatsExpansion.ts docs/football-ledger-stage13-5-review.md .github/workflows/tmp-stage13-finish-nfl-rb.yml .github/workflows/tmp-inspect-nfl-rb-ids.yml
          git commit -m 'Finish Stage 13.6 NFL RB factual hydration'
          git push origin HEAD:stage13-6-finish-nfl-rb
