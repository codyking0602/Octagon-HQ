name: Repair Auction Private Preview Once

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/auction-private-preview-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/auction-private-preview-proof
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply focused private-preview repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/octagon-private-preview"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"
          cd "$target"
          git checkout "$TARGET_BRANCH"

          python - <<'PY'
          from pathlib import Path

          model = Path("worker/previewModel.ts")
          text = model.read_text()
          old = """  return staticGameChallenge(requestUrl, catalog) ?? DEFAULT_PREVIEW;
}
"""
          new = """  if (requestUrl.pathname === \"/play/auction\" || requestUrl.pathname === \"/play/auction/\") {
    return DEFAULT_PREVIEW;
  }

  return staticGameChallenge(requestUrl, catalog) ?? DEFAULT_PREVIEW;
}
"""
          if old not in text:
              if new not in text:
                  raise SystemExit("preview fallback anchor missing")
          else:
              model.write_text(text.replace(old, new, 1))

          test_file = Path("worker/previewModel.test.ts")
          test_text = test_file.read_text()
          import_anchor = 'import { describe, expect, it } from "vitest";\n'
          extra_import = 'import { ensureDestinationPreview } from "./previewCard";\n'
          if extra_import not in test_text:
              test_text = test_text.replace(import_anchor, import_anchor + extra_import, 1)

          test_anchor = '  it("renders only the completed public Auction result", () => {\n'
          addition = """  it(\"routes private or unavailable Auctions through the canonical private card\", () => {
    const url = new URL(
      \"https://octagon.hq-app.workers.dev/play/auction?auction=123e4567-e89b-42d3-a456-426614174000\",
    );
    const unresolved = resolveRichPreview(url, catalog);
    expect(unresolved.kind).toBe(\"default\");

    const preview = ensureDestinationPreview(url, unresolved);
    expect(preview).toMatchObject({
      kind: \"auction\",
      title: \"Private Auction | Octagon HQ\",
      canonicalPath: \"/play/auction?auction=123e4567-e89b-42d3-a456-426614174000\",
    });
    expect(preview.description).toContain(\"Sign in as a participant\");
    expect(JSON.stringify(preview)).not.toMatch(/bid|rarity|formula|grade|deck|bankroll/i);
  });

"""
          if addition not in test_text:
              if test_anchor not in test_text:
                  raise SystemExit("preview test anchor missing")
              test_text = test_text.replace(test_anchor, addition + test_anchor, 1)
          test_file.write_text(test_text)
          PY

          git rm .github/workflows/repair-auction-private-preview-once.yml
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "3"

          npm ci
          npx vitest run worker/previewModel.test.ts worker/previewCard.test.ts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/previewModel.ts worker/previewModel.test.ts
          git commit -m "Use the private Auction preview before completion"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
