name: Materialize Auction photo repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-auction-photo-repair.yml

permissions:
  contents: read

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'chatgpt/repair-auction-photo-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Canva page render
        env:
          PAGE_URL: "https://media.canva.com/v2/document-image/hash:792072898/height:335/id:DAHRTTm0exk/type:B/width:596?brand=BAGU9Bq9udo&csig=AAAAAAAAAAAAAAAAAAAAANXfxq5O5DsngXF8B7kIvJB_qIXfjHdkA_v3POjLuS1Y&disableexport=T&exp=1785823403&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2Fm0exk%2FDAHRTTm0exk%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260803%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260803T074237Z%26X-Amz-Expires%3D80446%26X-Amz-Signature%3D11eca38f7acf7da56662a49041605b4a931421cc080df25f8873420bb5c62816%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252004%2520Aug%25202026%252006%253A03%253A23%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAJ6ZiAEyW8ZrAnFwzkVwfSNVvYQ1q2Dg47loE492xFgl&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1"
        run: |
          curl --fail --location --silent --show-error "$PAGE_URL" --output /tmp/page.png
          file /tmp/page.png
          identify /tmp/page.png
          stat -c '%s bytes' /tmp/page.png
          test "$(identify -format '%wx%h' /tmp/page.png)" = "596x335"
