name: Verify PR 313 Post-Merge Release

on:
  pull_request:
    paths:
      - ".github/workflows/verify-pr313-post-merge.yml"

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev

    steps:
      - name: Check out exact production main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Resolve successful canonical exact-SHA workflows
        id: workflows
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          script: |
            const expectedSha = process.env.EXPECTED_SHA.toLowerCase();
            const required = [
              "Deploy Supabase Backend",
              "Verify Generalized Daily Backend",
              "Deploy Cloudflare Frontend",
              "Verify Live Frontend Delivery",
            ];

            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: expectedSha,
                per_page: 100,
              });

              const selected = new Map();
              for (const name of required) {
                const candidates = data.workflow_runs.filter((run) => (
                  run.name === name && run.head_sha?.toLowerCase() === expectedSha
                ));
                const passed = candidates.find((run) => (
                  run.status === "completed" && run.conclusion === "success"
                ));
                if (passed) selected.set(name, passed);
              }

              if (selected.size === required.length) {
                for (const name of required) {
                  const run = selected.get(name);
                  core.info(`${name}: ${run.id} ${run.html_url}`);
                  core.setOutput(name.toLowerCase().replace(/[^a-z0-9]+/g, "_"), String(run.id));
                }
                return;
              }

              const observed = required.map((name) => {
                const runs = data.workflow_runs
                  .filter((run) => run.name === name)
                  .map((run) => `${run.id}:${run.status}/${run.conclusion ?? "none"}`)
                  .join(", ") || "none";
                return `${name}=[${runs}]`;
              }).join("; ");
              core.info(`Attempt ${attempt}: ${observed}`);
              if (attempt < 30) await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            core.setFailed(`Canonical exact-SHA workflows were not all successful for ${expectedSha}.`);

      - name: Verify exact live frontend marker
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/deployment.json"
          status=""
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error \
              --output "$marker" \
              --write-out "%{http_code}" \
              "${OCTAGON_PRODUCTION_ORIGIN}/deployment.json?proof=${GITHUB_RUN_ID}-${attempt}" || true)
            if [ "$status" = "200" ] && grep -Fq "\"sha\":\"$EXPECTED_SHA\"" "$marker"; then
              break
            fi
            sleep 10
          done
          test "$status" = "200"
          grep -Fq "\"sha\":\"$EXPECTED_SHA\"" "$marker"
          cat "$marker"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify exact remote migration state and function inventory
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            test -n "${!name:-}"
          done
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          migration_list=$(supabase migration list --linked)
          printf '%s\n' "$migration_list"
          remote_version=$(printf '%s\n' "$migration_list" | sed 's/│/|/g' | awk -F '|' '
            {
              local_version = $1
              remote_version = $2
              gsub(/[^0-9]/, "", local_version)
              gsub(/[^0-9]/, "", remote_version)
              if (local_version == "202609060001") {
                print remote_version
                exit
              }
            }
          ')
          test "$remote_version" = "202609060001"
          supabase db push --linked --dry-run
          function_list=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID")
          printf '%s\n' "$function_list"
          printf '%s\n' "$function_list" | grep -Fq "daily-challenge-runtime"

      - name: Verify exact live daily runtime and authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/daily-challenge-runtime"
          response="$RUNNER_TEMP/daily-runtime.json"
          status=""
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error \
              --dump-header "$RUNNER_TEMP/daily-runtime-headers.txt" \
              --output "$response" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Origin: $OCTAGON_PRODUCTION_ORIGIN" \
              --header "Content-Type: application/json" \
              --data '{"mode":"deployment-info"}' \
              "$endpoint" || true)
            if [ "$status" = "200" ] && grep -Fq "\"deployment_sha\":\"$EXPECTED_SHA\"" "$response"; then
              break
            fi
            sleep 10
          done
          test "$status" = "200"
          grep -Fq "\"deployment_sha\":\"$EXPECTED_SHA\"" "$response"
          grep -Fiq "access-control-allow-origin: $OCTAGON_PRODUCTION_ORIGIN" "$RUNNER_TEMP/daily-runtime-headers.txt"

          unauthorized_status=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/daily-runtime-unauthorized.json" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"mode":"get-today"}' \
            "$endpoint")
          test "$unauthorized_status" = "401"
          grep -Fq "SIGN_IN_REQUIRED" "$RUNNER_TEMP/daily-runtime-unauthorized.json"

      - name: Set up Node for scheduler proof
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify canonical shared hourly scheduler remains healthy
        run: node scripts/verify-production-monitoring-scheduler.mjs

      - name: Record exact post-merge release proof
        shell: bash
        run: |
          {
            echo "### PR #313 exact post-merge release verified"
            echo "- Exact current main and live frontend SHA: \`$EXPECTED_SHA\`"
            echo "- Deploy Supabase Backend run: \`${{ steps.workflows.outputs.deploy_supabase_backend }}\`"
            echo "- Verify Generalized Daily Backend run: \`${{ steps.workflows.outputs.verify_generalized_daily_backend }}\`"
            echo "- Deploy Cloudflare Frontend run: \`${{ steps.workflows.outputs.deploy_cloudflare_frontend }}\`"
            echo "- Verify Live Frontend Delivery run: \`${{ steps.workflows.outputs.verify_live_frontend_delivery }}\`"
            echo "- Remote migration 202609060001: recorded; linked dry run has no pending database changes"
            echo "- daily-challenge-runtime: deployed and returned exact embedded merge SHA"
            echo "- Unauthenticated game access: rejected with HTTP 401 / SIGN_IN_REQUIRED"
            echo "- Canonical shared hourly scheduler: healthy"
          } >> "$GITHUB_STEP_SUMMARY"
