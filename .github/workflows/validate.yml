name: Validate V2

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://octagon-validation.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_octagon_validation_only_00000000000000000000
      VITE_EXPECTED_SUPABASE_HOSTNAME: octagon-validation.supabase.co
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --silent

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 7

      - name: Test
        run: npm test 2>&1 | tee test.log

      - name: Commit reviewed thumbnail repair and remove generators
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'chatgpt/repair-play-thumbnail-framing'
        shell: bash
        run: |
          set -euo pipefail
          changed_assets=$(git diff --name-only -- 'public/assets/fighters/*-thumb.webp' | wc -l | tr -d ' ')
          if [ "$changed_assets" != "46" ]; then
            echo "::error title=Incomplete thumbnail generation::Expected 46 repaired assets, received $changed_assets."
            exit 1
          fi

          git checkout 1894f3b0a23f58b1a8195ac24525f4df1de5d217 -- package.json .github/workflows/validate.yml
          git rm --quiet \
            .github/workflows/repair-play-thumbnail-framing.yml \
            scripts/repair-play-thumbnail-framing.py \
            src/features/play/playThumbnailFramingGenerator.test.ts \
            src/app/treeShaProbe.test.ts

          git add \
            package.json \
            .github/workflows/validate.yml \
            src/features/play/playThumbnailCompleteness.test.ts \
            public/assets/fighters/*-thumb.webp

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair Play fighter thumbnail framing"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
          retention-days: 7

      - name: Verify all five Today’s Challenge phone layouts
        timeout-minutes: 2
        run: node scripts/verify-todays-challenge-phone.mjs 2>&1 | tee todays-challenge-phone.log

      - name: Upload Today’s Challenge phone proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todays-challenge-phone-proof
          path: |
            todays-challenge-phone.log
            ${{ runner.temp }}/todays-challenge-phone-proof/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: npm run build 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          retention-days: 7
