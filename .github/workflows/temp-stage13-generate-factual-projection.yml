name: TEMP Stage 13 Generate Football Factual Projection

on:
  push:
    branches: [stage13-football-factual-universe]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Stage 13 branch
        uses: actions/checkout@v4
        with:
          ref: stage13-football-factual-universe
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate factual projection
        run: node scripts/generate-football-find-leader-runtime.mjs

      - name: Commit generated projection
        run: |
          if git diff --quiet -- data/generated/football/find-leader-runtime-projection.json; then
            echo "Projection already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/football/find-leader-runtime-projection.json
          git commit -m "Generate Stage 13 Football factual projection"
          git push origin HEAD:stage13-football-factual-universe
