name: Update Auction PR 4 From Main

on:
  push:
    branches:
      - codex/implement-complete-gameplay-ui-for-auction
    paths:
      - .github/workflows/update-auction-pr4-main.yml

permissions:
  contents: write

concurrency:
  group: update-auction-pr4-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Auction PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/implement-complete-gameplay-ui-for-auction
          fetch-depth: 0

      - name: Merge exact current main and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/update-auction-pr4-main.yml
          git add -A
          git commit -m "Remove temporary Auction branch update helper"
          git push origin HEAD:codex/implement-complete-gameplay-ui-for-auction
