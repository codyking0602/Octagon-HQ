name: PR7 clean materialize

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/who-am-i-pr7-nfl-b-person-identity-clean
    paths:
      - .github/workflows/pr7-clean-materialize-temp.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean PR7 branch
        uses: actions/checkout@v4
        with:
          ref: feat/who-am-i-pr7-nfl-b-person-identity-clean
          fetch-depth: 0

      - name: Restore authoritative focused test baseline
        run: |
          git fetch origin feat/who-am-i-nfl-b-person-identity-research-temp
          git show 26e91f9fd7c42b496f16d06ca6253d07edfe8071:src/features/back-room/footballPersonIdentityKnowledge.test.ts > src/features/back-room/footballPersonIdentityKnowledge.test.ts

      - name: Materialize validated 99 x 5 PR7 research transport
        run: python3 scripts/pr7-integrate-temp.py

      - name: Keep exact B coverage and narrow the prior A-tier resume invariant
        run: |
          git show 26e91f9fd7c42b496f16d06ca6253d07edfe8071:src/features/back-room/footballPersonIdentityKnowledge.test.ts > src/features/back-room/footballPersonIdentityKnowledge.test.ts
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/features/back-room/footballPersonIdentityKnowledge.test.ts")
          text = path.read_text(encoding="utf-8")
          old = '''    for (const record of footballPersonIdentityKnowledgeRecords) {
      const subject = getFootballSubject(record.subjectId);
      expect(subject).not.toBeNull();
      const structured = footballWhoAmIIdentityFactBank(subject!);
      expect(structured.facts.length).toBeGreaterThanOrEqual(WHO_AM_I_IDENTITY_FACT_MINIMUM_TARGET);
      expect(structured.facts.every((identityFact) => !("knowledgeClass" in identityFact))).toBe(true);
    }
'''
          new = '''    const priorATierSubjectIds = [...PR4_SUBJECT_IDS, ...PR5_SUBJECT_IDS, ...PR6_SUBJECT_IDS];
    for (const subjectId of priorATierSubjectIds) {
      const subject = getFootballSubject(subjectId);
      expect(subject).not.toBeNull();
      const structured = footballWhoAmIIdentityFactBank(subject!);
      expect(structured.facts.length).toBeGreaterThanOrEqual(WHO_AM_I_IDENTITY_FACT_MINIMUM_TARGET);
    }

    for (const record of footballPersonIdentityKnowledgeRecords) {
      const subject = getFootballSubject(record.subjectId);
      expect(subject).not.toBeNull();
      const structured = footballWhoAmIIdentityFactBank(subject!);
      expect(structured.facts.every((identityFact) => !("knowledgeClass" in identityFact))).toBe(true);
    }
'''
          if old not in text:
              raise SystemExit("Could not find over-broad structured-fact assertion to narrow.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove all temporary PR7 transport
        run: |
          rm -rf scripts/pr7-stage
          rm -f scripts/pr7-integrate-temp.py
          rm -f scripts/pr7-payload-part-*.txt
          rm -f .github/workflows/pr7-clean-materialize-temp.yml

      - name: Validate focused PR7 integration
        run: |
          npm ci
          npx vitest run src/features/back-room/footballPersonIdentityKnowledge.test.ts
          git diff --check

      - name: Commit clean PR7 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/back-room/footballPersonIdentityKnowledge.ts \
                  src/features/back-room/footballPersonIdentityKnowledge.test.ts \
                  docs/who-am-i-pr7-nfl-b-person-identity-audit.md
          git add -u scripts/pr7-stage scripts/pr7-integrate-temp.py .github/workflows/pr7-clean-materialize-temp.yml
          git add -u scripts/pr7-payload-part-01.txt scripts/pr7-payload-part-02.txt scripts/pr7-payload-part-03.txt scripts/pr7-payload-part-04.txt scripts/pr7-payload-part-05.txt scripts/pr7-payload-part-06.txt scripts/pr7-payload-part-07.txt
          git commit -m "Integrate NFL B-tier person identity knowledge"
          git push origin HEAD:feat/who-am-i-pr7-nfl-b-person-identity-clean
