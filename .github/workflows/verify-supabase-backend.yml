name: Verify Supabase Backend

on:
  pull_request:
    paths:
      - ".github/workflows/verify-supabase-backend.yml"
      - ".github/workflows/deploy-supabase.yml"
      - "scripts/verify-event-setup-preview-live.mjs"
      - "scripts/verify-live-frontend-delivery.mjs"
      - "scripts/verify-live-auction-release.mjs"
      - "scripts/verify-pin-auth-live.mjs"
      - "scripts/verify-picks-scoring-live.mjs"
      - "scripts/verify-production-monitoring-scheduler.mjs"
      - "scripts/verify-sync-function-deployment.mjs"
      - "scripts/verify-whats-new-live.mjs"
      - "supabase/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  local_sql:
    name: local SQL proof
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Exact SHA checkout failed::Expected $SOURCE_SHA but checked out $checked_out_sha."
            exit 1
          fi
          echo "Local SQL proof source verified: $checked_out_sha"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Prepull fresh-database images in parallel
        shell: bash
        run: |
          set -euo pipefail
          service_table=$(supabase services)
          printf '%s\n' "$service_table"

          : > "$RUNNER_TEMP/supabase-db-images.txt"
          for service in \
            supabase/postgres \
            supabase/gotrue \
            supabase/realtime \
            supabase/storage-api
          do
            version=$(printf '%s\n' "$service_table" | sed 's/│/|/g' | awk -F '|' -v service="$service" '
              {
                image = $1
                version = $2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", image)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", version)
                if (image == service) {
                  print version
                  exit
                }
              }
            ')
            if [ -z "$version" ]; then
              echo "::error title=Supabase service version missing::Could not resolve $service from supabase services."
              exit 1
            fi
            echo "ghcr.io/${service}:${version}" >> "$RUNNER_TEMP/supabase-db-images.txt"
          done

          echo "Fresh-database bootstrap images:"
          cat "$RUNNER_TEMP/supabase-db-images.txt"
          xargs -r -n 1 -P 4 docker pull < "$RUNNER_TEMP/supabase-db-images.txt"

      - name: Execute Auction lifecycle SQL tests on a fresh local database
        shell: bash
        run: |
          set -euo pipefail
          supabase db start
          trap 'supabase stop --no-backup >/dev/null 2>&1 || true' EXIT

          db_url=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          if [ -z "$db_url" ]; then
            echo "::error title=Local Supabase database unavailable::The local database started, but its connection URL was not reported."
            exit 1
          fi

          for test_file in \
            supabase/tests/auction_private_lifecycle.sql \
            supabase/tests/auction_private_lifecycle_hardening.sql \
            supabase/tests/auction_playable_server_engine.sql \
            supabase/tests/auction_notifications_share_release.sql \
            supabase/tests/auction_launch_notification.sql \
            supabase/tests/auction_catalog_expansion.sql \
            supabase/tests/auction_standard_format.sql \
            supabase/tests/pick_monitoring_truthful_decisions.sql
          do
            echo "Executing $test_file"
            psql "$db_url" --set ON_ERROR_STOP=on --file "$test_file"
          done

          echo "Auction lifecycle and launch-notification SQL tests executed successfully against a fresh local database."
          echo "Truthful Picks monitoring and per-fight lock SQL tests executed successfully against the same fresh local database."

  live_backend:
    name: live Supabase proof
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev
      EXPECTED_SYNC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Exact SHA checkout failed::Expected $SOURCE_SHA but checked out $checked_out_sha."
            exit 1
          fi
          echo "Live Supabase proof source verified: $checked_out_sha"

      - name: Set up Node for live production proof
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify GitHub secret names are populated
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing GitHub secret::$name is missing or empty."
              missing=1
            else
              echo "$name is present."
            fi
          done
          exit "$missing"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify access token and project ID
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase projects list --output json > "$RUNNER_TEMP/supabase-projects.json"; then
            echo "::error title=Supabase access token failed::SUPABASE_ACCESS_TOKEN was rejected or does not have project access."
            exit 1
          fi

          if ! grep -Fq "$SUPABASE_PROJECT_ID" "$RUNNER_TEMP/supabase-projects.json"; then
            echo "::error title=Supabase project ID failed::The token works, but SUPABASE_PROJECT_ID does not match a project available to that token."
            exit 1
          fi

          echo "Access token and project ID are valid together."

      - name: Verify database password and migration connection
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase link --project-ref "$SUPABASE_PROJECT_ID"; then
            echo "::error title=Supabase database connection failed::SUPABASE_DB_PASSWORD is incorrect, or the project database is not reachable."
            exit 1
          fi

          if ! supabase db push --linked --dry-run; then
            echo "::error title=Supabase migration check failed::The project linked, but the migration dry run could not complete."
            exit 1
          fi

          echo "Database password and migration connection are valid."

      - name: Verify required Edge Function secret names
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" --output json > "$RUNNER_TEMP/supabase-function-secrets.json"; then
            echo "::error title=Supabase Edge Function access failed::The CLI could not inspect Edge Function secrets for this project."
            exit 1
          fi

          missing=0
          for name in OCTAGON_APP_ORIGIN OCTAGON_PROFILE_CREATION_OPEN; do
            if ! grep -Fq "$name" "$RUNNER_TEMP/supabase-function-secrets.json"; then
              echo "::error title=Missing Supabase function secret::$name is not set in the V2 Supabase project."
              missing=1
            else
              echo "$name is present."
            fi
          done
          exit "$missing"

      - name: Verify deployed migrations
        shell: bash
        run: |
          set -euo pipefail
          migration_list=$(supabase migration list --linked)
          printf '%s\n' "$migration_list"

          require_remote_migration() {
            local version="$1"
            local title="$2"
            local remote_version
            remote_version=$(printf '%s\n' "$migration_list" | sed 's/│/|/g' | awk -F '|' -v version="$version" '
              {
                local_version = $1
                remote_version = $2
                gsub(/[^0-9]/, "", local_version)
                gsub(/[^0-9]/, "", remote_version)
                if (local_version == version) {
                  print remote_version
                  exit
                }
              }
            ')

            if [ "$remote_version" != "$version" ]; then
              echo "::error title=${title}::Migration $version exists locally but is not recorded in the remote migration column."
              exit 1
            fi
          }

          require_local_migration() {
            local version="$1"
            local title="$2"
            local local_version
            local_version=$(printf '%s\n' "$migration_list" | sed 's/│/|/g' | awk -F '|' -v version="$version" '
              {
                local_version = $1
                gsub(/[^0-9]/, "", local_version)
                if (local_version == version) {
                  print local_version
                  exit
                }
              }
            ')

            if [ "$local_version" != "$version" ]; then
              echo "::error title=${title}::Migration $version is not present in the exact checked-out head."
              exit 1
            fi
          }

          require_remote_migration "202607240001" "Profile migration not deployed"
          require_remote_migration "202607250001" "Challenge migration not deployed"
          require_remote_migration "202607260001" "Your HQ migration not deployed"
          require_remote_migration "202607270001" "Picks migration not deployed"
          require_remote_migration "202607310001" "Picks result lifecycle migration not deployed"
          require_remote_migration "202608010001" "Picks recap migration not deployed"
          require_remote_migration "202608020000" "Picks scoring preparation migration not deployed"
          require_remote_migration "202608020001" "Picks scoring migration not deployed"
          require_remote_migration "202608020002" "Picks scoring RPC verification migration not deployed"
          require_remote_migration "202608030001" "Resolved group pick reveal migration not deployed"
          require_remote_migration "202608040001" "Fight Night control migration not deployed"
          require_remote_migration "202608050001" "Event setup and card review migration not deployed"
          require_remote_migration "202608200008" "What's New foundation migration not deployed"
          require_remote_migration "202608200011" "What's New ranking producer migration not deployed"
          require_remote_migration "202608200027" "Fighters to Watch durable event migration not deployed"
          require_remote_migration "202608200028" "What's New sync contract v3 migration not deployed"
          require_remote_migration "202608200030" "Gable production repair migration not deployed"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            require_local_migration "202609030001" "Auction PR 6 migration missing"
            require_local_migration "202609030003" "Auction launch migration missing"
            require_local_migration "202609040001" "Auction catalog expansion migration missing"
            require_local_migration "202609040002" "Auction v2 grader migration missing"
            echo "Auction migrations 202609030001 and 202609030003 exist locally and passed the fresh-database suite; linked production history is hard-required after merge by the canonical deployment workflow."
          else
            require_remote_migration "202609030001" "Auction PR 6 notifications and share release migration not deployed"
            require_remote_migration "202609030003" "Auction launch notification migration not deployed"
            require_remote_migration "202609040001" "Auction catalog expansion migration not deployed"
            require_remote_migration "202609040002" "Auction v2 grader migration not deployed"
          fi

      - name: Verify deployed functions and production CORS
        shell: bash
        run: |
          set -euo pipefail
          function_list=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID")
          if ! printf '%s\n' "$function_list" | grep -Fq "pin-auth"; then
            echo "::error title=PIN function not deployed::The pin-auth Edge Function is not deployed to the V2 project."
            exit 1
          fi
          if ! printf '%s\n' "$function_list" | grep -Fq "sync-next-ufc-event"; then
            echo "::error title=UFC event sync not deployed::The sync-next-ufc-event Edge Function is not deployed to the V2 project."
            exit 1
          fi

          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/pin-auth"
          status=$(curl --silent --show-error \
            --dump-header "$RUNNER_TEMP/pin-auth-headers.txt" \
            --output "$RUNNER_TEMP/pin-auth-response.json" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Origin: $OCTAGON_PRODUCTION_ORIGIN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$endpoint")

          if [ "$status" != "400" ]; then
            echo "::error title=PIN function live check failed::Expected HTTP 400 from the deployed validation path, received $status."
            cat "$RUNNER_TEMP/pin-auth-response.json"
            exit 1
          fi

          if ! grep -Fq "Enter a name and a 4-digit PIN." "$RUNNER_TEMP/pin-auth-response.json"; then
            echo "::error title=PIN function contract mismatch::The deployed function did not return the expected validation response."
            cat "$RUNNER_TEMP/pin-auth-response.json"
            exit 1
          fi

          if ! grep -Fiq "access-control-allow-origin: $OCTAGON_PRODUCTION_ORIGIN" "$RUNNER_TEMP/pin-auth-headers.txt"; then
            echo "::error title=Production origin mismatch::pin-auth is not allowing $OCTAGON_PRODUCTION_ORIGIN."
            cat "$RUNNER_TEMP/pin-auth-headers.txt"
            exit 1
          fi

      - name: Verify production Picks monitoring scheduler is active
        run: node scripts/verify-production-monitoring-scheduler.mjs

      - name: Verify exact deployed UFC sync source
        run: node scripts/verify-sync-function-deployment.mjs

      - name: Verify authenticated production Event Setup preview
        run: node scripts/verify-event-setup-preview-live.mjs

      - name: Verify live Picks scoring RPCs
        run: node scripts/verify-picks-scoring-live.mjs

  live_webkit:
    name: live WebKit proof
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev
      EXPECTED_LIVE_MAIN_REF: ${{ github.event.repository.default_branch || 'main' }}
      EXPECTED_SYNC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      current_main_sha: ${{ steps.live_frontend.outputs.current_main_sha }}
      verified_live_frontend_sha: ${{ steps.live_frontend.outputs.sha }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Exact SHA checkout failed::Expected $SOURCE_SHA but checked out $checked_out_sha."
            exit 1
          fi
          echo "Live WebKit proof source verified: $checked_out_sha"

      - name: Resolve verified live frontend SHA for current main
        id: live_frontend
        uses: actions/github-script@v7
        env:
          EXPECTED_LIVE_MAIN_REF: ${{ env.EXPECTED_LIVE_MAIN_REF }}
        with:
          script: |
            const mainRef = process.env.EXPECTED_LIVE_MAIN_REF;
            const { data: mainBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: mainRef,
            });
            const expectedSha = mainBranch.commit.sha.toLowerCase();
            core.info(`Resolved current ${mainRef} tip: ${expectedSha}`);
            core.setOutput("current_main_sha", expectedSha);
            const required = [
              "Deploy Cloudflare Frontend",
              "Verify Live Frontend Delivery",
            ];
            const runtimePathPatterns = [
              /^\.github\/workflows\/deploy-cloudflare\.yml$/,
              /^\.github\/workflows\/verify-live-frontend-delivery\.yml$/,
              /^src\//,
              /^public\//,
              /^index\.html$/,
              /^package\.json$/,
              /^package-lock\.json$/,
              /^vite\.config\./,
              /^wrangler\.jsonc$/,
            ];

            async function findSuccessfulRuns(sha) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100,
              });
              const selected = new Map();
              for (const workflowName of required) {
                const runs = data.workflow_runs.filter((run) => (
                  run.name === workflowName
                  && run.head_sha?.toLowerCase() === sha
                ));
                const passed = runs.find((run) => (
                  run.status === "completed" && run.conclusion === "success"
                ));
                if (!passed) return { passed: false, workflowName, runs };
                selected.set(workflowName, passed);
              }
              return { passed: true, selected };
            }

            let candidateSha = expectedSha;
            for (let depth = 0; depth < 20; depth += 1) {
              const result = await findSuccessfulRuns(candidateSha);
              if (result.passed) {
                for (const workflowName of required) {
                  const run = result.selected.get(workflowName);
                  core.info(`${workflowName} passed for verified live frontend ${candidateSha}: ${run.html_url}`);
                }
                if (candidateSha !== expectedSha) {
                  core.notice(
                    `Current main ${expectedSha} differs from verified live frontend ${candidateSha} only by non-runtime files.`,
                  );
                }
                core.setOutput("sha", candidateSha);
                return;
              }

              const { data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: candidateSha,
                per_page: 100,
              });
              const changedPaths = (commit.files ?? []).map((file) => file.filename);
              const runtimeChanges = changedPaths.filter((path) => (
                runtimePathPatterns.some((pattern) => pattern.test(path))
              ));
              if (runtimeChanges.length > 0) {
                const observed = result.runs
                  .map((run) => `${run.id}:${run.status}/${run.conclusion ?? "none"}`)
                  .join(", ") || "none";
                core.setFailed(
                  `${result.workflowName} has no successful exact-SHA run for runtime-changing commit ${candidateSha}. `
                  + `Runtime paths: ${runtimeChanges.join(", ")}. Observed: ${observed}.`,
                );
                return;
              }

              const parentSha = commit.parents?.[0]?.sha?.toLowerCase();
              if (!parentSha) {
                core.setFailed(`Could not resolve a verified live frontend ancestor for ${expectedSha}.`);
                return;
              }
              core.info(
                `No runtime-owned paths changed in ${candidateSha}; checking parent ${parentSha} for the live frontend proof.`,
              );
              candidateSha = parentSha;
            }

            core.setFailed(`Could not resolve a verified live frontend SHA within 20 ancestors of ${expectedSha}.`);

      - name: Set up Node for live production proof
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify exact live shell JavaScript and CSS
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.live_frontend.outputs.sha }}
          FRONTEND_DELIVERY_ATTEMPTS: 6
          FRONTEND_DELIVERY_DELAY_MS: 5000
        run: node scripts/verify-live-frontend-delivery.mjs

      - name: Verify live proof secret names are populated
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing GitHub secret::$name is missing or empty."
              missing=1
            else
              echo "$name is present."
            fi
          done
          exit "$missing"

      - name: Install production WebKit proof harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps webkit

      - name: Verify signed-in live What's New item
        env:
          WHATS_NEW_SCREENSHOT_PATH: ${{ runner.temp }}/whats-new-gable-proof.png
        run: node scripts/verify-whats-new-live.mjs

      - name: Verify production Event Setup in WebKit at 390x844
        shell: bash
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ steps.live_frontend.outputs.sha }}
          EXPECTED_SYNC_SOURCE_SHA: ${{ steps.live_frontend.outputs.current_main_sha }}
          EVENT_SETUP_SCREENSHOT_PATH: ${{ runner.temp }}/event-setup-preview.png
        run: |
          set +e
          node scripts/verify-pin-auth-live.mjs > "$RUNNER_TEMP/event-setup-webkit.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/event-setup-webkit.log"
          test "$status" -eq 0
          test -s "$EVENT_SETUP_SCREENSHOT_PATH"
          test "$(wc -c < "$EVENT_SETUP_SCREENSHOT_PATH")" -gt 5000

      - name: Verify temporary proof user and owner grant cleanup
        run: |
          node --input-type=module <<'NODE'
          const accessToken = process.env.SUPABASE_ACCESS_TOKEN;
          const projectId = process.env.SUPABASE_PROJECT_ID;
          const productionOrigin = process.env.OCTAGON_PRODUCTION_ORIGIN;
          const suffix = `${process.env.GITHUB_RUN_ID}${process.env.GITHUB_RUN_ATTEMPT}`;
          const displayName = `HQCHECK${suffix}`.slice(0, 24);
          const supabaseOrigin = `https://${projectId}.supabase.co`;

          const keysResponse = await fetch(
            `https://api.supabase.com/v1/projects/${projectId}/api-keys?reveal=true`,
            { headers: { Authorization: `Bearer ${accessToken}` } },
          );
          if (!keysResponse.ok) throw new Error(`Project key lookup failed: HTTP ${keysResponse.status}`);
          const keys = await keysResponse.json();
          const publishableKey = keys.find((item) => item.type === "publishable")?.api_key
            ?? keys.find((item) => item.type === "legacy" && /anon/i.test(item.name ?? ""))?.api_key;
          const secretKey = keys.find((item) => item.type === "secret")?.api_key
            ?? keys.find((item) => item.type === "legacy" && /service.role/i.test(item.name ?? ""))?.api_key;
          if (!publishableKey || !secretKey) throw new Error("Cleanup proof could not resolve project keys.");

          const loginResponse = await fetch(`${supabaseOrigin}/functions/v1/pin-auth`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${publishableKey}`,
              apikey: publishableKey,
              "Content-Type": "application/json",
              Origin: productionOrigin,
              "x-client-info": "octagon-hq-cleanup-proof/1",
            },
            body: JSON.stringify({ action: "login", displayName, pin: "4826" }),
          });
          const loginBody = await loginResponse.json().catch(() => ({}));
          if (loginResponse.status !== 401 || loginBody?.message !== "That name and PIN did not match.") {
            throw new Error(`Temporary PIN profile still authenticates or returned an unexpected cleanup response: HTTP ${loginResponse.status}`);
          }

          const serviceHeaders = {
            Authorization: `Bearer ${secretKey}`,
            apikey: secretKey,
            "Content-Type": "application/json",
          };
          const profileQuery = new URL(`${supabaseOrigin}/rest/v1/profiles`);
          profileQuery.searchParams.set("display_name", `eq.${displayName}`);
          profileQuery.searchParams.set("select", "id,display_name");
          const profilesResponse = await fetch(profileQuery, { headers: serviceHeaders });
          if (!profilesResponse.ok) throw new Error(`Temporary profile cleanup query failed: HTTP ${profilesResponse.status}`);
          const profiles = await profilesResponse.json();
          if (!Array.isArray(profiles) || profiles.length !== 0) {
            throw new Error("Temporary profile row still exists after the WebKit proof.");
          }

          const ownersQuery = new URL(`${supabaseOrigin}/rest/v1/pick_control_owners`);
          ownersQuery.searchParams.set("select", "profile_id,profiles(display_name)");
          const ownersResponse = await fetch(ownersQuery, { headers: serviceHeaders });
          if (!ownersResponse.ok) throw new Error(`Temporary owner-grant cleanup query failed: HTTP ${ownersResponse.status}`);
          const owners = await ownersResponse.json();
          const retainedOwner = Array.isArray(owners) && owners.some((owner) => {
            const related = owner?.profiles;
            if (Array.isArray(related)) return related.some((profile) => profile?.display_name === displayName);
            return related?.display_name === displayName;
          });
          if (retainedOwner) throw new Error("Temporary Event Setup owner grant still exists after the WebKit proof.");

          console.log(`Temporary profile and Event Setup owner grant cleanup verified for ${displayName}.`);
          NODE

      - name: Upload production WebKit proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-webkit-proof
          path: |
            ${{ runner.temp }}/event-setup-webkit.log
            ${{ runner.temp }}/event-setup-preview.png
            ${{ runner.temp }}/whats-new-gable-proof.png
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: verify
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - local_sql
      - live_backend
      - live_webkit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CURRENT_MAIN_SHA: ${{ needs.live_webkit.outputs.current_main_sha }}
      VERIFIED_LIVE_FRONTEND_SHA: ${{ needs.live_webkit.outputs.verified_live_frontend_sha }}

    steps:
      - name: Require every verification lane
        shell: bash
        env:
          LOCAL_SQL_RESULT: ${{ needs.local_sql.result }}
          LIVE_BACKEND_RESULT: ${{ needs.live_backend.result }}
          LIVE_WEBKIT_RESULT: ${{ needs.live_webkit.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "local SQL proof:$LOCAL_SQL_RESULT" \
            "live Supabase proof:$LIVE_BACKEND_RESULT" \
            "live WebKit proof:$LIVE_WEBKIT_RESULT"
          do
            name=${pair%%:*}
            result=${pair#*:}
            if [ "$result" != "success" ]; then
              echo "::error title=Backend verification lane failed::$name finished with $result."
              failed=1
            else
              echo "$name: success"
            fi
          done
          exit "$failed"

      - name: Record verification boundary
        shell: bash
        run: |
          {
            echo "### Supabase backend verification"
            echo "- Current main considered for verification: $CURRENT_MAIN_SHA"
            echo "- Verified live frontend SHA: $VERIFIED_LIVE_FRONTEND_SHA"
            echo "- Any commits between those SHAs changed no frontend runtime-owned paths"
            echo "- Deploy Cloudflare Frontend and Verify Live Frontend Delivery: successful for the verified live frontend SHA"
            echo "- Live SPA shell: exact JavaScript and CSS assets verified"
            echo "- Signed-in What's New feed: canonical current item rendered and linked correctly"
            echo "- GitHub deployment secrets: present and accepted"
            echo "- Supabase access token/project pairing: accepted"
            echo "- Database password and migration connection: accepted"
            echo "- Auction lifecycle, notification, push eligibility, launch targeting, completed-share, privacy, and cleanup SQL tests: executed against a fresh local Supabase database"
            echo "- Truthful Picks monitoring SQL test: executed against the same fresh local Supabase database"
            echo "- Required Edge Function secret names: present"
            echo "- Existing profile, challenge, Your HQ, Picks, scoring, recap, reveal, Fight Night, and What's New migrations: deployed remotely"
            echo "- Event setup and card review migration: deployed remotely"
            echo "- Production Picks monitoring scheduler: active, canonical, and token-configured without invoking the runner or provider"
            echo "- Authenticated Event Setup preview: supplied MMA Mania URL returned the exact clean four-fight main card without changing the staged or live cards"
            echo "- Private staged draft: exact clean UFC Belgrade card verified"
            echo "- Production WebKit: authenticated UI behavior verified at 390x844 with retained screenshot artifacts"
            echo "- Temporary proof profile and Event Setup owner grant: removed and independently verified"
            echo "- Underdog Lock and seven-field scoring summary RPCs: responding in production"
            echo "- pin-auth Edge Function: deployed and responding with the expected contract"
            echo "- sync-next-ufc-event Edge Function: production deployment is healthy; exact source is hard-required after merge"
            echo "- Production CORS origin: https://octagon.hq-app.workers.dev"
            echo "- Parallel lanes: local SQL, live Supabase/API, and live WebKit all passed"
          } >> "$GITHUB_STEP_SUMMARY"
