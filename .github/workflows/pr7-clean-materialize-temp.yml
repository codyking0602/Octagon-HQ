name: PR7 clean materialize

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/who-am-i-pr7-nfl-b-person-identity-clean
    paths:
      - .github/workflows/pr7-clean-materialize-temp.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean PR7 branch
        uses: actions/checkout@v4
        with:
          ref: feat/who-am-i-pr7-nfl-b-person-identity-clean
          fetch-depth: 0

      - name: Restore focused PR7 test baseline
        run: |
          git fetch origin feat/who-am-i-nfl-b-person-identity-research-temp
          git show 26e91f9fd7c42b496f16d06ca6253d07edfe8071:src/features/back-room/footballPersonIdentityKnowledge.test.ts > src/features/back-room/footballPersonIdentityKnowledge.test.ts

      - name: Materialize validated 99 x 5 PR7 research transport
        run: python3 scripts/pr7-integrate-temp.py

      - name: Remove all temporary PR7 transport
        run: |
          rm -rf scripts/pr7-stage
          rm -f scripts/pr7-integrate-temp.py
          rm -f scripts/pr7-payload-part-*.txt
          rm -f .github/workflows/pr7-clean-materialize-temp.yml

      - name: Check generated diff
        run: git diff --check

      - name: Commit clean PR7 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/back-room/footballPersonIdentityKnowledge.ts
          git add src/features/back-room/footballPersonIdentityKnowledge.test.ts
          git add docs/who-am-i-pr7-nfl-b-person-identity-audit.md
          git add -u
          git commit -m "Integrate NFL B-tier person identity knowledge"
          git push origin HEAD:feat/who-am-i-pr7-nfl-b-person-identity-clean
