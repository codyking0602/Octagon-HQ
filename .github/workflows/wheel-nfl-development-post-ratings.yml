name: Wheel NFL Post-Rating Development Review (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/generated/football/wheel-nfl-*-grades-*.json'
      - 'src/features/back-room/wheelFootballNflCurrentAuthority.ts'
  pull_request:
    paths:
      - 'data/generated/football/wheel-nfl-*-grades-*.json'
      - 'src/features/back-room/wheelFootballNflCurrentAuthority.ts'
      - '.github/workflows/wheel-nfl-development-post-ratings.yml'
      - 'scripts/wheel-monitor/nfl-development-post-ratings*.mjs'
      - 'scripts/wheel-monitor/nfl-madden-review.mjs'

permissions:
  contents: read
  actions: read

jobs:
  post-rating-development:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test post-rating stage and full NFL identity coverage
        run: |
          node --check scripts/wheel-monitor/nfl-development-post-ratings.mjs
          node --test scripts/wheel-monitor/nfl-development-post-ratings.nodecheck.mjs
      - name: Prove current 594-player/dual-position source bindings on PR
        if: github.event_name == 'pull_request'
        run: |
          node scripts/wheel-monitor/nfl-development-post-ratings.mjs \
            --out=tmp/wheel-monitor/nfl/pr-post-rating-readonly-check.json
      - name: Recover last complete published NFL grade checkpoint, if present
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp/wheel-monitor/nfl/previous
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=wheel-nfl-development-grade-checkpoint&per_page=100" \
            > tmp/wheel-monitor/nfl/checkpoint-artifacts.json
          id=$(jq -r '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty' tmp/wheel-monitor/nfl/checkpoint-artifacts.json)
          if [[ -n "$id" ]]; then
            gh run download "$id" --name wheel-nfl-development-grade-checkpoint --dir tmp/wheel-monitor/nfl/previous
            test -f tmp/wheel-monitor/nfl/previous/authority-grade-checkpoint.json
          else
            ever=$(jq '[.artifacts[]] | length' tmp/wheel-monitor/nfl/checkpoint-artifacts.json)
            if (( ever > 0 )); then
              echo "::error::NFL development checkpoint expired or inaccessible; manual recovery required."
              exit 1
            fi
            echo "::notice::First run initializes current published grade authority without requeueing older completed changes."
          fi
      - name: Reevaluate development only after HQ ratings are approved and published
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          prior=()
          if [[ -f tmp/wheel-monitor/nfl/previous/authority-grade-checkpoint.json ]]; then
            prior+=(--previous=tmp/wheel-monitor/nfl/previous/authority-grade-checkpoint.json)
          fi
          node scripts/wheel-monitor/nfl-development-post-ratings.mjs \
            --out=tmp/wheel-monitor/nfl/post-rating-development.json \
            --checkpoint=tmp/wheel-monitor/nfl/authority-grade-checkpoint.json \
            "${prior[@]}"
      - name: Save verified current grade checkpoint only after successful report
        if: github.event_name != 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-nfl-development-grade-checkpoint
          path: tmp/wheel-monitor/nfl/authority-grade-checkpoint.json
          retention-days: 90
          if-no-files-found: error
      - name: Preserve read-only recommendations; never auto-edit probabilities
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: wheel-nfl-post-rating-development-review
          path: tmp/wheel-monitor/nfl/post-rating-development.json
          retention-days: 90
          if-no-files-found: error
