name: Finalize Auction Assets

on:
  push:
    branches:
      - chatgpt/auction-format-photos
    paths:
      - ".github/workflows/finalize-auction-assets.yml"
      - "scripts/finalize-auction-assets.py"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/auction-format-photos
          fetch-depth: 0

      - name: Finalize individual Auction assets
        run: python scripts/finalize-auction-assets.py

      - name: Commit final asset architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use individual local Auction WebP assets"
          git push origin HEAD:chatgpt/auction-format-photos
