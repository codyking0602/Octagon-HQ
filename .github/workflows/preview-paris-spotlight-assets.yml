name: Preview Paris Spotlight Assets

on:
  push:
    branches:
      - fix/paris-spotlight-cutouts
    paths:
      - .github/workflows/preview-paris-spotlight-assets.yml

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paris-spotlight-cutouts
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Emit tiny visual previews
        run: |
          python <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps

          for slug in ("dan-hooker", "salahdine-parnasse", "daniil-donchenko", "punahele-soriano"):
              path = Path(f"public/assets/fighters/{slug}-spotlight.webp")
              image = Image.open(path).convert("RGBA")
              alpha = image.getchannel("A")
              print(f"META {slug} size={image.size} alpha={alpha.getextrema()}")
              canvas = Image.new("RGBA", image.size, (34, 34, 34, 255))
              canvas.alpha_composite(image)
              preview = ImageOps.contain(canvas.convert("RGB"), (96, 96), Image.Resampling.LANCZOS)
              buf = BytesIO()
              preview.save(buf, "JPEG", quality=55, optimize=True)
              print(f"PREVIEW {slug} {base64.b64encode(buf.getvalue()).decode('ascii')}")
          PY
      - name: Remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/preview-paris-spotlight-assets.yml
          git commit -m "chore: remove Spotlight preview helper"
          git push origin HEAD:fix/paris-spotlight-cutouts
