name: TEMP PR6 CFB team-gate finalize

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/temp-pr6-cfb-team-gate-finalize.yml
      - scripts/temp-finalize-pr6-cfb-team-gate.mjs

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply CFB Tier C team gate
        run: node scripts/temp-finalize-pr6-cfb-team-gate.mjs
      - name: Regenerate projection and audit
        run: node scripts/generate-football-recognizability.mjs
      - name: Run focused PR6 projection test
        run: npx vitest run src/features/back-room/footballRecognizabilityProjection.test.ts
      - name: Commit artifacts and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-football-recognizability.mjs docs/football-recognizability-audit.md
          git add -f data/generated/football/recognizability-projection.json
          git rm scripts/temp-finalize-pr6-cfb-team-gate.mjs .github/workflows/temp-pr6-cfb-team-gate-finalize.yml
          git commit -m 'fix: require single-program CFB Tier C evidence [finalize-pr6-team-gate]'
          git push origin HEAD:${{ github.head_ref }}
