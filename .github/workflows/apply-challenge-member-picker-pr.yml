name: Apply challenge member picker PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/challenge-member-picker-mobile-nav'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Apply embedded repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/run-challenge-member-picker-mobile-nav.yml')
          text = workflow.read_text()
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("          PY\n", start)
          script = textwrap.dedent(text[start:end])
          exec(compile(script, 'challenge-member-picker-repair', 'exec'))
          Path('.github/workflows/apply-challenge-member-picker-pr.yml').unlink()
          Path('.repair-trigger').unlink(missing_ok=True)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --silent

      - name: Run focused tests and typecheck
        run: |
          npx vitest run src/features/challenges/ChallengeMemberPicker.test.ts src/app/mobileChallengeExperience.contract.test.ts
          npm run typecheck

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix challenge member selection and mobile navigation"
          git push origin HEAD:chatgpt/challenge-member-picker-mobile-nav
