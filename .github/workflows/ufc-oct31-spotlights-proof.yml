name: One-time UFC Spotlight visual alpha proof
on:
  push:
    branches: [assets/ufc-oct31-spotlights-real-20261027]
    paths: [scripts/ufc_oct31_spotlight_visual_proof.py]
permissions:
  contents: write
jobs:
  render:
    if: github.event.head_commit.message == 'Render UFC spotlight transparency proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/ufc_oct31_spotlight_visual_proof.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/assets/fighters/_visual-proof-*.png
          git commit -m 'Record temporary transparency previews'
          git push origin "HEAD:${GITHUB_REF_NAME}"
