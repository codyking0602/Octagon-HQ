name: Auction Release Status Probe

on:
  push:
    branches:
      - chatgpt/auction-final-live-proof
    paths:
      - ".github/workflows/release-status-probe.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/auction-final-live-proof
          fetch-depth: 0
      - name: Record exact workflow states
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 657e9d29427b4a9fc7ee2d1ac334dae425ed9418
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-proof
          node <<'NODE'
          const fs = require('node:fs');
          const sha = process.env.EXPECTED_SHA;
          const token = process.env.GH_TOKEN;
          const response = await fetch(`https://api.github.com/repos/codyking0602/Octagon-HQ/actions/runs?head_sha=${sha}&per_page=100`, {
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'octagon-hq-release-status-probe/1',
            },
          });
          if (!response.ok) throw new Error(`GitHub runs query failed: HTTP ${response.status}`);
          const body = await response.json();
          const wanted = new Set([
            'Deploy Supabase Backend',
            'Deploy Cloudflare Frontend',
            'Verify Live Frontend Delivery',
            'Verify Live Notification Flow',
          ]);
          const runs = (body.workflow_runs ?? [])
            .filter((run) => wanted.has(run.name))
            .map((run) => ({ id: run.id, name: run.name, event: run.event, status: run.status, conclusion: run.conclusion, head_sha: run.head_sha, url: run.html_url, created_at: run.created_at, updated_at: run.updated_at }));
          fs.writeFileSync('release-proof/release-status.json', JSON.stringify({ expected_sha: sha, runs }, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-proof/release-status.json
          git commit -m "Record Auction release workflow status"
          git push origin HEAD:chatgpt/auction-final-live-proof
