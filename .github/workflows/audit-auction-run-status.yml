name: Audit Exact Auction Run Status

on:
  pull_request:
    branches:
      - audit/auction-run-status-base

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 313da4481a50c21a92531df726dbf225e69afa5c
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read exact canonical workflow runs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" \
            > runs.json
          python - <<'PY'
          import json
          data = json.load(open("runs.json"))
          names = {
              "Deploy Supabase Backend",
              "Deploy Cloudflare Frontend",
              "Verify Live Frontend Delivery",
              "Verify Live Notification Flow",
          }
          for run in data.get("workflow_runs", []):
              if run.get("name") in names:
                  print(json.dumps({
                      "id": run.get("id"),
                      "name": run.get("name"),
                      "event": run.get("event"),
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "created_at": run.get("created_at"),
                      "updated_at": run.get("updated_at"),
                      "head_sha": run.get("head_sha"),
                  }, sort_keys=True))
          PY
