name: Audit Auction Release Status

on:
  pull_request:
    types: [synchronize]
    branches:
      - audit/auction-final-cert-base

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 313da4481a50c21a92531df726dbf225e69afa5c
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Capture exact release run status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-status
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" \
            > release-status/all-runs.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("release-status/all-runs.json").read_text())
          names = {
              "Deploy Cloudflare Frontend",
              "Verify Live Frontend Delivery",
              "Verify Live Notification Flow",
          }
          runs = [
              {
                  "id": run.get("id"),
                  "name": run.get("name"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "event": run.get("event"),
                  "head_sha": run.get("head_sha"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
              }
              for run in data.get("workflow_runs", [])
              if run.get("name") in names
          ]
          Path("release-status/selected-runs.json").write_text(json.dumps(runs, indent=2, sort_keys=True))
          print(json.dumps(runs, indent=2, sort_keys=True))
          PY
      - name: Upload release status
        uses: actions/upload-artifact@v4
        with:
          name: auction-release-status-${{ env.TARGET_SHA }}
          path: release-status
          if-no-files-found: error
          retention-days: 7
