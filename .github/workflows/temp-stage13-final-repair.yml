name: TEMP Stage 13 Final Repair

on:
  push:
    branches: [feat/football-ledger-stage13-factual-universe]
    paths:
      - scripts/stage13-final-repair.mjs
      - .github/workflows/temp-stage13-final-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/football-ledger-stage13-factual-universe
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Trace college quarterback Keep/Cut pool
        run: |
          cat > stage13-keep-cut-diag.ts <<'EOF'
          import { buildFootballKeepCutBoard, footballComparisonTier } from "./src/features/back-room/footballComparisonGeneration";
          import { getFootballKeepCutPack } from "./src/features/back-room/footballKeepCutModel";
          const pack = getFootballKeepCutPack("college-quarterbacks");
          console.log("POOL", JSON.stringify(pack.items.map((item) => ({ id:item.id, name:item.name, rating:item.rating, tier:footballComparisonTier(item) })), null, 2));
          const appearances = new Map<string, number>();
          const styles = new Map<string, number>();
          const co = new Map<string, number>();
          const minshewId = "cfbfast-r-player-4038524-gardner-minshew";
          for (let index=0; index<128; index+=1) {
            const seed=`keep-cut-simulation-${pack.id}-${index}`;
            const board=buildFootballKeepCutBoard(pack.items, pack.id, seed);
            for (const item of board.items) appearances.set(item.id,(appearances.get(item.id)??0)+1);
            if (board.items.some((item)=>item.id===minshewId)) {
              styles.set(board.style,(styles.get(board.style)??0)+1);
              for (const item of board.items) if (item.id!==minshewId) co.set(item.id,(co.get(item.id)??0)+1);
            }
          }
          console.log("APPEARANCES", JSON.stringify([...appearances].sort((a,b)=>b[1]-a[1]), null, 2));
          console.log("MINSHEW_STYLES", JSON.stringify(Object.fromEntries(styles), null, 2));
          console.log("MINSHEW_COOCCURRENCE", JSON.stringify([...co].sort((a,b)=>b[1]-a[1]).slice(0,20), null, 2));
          EOF
          npx vite-node stage13-keep-cut-diag.ts
          rm stage13-keep-cut-diag.ts
      - name: Apply Stage 13 factual repair
        run: node scripts/stage13-final-repair.mjs
      - name: Regenerate Stage 13 artifacts
        run: npm run generate:football-factual-universe
      - name: Validate Stage 13 factual closure
        run: npx vitest run src/features/back-room/footballFactualUniverse.test.ts src/features/back-room/footballFactualStats.test.ts
