name: Diagnose Event Preview

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-event-preview.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev
      EXPECTED_SYNC_SOURCE_SHA: a191a969d37c655e5c52bb437b2015f3dcf7f648
    steps:
      - name: Invoke authenticated production preview
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const accessToken = process.env.SUPABASE_ACCESS_TOKEN;
          const projectId = process.env.SUPABASE_PROJECT_ID;
          const origin = process.env.OCTAGON_PRODUCTION_ORIGIN;
          const expectedSha = process.env.EXPECTED_SYNC_SOURCE_SHA;
          const supabaseOrigin = `https://${projectId}.supabase.co`;
          const articleUrl = "https://www.mmamania.com/ufc-fight-cards/446488/latest-ufc-belgrade-fight-card-paramount-start-time-date-and-location-medic-vs-rodriguez-mma";
          const read = async (response) => { const text = await response.text(); try { return text ? JSON.parse(text) : {}; } catch { return { message: text }; } };
          const request = async (url, options = {}) => { const response = await fetch(url, options); return { response, body: await read(response) }; };
          const keysResult = await request(`https://api.supabase.com/v1/projects/${projectId}/api-keys?reveal=true`, { headers: { Authorization: `Bearer ${accessToken}` } });
          if (!keysResult.response.ok) throw new Error(`key lookup HTTP ${keysResult.response.status}`);
          const keys = keysResult.body;
          const publishableKey = keys.find((item) => item.type === "publishable")?.api_key ?? keys.find((item) => item.type === "legacy" && /anon/i.test(item.name ?? ""))?.api_key;
          const secretKey = keys.find((item) => item.type === "secret")?.api_key ?? keys.find((item) => item.type === "legacy" && /service.role/i.test(item.name ?? ""))?.api_key;
          const serviceHeaders = { Authorization: `Bearer ${secretKey}`, apikey: secretKey, "Content-Type": "application/json" };
          const suffix = `${Date.now()}`;
          const email = `hqdiag-${suffix}@login.octagon-hq.app`;
          const password = `Diag-${suffix}!Aa1`;
          const displayName = `HQDIAG${suffix}`.slice(0, 24);
          let userId = "";
          try {
            const created = await request(`${supabaseOrigin}/auth/v1/admin/users`, { method: "POST", headers: serviceHeaders, body: JSON.stringify({ email, password, email_confirm: true, user_metadata: { display_name: displayName } }) });
            if (!created.response.ok) throw new Error(`create user HTTP ${created.response.status}: ${created.body?.message ?? "unknown"}`);
            userId = created.body.id;
            const profile = await request(`${supabaseOrigin}/rest/v1/rpc/register_pin_profile`, { method: "POST", headers: serviceHeaders, body: JSON.stringify({ p_profile_id: userId, p_display_name: displayName, p_initials: "H", p_internal_email: email, p_pin: "7318" }) });
            if (!profile.response.ok) throw new Error(`register profile HTTP ${profile.response.status}: ${profile.body?.message ?? profile.body?.hint ?? "unknown"}`);
            const grant = await request(`${supabaseOrigin}/rest/v1/pick_control_owners`, { method: "POST", headers: { ...serviceHeaders, Prefer: "return=minimal" }, body: JSON.stringify({ profile_id: userId }) });
            if (!grant.response.ok) throw new Error(`owner grant HTTP ${grant.response.status}: ${grant.body?.message ?? "unknown"}`);
            const session = await request(`${supabaseOrigin}/auth/v1/token?grant_type=password`, { method: "POST", headers: { apikey: publishableKey, "Content-Type": "application/json" }, body: JSON.stringify({ email, password }) });
            if (!session.response.ok || !session.body.access_token) throw new Error(`sign in HTTP ${session.response.status}: ${session.body?.message ?? "unknown"}`);
            const preview = await request(`${supabaseOrigin}/functions/v1/sync-next-ufc-event`, { method: "POST", headers: { Authorization: `Bearer ${session.body.access_token}`, apikey: publishableKey, "Content-Type": "application/json", Origin: origin }, body: JSON.stringify({ mode: "preview", card_scope: "auto", source_url: articleUrl }) });
            const safe = {
              status: preview.response.status,
              deployment_sha: preview.body?.deployment_sha,
              code: preview.body?.code,
              message: preview.body?.message,
              stage: preview.body?.stage,
              safeDetails: preview.body?.safeDetails,
              requested_scope: preview.body?.requested_scope,
              effective_scope: preview.body?.effective_scope,
              source_url: preview.body?.source_url,
              fight_count: preview.body?.fight_count,
            };
            console.log(JSON.stringify(safe, null, 2));
            if (!preview.response.ok) process.exitCode = 1;
            if (preview.response.ok && preview.body?.deployment_sha !== expectedSha) throw new Error(`backend SHA mismatch: ${preview.body?.deployment_sha ?? "missing"}`);
          } finally {
            if (userId) {
              await fetch(`${supabaseOrigin}/rest/v1/pick_control_owners?profile_id=eq.${encodeURIComponent(userId)}`, { method: "DELETE", headers: serviceHeaders }).catch(() => undefined);
              await fetch(`${supabaseOrigin}/auth/v1/admin/users/${userId}`, { method: "DELETE", headers: serviceHeaders }).catch(() => undefined);
            }
          }
          NODE
