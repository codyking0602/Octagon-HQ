name: Apply challenge member picker PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/challenge-member-picker-mobile-nav'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Apply embedded repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/run-challenge-member-picker-mobile-nav.yml')
          text = workflow.read_text()
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("          PY\n", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in text[start:end].splitlines()
          ) + "\n"

          auction_read_marker = "auction_text = auction.read_text()\n"
          auction_import_patch = "\n".join([
              "auction_text = auction_text.replace(",
              "    'import type { MemberProfileSummary } from \"../members/memberProfilesModel\";',",
              "    'import type { MemberCardSummary, MemberProfileSummary } from \"../members/memberProfilesModel\";',",
              "    1,",
              ")",
              "",
          ])
          script = script.replace(
              auction_read_marker,
              auction_read_marker + auction_import_patch,
              1,
          )

          patch_start = script.index("old_picker = '''")
          patch_end = script.index("auction.write_text(auction_text)", patch_start)
          replacement = "\n".join([
              "picker_start = auction_text.index(",
              "    '          <input\\n            aria-label=\"Auction opponent profile name\"'",
              ")",
              "button_start = auction_text.index(",
              "    '          <button\\n            className=\"primary-action\"',",
              "    picker_start,",
              ")",
              "button_body = auction_text.index(",
              "    '            {busy ? \"PREPARING…\"',",
              "    button_start,",
              ")",
              "new_picker = '''          <ChallengeMemberPicker",
              "            members={challenges.members}",
              "            recentNames={challenges.profiles.map((profile) => profile.displayName)}",
              "            selectedName={selectedOpponent?.displayName}",
              "            busy={busy}",
              "            onSelect={setSelectedOpponent}",
              "          />",
              "          <p>Choose any Octagon HQ member. Search is optional.</p>",
              "          <button",
              "            className=\"primary-action\"",
              "            type=\"button\"",
              "            disabled={!repository || !mode || !selectedOpponent || busy}",
              "            onClick={() => void prepare()}",
              "          >",
              "'''",
              "auction_text = auction_text[:picker_start] + new_picker + auction_text[button_body:]",
              "",
          ])
          script = script[:patch_start] + replacement + script[patch_end:]

          center_patch_start = script.index("old_member = '''")
          center_patch_end_marker = "center.write_text(center_text.replace(old_member, new_member, 1))"
          center_patch_end = script.index(center_patch_end_marker, center_patch_start) + len(center_patch_end_marker)
          center_replacement = "\n".join([
              "member_start = center_text.index('              const memberContent = (')",
              "member_end = center_text.index('\\n\\n              return (', member_start)",
              "new_member = '''              const memberContent = (",
              "                <>",
              "                  <i className=\"challenge-center__avatar\">",
              "                    {counterpart?.avatarPhotoData",
              "                      ? <img src={counterpart.avatarPhotoData} alt={`${counterpart.displayName} profile`} />",
              "                      : counterpart?.initials ?? \"HQ\"}",
              "                  </i>",
              "                  <div className=\"challenge-center__row-copy\">",
              "                    <span>{copy.eyebrow}</span>",
              "                    <strong>{counterpart?.displayName ?? \"Octagon HQ profile\"}</strong>",
              "                    <small>{challenge.gameTitle} · {copy.detail}</small>",
              "                  </div>",
              "                </>",
              "              );",
              "'''",
              "center.write_text(center_text[:member_start] + new_member + center_text[member_end:])",
          ])
          script = script[:center_patch_start] + center_replacement + script[center_patch_end:]

          exec(compile(script, 'challenge-member-picker-repair', 'exec'))
          Path('.github/workflows/apply-challenge-member-picker-pr.yml').unlink()
          Path('.repair-trigger').unlink(missing_ok=True)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --silent

      - name: Run focused tests and typecheck
        run: |
          npx vitest run src/features/challenges/ChallengeMemberPicker.test.ts src/app/mobileChallengeExperience.contract.test.ts
          npm run typecheck

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix challenge member selection and mobile navigation"
          git push origin HEAD:chatgpt/challenge-member-picker-mobile-nav
