name: Stage Auction PR 6

on:
  push:
    branches:
      - audit/pr276-main-backend-proof
    paths:
      - ".github/workflows/stage-auction-pr6.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: d580c20124d3d269829af693efde382622fb88ba
      TARGET_BRANCH: feat/auction-pr6-final-release
      PAYLOAD_COMMIT: 304a0fbb70cd889a1125a89f5ea400a7f81f32dd
      PAYLOAD_SHA256: 1f397245d46356ba589402b6fb0c4959958c3fd1134fcd6857c18d9cb180bb72
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out staging source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Recover verified implementation payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PAYLOAD_COMMIT"
          git show "$PAYLOAD_COMMIT:verification-artifacts/pr6-payload.b64" > "$RUNNER_TEMP/auction-pr6-payload.b64"
          base64 --decode "$RUNNER_TEMP/auction-pr6-payload.b64" > "$RUNNER_TEMP/auction-pr6-payload.tar.gz"
          echo "$PAYLOAD_SHA256  $RUNNER_TEMP/auction-pr6-payload.tar.gz" | sha256sum --check --status
          test "$(tar -tzf "$RUNNER_TEMP/auction-pr6-payload.tar.gz" | wc -l | tr -d ' ')" = "12"

      - name: Replace target branch with one clean implementation commit
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/octagon-pr6"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"
          cd "$target"
          git checkout --detach "$BASE_SHA"
          git switch -C "$TARGET_BRANCH"
          tar --extract --gzip --file "$RUNNER_TEMP/auction-pr6-payload.tar.gz" --directory .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          changed_count=$(git diff --cached --name-only | wc -l | tr -d ' ')
          test "$changed_count" = "12"
          test ! -e .github/workflows/auction-pr6-checkout-snapshot.yml
          test ! -e verification-artifacts/auction-pr6-snapshot.txt

          git commit -m "Complete Auction notifications and final release proof"
          final_sha=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push --force origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Final staged head: $final_sha"

# Recovers the reviewed payload from its immutable repository commit.
