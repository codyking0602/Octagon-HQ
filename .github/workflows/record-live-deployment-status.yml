name: Record Live Deployment Status

on:
  workflow_run:
    workflows:
      - Deploy Cloudflare Frontend
      - Deploy Supabase Backend
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  record:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record exact main deployment result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOYMENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOYMENT_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          case "$WORKFLOW_NAME" in
            "Deploy Cloudflare Frontend")
              context_name="octagon/frontend-live"
              deployment_kind="frontend"
              ;;
            "Deploy Supabase Backend")
              context_name="octagon/backend-live"
              deployment_kind="backend"
              ;;
            *)
              echo "::error title=Unsupported deployment workflow::$WORKFLOW_NAME"
              exit 1
              ;;
          esac

          case "$DEPLOYMENT_CONCLUSION" in
            success)
              state="success"
              description="Exact ${deployment_kind} production proof passed."
              ;;
            failure)
              state="failure"
              description="$WORKFLOW_NAME finished failure."
              ;;
            *)
              state="error"
              description="$WORKFLOW_NAME finished $DEPLOYMENT_CONCLUSION."
              ;;
          esac

          payload=$(node --input-type=module - "$state" "$context_name" "$description" "$DEPLOYMENT_URL" <<'NODE'
          const [state, context, description, targetUrl] = process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            state,
            context,
            description,
            target_url: targetUrl,
          }));
          NODE
          )

          status_api="https://api.github.com/repos/$REPOSITORY/statuses/$DEPLOYMENT_SHA"
          common_curl=(
            --fail-with-body
            --silent
            --show-error
            --retry 5
            --retry-all-errors
            --retry-delay 2
            --header "Accept: application/vnd.github+json"
            --header "Authorization: Bearer $GH_TOKEN"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )

          if curl "${common_curl[@]}" \
            --request POST \
            "$status_api" \
            --data "$payload"; then
            echo "$context_name: $state for $DEPLOYMENT_SHA"
            exit 0
          fi

          echo "::warning title=Status write response unavailable::Confirming whether GitHub recorded the exact status before returning an upstream error."
          statuses=$(curl "${common_curl[@]}" "$status_api")
          STATUS_CONTEXT="$context_name" \
          STATUS_STATE="$state" \
          STATUS_TARGET_URL="$DEPLOYMENT_URL" \
          STATUSES_JSON="$statuses" \
          node --input-type=module <<'NODE'
          const statuses = JSON.parse(process.env.STATUSES_JSON ?? "[]");
          const expected = {
            context: process.env.STATUS_CONTEXT,
            state: process.env.STATUS_STATE,
            targetUrl: process.env.STATUS_TARGET_URL,
          };
          const exactStatus = statuses.some((status) =>
            status?.context === expected.context &&
            status?.state === expected.state &&
            status?.target_url === expected.targetUrl
          );
          if (!exactStatus) {
            throw new Error(`GitHub did not record the exact ${expected.context} status.`);
          }
          console.log(`${expected.context}: ${expected.state} confirmed after an unavailable write response.`);
          NODE
