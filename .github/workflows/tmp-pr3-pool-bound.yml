name: Temporary PR3 pool-bound update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/heavyweight-good-tier-depth
      - name: Advance intentional Play pool ceiling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/play/playFighterPool.test.ts')
          text = path.read_text()
          old = 'expect(playFighters.length).toBeLessThanOrEqual(200);'
          new = 'expect(playFighters.length).toBeLessThanOrEqual(220);'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit clean test update and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-pr3-pool-bound.yml
          git add src/features/play/playFighterPool.test.ts
          git commit -m 'Advance Play fighter pool depth ceiling'
          git push origin HEAD:codex/heavyweight-good-tier-depth
