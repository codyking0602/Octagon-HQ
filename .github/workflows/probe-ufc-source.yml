name: Probe UFC source

on:
  push:
    branches:
      - agent/restore-ufc-picks-source
    paths:
      - ".github/workflows/probe-ufc-source.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-ufc-picks-source
      - name: Probe Cloudflare browser transport
        shell: bash
        run: |
          set -u
          : > probe-output.txt
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "cloudflare_credentials=missing" > probe-output.txt
          else
            endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/browser-rendering/content"
            rm -f /tmp/cf-body /tmp/cf-headers
            status=$(curl --silent --show-error --max-time 45 \
              --request POST "$endpoint" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"url":"https://www.ufc.com/event/ufc-fight-night-august-22-2026","gotoOptions":{"waitUntil":"domcontentloaded","timeout":30000},"waitForTimeout":2000,"rejectResourceTypes":["image","media","font"]}' \
              -D /tmp/cf-headers -o /tmp/cf-body -w '%{http_code}' || true)
            {
              echo "cloudflare_browser_status=$status"
              echo "response_bytes=$(wc -c < /tmp/cf-body 2>/dev/null || echo 0)"
              if grep -Fqi 'Anthony Hernandez' /tmp/cf-body 2>/dev/null && grep -Fqi 'Gregory Rodrigues' /tmp/cf-body 2>/dev/null; then
                echo "current_main_event=present"
              else
                echo "current_main_event=missing"
              fi
              if grep -Fqi 'Fight Card' /tmp/cf-body 2>/dev/null; then
                echo "fight_card=present"
              else
                echo "fight_card=missing"
              fi
              if grep -Fqi 'Prelims' /tmp/cf-body 2>/dev/null && grep -Fqi 'Main Card' /tmp/cf-body 2>/dev/null; then
                echo "card_sections=present"
              else
                echo "card_sections=missing"
              fi
              echo "response_preview:"
              head -c 1200 /tmp/cf-body 2>/dev/null | sed -E 's/[A-Za-z0-9_-]{30,}/[redacted-long-token]/g' | tr '\n' ' ' || true
              echo
            } >> probe-output.txt
          fi
          cat probe-output.txt
      - name: Commit probe output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-output.txt
          git commit -m "Record UFC browser transport probe" || exit 0
          git push origin HEAD:agent/restore-ufc-picks-source
