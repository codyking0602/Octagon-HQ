name: TEMP Stage 13 Persist Repair

on:
  push:
    branches: [feat/football-ledger-stage13-factual-universe]
    paths:
      - .github/workflows/temp-stage13-force-commit.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/football-ledger-stage13-factual-universe
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Reapply proven repair
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          workflow = Path('.github/workflows/temp-stage13-final-repair.yml').read_text()
          marker = '      - name: Apply remaining canonical Stage 13 closure\n'
          start = workflow.index(marker)
          start = workflow.index('        run: |\n', start) + len('        run: |\n')
          end = workflow.index('\n      - name: Regenerate Stage 13 artifacts', start)
          raw = workflow[start:end]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          subprocess.run(['bash', '-e', '-c', block], check=True)
          PY
      - name: Regenerate Stage 13 artifacts
        run: npm run generate:football-factual-universe
      - name: Revalidate proven closures
        run: npx vitest run src/features/back-room/footballFactualUniverse.test.ts src/features/back-room/footballFactualStats.test.ts src/features/back-room/footballGenerationMaturity.test.ts
      - name: Persist repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json scripts/generate-football-factual-universe.mjs src/features/back-room/footballFactualUniverse.test.ts src/features/back-room/footballComparisonGeneration.ts
          git add -f data/generated/football/factual-universe-projection.json data/generated/football/factual-coverage-matrix.json
          git commit -m 'fix: close Stage 13 canonical factual gaps'
          git push origin HEAD:feat/football-ledger-stage13-factual-universe
