name: Fast PR Feedback

on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: fast-pr-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  VITE_SUPABASE_URL: https://octagon-validation.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_octagon_validation_only_00000000000000000000
  VITE_EXPECTED_SUPABASE_HOSTNAME: octagon-validation.supabase.co

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  fast-feedback:
    name: fast feedback
    if: ${{ github.event.pull_request.draft == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact draft head with comparison history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify exact checked-out SHA
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Exact SHA checkout failed::Expected $SOURCE_SHA but checked out $checked_out_sha."
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          echo "Fast feedback source verified: $checked_out_sha against base $BASE_SHA"

      - name: Set up Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Classify draft scope
        id: scope
        run: |
          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$SOURCE_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"

          whoami_only=true
          saw_whoami=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              src/features/games/whoAmI*.ts|src/features/games/footballWhoAmI*.ts|src/features/games/ufcWhoAmI*.ts|src/features/back-room/footballPersonIdentity*.ts|src/features/back-room/ufcPersonIdentity*.ts)
                saw_whoami=true
                ;;
              package.json|.github/workflows/fast-pr-feedback.yml|.github/workflows/validate.yml)
                ;;
              *)
                whoami_only=false
                break
                ;;
            esac
          done

          if [ "$saw_whoami" != true ]; then
            whoami_only=false
          fi

          echo "whoami_only=$whoami_only" >> "$GITHUB_OUTPUT"

      - name: Standard typecheck
        if: steps.scope.outputs.whoami_only != 'true'
        run: npm run typecheck

      - name: Generate Who Am I source artifacts
        if: steps.scope.outputs.whoami_only == 'true'
        run: |
          npm run generate:football-recognizability
          npm run generate:football-cfb-player-seasons
          npm run generate:football-factual-universe

      - name: Run fast Who Am I semantic gate
        if: steps.scope.outputs.whoami_only == 'true'
        env:
          WHO_AM_I_AUDIT_SUBJECTS: all
        run: npm run test:whoami:fast

      - name: Run tests affected by this PR
        if: steps.scope.outputs.whoami_only != 'true'
        run: npm test -- --changed="$BASE_SHA" --passWithNoTests

      - name: Summarize fast feedback
        if: success()
        run: |
          {
            echo "### Fast draft feedback passed"
            echo "- Exact draft head: \`$SOURCE_SHA\`"
            echo "- Draft scope: Who Am I-only = \`${{ steps.scope.outputs.whoami_only }}\`"
            echo "- Draft validation stayed on the lightweight path"
            echo "- Fast semantic gate or affected tests passed"
            echo "- Full validation still runs once the PR is marked ready"
          } >> "$GITHUB_STEP_SUMMARY"
