name: Materialize Auction UI Gates

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-auction-ui-gates.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Add focused backend verification and deployment gates
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one owner anchor in {path}")
              file.write_text(text.replace(old, new, 1))

          verify_path = ".github/workflows/verify-supabase-backend.yml"
          replace_once(
              verify_path,
              """            supabase/tests/auction_notifications_share_release.sql \\
            supabase/tests/pick_monitoring_truthful_decisions.sql""",
              """            supabase/tests/auction_notifications_share_release.sql \\
            supabase/tests/auction_ui_release_whats_new.sql \\
            supabase/tests/pick_monitoring_truthful_decisions.sql""",
          )

          release_gate = """          if [ \"$GITHUB_EVENT_NAME\" = \"pull_request\" ]; then
            local_version=$(printf '%s\\n' \"$migration_list\" | sed 's/│/|/g' | awk -F '|' '
              {
                local_version = $1
                gsub(/[^0-9]/, \"\", local_version)
                if (local_version == \"202609030001\") {
                  print local_version
                  exit
                }
              }
            ')
            if [ \"$local_version\" != \"202609030001\" ]; then
              echo \"::error title=Auction PR 6 migration missing::Migration 202609030001 is not present in the exact PR head.\"
              exit 1
            fi
            echo \"Auction PR 6 migration 202609030001 exists locally and passed the fresh-database suite; linked production history is hard-required after merge by the canonical deployment workflow.\"
          else
            require_remote_migration \"202609030001\" \"Auction PR 6 notifications and share release migration not deployed\"
          fi
"""
          ui_gate = release_gate + """
          if [ \"$GITHUB_EVENT_NAME\" = \"pull_request\" ]; then
            local_version=$(printf '%s\\n' \"$migration_list\" | sed 's/│/|/g' | awk -F '|' '
              {
                local_version = $1
                gsub(/[^0-9]/, \"\", local_version)
                if (local_version == \"202609030002\") {
                  print local_version
                  exit
                }
              }
            ')
            if [ \"$local_version\" != \"202609030002\" ]; then
              echo \"::error title=Auction UI release migration missing::Migration 202609030002 is not present in the exact PR head.\"
              exit 1
            fi
            echo \"Auction UI release migration 202609030002 exists locally and passed the focused fresh-database proof; linked production history is required after merge.\"
          else
            require_remote_migration \"202609030002\" \"Auction UI release What's New migration not deployed\"
          fi
"""
          replace_once(verify_path, release_gate, ui_gate)

          deploy_path = ".github/workflows/deploy-supabase.yml"
          deploy_gate = """          if [ -f supabase/migrations/202609030001_auction_notifications_share_release.sql ]; then
            require_remote_migration \"202609030001\"
          fi
"""
          replace_once(
              deploy_path,
              deploy_gate,
              deploy_gate + """          if [ -f supabase/migrations/202609030002_auction_ui_release_whats_new.sql ]; then
            require_remote_migration \"202609030002\"
          fi
""",
          )
          PY

          rm .github/workflows/materialize-auction-ui-gates.yml

      - name: Commit canonical release gates
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify Auction UI release through canonical backend owners"
          git push origin HEAD:"$HEAD_BRANCH"
