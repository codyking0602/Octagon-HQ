name: TEMP PR6 materialize

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/generate-football-recognizability.mjs
      - .github/workflows/temp-pr6-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Skip materialization commit
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -Fq '[materialize-pr6]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Repair projection and generate
        if: steps.guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-football-recognizability.mjs')
          s = p.read_text()
          s = s.replace('"Matt Ryan", "Jamaal Charles", "Dez Bryant", "Luke Kuechly", "A.J. Green", "Calvin Johnson", "Andrew Luck",', '"Matt Ryan", "Jamaal Charles", "Dez Bryant", "Luke Kuechly", "Calvin Johnson", "Andrew Luck",')
          s = s.replace('const p = people.get(sourceId) ?? { sourceId, name: String(name), league, seasons: new Set(), teams: new Set(), position: "", totals: {}, peaks: {} };', 'const personKey = league === "CFB" ? `${sourceId}:${normalize(name)}` : sourceId;\n    const p = people.get(personKey) ?? { sourceId, name: String(name), league, seasons: new Set(), teams: new Set(), position: "", totals: {}, peaks: {} };')
          s = s.replace('people.set(sourceId, p);', 'people.set(personKey, p);')
          s = s.replace('(sacks >= 50 || ints >= 20)', '(sacks >= 70 || ints >= 30)')
          s = s.replace('id: `cfbfast-r-player-${p.sourceId}`', 'id: `cfbfast-r-player-${p.sourceId}-${normalize(p.name)}`')
          p.write_text(s)
          if 'Math.random' in s:
              raise SystemExit('nondeterministic Math.random fallback remains')
          PY
          node scripts/generate-football-recognizability.mjs
      - name: Commit materialized artifacts
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-football-recognizability.mjs docs/football-recognizability-audit.md
          git add -f data/generated/football/recognizability-projection.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: materialize tightened PR6 recognizability [materialize-pr6]'
          git push origin HEAD:${{ github.head_ref }}
