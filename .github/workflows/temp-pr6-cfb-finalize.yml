name: TEMP PR6 CFB finalize

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/temp-pr6-cfb-finalize.yml
      - scripts/temp-finalize-pr6-cfb.mjs

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply final CFB calibration
        run: node scripts/temp-finalize-pr6-cfb.mjs
      - name: Regenerate projection and audit
        run: node scripts/generate-football-recognizability.mjs
      - name: Commit artifacts and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-football-recognizability.mjs src/features/back-room/footballRecognizabilityProjection.test.ts docs/football-recognizability-audit.md
          git add -f data/generated/football/recognizability-projection.json
          git rm scripts/temp-finalize-pr6-cfb.mjs .github/workflows/temp-pr6-cfb-finalize.yml
          git commit -m 'fix: tighten CFB recognizability context [finalize-pr6-cfb]'
          git push origin HEAD:${{ github.head_ref }}
# transient finalizer; self-deletes on success