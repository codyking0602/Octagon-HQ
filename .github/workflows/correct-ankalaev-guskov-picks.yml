name: Correct Ankalaev-Guskov Picks

on:
  push:
    branches:
      - ops/correct-ankalaev-guskov-picks
    paths:
      - .github/workflows/correct-ankalaev-guskov-picks.yml
      - scripts/correct-ankalaev-guskov-picks.mjs
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/correct-ankalaev-guskov-picks.yml
      - scripts/correct-ankalaev-guskov-picks.mjs

permissions:
  contents: read

concurrency:
  group: correct-ankalaev-guskov-picks
  cancel-in-progress: false

jobs:
  correct:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V2_PROJECT_REF: rvbspcjvebgwqzssayts
      V2_SUPABASE_URL: https://rvbspcjvebgwqzssayts.supabase.co
      CORRECTION_REPORT: /tmp/ankalaev-guskov-pick-correction.json
      DIAGNOSTIC_LOG: /tmp/ankalaev-guskov-pick-correction.log

    steps:
      - name: Check out exact operational branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Resolve V2 service credential without printing it
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing Supabase management credential::SUPABASE_ACCESS_TOKEN is unavailable."
            exit 1
          fi
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${V2_PROJECT_REF}/api-keys")
          service_key=$(printf '%s' "$response" | jq -r '[.[] | select(.name == "service_role" or .name == "secret") | (.api_key // .key // empty)] | map(select(length > 0)) | first // empty')
          if [ -z "$service_key" ]; then
            echo "::error title=V2 service credential unavailable::No service credential was returned."
            exit 1
          fi
          echo "::add-mask::$service_key"
          printf 'V2_SERVICE_ROLE_KEY=%s\n' "$service_key" >> "$GITHUB_ENV"

      - name: Correct picks and verify recalculated results
        shell: bash
        run: |
          set -euo pipefail
          node scripts/correct-ankalaev-guskov-picks.mjs 2>&1 | tee "$DIAGNOSTIC_LOG"
          test -s "$CORRECTION_REPORT"

      - name: Upload one-day correction proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ankalaev-guskov-pick-correction-${{ github.sha }}
          path: |
            /tmp/ankalaev-guskov-pick-correction.json
            /tmp/ankalaev-guskov-pick-correction.log
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0

      - name: Record correction boundary
        if: success()
        shell: bash
        run: |
          {
            echo "### Ankalaev-Guskov picks corrected from direct user evidence"
            echo "- Exact operational source SHA: \`${GITHUB_SHA}\`"
            echo "- Cody: Vagaev, Rzepecki, Dulatov, Kuniev, Erceg, Ankalaev"
            echo "- Cody lock: Damian Rzepecki at +212"
            echo "- Shane: opposite first two, same remaining four"
            echo "- Final event score: Cody 12, Shane 12"
            echo "- Official outcomes and event completion remained unchanged"
            echo "- Second pass produced zero mutations"
            echo "- Unrelated V2 data remained hash-identical"
            echo "- Zero active events remain"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary runner files
        if: always()
        shell: bash
        run: rm -f "$CORRECTION_REPORT" "$DIAGNOSTIC_LOG"
