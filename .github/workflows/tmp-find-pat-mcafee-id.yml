name: Temporary Find Pat McAfee Identity

on:
  push:
    branches:
      - stage13-6-finish-nfl-specialists

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Find canonical references
        run: grep -Rni --exclude='tmp-find-pat-mcafee-id.yml' 'Pat McAfee' src data docs | head -50
