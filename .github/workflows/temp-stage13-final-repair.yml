name: TEMP Stage 13 Specialist Registry Diagnostic

on:
  push:
    branches: [feat/football-ledger-stage13-factual-universe]
    paths:
      - .github/workflows/temp-stage13-final-repair.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/football-ledger-stage13-factual-universe
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Inspect canonical Stage 12 NFL specialists
        run: |
          cat > stage13-specialist-diag.ts <<'EOF'
          import { queryFootballSubjects } from './src/features/back-room/footballSubjectRegistry';
          import { getFootballFactualRecord } from './src/features/back-room/footballFactualStatsCore';
          const rows = queryFootballSubjects({
            league: 'NFL',
            kind: 'player-career',
            positions: ['K', 'P'],
            recognizabilityTiers: ['A','B','C'],
            includeProjectedCanonicalRecognition: true,
            includeProjectedSourceSubjects: true,
          });
          console.log('REGISTRY_SPECIALIST_COUNT', rows.length);
          for (const row of rows) {
            console.log('REGISTRY_SPECIALIST', JSON.stringify({
              id: row.id, name: row.name, position: row.position,
              tier: row.recognizabilityTier, startSeason: row.startSeason, endSeason: row.endSeason,
              sourceIdentityKeys: row.sourceIdentityKeys,
              existingFacts: getFootballFactualRecord(row.id)?.facts ?? [],
            }));
          }
          EOF
          npx vite-node stage13-specialist-diag.ts
          rm stage13-specialist-diag.ts
