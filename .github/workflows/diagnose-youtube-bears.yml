name: Diagnose official Bears YouTube highlights
on:
  push:
    branches: [diagnostic/football-seatgeek-discovery-20261020]
    paths:
      - .github/workflows/diagnose-youtube-bears.yml
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: List latest official Bears YouTube uploads
        run: |
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          url="https://www.youtube.com/feeds/videos.xml?channel_id=UCP0Cdc6moLMyDJiO0s-yhbQ"
          try:
            request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/atom+xml"})
            with urllib.request.urlopen(request,timeout=22) as response:
              content=response.read(500000)
              print("STATUS",response.status,"BYTES",len(content))
            root=ET.fromstring(content)
            atom="{http://www.w3.org/2005/Atom}"
            yt="{http://www.youtube.com/xml/schemas/2015}"
            for entry in root.findall(atom+"entry"):
              name=entry.findtext(atom+"title")
              date=entry.findtext(atom+"published")
              identifier=entry.findtext(yt+"videoId")
              print("VIDEO",date,"https://www.youtube.com/watch?v="+str(identifier),"TITLE",name)
          except Exception as exc:
            print("OFFICIAL FEED NOT ACCESSIBLE",repr(exc))
          PY
