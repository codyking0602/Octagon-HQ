name: Generate Dependency Lock Experiment

on:
  push:
    branches:
      - agent/dependency-lock-cache
    paths:
      - .github/workflows/generate-dependency-lock-experiment.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up project Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate package lock from the real npm registry
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -f package-lock.json

      - name: Prove the generated lock can perform a clean install
        run: npm ci --no-audit --no-fund

      - name: Commit the verified lock to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git commit -m "Lock application dependencies"
          git push origin HEAD:agent/dependency-lock-cache
