name: Diagnose Event Preview

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-event-preview.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: e35afa13f79286aaa6246b73e9572afd3c8d1db2
    steps:
      - name: List target deployment workflow runs
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=30" \
            --jq '.workflow_runs[] | select(.head_sha == env.TARGET_SHA or .name == "Deploy Labeled PR Head") | [.id,.name,.event,.head_branch,.head_sha,.status,.conclusion,.created_at] | @tsv'
