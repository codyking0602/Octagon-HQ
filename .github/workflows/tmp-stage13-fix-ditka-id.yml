name: Temporary Stage 13 Fix Ditka Identity

on:
  push:
    branches:
      - stage13-6-finish-nfl-te

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Correct Ditka canonical subject id
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/features/back-room/footballFactualStatsExpansion.ts')
          text = source.read_text().replace('wr("nfl-mike-ditka", 427, 5812, 43)', 'wr("mike-ditka", 427, 5812, 43)')
          source.write_text(text)
          test = Path('src/features/back-room/footballStage13_6FinishNflTe.test.ts')
          text = test.read_text().replace('"nfl-mike-ditka"', '"mike-ditka"')
          test.write_text(text)
          PY
      - run: npm run generate:football-cfb-player-seasons && npm run generate:football-factual-universe && npm run generate:football-ledger-audit
      - name: Commit canonical correction, generated audit, and self-clean
        run: |
          rm .github/workflows/tmp-stage13-fix-ditka-id.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/back-room/footballFactualStatsExpansion.ts src/features/back-room/footballStage13_6FinishNflTe.test.ts docs/football-ledger-stage13-5-review.md .github/workflows/tmp-stage13-fix-ditka-id.yml
          git commit -m 'Correct Stage 13.6 Ditka canonical identity'
          git push origin HEAD:stage13-6-finish-nfl-te
