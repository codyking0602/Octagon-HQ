name: Materialize Auction photo repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-auction-photo-repair.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'chatgpt/repair-auction-photo-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/repair-auction-photo-quality
          fetch-depth: 0

      - name: Materialize all sixteen clean renders
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          cat > /tmp/materialize.py <<'PY'
