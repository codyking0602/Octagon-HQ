name: PR7 scratch materialization

on:
  push:
    branches:
      - recovery/pr7-materialize-20260910

permissions:
  contents: write

concurrency:
  group: pr7-scratch-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Materialize and validate recovered PR7 payload
        run: node scripts/pr7-materialize-scratch.mjs
      - name: Commit materialized recovery output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/back-room/footballPersonIdentityKnowledge.ts docs/who-am-i-pr7-nfl-b-person-identity-audit.md scripts/pr7-materialize-validation.json
          git diff --cached --quiet && exit 0
          git commit -m "Materialize recovered PR7 product files"
          git push origin HEAD:${{ github.ref_name }}
