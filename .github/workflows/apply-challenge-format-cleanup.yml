name: Apply challenge formatting cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'chatgpt/challenge-member-picker-mobile-nav'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Clean generated JSX formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected cleanup block missing from {path}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/components/BottomNavigation.tsx",
              '''        <NavLink
key={destination.to}
to={destination.to}
end={destination.end}
onClick={(event) => {
  if (location.pathname !== destination.to) return;
  event.preventDefault();
  scrollPageToTop("smooth");
}}
className={({ isActive }) => (isActive ? "bottom-nav__item is-active" : "bottom-nav__item")}
        >
<span className="bottom-nav__indicator" aria-hidden="true" />
<NavigationIcon name={destination.icon} />
<span className="bottom-nav__label">{destination.label}</span>
{destination.to === "/war-room" && warRoom.unreadCount > 0 ? (
  <b
    className="bottom-nav__badge"
    aria-label={`${unreadLabel} unread War Room message${warRoom.unreadCount === 1 ? "" : "s"}`}
  >
    {unreadLabel}
  </b>
) : null}
        </NavLink>''',
              '''        <NavLink
          key={destination.to}
          to={destination.to}
          end={destination.end}
          onClick={(event) => {
            if (location.pathname !== destination.to) return;
            event.preventDefault();
            scrollPageToTop("smooth");
          }}
          className={({ isActive }) => (isActive ? "bottom-nav__item is-active" : "bottom-nav__item")}
        >
          <span className="bottom-nav__indicator" aria-hidden="true" />
          <NavigationIcon name={destination.icon} />
          <span className="bottom-nav__label">{destination.label}</span>
          {destination.to === "/war-room" && warRoom.unreadCount > 0 ? (
            <b
              className="bottom-nav__badge"
              aria-label={`${unreadLabel} unread War Room message${warRoom.unreadCount === 1 ? "" : "s"}`}
            >
              {unreadLabel}
            </b>
          ) : null}
        </NavLink>''',
          )

          replace_once(
              "src/features/challenges/ChallengeMemberPicker.tsx",
              '''        <input
autoCapitalize="characters"
autoComplete="off"
placeholder="SEARCH MEMBERS"
value={query}
onChange={(event) => setQuery(event.target.value.toUpperCase())}
        />''',
              '''        <input
          autoCapitalize="characters"
          autoComplete="off"
          placeholder="SEARCH MEMBERS"
          value={query}
          onChange={(event) => setQuery(event.target.value.toUpperCase())}
        />''',
          )
          replace_once(
              "src/features/challenges/ChallengeMemberPicker.tsx",
              '''        {options.map((member) => {
const normalizedName = normalizeMemberName(member.displayName);
const selected = normalizedName === normalizedSelected;
return (
  <button
    className={selected ? "is-selected" : ""}
    type="button"
    role="option"
    aria-selected={selected}
    disabled={busy}
    key={member.displayName}
    onClick={() => onSelect(member)}
  >
    <i>
      {member.avatarPhotoData
        ? <img src={member.avatarPhotoData} alt={`${member.displayName} profile`} />
        : member.initials}
    </i>
    <span>
      <strong>{member.displayName}</strong>
      <small>{recentSet.has(normalizedName) ? "RECENT OPPONENT" : "OCTAGON HQ MEMBER"}</small>
    </span>
    <em aria-hidden="true" />
  </button>
);
        })}''',
              '''        {options.map((member) => {
          const normalizedName = normalizeMemberName(member.displayName);
          const selected = normalizedName === normalizedSelected;
          return (
            <button
              className={selected ? "is-selected" : ""}
              type="button"
              role="option"
              aria-selected={selected}
              disabled={busy}
              key={member.displayName}
              onClick={() => onSelect(member)}
            >
              <i>
                {member.avatarPhotoData
                  ? <img src={member.avatarPhotoData} alt={`${member.displayName} profile`} />
                  : member.initials}
              </i>
              <span>
                <strong>{member.displayName}</strong>
                <small>{recentSet.has(normalizedName) ? "RECENT OPPONENT" : "OCTAGON HQ MEMBER"}</small>
              </span>
              <em aria-hidden="true" />
            </button>
          );
        })}''',
          )
          replace_once(
              "src/features/challenges/ChallengeMemberPicker.tsx",
              '''        {!options.length ? (
<p className="challenge-member-picker__empty">
  {query ? "No members match that search." : "No other Octagon HQ members are available yet."}
</p>
        ) : null}''',
              '''        {!options.length ? (
          <p className="challenge-member-picker__empty">
            {query ? "No members match that search." : "No other Octagon HQ members are available yet."}
          </p>
        ) : null}''',
          )

          replace_once(
              "src/features/challenges/ChallengeProvider.tsx",
              '''        <header>
<div>
  <p className="eyebrow">GAME CHALLENGE</p>
  <h2 id="challenge-dialog-title">Challenge Someone</h2>
  <p>Choose any Octagon HQ member below. Search is optional.</p>
</div>
<button type="button" className="challenge-dialog__close" aria-label="Close challenge dialog" onClick={onClose}>×</button>
        </header>''',
              '''        <header>
          <div>
            <p className="eyebrow">GAME CHALLENGE</p>
            <h2 id="challenge-dialog-title">Challenge Someone</h2>
            <p>Choose any Octagon HQ member below. Search is optional.</p>
          </div>
          <button type="button" className="challenge-dialog__close" aria-label="Close challenge dialog" onClick={onClose}>×</button>
        </header>''',
          )
          replace_once(
              "src/features/challenges/ChallengeProvider.tsx",
              '''        <div className="challenge-dialog__summary">
<span><small>{draft.gameTitle}</small><strong>{draft.summary}</strong></span>
<b>LOCKED</b>
        </div>''',
              '''        <div className="challenge-dialog__summary">
          <span><small>{draft.gameTitle}</small><strong>{draft.summary}</strong></span>
          <b>LOCKED</b>
        </div>''',
          )
          replace_once(
              "src/features/challenges/ChallengeProvider.tsx",
              '''        <ChallengeMemberPicker
members={members}
recentNames={recentProfileNames}
selectedName={selectedName}
busy={busy}
onSelect={(member) => void lookupProfile(member.displayName, member.avatarPhotoData)}
        />''',
              '''        <ChallengeMemberPicker
          members={members}
          recentNames={recentProfileNames}
          selectedName={selectedName}
          busy={busy}
          onSelect={(member) => void lookupProfile(member.displayName, member.avatarPhotoData)}
        />''',
          )
          replace_once(
              "src/features/challenges/ChallengeProvider.tsx",
              '''        <footer>
<button type="button" disabled={busy} onClick={() => void shareExternally()}>TEXT / SHARE LINK</button>
<button type="button" className="primary-action" disabled={!recipient || busy} onClick={() => void sendToProfile()}>
  {busy ? "SENDING…" : "SEND TO PROFILE"}
</button>
        </footer>''',
              '''        <footer>
          <button type="button" disabled={busy} onClick={() => void shareExternally()}>TEXT / SHARE LINK</button>
          <button type="button" className="primary-action" disabled={!recipient || busy} onClick={() => void sendToProfile()}>
            {busy ? "SENDING…" : "SEND TO PROFILE"}
          </button>
        </footer>''',
          )

          center = Path("src/features/challenges/ChallengeCenter.tsx")
          center.write_text(center.read_text().replace("              );\n\n\n              return (", "              );\n\n              return (", 1))
          Path(".github/workflows/apply-challenge-format-cleanup.yml").unlink()
          Path(".github/workflows/run-challenge-format-cleanup.yml").unlink(missing_ok=True)
          Path(".format-trigger").unlink(missing_ok=True)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies without creating a lockfile
        run: npm install --silent --no-package-lock

      - name: Verify cleanup
        run: |
          npm run typecheck
          npx vitest run src/features/challenges/ChallengeMemberPicker.test.ts src/app/mobileChallengeExperience.contract.test.ts

      - name: Commit clean implementation head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean challenge member picker formatting"
          git push origin HEAD:chatgpt/challenge-member-picker-mobile-nav
