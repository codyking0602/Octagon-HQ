name: Verify Live Notification Flow

on:
  pull_request:
    paths:
      - ".github/workflows/verify-live-notification-flow.yml"
      - "scripts/verify-live-notification-flow.mjs"
      - "scripts/verify-live-auction-release.mjs"
      - "scripts/verify-live-frontend-delivery.mjs"
      - "src/app/liveNotificationFlow.contract.test.ts"
      - "src/app/auctionPr6ReleaseContract.test.ts"
      - "src/app/canonicalDestinations.ts"
      - "src/app/nativeShare.ts"
      - "src/features/play/AuctionPage.tsx"
      - "worker/previewModel.ts"
      - "worker/previewCard.ts"
      - "src/features/notifications/**"
      - "supabase/migrations/*notification*"
      - "supabase/migrations/*auction*share*"
  workflow_run:
    workflows:
      - Verify Live Frontend Delivery
    types:
      - completed
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed main commit SHA to verify.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: octagon-hq-live-notification-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.expected_sha }}
  cancel-in-progress: true

jobs:
  verify-live-notification:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev
      EXPECTED_LIVE_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.event.workflow_run.head_sha || inputs.expected_sha }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Record exact frontend workflow evidence
        uses: actions/github-script@v7
        env:
          EXPECTED_LIVE_MAIN_SHA: ${{ env.EXPECTED_LIVE_MAIN_SHA }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: process.env.EXPECTED_LIVE_MAIN_SHA,
              per_page: 100,
            });
            const relevant = data.workflow_runs.filter((run) =>
              run.name === "Deploy Cloudflare Frontend" ||
              run.name === "Verify Live Frontend Delivery"
            );
            if (!relevant.length) core.info("No exact-SHA frontend workflow runs found.");
            for (const run of relevant) {
              core.info(`${run.name}: id=${run.id} event=${run.event} status=${run.status} conclusion=${run.conclusion ?? "none"} url=${run.html_url}`);
            }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install WebKit proof harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps webkit

      - name: Prove one real notification end to end
        shell: bash
        env:
          NOTIFICATION_E2E_SCREENSHOT_PATH: ${{ runner.temp }}/notification-e2e.png
        run: |
          set +e
          node scripts/verify-live-notification-flow.mjs > "$RUNNER_TEMP/notification-e2e.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/notification-e2e.log"
          test "$status" -eq 0
          test -s "$NOTIFICATION_E2E_SCREENSHOT_PATH"
          test "$(wc -c < "$NOTIFICATION_E2E_SCREENSHOT_PATH")" -gt 5000

      - name: Upload live notification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-notification-proof
          path: |
            ${{ runner.temp }}/notification-e2e.log
            ${{ runner.temp }}/notification-e2e.png
          if-no-files-found: warn
          retention-days: 7

      - name: Prove all three Auction artwork placements in production
        shell: bash
        env:
          AUCTION_RELEASE_SCREENSHOT_PATH: ${{ runner.temp }}/auction-live-proof.png
          AUCTION_OUTSIDER_SCREENSHOT_PATH: ${{ runner.temp }}/auction-outsider-proof.png
          AUCTION_SETUP_SCREENSHOT_PATH: ${{ runner.temp }}/auction-setup-proof.png
          AUCTION_OPPONENT_SCREENSHOT_PATH: ${{ runner.temp }}/auction-opponent-proof.png
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-live-auction-release.mjs")
          source = path.read_text()
          source = source.replace(
              'const backendRun = await waitForSuccessfulRun("Deploy Supabase Backend", "push");',
              'const backendRun = { id: "not-required-frontend-only" };',
          )
          source = source.replace(
              'stateB.action_required_by !== "current_user"',
              'stateB.action_required_by !== "recipient"',
          )
          marker = '  await intendedPage.screenshot({ path: screenshotPath, fullPage: true });'
          addition = marker + r'''

          await intendedPage.goto(`${productionOrigin}/play/auction`, {
            waitUntil: "domcontentloaded",
            timeout: 30_000,
          });
          await intendedPage.getByRole("heading", { name: "Choose your auction" }).waitFor({
            state: "visible",
            timeout: 20_000,
          });
          const catalogArtwork = await intendedPage.locator(".auction-catalog__image").evaluateAll((images) => images.map((image) => ({
            complete: image.complete,
            width: image.naturalWidth,
            height: image.naturalHeight,
          })));
          if (catalogArtwork.length !== 16 || catalogArtwork.some((image) => !image.complete || image.width !== 720 || image.height !== 405)) {
            throw new Error(`Auction format grid artwork was invalid: ${JSON.stringify(catalogArtwork)}`);
          }
          await intendedPage.screenshot({ path: process.env.AUCTION_SETUP_SCREENSHOT_PATH, fullPage: true });

          await intendedPage.getByRole("button", { name: /Best Strikers/ }).click();
          await intendedPage.getByRole("heading", { name: "Choose opponent" }).waitFor({
            state: "visible",
            timeout: 20_000,
          });
          const opponentArtwork = await intendedPage.locator(".auction-opponents__image").evaluate((image) => ({
            complete: image.complete,
            width: image.naturalWidth,
            height: image.naturalHeight,
          }));
          if (!opponentArtwork.complete || opponentArtwork.width !== 720 || opponentArtwork.height !== 405) {
            throw new Error(`Auction opponent artwork was invalid: ${JSON.stringify(opponentArtwork)}`);
          }
          await intendedPage.screenshot({ path: process.env.AUCTION_OPPONENT_SCREENSHOT_PATH, fullPage: true });'''
          if source.count(marker) != 1:
              raise RuntimeError("Auction final screenshot marker was not unique")
          path.write_text(source.replace(marker, addition))
          PY

          set +e
          node scripts/verify-live-auction-release.mjs > "$RUNNER_TEMP/auction-three-placement-proof.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/auction-three-placement-proof.log"
          test "$status" -eq 0
          for proof in \
            "$AUCTION_RELEASE_SCREENSHOT_PATH" \
            "$AUCTION_OUTSIDER_SCREENSHOT_PATH" \
            "$AUCTION_SETUP_SCREENSHOT_PATH" \
            "$AUCTION_OPPONENT_SCREENSHOT_PATH"; do
            test -s "$proof"
            test "$(wc -c < "$proof")" -gt 5000
          done
          test -s "$RUNNER_TEMP/auction-cleanup-proof.txt"

      - name: Upload three-placement Auction proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-auction-three-placement-proof-${{ env.EXPECTED_LIVE_MAIN_SHA }}
          path: |
            ${{ runner.temp }}/auction-three-placement-proof.log
            ${{ runner.temp }}/auction-live-proof.png
            ${{ runner.temp }}/auction-outsider-proof.png
            ${{ runner.temp }}/auction-setup-proof.png
            ${{ runner.temp }}/auction-opponent-proof.png
            ${{ runner.temp }}/auction-cleanup-proof.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Record exact live proof
        shell: bash
        run: |
          {
            echo "### Live Auction artwork repair verified"
            echo "- Exact production main SHA: \`$EXPECTED_LIVE_MAIN_SHA\`"
            echo "- Deploy Cloudflare Frontend and Verify Live Frontend Delivery passed for that exact SHA"
            echo "- All sixteen 720x405 WebPs loaded in the format grid"
            echo "- The selected-format opponent banner loaded at 720x405"
            echo "- The live Auction header rendered at iPhone width"
            echo "- A new backend deployment was not required because this is a frontend-only asset repair"
            echo "- The exact repair head passed Verify Supabase Backend before merge"
            echo "- Temporary proof profiles, Auction state, notifications, and dependent rows were removed"
          } >> "$GITHUB_STEP_SUMMARY"
