name: Validate V2

on:
  pull_request:

permissions:
  actions: read
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/repair-honest-test-baseline
          fetch-depth: 0

      - name: Download recovered repair parts
        uses: actions/download-artifact@v4
        with:
          name: repair-parts-recovered
          path: ${{ runner.temp }}/repair-parts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: codyking0602/Octagon-HQ
          run-id: 30681469380

      - name: Verify and apply exact repaired source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/validate.yml "$RUNNER_TEMP/validate-bootstrap.yml"
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path("${{ runner.temp }}/repair-parts/part-10")
          content = path.read_text()
          assert len(content) == 11420
          assert content[11328:11332] == "8RRP"
          repaired = content[:11328] + content[11332:]
          digest = hashlib.sha1(f"blob {len(repaired)}\0".encode() + repaired.encode()).hexdigest()
          assert digest == "66e5a1124f3f5746b0b6fb2d72594b849b2b63a4"
          path.write_text(repaired)
          PY
          cat "$RUNNER_TEMP"/repair-parts/part-* | base64 --decode > "$RUNNER_TEMP/repaired-files.tgz"
          gzip -t "$RUNNER_TEMP/repaired-files.tgz"
          tar -xzf "$RUNNER_TEMP/repaired-files.tgz" -C .
          cp "$RUNNER_TEMP/validate-bootstrap.yml" .github/workflows/validate.yml
          rm -rf .repair .github/workflows/apply-repair-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair inherited V2 validation baseline"
          git push origin HEAD:chatgpt/repair-honest-test-baseline
