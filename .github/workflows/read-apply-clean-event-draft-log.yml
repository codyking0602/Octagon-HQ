name: Read Apply Clean Draft Log

on:
  pull_request:
    paths:
      - ".github/workflows/read-apply-clean-event-draft-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  read-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Show the repair failure tail
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/89904625801/logs" > "$RUNNER_TEMP/job.log"
          tail -n 45 "$RUNNER_TEMP/job.log"
