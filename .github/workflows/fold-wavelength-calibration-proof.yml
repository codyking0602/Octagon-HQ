name: Fold Wavelength calibration proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fold-wavelength-calibration-proof.yml

permissions:
  contents: write

jobs:
  fold-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Include focused proof in canonical SQL suite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/generalized_todays_challenge_backend.sql')
          text = path.read_text()
          old = '\nrollback;\n'
          new = '\nrollback;\n\n\\ir wavelength_score_calibration.sql\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one final rollback, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/generalized_todays_challenge_backend.sql
          git commit -m "Run Wavelength calibration backend proof"
          git push origin HEAD:agent/calibrate-wavelength-score
