name: Verify Live Pick Deadlines

on:
  pull_request:
    paths:
      - ".github/workflows/verify-live-pick-deadlines.yml"
      - "scripts/verify-live-pick-deadlines.mjs"
      - "supabase/migrations/202609010002_restore_chronological_pick_bout_deadlines.sql"
      - "supabase/tests/per_fight_pick_locks.sql"
      - "supabase/tests/progressive_pick_bout_deadlines.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify production chronological fight deadlines
        run: node scripts/verify-live-pick-deadlines.mjs
