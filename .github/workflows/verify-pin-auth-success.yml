name: Verify PIN Authentication Success

on:
  pull_request:
    paths:
      - ".github/workflows/verify-pin-auth-success.yml"
      - "scripts/verify-pin-preview.mjs"
      - "supabase/functions/pin-auth/**"
      - "supabase/migrations/**"
      - "src/features/identity/**"
      - "src/lib/supabase.ts"
      - "scripts/build-supabase-proxy.mjs"
      - "wrangler.jsonc"

permissions:
  contents: read

jobs:
  verify-success:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify direct PIN login through the live branch preview
        id: pin-preview
        continue-on-error: true
        shell: bash
        run: node scripts/verify-pin-preview.mjs > "$RUNNER_TEMP/pin-preview.log" 2>&1

      - name: Upload concise PIN preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin-preview-diagnostics
          path: ${{ runner.temp }}/pin-preview.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce PIN preview result
        if: always()
        shell: bash
        env:
          PIN_PREVIEW_OUTCOME: ${{ steps.pin-preview.outcome }}
        run: |
          cat "$RUNNER_TEMP/pin-preview.log"
          test "$PIN_PREVIEW_OUTCOME" = "success"
