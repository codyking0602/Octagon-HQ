name: TEMP Football PR7 source window

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/temp-football-pr7-source-window.yml
      - scripts/temp-tighten-football-pr7-source-windows.mjs

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply source-window guard
        run: node scripts/temp-tighten-football-pr7-source-windows.mjs
      - name: Regenerate compact runtime projection
        run: node scripts/generate-football-find-leader-runtime.mjs
      - name: Commit guarded projection and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-football-find-leader-runtime.mjs
          git add -f data/generated/football/find-leader-runtime-projection.json
          git rm scripts/temp-tighten-football-pr7-source-windows.mjs .github/workflows/temp-football-pr7-source-window.yml
          git commit -m 'fix: guard PR7 career facts to complete source windows [materialize-pr7-window]'
          git push origin HEAD:${{ github.head_ref }}
