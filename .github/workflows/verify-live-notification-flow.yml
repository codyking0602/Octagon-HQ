name: Verify Live Notification Flow

on:
  pull_request:
    paths:
      - ".github/workflows/verify-live-notification-flow.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: octagon-hq-auction-photo-proof-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  verify-live-notification:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev
      EXPECTED_LIVE_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      AUCTION_RELEASE_SCREENSHOT_PATH: ${{ runner.temp }}/auction-live-proof.png
      AUCTION_OUTSIDER_SCREENSHOT_PATH: ${{ runner.temp }}/auction-outsider-proof.png
      AUCTION_SETUP_SCREENSHOT_PATH: ${{ runner.temp }}/auction-setup-proof.png
      AUCTION_OPPONENT_SCREENSHOT_PATH: ${{ runner.temp }}/auction-opponent-proof.png

    steps:
      - name: Check out disposable verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install WebKit proof harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps webkit

      - name: Align disposable proof and capture all three placements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-live-auction-release.mjs")
          source = path.read_text()
          source = source.replace(
              'const backendRun = await waitForSuccessfulRun("Deploy Supabase Backend", "push");',
              'const backendRun = { id: "not-required-frontend-only" };',
          )
          source = source.replace(
              'stateB.action_required_by !== "current_user"',
              'stateB.action_required_by !== "recipient"',
          )
          marker = '  await intendedPage.screenshot({ path: screenshotPath, fullPage: true });'
          addition = marker + r'''

          await intendedPage.goto(`${productionOrigin}/play/auction`, {
            waitUntil: "domcontentloaded",
            timeout: 30_000,
          });
          await intendedPage.getByRole("heading", { name: "Choose your auction" }).waitFor({
            state: "visible",
            timeout: 20_000,
          });
          const catalogArtwork = await intendedPage.locator(".auction-catalog__image").evaluateAll((images) => images.map((image) => ({
            complete: image.complete,
            width: image.naturalWidth,
            height: image.naturalHeight,
          })));
          if (catalogArtwork.length !== 16 || catalogArtwork.some((image) => !image.complete || image.width !== 720 || image.height !== 405)) {
            throw new Error(`Auction format grid artwork was invalid: ${JSON.stringify(catalogArtwork)}`);
          }
          await intendedPage.screenshot({ path: process.env.AUCTION_SETUP_SCREENSHOT_PATH, fullPage: true });

          await intendedPage.getByRole("button", { name: /Best Strikers/ }).click();
          await intendedPage.getByRole("heading", { name: "Choose opponent" }).waitFor({
            state: "visible",
            timeout: 20_000,
          });
          const opponentArtwork = await intendedPage.locator(".auction-opponents__image").evaluate((image) => ({
            complete: image.complete,
            width: image.naturalWidth,
            height: image.naturalHeight,
          }));
          if (!opponentArtwork.complete || opponentArtwork.width !== 720 || opponentArtwork.height !== 405) {
            throw new Error(`Auction opponent artwork was invalid: ${JSON.stringify(opponentArtwork)}`);
          }
          await intendedPage.screenshot({ path: process.env.AUCTION_OPPONENT_SCREENSHOT_PATH, fullPage: true });'''
          if source.count(marker) != 1:
              raise RuntimeError("Auction final screenshot marker was not unique")
          source = source.replace(marker, addition)
          path.write_text(source)
          PY

          set +e
          node scripts/verify-live-auction-release.mjs > "$RUNNER_TEMP/auction-three-placement-proof.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/auction-three-placement-proof.log"
          test "$status" -eq 0
          for proof in \
            "$AUCTION_RELEASE_SCREENSHOT_PATH" \
            "$AUCTION_OUTSIDER_SCREENSHOT_PATH" \
            "$AUCTION_SETUP_SCREENSHOT_PATH" \
            "$AUCTION_OPPONENT_SCREENSHOT_PATH"; do
            test -s "$proof"
            test "$(wc -c < "$proof")" -gt 5000
          done
          test -s "$RUNNER_TEMP/auction-cleanup-proof.txt"

      - name: Upload three-placement production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-auction-three-placement-proof-${{ env.EXPECTED_LIVE_MAIN_SHA }}
          path: |
            ${{ runner.temp }}/auction-three-placement-proof.log
            ${{ runner.temp }}/auction-live-proof.png
            ${{ runner.temp }}/auction-outsider-proof.png
            ${{ runner.temp }}/auction-setup-proof.png
            ${{ runner.temp }}/auction-opponent-proof.png
            ${{ runner.temp }}/auction-cleanup-proof.txt
          if-no-files-found: warn
          retention-days: 7
