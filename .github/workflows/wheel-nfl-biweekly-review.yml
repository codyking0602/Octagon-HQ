name: NFL Biweekly Editorial Test
on:
  workflow_dispatch:
  schedule:
    - cron: '45 21 * * 2'
    - cron: '45 22 * * 2'
permissions:
  contents: read
  actions: read
jobs:
  nfl-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/wheel-monitor/nfl-madden-review.mjs
      - run: node --check scripts/wheel-monitor/nfl-roster-integrity-pilot.mjs
      - run: node --check scripts/wheel-monitor/nfl-biweekly-consolidate.mjs
