name: Deploy Supabase Backend

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact same-repository PR head SHA to deploy.
        required: true
        type: string
      pr_number:
        description: Open pull request number whose head must still match source_sha.
        required: true
        type: string
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-supabase.yml"
      - "supabase/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: octagon-hq-supabase-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SOURCE_PR_NUMBER: ${{ inputs.pr_number || '0' }}
      OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev

    steps:
      - name: Revalidate requested PR head
        if: env.SOURCE_PR_NUMBER != '0'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          PR_NUMBER: ${{ env.SOURCE_PR_NUMBER }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedSha = process.env.EXPECTED_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== "open") {
              core.setFailed(`PR #${prNumber} is no longer open.`);
              return;
            }

            if (pr.base.ref !== "main") {
              core.setFailed(`PR #${prNumber} targets ${pr.base.ref}, not main.`);
              return;
            }

            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`PR #${prNumber} is not a same-repository pull request.`);
              return;
            }

            if (pr.head.sha !== expectedSha) {
              core.setFailed(
                `PR #${prNumber} moved from ${expectedSha} to ${pr.head.sha}. Reapply the deploy-backend label to deploy the new head.`,
              );
            }

      - name: Check out exact deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Exact SHA checkout failed::Expected $SOURCE_SHA but checked out $checked_out_sha."
            exit 1
          fi
          echo "Exact deployment source verified: $checked_out_sha"

      - name: Verify deployment credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is missing or empty."
              exit 1
            fi
          done

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link V2 project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Publish canonical production origin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" OCTAGON_APP_ORIGIN="$OCTAGON_PRODUCTION_ORIGIN"

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      - name: Deploy PIN authentication function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy pin-auth --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy UFC event sync function when present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -f supabase/functions/sync-next-ufc-event/index.ts ]; then
            printf '// Generated only in the deployment workspace.\nexport const DEPLOYED_SOURCE_SHA = "%s";\n' "$SOURCE_SHA" \
              > supabase/functions/sync-next-ufc-event/deployment.ts
            supabase functions deploy sync-next-ufc-event --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          else
            echo "sync-next-ufc-event is not present in this exact deployment source; skipping."
          fi

      - name: Deploy manual Picks monitoring function when present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -f supabase/functions/run-pick-monitoring/index.ts ]; then
            secret_names=$(supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" --output json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(x=>x.name).join("\n")))')
            if ! printf '%s\n' "$secret_names" | grep -Fxq "THE_ODDS_API_KEY"; then
              echo "::error title=Missing monitoring provider secret::THE_ODDS_API_KEY is not configured in the Supabase project."
              exit 1
            fi
            printf '// Generated only in the deployment workspace.\nexport const DEPLOYED_SOURCE_SHA = "%s";\n' "$SOURCE_SHA" \
              > supabase/functions/run-pick-monitoring/deployment.ts
            supabase functions deploy run-pick-monitoring --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          else
            echo "run-pick-monitoring is not present in this exact deployment source; skipping."
          fi

      - name: Deploy notification push delivery function when present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -f supabase/functions/deliver-notification-push/index.ts ]; then
            printf '// Generated only in the deployment workspace.\nexport const DEPLOYED_SOURCE_SHA = "%s";\n' "$SOURCE_SHA" \
              > supabase/functions/deliver-notification-push/deployment.ts
            supabase functions deploy deliver-notification-push --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          else
            echo "deliver-notification-push is not present in this exact deployment source; skipping."
          fi

      - name: Keep canonical automatic monitoring scheduler active
        if: ${{ hashFiles('supabase/migrations/202608090001_automatic_pick_monitoring_scheduler.sql') != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          PICK_MONITORING_SCHEDULER_ENABLED=true node scripts/configure-monitoring-scheduler.mjs
          echo "EXPECTED_MONITORING_SCHEDULER_ENABLED=true" >> "$GITHUB_ENV"

      - name: Verify migrations, functions, and production CORS
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          migration_list=$(supabase migration list --linked)
          printf '%s\n' "$migration_list"

          require_remote_migration() {
            local version="$1"
            local remote_version
            remote_version=$(printf '%s\n' "$migration_list" | sed 's/│/|/g' | awk -F '|' -v version="$version" '
              {
                local_version = $1
                remote_version = $2
                gsub(/[^0-9]/, "", local_version)
                gsub(/[^0-9]/, "", remote_version)
                if (local_version == version) {
                  print remote_version
                  exit
                }
              }
            ')
            test "$remote_version" = "$version"
          }

          require_remote_migration "202607240001"
          require_remote_migration "202607250001"
          require_remote_migration "202607260001"
          require_remote_migration "202607270001"
          if [ -f supabase/migrations/202608050001_event_setup_card_review.sql ]; then
            require_remote_migration "202608050001"
          fi
          if [ -f supabase/migrations/202608080001_manual_pick_monitoring_runner.sql ]; then
            require_remote_migration "202608080001"
          fi
          if [ -f supabase/migrations/202608090001_automatic_pick_monitoring_scheduler.sql ]; then
            require_remote_migration "202608090001"
          fi
          if [ -f supabase/migrations/202608090002_harden_pick_monitoring_schedule_claims.sql ]; then
            require_remote_migration "202608090002"
          fi
          if [ -f supabase/migrations/202608090003_verify_pick_monitoring_scheduler_runtime.sql ]; then
            require_remote_migration "202608090003"
          fi
          if [ -f supabase/migrations/202608100001_pick_monitoring_inbox.sql ]; then
            require_remote_migration "202608100001"
          fi
          if [ -f supabase/migrations/202608110001_live_pick_odds_application.sql ]; then
            require_remote_migration "202608110001"
          fi
          if [ -f supabase/migrations/202608250001_truthful_pick_monitoring_decisions.sql ]; then
            require_remote_migration "202608250001"
          fi
          if [ -f supabase/migrations/202608200025_notification_device_push_delivery.sql ]; then
            require_remote_migration "202608200025"
          fi
          if [ -f supabase/migrations/202608210002_auction_private_lifecycle.sql ]; then
            require_remote_migration "202608210002"
          fi
          if [ -f supabase/migrations/202608210003_auction_private_lifecycle_hardening.sql ]; then
            require_remote_migration "202608210003"
          fi
          if [ -f supabase/migrations/202608220001_auction_playable_server_engine.sql ]; then
            require_remote_migration "202608220001"
          fi
          if [ -f supabase/migrations/202608220002_auction_playable_server_engine_hardening.sql ]; then
            require_remote_migration "202608220002"
          fi
          if [ -f supabase/migrations/202608220003_auction_round_notification_hardening.sql ]; then
            require_remote_migration "202608220003"
          fi
          if [ -f supabase/migrations/202608220004_auction_catalog_version_rotation.sql ]; then
            require_remote_migration "202608220004"
          fi
          if [ -f supabase/migrations/202609020001_auction_real_ufc_catalog_private_grading.sql ]; then
            require_remote_migration "202609020001"
            require_remote_migration "202609020002"
            require_remote_migration "202609020003"
            require_remote_migration "202609020004"
            require_remote_migration "202609020005"
            require_remote_migration "202609020006"
            require_remote_migration "202609020007"
            require_remote_migration "202609020008"
          fi
          if [ -f supabase/migrations/202609030001_auction_notifications_share_release.sql ]; then
            require_remote_migration "202609030001"
          fi

          function_list=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID")
          printf '%s\n' "$function_list" | grep -F "pin-auth"
          if [ -f supabase/functions/sync-next-ufc-event/index.ts ]; then
            printf '%s\n' "$function_list" | grep -F "sync-next-ufc-event"
          fi
          if [ -f supabase/functions/run-pick-monitoring/index.ts ]; then
            printf '%s\n' "$function_list" | grep -F "run-pick-monitoring"
          fi
          if [ -f supabase/functions/deliver-notification-push/index.ts ]; then
            printf '%s\n' "$function_list" | grep -F "deliver-notification-push"
          fi

          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/pin-auth"
          status=$(curl --silent --show-error \
            --dump-header "$RUNNER_TEMP/pin-auth-headers.txt" \
            --output "$RUNNER_TEMP/pin-auth-response.json" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Origin: $OCTAGON_PRODUCTION_ORIGIN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$endpoint")

          if [ "$status" != "400" ]; then
            echo "::error title=PIN function verification failed::Expected HTTP 400 from the deployed validation path, received $status."
            cat "$RUNNER_TEMP/pin-auth-response.json"
            exit 1
          fi

          grep -Fq "Enter a name and a 4-digit PIN." "$RUNNER_TEMP/pin-auth-response.json"
          grep -Fiq "access-control-allow-origin: $OCTAGON_PRODUCTION_ORIGIN" "$RUNNER_TEMP/pin-auth-headers.txt"

          if [ -f supabase/functions/deliver-notification-push/index.ts ]; then
            push_endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/deliver-notification-push"
            push_status=$(curl --silent --show-error \
              --dump-header "$RUNNER_TEMP/push-config-headers.txt" \
              --output "$RUNNER_TEMP/push-config-response.json" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Origin: $OCTAGON_PRODUCTION_ORIGIN" \
              --header "Content-Type: application/json" \
              --data '{"mode":"configuration"}' \
              "$push_endpoint")
            test "$push_status" = "200"
            grep -Fq '"public_key"' "$RUNNER_TEMP/push-config-response.json"
            grep -Fq "\"deployment_sha\":\"$SOURCE_SHA\"" "$RUNNER_TEMP/push-config-response.json"
            grep -Fiq "access-control-allow-origin: $OCTAGON_PRODUCTION_ORIGIN" "$RUNNER_TEMP/push-config-headers.txt"

            unauthorized_status=$(curl --silent --show-error \
              --output "$RUNNER_TEMP/push-unauthorized-response.json" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"mode":"deliver","notification_id":"00000000-0000-0000-0000-000000000000"}' \
              "$push_endpoint")
            test "$unauthorized_status" = "401"
            grep -Fq "DELIVERY_AUTH_REQUIRED" "$RUNNER_TEMP/push-unauthorized-response.json"
          fi

      - name: Verify exact deployed UFC sync source
        if: ${{ hashFiles('supabase/functions/sync-next-ufc-event/index.ts') != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          EXPECTED_SYNC_SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: node scripts/verify-sync-function-deployment.mjs

      - name: Verify exact deployed manual monitoring source and scheduler
        if: ${{ hashFiles('supabase/functions/run-pick-monitoring/index.ts') != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          EXPECTED_MONITORING_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          EXPECTED_MONITORING_SCHEDULER_ENABLED: ${{ env.EXPECTED_MONITORING_SCHEDULER_ENABLED }}
        run: node scripts/verify-monitoring-function-deployment.mjs

      - name: Record deployed backend
        shell: bash
        run: |
          {
            echo "### Octagon HQ V2 backend deployed"
            echo "- Exact source SHA: \`$SOURCE_SHA\`"
            if [ "$SOURCE_PR_NUMBER" != "0" ]; then
              echo "- Source PR: #$SOURCE_PR_NUMBER"
            else
              echo "- Source event: $GITHUB_EVENT_NAME"
            fi
            echo "- Exact checkout was verified before deployment credentials were used"
            echo "- Database migrations applied"
            echo "- pin-auth Edge Function deployed"
            if [ -f supabase/functions/sync-next-ufc-event/index.ts ]; then
              echo "- sync-next-ufc-event Edge Function deployed and returned the embedded exact source SHA"
            fi
            if [ -f supabase/functions/run-pick-monitoring/index.ts ]; then
              echo "- run-pick-monitoring Edge Function deployed, rejected unauthenticated and fake-scheduler execution without a provider call, and returned the embedded exact source SHA"
            fi
            if [ -f supabase/functions/deliver-notification-push/index.ts ]; then
              echo "- deliver-notification-push Edge Function deployed, created or reused private VAPID keys, returned its public key, and rejected unauthenticated delivery"
            fi
            if [ -f supabase/migrations/202608090001_automatic_pick_monitoring_scheduler.sql ]; then
              echo "- Canonical hourly scheduler verified; active state: ${EXPECTED_MONITORING_SCHEDULER_ENABLED:-not-configured}"
            fi
            if [ -f supabase/migrations/202608210003_auction_private_lifecycle_hardening.sql ]; then
              echo "- Auction lifecycle migrations 202608210002 and 202608210003 verified in linked production history"
            fi
            if [ -f supabase/migrations/202608220004_auction_catalog_version_rotation.sql ]; then
              echo "- Auction playable server migrations 202608220001 through 202608220004 verified in linked production history"
            fi
            if [ -f supabase/migrations/202609020008_auction_private_fixed_grader.sql ]; then
              echo "- Auction real-content and private-grading migrations 202609020001 through 202609020008 verified in linked production history"
            fi
            if [ -f supabase/migrations/202609030001_auction_notifications_share_release.sql ]; then
              echo "- Auction notification, push-eligibility, and completed-share migration 202609030001 verified in linked production history"
            fi
            echo "- Canonical production origin: $OCTAGON_PRODUCTION_ORIGIN"
            echo "- Remote migrations, exact deployed function revisions, live authentication contracts, scheduler health, push configuration, and production CORS were verified"
            echo "- Project secrets were never printed or exposed to PR build code"
          } >> "$GITHUB_STEP_SUMMARY"
