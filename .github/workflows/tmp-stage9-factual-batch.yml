name: Temporary Stage 9 finalizer

on:
  push:
    branches:
      - games/20q-football-factual-readiness
    paths:
      - .github/workflows/tmp-stage9-factual-batch.yml

permissions:
  contents: write

concurrency:
  group: stage9-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: games/20q-football-factual-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Regenerate canonical Football artifacts
        run: |
          node scripts/generate-football-recognizability.mjs
          npm run generate:football-cfb-player-seasons
          npm run generate:football-career-media-context
          npm run generate:football-factual-universe
          npm run generate:football-ledger-audit
      - name: Remove temporary Stage 9 tooling
        run: |
          git checkout origin/main -- .github/workflows/fast-pr-feedback.yml
          rm -f .github/workflows/tmp-stage9-factual-batch.yml
          rm -f .github/scripts/tmp-stage9-factual-batch.py
          rm -f .github/scripts/tmp-stage9-pool-fix.py
          rm -f .github/scripts/tmp-stage9-final-facts.py
          rm -f .github/scripts/tmp-stage9-collision-fix.py
          rm -f .github/scripts/tmp-stage9-collision-values.py
          rm -f src/features/games/twentyQuestionsMetadataCoverage.audit.test.ts
          rm -f src/features/games/twentyQuestionsCandidateCoverage.audit.test.ts
      - name: Create exact candidate head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Stage 9 factual readiness"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify canonical Football ledger
        run: npm run verify:football-ledger-audit
      - name: Typecheck exact candidate head
        run: npm run typecheck
      - name: Run focused Stage 9 verification
        run: npx vitest run src/features/games/twentyQuestionsFactualReadiness.audit.test.ts src/features/back-room/footballCareerAffiliationProjection.test.ts
      - name: Run full test suite
        run: npm test -- --run
      - name: Build production bundle
        run: npm run build
      - name: Push exact verified head
        run: |
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git push origin HEAD:games/20q-football-factual-readiness
