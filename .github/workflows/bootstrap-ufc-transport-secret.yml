name: Bootstrap UFC transport secret

on:
  push:
    branches:
      - agent/restore-ufc-picks-source
    paths:
      - ".github/workflows/bootstrap-ufc-transport-secret.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-ufc-picks-source
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false
      - name: Resolve matching transport token without exposing the service key
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing bootstrap secret::$name is missing or empty."
              exit 1
            fi
          done
          api_keys_file="$RUNNER_TEMP/supabase-api-keys.json"
          trap 'rm -f "$api_keys_file" "$RUNNER_TEMP/ufc-transport-token"' EXIT
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" \
            --output "$api_keys_file"
          node - "$api_keys_file" "$RUNNER_TEMP/ufc-transport-token" <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const keys = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const service = keys.find((key) => key.type === 'secret')
            ?? keys.find((key) => key.type === 'legacy' && /service.role/i.test(key.name ?? ''));
          if (!service?.api_key) throw new Error('No Supabase service key was returned.');
          const token = crypto.createHash('sha256')
            .update(`octagon-ufc-source-v1:${service.api_key}`)
            .digest('hex');
          fs.writeFileSync(process.argv[3], token, { mode: 0o600 });
          NODE
          echo "UFC transport token derived from the existing Supabase service credential."
      - name: Store token only in the existing Octagon Worker
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/ufc-transport-token" | npx --yes wrangler@4.123.0 secret put UFC_SOURCE_TRANSPORT_TOKEN --config wrangler.jsonc
          echo "UFC source transport secret is configured in the canonical Octagon Worker."
