name: Verify Supabase Backend

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-auction-pr6-cleanup:
    if: github.head_ref == 'feat/auction-pr6-final-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: feat/auction-pr6-final-release
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Repair Auction proof cleanup order
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/octagon-pr6"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"
          cd "$target"
          git checkout "$TARGET_BRANCH"

          python - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/202609030001_auction_notifications_share_release.sql")
          text = migration.read_text()
          anchor = "revoke all on function public.get_rich_preview_data(text, text) from public;\ngrant execute on function public.get_rich_preview_data(text, text) to anon, authenticated;\n"
          cleanup_function = r'''

create or replace function public.cleanup_auction_release_proof(
  p_profile_ids uuid[]
)
returns integer
language plpgsql
security definer
set search_path = ''
as $$
declare
  v_profile_count integer;
  v_deleted integer;
begin
  if auth.role() <> 'service_role' then
    raise exception 'service role required';
  end if;

  if p_profile_ids is null
    or cardinality(p_profile_ids) not between 1 and 5
    or cardinality(p_profile_ids) <> (
      select count(distinct profile_id)
      from unnest(p_profile_ids) profile_id
    )
  then
    raise exception 'one to five unique proof profile IDs are required';
  end if;

  select count(*)
    into v_profile_count
  from public.profiles profile
  where profile.id = any(p_profile_ids)
    and profile.display_name ~ '^HQ[A-Z][0-9]+$';

  if v_profile_count <> cardinality(p_profile_ids) then
    raise exception 'cleanup is restricted to disposable HQ proof profiles';
  end if;

  delete from private.auction_games auction
  where auction.challenger_id = any(p_profile_ids)
     or auction.recipient_id = any(p_profile_ids);
  get diagnostics v_deleted = row_count;

  return v_deleted;
end;
$$;

revoke all on function public.cleanup_auction_release_proof(uuid[])
  from public, anon, authenticated;
grant execute on function public.cleanup_auction_release_proof(uuid[])
  to service_role;
'''
          if "create or replace function public.cleanup_auction_release_proof" not in text:
              if anchor not in text:
                  raise SystemExit("cleanup function insertion anchor missing")
              text = text.replace(anchor, anchor + cleanup_function, 1)
          comment_anchor = "comment on function public.get_rich_preview_data(text, text) is\n  'Single public rich-preview owner. Auction returns only completed final names, 0-100 scores, and winner or true tie; incomplete and private state returns null.';\n"
          cleanup_comment = "comment on function public.cleanup_auction_release_proof(uuid[]) is\n  'Service-role-only cleanup for one to five disposable HQ proof profiles. Deletes private Auction roots before supported auth-user cleanup cascades public dependents.';\n"
          if cleanup_comment not in text:
              if comment_anchor not in text:
                  raise SystemExit("cleanup comment insertion anchor missing")
              text = text.replace(comment_anchor, comment_anchor + cleanup_comment, 1)
          migration.write_text(text)

          sql_test = Path("supabase/tests/auction_notifications_share_release.sql")
          test = sql_test.read_text()
          replacements = {
              "  v_private_text text;\n": "  v_private_text text;\n  v_cleanup_count integer;\n",
              "    (v_challenger, 'PR6 Challenger', 'PR6 CHALLENGER', 'PC'),\n    (v_recipient, 'PR6 Recipient', 'PR6 RECIPIENT', 'PR'),\n    (v_outsider, 'PR6 Outsider', 'PR6 OUTSIDER', 'PO'),\n    (v_cancel_recipient, 'PR6 Cancel Recipient', 'PR6 CANCEL RECIPIENT', 'PX');": "    (v_challenger, 'HQA6001', 'HQA6001', 'HA'),\n    (v_recipient, 'HQB6002', 'HQB6002', 'HB'),\n    (v_outsider, 'HQO6003', 'HQO6003', 'HO'),\n    (v_cancel_recipient, 'HQC6004', 'HQC6004', 'HC');",
              "(v_notification->>'title') !~ '^Auction result · (You won|True tie|PR6 Recipient won)$'": "(v_notification->>'title') !~ '^Auction result · (You won|True tie|HQB6002 won)$'",
              "  perform set_config('request.jwt.claim.role', 'service_role', true);\n  perform set_config('request.jwt.claim.sub', '', true);\n  delete from auth.users where id in (v_challenger, v_recipient, v_outsider, v_cancel_recipient);": "  perform set_config('request.jwt.claim.role', 'service_role', true);\n  perform set_config('request.jwt.claim.sub', '', true);\n  v_cleanup_count := public.cleanup_auction_release_proof(array[\n    v_challenger, v_recipient, v_outsider, v_cancel_recipient\n  ]);\n  if v_cleanup_count <> 4 then\n    raise exception 'Auction proof cleanup removed % roots instead of 4', v_cleanup_count;\n  end if;\n  delete from auth.users where id in (v_challenger, v_recipient, v_outsider, v_cancel_recipient);",
          }
          for old, new in replacements.items():
              if old not in test:
                  if new in test:
                      continue
                  raise SystemExit(f"SQL test repair anchor missing: {old[:80]!r}")
              test = test.replace(old, new, 1)
          sql_test.write_text(test)

          live = Path("scripts/verify-live-auction-release.mjs")
          live_text = live.read_text()
          finally_anchor = "  if (browser) await browser.close().catch(() => undefined);\n  for (const profile of [...profiles].reverse()) {\n"
          cleanup_call = "  if (browser) await browser.close().catch(() => undefined);\n  const createdProfileIds = profiles.filter((profile) => profile.id).map((profile) => profile.id);\n  if (createdProfileIds.length > 0) {\n    const deletedRoots = Number(scalar(await rpc(\n      \"cleanup_auction_release_proof\",\n      { p_profile_ids: createdProfileIds },\n      secretKey,\n      secretKey,\n      \"Cleanup private Auction proof roots\",\n    )));\n    if (auctionId && deletedRoots < 1) {\n      throw new Error(`Auction cleanup removed ${deletedRoots} private roots.`);\n    }\n  }\n  for (const profile of [...profiles].reverse()) {\n"
          if cleanup_call not in live_text:
              if finally_anchor not in live_text:
                  raise SystemExit("live cleanup insertion anchor missing")
              live_text = live_text.replace(finally_anchor, cleanup_call, 1)
          old_delete = "    await fetch(`${supabaseOrigin}/auth/v1/admin/users/${profile.id}`, {\n      method: \"DELETE\",\n      headers: serviceHeaders,\n    }).catch(() => undefined);\n"
          new_delete = "    await request(\n      `Delete temporary Auction auth user ${profile.role}`,\n      `${supabaseOrigin}/auth/v1/admin/users/${profile.id}`,\n      { method: \"DELETE\", headers: serviceHeaders },\n      [200, 204],\n    );\n"
          if old_delete in live_text:
              live_text = live_text.replace(old_delete, new_delete, 1)
          elif new_delete not in live_text:
              raise SystemExit("live auth deletion anchor missing")
          evidence_anchor = "    cleanupEvidence.push(\"play challenge rows: removed\");\n"
          evidence = "    cleanupEvidence.push(\"private Auction roots: removed by service-role proof cleanup\");\n"
          if evidence not in live_text:
              if evidence_anchor not in live_text:
                  raise SystemExit("cleanup evidence anchor missing")
              live_text = live_text.replace(evidence_anchor, evidence_anchor + evidence, 1)
          live.write_text(live_text)

          contract = Path("src/app/auctionPr6ReleaseContract.test.ts")
          contract_text = contract.read_text()
          contract_anchor = '    expect(migration).toContain("auction.lifecycle_state = \'completed\'");\n'
          contract_add = (
              '    expect(migration).toContain("create or replace function public.cleanup_auction_release_proof");\n'
              '    expect(migration).toContain("cleanup is restricted to disposable HQ proof profiles");\n'
              '    expect(migration).toContain("to service_role");\n'
          )
          if contract_add not in contract_text:
              if contract_anchor not in contract_text:
                  raise SystemExit("cleanup contract anchor missing")
              contract_text = contract_text.replace(contract_anchor, contract_anchor + contract_add, 1)
              contract.write_text(contract_text)
          PY

          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/202609030001_auction_notifications_share_release.sql \
            supabase/tests/auction_notifications_share_release.sql \
            scripts/verify-live-auction-release.mjs \
            src/app/auctionPr6ReleaseContract.test.ts
          git commit -m "Clean up Auction proof roots before profiles"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
