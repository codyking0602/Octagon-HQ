name: Diagnose Profile Owner

on:
  push:
    branches:
      - agent/repair-picks-event-import
    paths:
      - ".github/workflows/diagnose-profile-owner.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-picks-event-import
          fetch-depth: 1
      - name: Locate profile write and schema owners
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PROFILE SOURCE FILES ==="
          grep -RIl --exclude-dir=node_modules --exclude-dir=.git -E "PROFILE UPDATED|from\(['\"]profiles['\"]\)|/rest/v1/profiles|first_name|display_name" src supabase scripts | sort
          echo "=== PROFILE WRITE CALLS ==="
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E "from\(['\"]profiles['\"]\)|upsert\(|insert\(|update\(|PROFILE UPDATED" src | head -n 300
          echo "=== PROFILE TABLE/POLICY DEFINITIONS ==="
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E "create table.*profiles|alter table.*profiles|policy.*profiles|on public\.profiles|user_id.*profiles|profiles.*user_id" supabase/migrations | head -n 500
          echo "=== END PROFILE OWNER DIAGNOSTIC ==="
