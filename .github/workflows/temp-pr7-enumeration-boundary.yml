name: TEMP PR7 enumeration boundary

on:
  push:
    branches:
      - codex/football-ledger-pr7-find-leader
    paths:
      - .github/workflows/temp-pr7-enumeration-boundary.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/football-ledger-pr7-find-leader
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent --no-audit --no-fund
      - name: Apply enumeration boundary
        run: python scripts/temp-pr7-enumeration-boundary.py
      - name: Focused PR7 regression tests
        run: npx vitest run src/features/back-room/footballFindLeaderRuntimeProjection.test.ts src/features/back-room/footballHitTheNumberModel.test.ts src/features/play/findLeaderCompetition.test.ts --reporter=dot
      - name: Typecheck
        run: npm run typecheck
      - name: Commit fix and remove staging tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/temp-pr7-enumeration-boundary.py .github/workflows/temp-pr7-enumeration-boundary.yml
          git add src/features/back-room/footballFactualStatsCore.ts src/features/back-room/footballFindLeaderRuntimeProjection.test.ts src/features/play/findLeaderCompetition.test.ts
          git commit -m "fix: keep PR7 projection exposure game-scoped"
          git push origin HEAD:codex/football-ledger-pr7-find-leader
