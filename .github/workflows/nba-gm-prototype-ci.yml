name: NBA GM Private Prototype Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]
    paths:
      - "src/features/nba/nbaGmDev*"
      - "src/features/nba/nbaGmOfficialHeadshots.ts"
      - "scripts/audit-nba-gm-cdn-private.mjs"
      - "src/features/nba/nbaGmVisualParity.test.tsx"
      - "src/features/nba/nbaGmDraftCompletion.test.ts"
      - "src/features/nba/nbaGmHistoricalCalibration.test.ts"
      - "src/features/nba/nbaGmPostseasonCalibration.test.ts"
      - "docs/nba-gm-150-team-season-efficiency-2022-2026.csv"
      - "docs/nba-gm-150-team-season-postseason-2022-2026.csv"
      - "src/features/nba/NbaGmDevPage.tsx"
      - "src/features/nba/NbaGmDevelopmentReport.tsx"
      - "src/features/nba/NbaGmFinalExperience.tsx"
      - "src/features/nba/nbaGmScouting.ts"
      - "src/features/nba/nbaGmScoutingCalibration.test.ts"
      - "src/features/nba/nbaGmThreeSeasonBalance.test.ts"
      - "src/features/nba/nbaGmFinalPresentation.test.ts"
      - "src/features/nba/nbaGmFootballParity.test.tsx"
      - "supabase/migrations/202612310897_nba_gm_football_parity_private.sql"
      - "supabase/migrations/202612310898_nba_gm_dev_profiles_setup.sql"
      - "supabase/migrations/202612310900_nba_gm_scouting_reprice_signals.sql"
      - "supabase/migrations/202612310901_nba_gm_private_three_season_balance.sql"
      - "supabase/migrations/202612310902_nba_gm_starters_score_release.sql"
      - "supabase/tests/nba_gm_owner_starter_score_release.sql"
      - "supabase/tests/nba_gm_three_season_balance.sql"
      - "data/curated/nba/gm-nba-development-profiles-2026-10-30.json"
      - "src/features/nba/nbaGmDevelopmentProfiles.test.ts"
      - "supabase/tests/nba_gm_development_profiles.sql"
      - "supabase/tests/nba_gm_scouting_reprice.sql"
      - "src/styles/nba-gm-dev.css"
      - "src/app/router.tsx"
      - "supabase/migrations/202612310893_nba_gm_private_playtest_runtime.sql"
      - "supabase/migrations/202612310894_nba_gm_private_330_development_fixtures.sql"
      - "supabase/migrations/202612310896_nba_gm_spin_first_private_franchise.sql"
      - "supabase/tests/nba_gm_private_playtest.sql"
      - ".github/workflows/nba-gm-prototype-ci.yml"

permissions:
  contents: read

concurrency:
  group: nba-gm-private-prototype-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  head-build:
    name: exact-head typecheck, build, NBA and Football GM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      VITE_SUPABASE_URL: https://octagon-validation.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_octagon_validation_only_00000000000000000000
      VITE_EXPECTED_SUPABASE_HOSTNAME: octagon-validation.supabase.co
    steps:
      - name: Check out exact draft PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund
      - name: Typecheck and generate existing required artifacts
        run: npm run typecheck
      - name: Build production artifacts without deploying
        run: npm run build:artifacts
      - name: NBA GM and Football GM unit regressions
        run: npx vitest run src/features/nba/nbaGmHistoricalCalibration.test.ts src/features/nba/nbaGmPostseasonCalibration.test.ts src/features/nba/nbaGmDraftCompletion.test.ts src/features/nba/nbaGmDevPrototype.test.ts src/features/nba/nbaGmVisualParity.test.tsx src/features/nba/nbaGmFootballParity.test.tsx src/features/nba/nbaGmDevelopmentProfiles.test.ts src/features/nba/nbaGmScoutingCalibration.test.ts src/features/nba/nbaGmThreeSeasonBalance.test.ts src/features/nba/nbaGmStarterPriority.test.ts src/features/nba/nbaGmFinalPresentation.test.ts src/features/nba/nbaGmFoundation.test.ts src/features/nba/nbaGmSixSkillProposals.test.ts src/features/back-room/footballGmEngine.test.ts src/features/back-room/footballGmRosterFlow.test.ts src/features/back-room/footballGmLongFoundation.test.ts

      - name: Probe live official NBA image delivery and record all 330 results
        if: always()
        timeout-minutes: 7
        run: node scripts/audit-nba-gm-cdn-private.mjs
