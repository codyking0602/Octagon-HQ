name: Temporary Stage 13 Finish NFL WR

on:
  push:
    branches:
      - stage13-6-finish-nfl-wr

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Hydrate remaining NFL WR facts
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/back-room/footballFactualStatsExpansion.ts')
          text = path.read_text()
          marker = '  wr("nfl-fred-biletnikoff", 589, 8974, 76),\n'
          addition = '''  wr("nfl-harold-carmichael", 590, 8985, 79),
          wr("nfl-james-lofton", 764, 14004, 75),
          wr("nfl-john-stallworth", 537, 8723, 63),
          wr("nfl-lance-alworth", 542, 10266, 85),
          wr("nfl-lynn-swann", 336, 5462, 51),
          wr("nfl-paul-warfield", 427, 8565, 85),
          wr("nfl-sterling-sharpe", 595, 8134, 65),
          wr("nfl-steve-largent", 819, 13089, 100),
          '''
          if marker not in text:
              raise SystemExit('canonical insertion marker not found')
          if 'nfl-harold-carmichael' in text:
              raise SystemExit('remaining NFL WR hydration already present')
          path.write_text(text.replace(marker, marker + addition, 1))
          PY
      - run: npm run generate:football-cfb-player-seasons && npm run generate:football-factual-universe && npm run generate:football-ledger-audit
      - name: Commit canonical source, generated audit, and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/back-room/footballFactualStatsExpansion.ts docs/football-ledger-stage13-5-review.md
          git rm .github/workflows/tmp-stage13-finish-nfl-wr.yml
          git commit -m "Finish Stage 13.6 NFL WR factual hydration"
          git push origin HEAD:stage13-6-finish-nfl-wr
