name: Temporary Vince Transfer

on:
  push:
    branches:
      - fix/football-vince-transition
    paths:
      - ".vince-transfer/**"
      - ".github/workflows/temp-vince-transfer.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct approved Vince Young transition
        shell: bash
        run: |
          set -euo pipefail
          cat .vince-transfer/*.b64 > "$RUNNER_TEMP/vince.b64"
          base64 -d "$RUNNER_TEMP/vince.b64" > public/assets/football/vince-young-championship-run.mp4
          test "$(wc -c < public/assets/football/vince-young-championship-run.mp4)" -eq 80417
          test "$(sha256sum public/assets/football/vince-young-championship-run.mp4 | cut -d' ' -f1)" = "6c94851fc1388b721b9b45225b63bebfc1bb64e05572c621127f5575a2500e9d"
      - name: Commit reconstructed asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/football/vince-young-championship-run.mp4
          git commit -m "Replace Football HQ Vince transition clip"
          git push
