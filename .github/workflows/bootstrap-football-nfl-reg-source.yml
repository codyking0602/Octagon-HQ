name: Bootstrap Football NFL regular source

on:
  push:
    branches:
      - fix/football-nfl-dedicated-regular-assets
    paths:
      - .github/workflows/bootstrap-football-nfl-reg-source.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/football-nfl-dedicated-regular-assets
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Snapshot pinned nflverse regular-season assets
        run: node scripts/snapshot-football-nflverse-source-manifest.mjs
      - name: Commit generated source manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/data/football/nfl/historical-player-team-seasons.source-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot nflverse regular-season assets"
          git push origin HEAD:fix/football-nfl-dedicated-regular-assets
