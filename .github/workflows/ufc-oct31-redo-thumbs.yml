name: UFC Oct31 real-photo thumb rebuild (one-time)
on:
  push:
    branches:
      - assets/ufc-oct31-real-photo-thumbnails-20261027
    paths:
      - scripts/ufc_oct31_replace_thumbs.py
permissions:
  contents: write
jobs:
  rebuild:
    if: github.event.head_commit.message == 'Request clean real-person UFC thumb replacements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests beautifulsoup4 rembg onnxruntime
      - name: Rebuild nine real-fighter 320px WebPs
        run: python scripts/ufc_oct31_replace_thumbs.py
      - name: Commit photos for explicit visual review
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/assets/fighters/*-thumb.webp
          git commit -m "Generate nine real-photo UFC October 31 replacement thumbnails"
          git push origin "HEAD:${GITHUB_REF_NAME}"
