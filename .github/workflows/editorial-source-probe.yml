name: Editorial source discovery diagnostic
on:
  push:
    branches: [preview/football-editorial-20261013]
    paths: [.github/workflows/editorial-source-probe.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Octagon HQ live deployment and approved image files
        shell: python
        run: |
          import urllib.request,json
          for origin in ("https://octagon.hq-app.workers.dev", "https://the.hq-app.workers.dev"):
            for path in ("/deployment.json",
                         "/assets/football/weekly/2026-10-13/cfb/spotlight.webp",
                         "/assets/football/weekly/2026-10-13/nfl/spotlight.webp"):
              try:
                with urllib.request.urlopen(urllib.request.Request(origin+path,headers={"User-Agent":"OctagonHQReleaseVerification/1.0"}),timeout=15) as r:
                  raw=r.read(250) if path.endswith(".json") else r.read(28)
                  print("LIVE",origin,path,r.status,r.headers.get("Content-Type"),raw,flush=True)
              except Exception as e:
                print("NOT_LIVE",origin,path,type(e).__name__,str(e)[:120],flush=True)
