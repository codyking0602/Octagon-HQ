name: Refresh UFCStats ranking branch snapshot

on:
  push:
    branches:
      - feature/ufc-rankings-van-pantoja-rda

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh UFCStats supplemental snapshot
        run: node scripts/backfill-ufcstats-supplemental.mjs

      - name: Verify focused ranking evidence
        run: |
          npx vitest run src/features/rankings/data/ufcStatsSupplementalFacts.test.ts src/features/rankings/data/september2026RankingRefresh.test.ts
          git diff --check

      - name: Commit refreshed snapshot and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/rankings/data/generated/ufcstats-supplemental-facts-v1.json
          git rm .github/workflows/refresh-ufcstats-ranking-branch.yml
          git commit -m "Refresh UFCStats supplemental ranking facts"
          git push origin "HEAD:${{ github.ref_name }}"
