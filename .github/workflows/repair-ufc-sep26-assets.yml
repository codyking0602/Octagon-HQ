name: Repair Sep 26 UFC fighter assets

on:
  push:
    branches:
      - chatgpt/ufc-sep26-assets-odds-fix

permissions:
  contents: write

jobs:
  repair-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ufc-sep26-assets-odds-fix
          fetch-depth: 1

      - name: Install image tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow "rembg[cpu]" onnxruntime

      - name: Download real fighter photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ufc-asset-src/raw .ufc-asset-src/cut

          fetch() {
            local name="$1"
            local url="$2"
            curl --fail --location --retry 4 --retry-delay 2 \
              --user-agent "Mozilla/5.0" \
              --output ".ufc-asset-src/raw/$name" "$url"
            test -s ".ufc-asset-src/raw/$name"
          }

          # These are the same real-photo sources already proven reachable by the
          # Sep. 26 prep asset job. The repair changes the transformation: every
          # source becomes a true alpha cutout instead of being composited onto
          # an opaque white canvas.
          fetch raul-rosas-jr.png 'https://gidstats.com/img/fighters/0/0/1-1596.png'
          fetch raoni-barcelos.png 'https://cbssports.cbsistatic.com/ufc/public-files/f18ee6e5-c1d5-496f-91e6-4b555940345b/BARCELOS_RAONI_R_06-14.png?gender=m&stance=r'
          fetch rodolfo-vieira.png 'https://gidstats.ru/img/fighters/460/700/1-341.png'
          fetch robert-bryczek.png 'https://gidstats.ru/img/fighters/460/700/1-1085.png'
          fetch brady-hiestand.png 'https://gidstats.com/img/fighters/460/700/1-472.png'
          fetch rinya-nakamura.webp 'https://www.neweracap.jp/cdn/shop/articles/br-mma-561618_1024x.webp?v=1748262234'
          fetch mehemmedeli-osmanli.jpg 'https://pbs.twimg.com/media/Gwo02kKWQAA33KY.jpg'
          fetch ilimbek-akylbek.jpg 'https://cdn-1.aki.kg/cdn-st-0/qi0/F/en-891042.1776244308.b.jpg'
          fetch melissa-amaya.jpg 'https://thumb.spokesman.com/QQdu-DUfe69zlQwD43Lq_LBOG-g%3D/2500x1875/smart/media.spokesman.com/photos/2025/06/18/68534e632a5e4.hires.jpg'
          fetch valesca-machado.png 'https://gidstats.com/img/fighters/0/0/1-1232.png'
          fetch josiah-harrell.png 'https://gidstats.com/img/fighters/0/0/2-1096.png'
          fetch elves-brener.png 'https://gidstats.com/img/fighters/0/0/1-1357.png'

      - name: Create true transparent cutouts
        shell: bash
        run: |
          set -euo pipefail
          for source in .ufc-asset-src/raw/*; do
            base="$(basename "$source")"
            stem="${base%.*}"
            python -m rembg i "$source" ".ufc-asset-src/cut/$stem.png"
          done

      - name: Build transparent WebP assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          root = Path('.ufc-asset-src/cut')
          out = Path('public/assets/fighters')
          out.mkdir(parents=True, exist_ok=True)

          slugs = [
              'raul-rosas-jr','raoni-barcelos','rodolfo-vieira','robert-bryczek',
              'brady-hiestand','rinya-nakamura','mehemmedeli-osmanli','ilimbek-akylbek',
              'melissa-amaya','valesca-machado','josiah-harrell','elves-brener',
          ]

          def load_cutout(slug):
              path = root/f'{slug}.png'
              im = Image.open(path).convert('RGBA')
              alpha = im.getchannel('A')
              assert alpha.getextrema()[0] < 255, f'{slug} background removal produced no alpha'
              box = alpha.getbbox()
              assert box, f'{slug} has no visible subject'
              return im.crop(box)

          def fit(im, size, *, bottom):
              width, height = size
              scale = min(width / im.width, height / im.height)
              nw = max(1, round(im.width * scale))
              nh = max(1, round(im.height * scale))
              im = im.resize((nw, nh), Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=0.55, percent=45, threshold=2))
              canvas = Image.new('RGBA', size, (0, 0, 0, 0))
              x = (width - nw) // 2
              y = height - nh if bottom else (height - nh) // 2
              canvas.alpha_composite(im, (x, y))
              return canvas

          # Preserve the already-approved Rosas thumb exactly.
          for slug in slugs:
              subject = load_cutout(slug)
              if slug != 'raul-rosas-jr':
                  fit(subject, (320, 320), bottom=True).save(
                      out/f'{slug}-thumb.webp', 'WEBP', quality=92, method=6
                  )
              fit(subject, (626, 800), bottom=True).save(
                  out/f'{slug}-spotlight.webp', 'WEBP', quality=92, method=6
              )
          PY

      - name: Verify asset dimensions and alpha
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          repaired = [
            'raoni-barcelos','rodolfo-vieira','robert-bryczek','brady-hiestand','rinya-nakamura',
            'mehemmedeli-osmanli','ilimbek-akylbek','melissa-amaya','valesca-machado',
            'josiah-harrell','elves-brener'
          ]
          spotlights = ['raul-rosas-jr', *repaired]
          for slug in repaired:
              p = Path('public/assets/fighters')/f'{slug}-thumb.webp'
              im = Image.open(p).convert('RGBA')
              assert im.size == (320,320)
              assert im.getchannel('A').getextrema()[0] < 255
              print(p, im.size, im.getchannel('A').getextrema())
          for slug in spotlights:
              p = Path('public/assets/fighters')/f'{slug}-spotlight.webp'
              im = Image.open(p).convert('RGBA')
              assert im.size == (626,800)
              assert im.getchannel('A').getextrema()[0] < 255
              print(p, im.size, im.getchannel('A').getextrema())
          PY

      - name: Commit repaired assets and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ufc-asset-src
          rm -f .github/workflows/repair-ufc-sep26-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/fighters .github/workflows/repair-ufc-sep26-assets.yml
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "UFC Picks: repair Sep 26 transparent fighter assets"
          git push origin HEAD:chatgpt/ufc-sep26-assets-odds-fix
