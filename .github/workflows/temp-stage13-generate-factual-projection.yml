name: TEMP Stage 13 Generate Football Factual Projection

on:
  push:
    branches: [stage13-football-factual-universe]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Stage 13 branch
        uses: actions/checkout@v4
        with:
          ref: stage13-football-factual-universe
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Materialize Stage 13 canonical ownership
        run: |
          node scripts/stage13-fix-generator.mjs
          node scripts/stage13-include-recognition-evidence.mjs
          node scripts/stage13-patch-core.mjs

      - name: Generate factual projection
        run: node --experimental-strip-types scripts/generate-football-find-leader-runtime.mjs

      - name: Commit materialized Stage 13 files
        run: |
          if git diff --quiet; then
            echo "Stage 13 files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-football-find-leader-runtime.mjs src/features/back-room/footballFactualStatsCore.ts src/features/back-room/footballFactualStats.ts
          git add -f data/generated/football/find-leader-runtime-projection.json
          git commit -m "Materialize Stage 13 Football factual universe"
          git push origin HEAD:stage13-football-factual-universe
