name: Diagnose verified SeatGeek matchup asset
on:
  push:
    branches:
      - diagnostic/football-seatgeek-discovery-20261020
    paths:
      - .github/workflows/diagnose-seatgeek-matchup.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect official SeatGeek event image references (read only)
        shell: bash
        run: |
          python3 - <<'PY'
          import html, re, urllib.request, urllib.error
          url = "https://seatgeek.com/chicago-bears-tickets/10-22-2026-chicago-illinois-soldier-field/nfl/18016524"
          req = urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; OctagonHQEditorialAudit/1.0)","Accept":"text/html"})
          try:
            with urllib.request.urlopen(req,timeout=25) as res:
              source=res.read(3000000).decode(errors="replace")
              print("HTTP",res.status,"SIZE",len(source))
          except Exception as exc:
            print("FETCH FAILED",repr(exc));raise SystemExit(0)
          source=html.unescape(source).replace("\\u002F","/").replace("\\/","/")
          title=re.search(r"<title[^>]*>(.*?)</title>",source,re.I|re.S)
          print("TITLE",title.group(1)[:220] if title else "MISSING")
          urls=re.findall(r'https?://(?:www\\.)?seatgeekimages\\.com/matchup/[^"\\s<>]+',source,re.I)
          print("MATCHUP_URLS_COUNT",len(urls))
          for uri in dict.fromkeys(urls):
            print("MATCHUP_SOURCE",uri[:700])
          for key in ("og:image","twitter:image","patriots","bears"):
            idx=source.lower().find(key)
            print("SNIPPET",key,source[max(0,idx-130):idx+300] if idx>=0 else "MISSING")
          PY
