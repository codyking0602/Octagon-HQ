name: PR3 Apply CI Fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund
      - name: Apply narrow Stage 15F/G fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/features/back-room/footballFactualStatsCore.ts",
              'derived(sourceId,"nfl-career-passing-attempts-per-game",row.passingAttempts/row.games,"passing attempts / games")',
              'derived(sourceId,"nfl-career-passing-attempts-per-game",row.attempts/row.games,"passing attempts / games")',
          )

          replace_once(
              "src/features/back-room/footballNflCoachRecognitionProjection.ts",
              '    && record.sourceProvider === "nflverse"\n    && record.tier !== "D"',
              '    && (record.tier !== "D" || hallCoachById.has(subjectId(record.name)))',
          )

          replace_once(
              "src/features/back-room/footballProHallHistoricalRepairSeeds.ts",
              '  { id: "nfl-chuck-bednarik", name: "Chuck Bednarik", kind: "player-career", position: "OL", startSeason: 1949, endSeason: 1962, tier: "A" },',
              '  { id: "nfl-chuck-bednarik", name: "Chuck Bednarik", kind: "player-career", position: "OL", startSeason: 1949, endSeason: 1962, tier: "A" },\n  { id: "chuck-noll", name: "Chuck Noll", kind: "coach", startSeason: 1969, endSeason: 1991, tier: "A" },',
          )

          replace_once(
              "src/features/back-room/footballStage15NflCoachFranchiseEraRankingModels.test.ts",
              'expect(candidate.factMetricIds).toEqual(expect.arrayContaining(coachMetrics));',
              'expect(candidate.factMetricIds).toEqual(expect.arrayContaining([...coachMetrics]));',
          )

          replace_once(
              "src/features/back-room/footballFactualStats.test.ts",
              '      "nfl-franchise",\n      "cfb-player-career",',
              '      "nfl-franchise",\n      "nfl-coach-career",\n      "nfl-franchise-era",\n      "cfb-player-career",',
          )
          PY
      - name: Regenerate canonical Football audit
        run: |
          npm run generate:football-cfb-player-seasons
          npm run generate:football-factual-universe
          npm run generate:football-ledger-audit
          npm run verify:football-ledger-audit
      - name: Commit source fixes and owned audit artifact
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/back-room/footballFactualStatsCore.ts \
            src/features/back-room/footballNflCoachRecognitionProjection.ts \
            src/features/back-room/footballProHallHistoricalRepairSeeds.ts \
            src/features/back-room/footballStage15NflCoachFranchiseEraRankingModels.test.ts \
            src/features/back-room/footballFactualStats.test.ts \
            docs/football-ledger-stage13-5-review.md
          if git diff --cached --quiet; then
            echo "PR3 fixes already applied."
            exit 0
          fi
          git commit -m "Fix Stage 15F/G canonical coach coverage"
          git push origin HEAD:"$HEAD_BRANCH"
