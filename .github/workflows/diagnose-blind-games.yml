name: Diagnose Blind Games

on:
  pull_request:
    paths:
      - "src/features/play/**"
      - "src/features/intelligence/**"
      - "src/styles/**"
      - ".github/workflows/diagnose-blind-games.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run Blind game tests
        continue-on-error: true
        run: npm test -- src/features/play/blindGames.test.tsx --reporter=json --outputFile=blind-games-results.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-games-results
          path: blind-games-results.json
