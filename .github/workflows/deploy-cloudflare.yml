name: Deploy Cloudflare Frontend

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact same-repository PR head SHA to deploy.
        required: true
        type: string
      pr_number:
        description: Open pull request number whose head must still match source_sha.
        required: true
        type: string
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "wrangler.jsonc"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: octagon-hq-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SOURCE_PR_NUMBER: ${{ inputs.pr_number || '0' }}
      OCTAGON_PRODUCTION_URL: https://octagon.hq-app.workers.dev

    steps:
      - name: Revalidate requested PR head
        if: env.SOURCE_PR_NUMBER != '0'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          PR_NUMBER: ${{ env.SOURCE_PR_NUMBER }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedSha = process.env.EXPECTED_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== "open") {
              core.setFailed(`PR #${prNumber} is no longer open.`);
              return;
            }

            if (pr.base.ref !== "main") {
              core.setFailed(`PR #${prNumber} targets ${pr.base.ref}, not main.`);
              return;
            }

            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`PR #${prNumber} is not a same-repository pull request.`);
              return;
            }

            if (pr.head.sha !== expectedSha) {
              core.setFailed(
                `PR #${prNumber} moved from ${expectedSha} to ${pr.head.sha}. Reapply the deploy-frontend label to deploy the new head.`,
              );
            }

      - name: Check out exact deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Exact SHA checkout failed::Expected $SOURCE_SHA but checked out $checked_out_sha."
            exit 1
          fi
          echo "Exact deployment source verified: $checked_out_sha"

      - name: Check deployment credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is missing or empty."
              missing=1
            else
              echo "$name is present."
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install application dependencies without lifecycle scripts
        run: npm ci --silent --ignore-scripts

      - name: Install Wrangler without lifecycle scripts
        run: npm install --silent --no-save --ignore-scripts wrangler@4

      - name: Verify Cloudflare identity
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami 2>&1 | tee wrangler-whoami.log

      - name: Resolve public Supabase browser configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          api_keys_file="$RUNNER_TEMP/supabase-api-keys.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" \
            --output "$api_keys_file"

          publishable_key=$(node - "$api_keys_file" <<'NODE'
          const fs = require('fs');
          const keys = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const publicKey = keys.find((key) => key.type === 'publishable')
            ?? keys.find((key) => key.type === 'legacy' && /anon/i.test(key.name ?? ''));
          if (!publicKey?.api_key) process.exit(1);
          process.stdout.write(publicKey.api_key);
          NODE
          )

          if [ -z "$publishable_key" ]; then
            echo "::error title=Supabase browser key unavailable::No publishable or legacy anon API key was returned for the V2 project."
            exit 1
          fi

          echo "::add-mask::$publishable_key"
          echo "VITE_SUPABASE_URL=https://${SUPABASE_PROJECT_ID}.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$publishable_key" >> "$GITHUB_ENV"

      - name: Stamp exact deployment SHA
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          fs.writeFileSync(
            "public/deployment.json",
            `${JSON.stringify({ sha: process.env.SOURCE_SHA })}\n`,
          );
          NODE

      - name: Build production frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee cloudflare-build.log
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/deployment.json
          grep -Fq "Cache-Control: no-cache" dist/_headers
          node --input-type=module - "$SOURCE_SHA" <<'NODE'
          import fs from "node:fs";
          const expectedSha = process.argv[2];
          const marker = JSON.parse(fs.readFileSync("dist/deployment.json", "utf8"));
          if (marker.sha !== expectedSha) {
            throw new Error(`Expected deployment marker ${expectedSha}, received ${marker.sha}`);
          }
          NODE
          grep -FRq "overscroll-behavior:contain" dist/assets/*.css
          grep -FRq "identity-overlay--viewport" dist/assets/*.js
          grep -FRq "NO PROFILE FOUND WITH THAT EXACT NAME" dist/assets/*.js
          grep -FRq "SIGN IN TO CHALLENGE" dist/assets/*.js
          grep -FRq "SIGN IN TO YOUR HQ" dist/assets/*.js
          grep -FRq "SIGN IN TO MAKE PICKS" dist/assets/*.js
          grep -FRq "vite:preloadError" dist/assets/*.js
          grep -FRq "list_my_find_leader_history" dist/assets/*.js
          grep -FRq "set_my_favorite_fighter" dist/assets/*.js
          grep -FRq "get_current_pick_event" dist/assets/*.js
          grep -FRq "save_my_event_pick" dist/assets/*.js
          echo "Production dist contains the exact SHA marker, real profiles, challenges, Your HQ, profile-backed UFC Picks, and stale-chunk recovery."

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-diagnostics
          path: cloudflare-build.log
          retention-days: 7

      - name: Deploy octagon Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy 2>&1 | tee wrangler-deploy.log

      - name: Upload Wrangler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-deploy-diagnostics
          path: |
            wrangler-whoami.log
            wrangler-deploy.log
          retention-days: 7

      - name: Verify exact live frontend and profile-backed Picks
        shell: bash
        run: |
          set -euo pipefail
          live_assets_dir="$RUNNER_TEMP/octagon-live-assets"
          bundle_file="$RUNNER_TEMP/octagon-all-live.js"
          shell_headers="$RUNNER_TEMP/octagon-shell-headers.txt"
          live_marker="$RUNNER_TEMP/octagon-deployment.json"
          markers=(
            "SIGN IN"
            "identity-overlay--viewport"
            "NO PROFILE FOUND WITH THAT EXACT NAME"
            "SIGN IN TO CHALLENGE"
            "SIGN IN TO YOUR HQ"
            "SIGN IN TO MAKE PICKS"
            "vite:preloadError"
            "list_my_find_leader_history"
            "set_my_favorite_fighter"
            "get_current_pick_event"
            "save_my_event_pick"
          )

          verify_live_assets() {
            local attempt="$1"
            local found_assets=0
            local missing_marker=""

            rm -rf "$live_assets_dir"
            mkdir -p "$live_assets_dir"

            if ! curl --fail --silent --show-error \
              --header "Cache-Control: no-cache" \
              --dump-header "$shell_headers" \
              --output "$RUNNER_TEMP/octagon-shell.html" \
              "${OCTAGON_PRODUCTION_URL}/?deployment=${SOURCE_SHA}&attempt=${attempt}"; then
              echo "The live SPA shell is not available yet."
              return 1
            fi

            if ! grep -Fiq "cache-control: no-cache" "$shell_headers"; then
              echo "The live SPA shell is missing the required no-cache policy."
              return 1
            fi

            if ! curl --fail --silent --show-error \
              --header "Cache-Control: no-cache" \
              "${OCTAGON_PRODUCTION_URL}/deployment.json?deployment=${SOURCE_SHA}&attempt=${attempt}" \
              --output "$live_marker"; then
              echo "The live exact-SHA marker is not available yet."
              return 1
            fi

            if ! node --input-type=module - "$live_marker" "$SOURCE_SHA" <<'NODE'
            import fs from "node:fs";
            const markerPath = process.argv[2];
            const expectedSha = process.argv[3];
            const marker = JSON.parse(fs.readFileSync(markerPath, "utf8"));
            if (marker.sha !== expectedSha) process.exit(1);
            NODE
            then
              echo "The live deployment marker does not match $SOURCE_SHA yet."
              return 1
            fi

            for local_asset in dist/assets/*.js; do
              asset_name=$(basename "$local_asset")
              live_asset="$live_assets_dir/$asset_name"

              if ! curl --fail --silent --show-error \
                --header "Cache-Control: no-cache" \
                "${OCTAGON_PRODUCTION_URL}/assets/${asset_name}?deployment=${SOURCE_SHA}&attempt=${attempt}" \
                --output "$live_asset"; then
                echo "Live asset $asset_name is not available yet."
                return 1
              fi

              if grep -Fqi "<!doctype html" "$live_asset"; then
                echo "Live asset $asset_name still resolves to the SPA fallback."
                return 1
              fi

              found_assets=$((found_assets + 1))
            done

            if [ "$found_assets" -lt 1 ]; then
              echo "No JavaScript assets were available for verification."
              return 1
            fi

            cat "$live_assets_dir"/*.js > "$bundle_file"

            for marker in "${markers[@]}"; do
              if ! grep -Fq "$marker" "$bundle_file"; then
                missing_marker="$marker"
                break
              fi
            done

            if [ -n "$missing_marker" ]; then
              echo "Live bundle is not current yet; missing marker: $missing_marker"
              return 1
            fi

            return 0
          }

          verified=0
          for attempt in $(seq 1 12); do
            if verify_live_assets "$attempt"; then
              verified=1
              break
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Waiting for Cloudflare asset propagation (attempt $attempt of 12)..."
              sleep 5
            fi
          done

          if [ "$verified" -ne 1 ]; then
            echo "::error title=Live frontend verification failed::Exact SHA $SOURCE_SHA did not become the verified production build after 12 attempts."
            exit 1
          fi

          echo "Live Worker exactly matches $SOURCE_SHA and contains profile-backed UFC Picks plus automatic stale-chunk recovery."

      - name: Record deployment
        shell: bash
        run: |
          {
            echo "### Octagon HQ frontend deployed"
            echo "- Worker: octagon"
            echo "- Production URL: $OCTAGON_PRODUCTION_URL"
            echo "- Exact source SHA: \`$SOURCE_SHA\`"
            if [ "$SOURCE_PR_NUMBER" != "0" ]; then
              echo "- Source PR: #$SOURCE_PR_NUMBER"
            else
              echo "- Source event: $GITHUB_EVENT_NAME"
            fi
            echo "- Exact checkout and exact live deployment marker were verified"
            echo "- Supabase browser configuration was resolved from the V2 project without printing the key"
            echo "- Challenge Center uses authenticated profiles and exact-name delivery"
            echo "- Your HQ uses profile history, Picks record, canonical favorite fighter data, and cached challenge rows"
            echo "- Picks uses the public current event and authenticated cross-device profile selections"
            echo "- Stale lazy chunks trigger one guarded reload instead of the React Router developer error screen"
            echo "- The SPA shell is served with Cache-Control: no-cache"
            echo "- All deployed production chunks were verified for the current profile contracts"
          } >> "$GITHUB_STEP_SUMMARY"
