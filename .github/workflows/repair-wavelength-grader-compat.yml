name: Repair Wavelength grader compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-wavelength-grader-compat.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve the canonical PostgreSQL compatibility helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/202609090001_calibrate_wavelength_scoring.sql')
          text = path.read_text()
          old = "jsonb_object_length(p_grading_evidence->'ratings')"
          if text.count(old) != 2:
              raise SystemExit(f'Expected two compatibility calls, found {text.count(old)}')
          path.write_text(text.replace(old, "private.jsonb_object_length(p_grading_evidence->'ratings')"))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202609090001_calibrate_wavelength_scoring.sql
          git commit -m "Preserve daily grader compatibility"
          git push origin HEAD:agent/calibrate-wavelength-score
