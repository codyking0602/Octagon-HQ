name: Repair Auction PR 6 Cascade Immutability

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feat/auction-pr6-final-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: feat/auction-pr6-final-release
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply focused cascade immutability repair
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/octagon-pr6"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"
          cd "$target"
          git checkout "$TARGET_BRANCH"

          python - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/202609030001_auction_notifications_share_release.sql")
          text = migration.read_text()
          old = """-- Profile deletion already owns dependent public challenge cleanup. Keep that
-- single cleanup boundary complete for private Auction state and every child row.
alter table private.auction_games
  drop constraint auction_games_challenger_id_fkey,
  drop constraint auction_games_recipient_id_fkey,
  drop constraint auction_games_challenge_id_fkey,
  drop constraint auction_games_tie_priority_profile_id_fkey,
  drop constraint auction_games_cancelled_by_fkey,
  drop constraint auction_games_winner_profile_id_fkey;

alter table private.auction_games
  add constraint auction_games_challenger_id_fkey
    foreign key (challenger_id) references public.profiles(id) on delete cascade,
  add constraint auction_games_recipient_id_fkey
    foreign key (recipient_id) references public.profiles(id) on delete cascade,
  add constraint auction_games_challenge_id_fkey
    foreign key (challenge_id) references public.play_challenges(id) on delete cascade,
  add constraint auction_games_tie_priority_profile_id_fkey
    foreign key (tie_priority_profile_id) references public.profiles(id) on delete cascade,
  add constraint auction_games_cancelled_by_fkey
    foreign key (cancelled_by) references public.profiles(id) on delete cascade,
  add constraint auction_games_winner_profile_id_fkey
    foreign key (winner_profile_id) references public.profiles(id) on delete cascade;

alter table private.auction_pending_bids
  drop constraint auction_pending_bids_bidder_id_fkey,
  add constraint auction_pending_bids_bidder_id_fkey
    foreign key (bidder_id) references public.profiles(id) on delete cascade;

alter table private.auction_awards
  drop constraint auction_awards_awarded_to_fkey,
  add constraint auction_awards_awarded_to_fkey
    foreign key (awarded_to) references public.profiles(id) on delete cascade;

"""
          new = """-- Profile deletion already owns dependent public challenge cleanup. Keep that
-- single cleanup boundary complete without making ordinary private rows mutable.
alter table private.auction_games
  drop constraint auction_games_challenger_id_fkey,
  drop constraint auction_games_recipient_id_fkey,
  drop constraint auction_games_challenge_id_fkey,
  drop constraint auction_games_tie_priority_profile_id_fkey,
  drop constraint auction_games_cancelled_by_fkey,
  drop constraint auction_games_winner_profile_id_fkey;

alter table private.auction_games
  add constraint auction_games_challenger_id_fkey
    foreign key (challenger_id) references public.profiles(id) on delete cascade,
  add constraint auction_games_recipient_id_fkey
    foreign key (recipient_id) references public.profiles(id) on delete cascade,
  add constraint auction_games_challenge_id_fkey
    foreign key (challenge_id) references public.play_challenges(id) on delete cascade;

-- These identities are already constrained to the two participants, so their
-- direct profile foreign keys are redundant and would compete with game cleanup.
alter table private.auction_pending_bids
  drop constraint auction_pending_bids_bidder_id_fkey;

alter table private.auction_awards
  drop constraint auction_awards_awarded_to_fkey,
  drop constraint auction_awards_deck_entry_id_auction_id_fkey,
  add constraint auction_awards_deck_entry_id_auction_id_fkey
    foreign key (deck_entry_id, auction_id)
    references private.auction_deck_entries(id, auction_id) on delete cascade;

create or replace function private.prevent_auction_private_mutation()
returns trigger
language plpgsql
set search_path = ''
as $$
begin
  if tg_op = 'DELETE'
    and tg_table_name in ('auction_deck_entries', 'auction_pending_bids', 'auction_awards')
    and not exists (
      select 1
      from private.auction_games auction
      where auction.id = old.auction_id
    )
  then
    return old;
  end if;

  raise exception 'Auction private records are immutable';
end;
$$;

"""
          if old not in text:
              if new in text:
                  pass
              else:
                  raise SystemExit("expected cleanup block missing")
          else:
              migration.write_text(text.replace(old, new, 1))

          test_file = Path("src/app/auctionPr6ReleaseContract.test.ts")
          test_text = test_file.read_text()
          test_text = test_text.replace(
              '    expect(migration.match(/on delete cascade/g)?.length).toBeGreaterThanOrEqual(8);\n',
              '    expect(migration.match(/on delete cascade/g)?.length).toBeGreaterThanOrEqual(4);\n'
              '    expect(migration).toContain("tg_table_name in (\\\'auction_deck_entries\\\', \\\'auction_pending_bids\\\', \\\'auction_awards\\\')");\n'
              '    expect(migration).toContain("where auction.id = old.auction_id");\n',
          )
          test_file.write_text(test_text)
          PY

          if git diff --quiet; then
            echo "Focused cascade immutability repair is already present."
            exit 0
          fi

          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/202609030001_auction_notifications_share_release.sql \
            src/app/auctionPr6ReleaseContract.test.ts
          git commit -m "Allow immutable Auction rows to cascade on profile cleanup"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
