name: Repair PR 3 Review Findings

on:
  push:
    branches:
      - agent/picks-canonical-fight-change-semantics
    paths:
      - '.github/workflows/repair-pr3-review.yml'
      - 'scripts/repair-pr3-review.py'
  pull_request:
    paths:
      - '.github/workflows/repair-pr3-review.yml'
      - 'scripts/repair-pr3-review.py'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/picks-canonical-fight-change-semantics
          fetch-depth: 0

      - name: Apply reviewed source and proof repair
        run: python scripts/repair-pr3-review.py

      - name: Commit repaired exact head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Preserve canonical repick evidence and receipt parity"
          git push origin HEAD:agent/picks-canonical-fight-change-semantics
