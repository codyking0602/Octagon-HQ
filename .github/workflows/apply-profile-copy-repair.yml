name: Apply profile copy repair

on:
  push:
    branches:
      - codex/perform-editorial-review-of-fighter-profiles
    paths:
      - ".github/workflows/apply-profile-copy-repair.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct reviewed profile source
        shell: bash
        run: |
          set -euo pipefail
          echo "source_head=$(git rev-parse HEAD)"
          echo "staging_before=$(git rev-parse refs/remotes/origin/agent/profile-copy-repair-staging)"
          git fetch origin refs/heads/agent/profile-copy-repair-staging:refs/remotes/origin/agent/profile-copy-repair-staging
          echo "staging_after=$(git rev-parse refs/remotes/origin/agent/profile-copy-repair-staging)"
          : > /tmp/profile-suffix.b64
          for i in 00 01 02 03 04 05 06 07 08; do
            git show "origin/agent/profile-copy-repair-staging:.profile-repair/suffix.gz.b64.part-$i" >> /tmp/profile-suffix.b64
          done
          echo "payload_bytes=$(wc -c < /tmp/profile-suffix.b64)"
          echo "payload_sha256=$(sha256sum /tmp/profile-suffix.b64 | awk '{print $1}')"
          base64 -d < /tmp/profile-suffix.b64 | gzip -d > /tmp/profile-suffix.ts
          echo "suffix_bytes=$(wc -c < /tmp/profile-suffix.ts)"
          echo "suffix_sha256=$(sha256sum /tmp/profile-suffix.ts | awk '{print $1}')"
          python - <<'PY'
          from pathlib import Path

          source = Path("src/features/rankings/data/v2RankingRoster.ts")
          marker = "/** Applies the one-time, intentional 2026 profile-copy review without touching ranking data. */"
          current = source.read_text()
          suffix = Path("/tmp/profile-suffix.ts").read_text()
          print(f"marker_count={current.count(marker)}")
          print(f"suffix_starts_marker={suffix.startswith(marker)}")
          if current.count(marker) != 1:
              raise SystemExit(f"expected one editorial marker, found {current.count(marker)}")
          if not suffix.startswith(marker):
              raise SystemExit("reconstructed suffix does not start with editorial marker")
          source.write_text(current.split(marker, 1)[0] + suffix)

          standard = Path("docs/ranking-profile-copy.md")
          text = standard.read_text()
          old = "| 51-82 | 20-28 | 30-40 | 30-40 |"
          new = "| 51 through current roster end | 20-28 | 30-40 | 30-40 |"
          print(f"docs_old_row_count={text.count(old)}")
          if text.count(old) != 1:
              raise SystemExit(f"expected one hard-coded lowest-band row, found {text.count(old)}")
          standard.write_text(text.replace(old, new))
          PY
          actual_blob="$(git hash-object src/features/rankings/data/v2RankingRoster.ts)"
          expected_blob="e0d8e29d67a249fb39801407bbf482235cdbf88e"
          echo "actual_profile_blob=$actual_blob"
          echo "expected_profile_blob=$expected_blob"
          test "$actual_blob" = "$expected_blob"
          rm -f docs/ranking-profile-copy-review-2026-08.md
          rm -f .github/workflows/apply-profile-copy-repair.yml
          git diff --check
      - name: Commit repaired canonical profile pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes found"
            exit 1
          fi
          git commit -m "Repair canonical fighter profile editorial pass"
          git push origin HEAD:codex/perform-editorial-review-of-fighter-profiles
