name: One-off UFC Home ranked ESPN portrait acquisition
on:
  push:
    branches: [feat/ufc-home-ranked-espn-portraits-20261114]
    paths:
      - .github/workflows/ufc-home-ranked-portraits-acquire.yml
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image exporter
        run: python -m pip install Pillow==11.3.0
      - name: Fetch and independently verify all HQ-ranked ESPN MMA headshots
        run: python scripts/generate-ufc-home-ranked-espn.py
      - name: Check source coverage and output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('src/features/home/ufcHomeEspnSources.json').read_text())
          print('Ranked:',doc['rankedTotal'],'Available:',len(doc['sources']),'Blocked:',len(doc['blocked']))
          for entry in doc['blocked']:
              print('BLOCKED',entry['name'],entry['reason'])
          assert doc['rankedTotal']==len(doc['sources'])+len(doc['blocked'])
          assert len(doc['sources'])>35
          PY
      - name: Commit ONLY Home-only source assets and source registry
        run: |
          git add -- 'public/assets/fighters/*.home.webp' src/features/home/ufcHomeEspnSources.json src/features/home/ufcHomePortraitSlugs.ts
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No new assets to commit'
            exit 0
          fi
          git -c user.name='octagon-hq-automation[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets: add verified ESPN portraits for HQ-ranked UFC Home spotlight'
          git push origin HEAD:feat/ufc-home-ranked-espn-portraits-20261114
