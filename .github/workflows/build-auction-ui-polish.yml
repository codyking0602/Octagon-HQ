          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          registry = Path("src/features/play/playRegistry.ts")
          text = registry.read_text()
          start = text.index('  {\n    id: "auction",')
          suffix = '\n  },\n] as const;'
          end = text.index(suffix, start) + len('\n  },')
          block = text[start:end]
          text = text[:start] + text[end:]
          block = block.replace(
              'description: "Choose a UFC auction, submit private sealed bids, and build your collection asynchronously.",',
              'description: "Choose a UFC auction, bid privately, and build the stronger collection.",',
          )
          marker = 'export const playGames: readonly PlayGameDefinition[] = [\n'
          if text.count(marker) != 1:
              raise SystemExit("Play registry owner marker changed")
          registry.write_text(text.replace(marker, marker + block + '\n', 1))

          test = Path("src/features/play/auctionContract.test.tsx")
          text = test.read_text()
          text = text.replace(
              '  auctionModeDefinition,\n  auctionModes,',
              '  auctionModeDefinition,\n  auctionModeGroups,\n  auctionModes,\n  auctionModesForGroup,',
              1,
          )
          text = text.replace(
              '    expect(playGameDefinition("auction")).toMatchObject({\n      title: "Auction",\n      lineup: { challengeEligible: true },\n    });',
              '    expect(playGames[0]?.id).toBe("auction");\n    expect(playGameDefinition("auction")).toMatchObject({\n      icon: "$",\n      title: "Auction",\n      description: "Choose a UFC auction, bid privately, and build the stronger collection.",\n      lineup: { challengeEligible: true },\n    });',
              1,
          )
          anchor = '''  it("limits career-performance auctions to the three locked fighter careers", () => {'''
          group_test = '''  it("groups every approved mode once without forcing a sixteen-row setup list", () => {\n    const groupedIds = auctionModeGroups.flatMap((group) => group.modeIds);\n    expect(auctionModeGroups.map((group) => group.id)).toEqual([\n      "fighters",\n      "skills",\n      "performances",\n      "history",\n    ]);\n    expect(groupedIds).toHaveLength(16);\n    expect(new Set(groupedIds).size).toBe(16);\n    expect([...groupedIds].sort()).toEqual([...AUCTION_MODE_IDS].sort());\n    expect(auctionModesForGroup("all")).toEqual(auctionModes);\n    for (const group of auctionModeGroups) {\n      expect(auctionModesForGroup(group.id).map((mode) => mode.id)).toEqual(group.modeIds);\n    }\n  });\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("Auction contract test anchor changed")
          test.write_text(text.replace(anchor, group_test + anchor, 1))

          final_games = Path("src/features/play/finalGames.test.tsx")
          text = final_games.read_text()
          old = '''    expect(container.querySelectorAll(".play-games__grid .play-game-card")).toHaveLength(7);\n    expect(container.querySelectorAll(".play-games__grid button.play-game-card")).toHaveLength(7);\n    expect(container.querySelector(".play-game-card__status.is-preview")).toBeNull();'''
          new = '''    const cards = [...container.querySelectorAll<HTMLElement>(".play-games__grid .play-game-card")];\n    expect(cards).toHaveLength(7);\n    expect(container.querySelectorAll(".play-games__grid button.play-game-card")).toHaveLength(7);\n    expect(cards[0]?.textContent).toContain("Auction");\n    expect(cards[0]?.textContent).toContain("bid privately");\n    expect(cards[0]?.textContent).not.toContain("asynchronously");\n    expect(container.querySelector(".play-game-card__status.is-preview")).toBeNull();'''
          if text.count(old) != 1:
              raise SystemExit("Final games test anchor changed")
          final_games.write_text(text.replace(old, new, 1))

          verify = Path(".github/workflows/verify-supabase-backend.yml")
          text = verify.read_text()
          text = text.replace(
              '            supabase/tests/auction_notifications_share_release.sql \\\n            supabase/tests/pick_monitoring_truthful_decisions.sql',
              '            supabase/tests/auction_notifications_share_release.sql \\\n            supabase/tests/auction_ui_release_whats_new.sql \\\n            supabase/tests/pick_monitoring_truthful_decisions.sql',
              1,
          )
          migration_anchor = '''          else\n            require_remote_migration "202609030001" "Auction PR 6 notifications and share release migration not deployed"\n          fi\n'''
          migration_insert = migration_anchor + '''\n          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then\n            local_version=$(printf '%s\\n' "$migration_list" | sed 's/│/|/g' | awk -F '|' '\n              {\n                local_version = $1\n                gsub(/[^0-9]/, "", local_version)\n                if (local_version == "202609030002") {\n                  print local_version\n                  exit\n                }\n              }\n            ')\n            if [ "$local_version" != "202609030002" ]; then\n              echo "::error title=Auction UI release migration missing::Migration 202609030002 is not present in the exact PR head."\n              exit 1\n            fi\n            echo "Auction UI release migration 202609030002 exists locally and passed the fresh-database suite; linked production history is required after merge."\n          else\n            require_remote_migration "202609030002" "Auction UI release What's New migration not deployed"\n          fi\n'''
          if text.count(migration_anchor) != 1:
              raise SystemExit("Backend migration verification anchor changed")
          verify.write_text(text.replace(migration_anchor, migration_insert, 1))

          deploy = Path(".github/workflows/deploy-supabase.yml")
          text = deploy.read_text()
          deploy_anchor = '''          if [ -f supabase/migrations/202609030001_auction_notifications_share_release.sql ]; then\n            require_remote_migration "202609030001"\n          fi\n'''
          deploy_insert = deploy_anchor + '''          if [ -f supabase/migrations/202609030002_auction_ui_release_whats_new.sql ]; then\n            require_remote_migration "202609030002"\n          fi\n'''
          if text.count(deploy_anchor) != 1:
              raise SystemExit("Supabase deployment migration anchor changed")
          deploy.write_text(text.replace(deploy_anchor, deploy_insert, 1))
          PY

          cat > supabase/migrations/202609030002_auction_ui_release_whats_new.sql <<'EOF'
          -- Publish one canonical Auction release announcement after the complete game and mobile polish ship.
          -- The durable source key keeps retries and future deploys idempotent.

          delete from private.whats_new_items
          where kind = 'new_game'
            and source_key <> 'games:release:auction'
            and (
              source_key like 'games:new:%:auction'
              or lower(title) = 'auction is now playable'
            );

          select public.publish_whats_new_item(
            'games:release:auction',
            'new_game',
            'games',
            'automatic',
            'Auction is now playable',
            'Choose a UFC auction, bid privately, and build the stronger collection.',
            '/play/auction',
            'PLAY AUCTION',
            now()
          );
          EOF

          cat > supabase/tests/auction_ui_release_whats_new.sql <<'EOF'
          begin;

          do $$
          declare
            v_count integer;
          begin
            select count(*)
            into v_count
            from private.whats_new_items
            where source_key = 'games:release:auction';

            if v_count <> 1 then
              raise exception 'Expected exactly one canonical Auction release announcement, found %', v_count;
            end if;

            if not exists (
              select 1
              from private.whats_new_items
              where source_key = 'games:release:auction'
                and kind = 'new_game'
                and category = 'games'
                and title = 'Auction is now playable'
                and summary = 'Choose a UFC auction, bid privately, and build the stronger collection.'
                and route = '/play/auction'
                and action_label = 'PLAY AUCTION'
            ) then
              raise exception 'Auction release announcement does not match the approved public copy and route';
            end if;

            if exists (
              select 1
              from private.whats_new_items
              where kind = 'new_game'
                and source_key <> 'games:release:auction'
                and (
                  source_key like 'games:new:%:auction'
                  or lower(title) = 'auction is now playable'
                )
            ) then
              raise exception 'A duplicate Auction release announcement remains';
            end if;
          end
          $$;

          rollback;
          EOF

          rm .github/workflows/build-auction-ui-polish.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run exact-head validation
        env:
          VITE_DEPLOYMENT_SHA: ${{ github.sha }}
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit validated change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Auction setup and results"
          git push origin HEAD:chatgpt/auction-ui-polish
