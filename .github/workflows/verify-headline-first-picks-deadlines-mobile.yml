name: Verify Headline-First Picks Deadlines Mobile

on:
  pull_request:
    paths:
      - ".github/workflows/verify-headline-first-picks-deadlines-mobile.yml"
      - "scripts/verify-picks-deadlines-webkit-live.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev
      EXPECTED_MAIN_SHA: d4093be3d3aa5af766833967ab26b4cbb376a963
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PICKS_DEADLINE_SCREENSHOT_PATH: ${{ runner.temp }}/picks-deadline-control-mobile.png

    steps:
      - name: Check out verification source
        uses: actions/checkout@v4

      - name: Confirm recovery backend is deployed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/30848381761 --jq '.status + ":" + .conclusion' | grep -qx 'completed:success'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install production WebKit proof harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps webkit

      - name: Verify live Gamrot vs. Quillan deadlines at 390x844
        run: node scripts/verify-picks-deadlines-webkit-live.mjs

      - name: Upload mobile Control Center proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headline-first-picks-deadlines-mobile
          path: ${{ env.PICKS_DEADLINE_SCREENSHOT_PATH }}
          if-no-files-found: warn
          retention-days: 7
