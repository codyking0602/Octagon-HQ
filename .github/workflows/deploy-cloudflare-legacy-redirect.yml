name: Deploy Cloudflare Legacy Redirect

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-legacy-redirect.yml"
      - "worker/legacyOctagonRedirect.ts"
      - "wrangler.legacy-redirect.jsonc"

permissions:
  contents: read

concurrency:
  group: octagon-hq-cloudflare-legacy-redirect
  cancel-in-progress: false

jobs:
  deploy-legacy-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
      LEGACY_ORIGIN: https://octagon.hq-app.workers.dev
      CANONICAL_ORIGIN: https://the.hq-app.workers.dev
      WRANGLER_VERSION: 4.123.0
    steps:
      - name: Check out exact redirect source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            worker/legacyOctagonRedirect.ts
            wrangler.legacy-redirect.jsonc
          sparse-checkout-cone-mode: false

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Exact SHA checkout failed::Expected $SOURCE_SHA but checked out $checked_out_sha."
            exit 1
          fi
          test -f worker/legacyOctagonRedirect.ts
          test -f wrangler.legacy-redirect.jsonc
          echo "Exact legacy redirect source verified: $checked_out_sha"

      - name: Set up trusted Wrangler runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Wrangler outside repository dependencies
        shell: bash
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/octagon-legacy-wrangler"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          npm init --yes --silent >/dev/null
          npm install --silent --ignore-scripts --no-audit --no-fund "wrangler@$WRANGLER_VERSION"
          wrangler_bin="$tool_dir/node_modules/.bin/wrangler"
          test -x "$wrangler_bin"
          "$wrangler_bin" --version | grep -Fq "$WRANGLER_VERSION"
          echo "WRANGLER_BIN=$wrangler_bin" >> "$GITHUB_ENV"

      - name: Validate redirect Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          "$WRANGLER_BIN" deploy \
            --dry-run \
            --config "$GITHUB_WORKSPACE/wrangler.legacy-redirect.jsonc" \
            --outdir "$RUNNER_TEMP/octagon-legacy-dry-run"
          test -d "$RUNNER_TEMP/octagon-legacy-dry-run"

      - name: Check Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is missing or empty."
              exit 1
            fi
          done

      - name: Verify Cloudflare identity
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: "$WRANGLER_BIN" whoami

      - name: Deploy redirect-only legacy Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          "$WRANGLER_BIN" deploy --config "$GITHUB_WORKSPACE/wrangler.legacy-redirect.jsonc"

      - name: Verify legacy URL redirects to canonical host
        shell: bash
        run: |
          set -euo pipefail
          legacy_test_url="$LEGACY_ORIGIN/play/futures?compat=octagon"
          expected_location="$CANONICAL_ORIGIN/play/futures?compat=octagon"

          for attempt in $(seq 1 24); do
            headers_file="$RUNNER_TEMP/legacy-redirect-headers-$attempt.txt"
            curl --silent --show-error --head --output "$headers_file" "$legacy_test_url" || true
            status=$(awk 'NR == 1 { print $2 }' "$headers_file" 2>/dev/null || true)
            location=$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$headers_file" 2>/dev/null || true)
            if [ "$status" = "308" ] && [ "$location" = "$expected_location" ]; then
              echo "Legacy workers.dev compatibility redirect verified."
              exit 0
            fi
            sleep 5
          done

          echo "::error title=Legacy redirect verification failed::Expected 308 to $expected_location."
          exit 1

      - name: Record compatibility deployment
        shell: bash
        run: |
          {
            echo "### Legacy Octagon URL compatibility deployed"
            echo "- Redirect Worker: octagon"
            echo "- Legacy URL: $LEGACY_ORIGIN"
            echo "- Canonical app: $CANONICAL_ORIGIN"
            echo "- Behavior: permanent 308 preserving path and query"
            echo "- Exact source SHA: \`$SOURCE_SHA\`"
            echo "- No application assets, Supabase bindings, or alternate frontend route owner are deployed here"
          } >> "$GITHUB_STEP_SUMMARY"
