name: Deploy Supabase Backend

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact same-repository PR head SHA to deploy.
        required: true
        type: string
      pr_number:
        description: Open pull request number whose head must still match source_sha.
        required: true
        type: string
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-supabase.yml"
      - "supabase/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: octagon-hq-supabase-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SOURCE_PR_NUMBER: ${{ inputs.pr_number || '0' }}
      OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev

    steps:
      - name: Revalidate requested PR head
        if: env.SOURCE_PR_NUMBER != '0'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          PR_NUMBER: ${{ env.SOURCE_PR_NUMBER }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedSha = process.env.EXPECTED_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== "open") {
              core.setFailed(`PR #${prNumber} is no longer open.`);
              return;
            }

            if (pr.base.ref !== "main") {
              core.setFailed(`PR #${prNumber} targets ${pr.base.ref}, not main.`);
              return;
            }

            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`PR #${prNumber} is not a same-repository pull request.`);
              return;
            }

            if (pr.head.sha !== expectedSha) {
              core.setFailed(
                `PR #${prNumber} moved from ${expectedSha} to ${pr.head.sha}. Reapply the deploy-backend label to deploy the new head.`,
              );
            }

      - name: Check out exact deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Exact SHA checkout failed::Expected $SOURCE_SHA but checked out $checked_out_sha."
            exit 1
          fi
          echo "Exact deployment source verified: $checked_out_sha"

      - name: Verify deployment credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is missing or empty."
              exit 1
            fi
          done

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link V2 project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Publish canonical production origin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" OCTAGON_APP_ORIGIN="$OCTAGON_PRODUCTION_ORIGIN"

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      - name: Deploy PIN authentication function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy pin-auth --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Verify migrations and browser-equivalent PIN authentication
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          migration_list=$(supabase migration list --linked)
          printf '%s\n' "$migration_list"

          require_remote_migration() {
            local version="$1"
            local remote_version
            remote_version=$(printf '%s\n' "$migration_list" | sed 's/│/|/g' | awk -F '|' -v version="$version" '
              {
                local_version = $1
                remote_version = $2
                gsub(/[^0-9]/, "", local_version)
                gsub(/[^0-9]/, "", remote_version)
                if (local_version == version) {
                  print remote_version
                  exit
                }
              }
            ')
            test "$remote_version" = "$version"
          }

          require_remote_migration "202607240001"
          require_remote_migration "202607250001"
          require_remote_migration "202607260001"
          require_remote_migration "202607270001"
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" | grep -F "pin-auth"

          api_keys_file="$RUNNER_TEMP/supabase-api-keys.json"
          trap 'rm -f "$api_keys_file"' EXIT
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" \
            --output "$api_keys_file"

          publishable_key=$(node - "$api_keys_file" <<'NODE'
          const fs = require('fs');
          const keys = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const publicKey = keys.find((key) => key.type === 'publishable')
            ?? keys.find((key) => key.type === 'legacy' && /anon/i.test(key.name ?? ''));
          if (!publicKey?.api_key) process.exit(1);
          process.stdout.write(publicKey.api_key);
          NODE
          )

          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/pin-auth"
          requested_headers="authorization, x-client-info, apikey, content-type"
          preflight_status=$(curl --silent --show-error \
            --dump-header "$RUNNER_TEMP/pin-auth-preflight-headers.txt" \
            --output "$RUNNER_TEMP/pin-auth-preflight-response.txt" \
            --write-out "%{http_code}" \
            --request OPTIONS \
            --header "Origin: $OCTAGON_PRODUCTION_ORIGIN" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: $requested_headers" \
            "$endpoint")

          if [ "$preflight_status" != "200" ]; then
            echo "::error title=PIN browser preflight failed::Expected HTTP 200 from OPTIONS, received $preflight_status."
            cat "$RUNNER_TEMP/pin-auth-preflight-response.txt"
            exit 1
          fi

          allow_headers=$(grep -i '^access-control-allow-headers:' "$RUNNER_TEMP/pin-auth-preflight-headers.txt" | tr '[:upper:]' '[:lower:]')
          grep -Fiq "access-control-allow-origin: $OCTAGON_PRODUCTION_ORIGIN" "$RUNNER_TEMP/pin-auth-preflight-headers.txt"
          grep -Fiq "access-control-allow-methods:" "$RUNNER_TEMP/pin-auth-preflight-headers.txt"
          for header in authorization x-client-info apikey content-type; do
            if [[ "$allow_headers" != *"$header"* ]]; then
              echo "::error title=PIN browser header blocked::$header is missing from Access-Control-Allow-Headers."
              exit 1
            fi
          done

          browser_status=$(curl --silent --show-error \
            --dump-header "$RUNNER_TEMP/pin-auth-browser-headers.txt" \
            --output "$RUNNER_TEMP/pin-auth-browser-response.json" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Origin: $OCTAGON_PRODUCTION_ORIGIN" \
            --header "Authorization: Bearer $publishable_key" \
            --header "apikey: $publishable_key" \
            --header "x-client-info: supabase-js-web/2.110.7" \
            --header "Content-Type: application/json" \
            --data '{"action":"login","displayName":"__OCTAGON_HEALTHCHECK__","pin":"0000"}' \
            "$endpoint")

          if [ "$browser_status" != "401" ]; then
            echo "::error title=Browser-equivalent PIN request failed::Expected the healthcheck profile to return HTTP 401, received $browser_status."
            cat "$RUNNER_TEMP/pin-auth-browser-response.json"
            exit 1
          fi

          grep -Fq "That name and PIN did not match." "$RUNNER_TEMP/pin-auth-browser-response.json"
          grep -Fiq "access-control-allow-origin: $OCTAGON_PRODUCTION_ORIGIN" "$RUNNER_TEMP/pin-auth-browser-headers.txt"

      - name: Record deployed backend
        shell: bash
        run: |
          {
            echo "### Octagon HQ V2 backend deployed"
            echo "- Exact source SHA: \`$SOURCE_SHA\`"
            if [ "$SOURCE_PR_NUMBER" != "0" ]; then
              echo "- Source PR: #$SOURCE_PR_NUMBER"
            else
              echo "- Source event: $GITHUB_EVENT_NAME"
            fi
            echo "- Exact checkout was verified before deployment credentials were used"
            echo "- Profile/PIN migration applied"
            echo "- Real profile challenge migration applied"
            echo "- Profile-backed Your HQ migration applied"
            echo "- Profile-backed UFC Picks migration applied"
            echo "- pin-auth Edge Function deployed"
            echo "- Canonical production origin: $OCTAGON_PRODUCTION_ORIGIN"
            echo "- Browser OPTIONS preflight passed with the actual Supabase SDK header set"
            echo "- Browser-equivalent invoke passed with the live production publishable key"
            echo "- Project secrets were never printed or exposed to PR build code"
          } >> "$GITHUB_STEP_SUMMARY"
