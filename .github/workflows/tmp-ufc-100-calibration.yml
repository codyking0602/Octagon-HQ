name: Temporary UFC 100 cap calibration

on:
  push:
    branches:
      - games/20q-factual-readiness-expansion
    paths:
      - src/features/back-room/ufcFactualLedger.ts
      - src/features/back-room/ufcFactualLedger.test.ts
      - src/features/games/twentyQuestionsUfc100Calibration.tmp.audit.test.ts
      - data/generated/ufc/factual-expansion-v1.json
      - .github/workflows/tmp-ufc-100-calibration.yml

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run UFC factual ledger and cap calibration
        run: npx vitest run src/features/back-room/ufcFactualLedger.test.ts src/features/games/twentyQuestionsUfc100Calibration.tmp.audit.test.ts --reporter=verbose
