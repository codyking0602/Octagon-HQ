name: PR3 Coach Recognition Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Inspect canonical coach source evidence
        run: |
          python - <<'PY' > pr3-coach-diagnostic.txt
          import json
          from pathlib import Path

          names = {"Pete Carroll", "Joe Gibbs", "Chuck Noll", "Bill Parcells"}
          projection = json.loads(Path("data/generated/football/recognizability-projection.json").read_text())
          print("RECOGNIZABILITY PROJECTION")
          for record in projection["records"]:
              if record.get("name") in names:
                  print(json.dumps(record, sort_keys=True))

          print("\nNFL COACH-SEASON RELATIONSHIPS")
          payload = json.loads(Path("data/generated/football/relationships/nfl-coach-seasons-1999-2025.json").read_text())
          columns = payload["columns"]
          for values in payload["rows"]:
              row = dict(zip(columns, values))
              text = " ".join(str(v) for v in row.values())
              if any(name.lower().replace(" ", "-") in text.lower().replace(" ", "-") or name.lower() in text.lower() for name in names):
                  print(json.dumps(row, sort_keys=True))

          print("\nHISTORICAL/HALL SOURCE OCCURRENCES")
          for path in [
              "src/features/back-room/footballProHallHistoricalRepairSeeds.ts",
              "src/features/back-room/footballProHallRecognitionCompletenessEvidence.ts",
              "src/features/back-room/footballRecognitionEvidence.ts",
              "src/features/back-room/footballHistoricalRecognitionRepairs.ts",
          ]:
              text = Path(path).read_text()
              print(f"-- {path}")
              for line in text.splitlines():
                  if any(name in line for name in names):
                      print(line)
          PY
          cat pr3-coach-diagnostic.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr3-coach-recognition-diagnostic-${{ github.event.pull_request.head.sha }}
          path: pr3-coach-diagnostic.txt
          if-no-files-found: error
