name: Temporary Live Picks Coverage Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-live-picks-coverage-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PROOF_BACKEND_SHA: 32010dbda253549cba31005d85f4cb156d52e306
      PROOF_STARTED_AFTER: 2026-08-08T18:34:15Z
    steps:
      - name: Inspect one-time live canonical monitoring evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const accessToken = process.env.SUPABASE_ACCESS_TOKEN;
          const projectId = process.env.SUPABASE_PROJECT_ID;
          const proofBackendSha = process.env.PROOF_BACKEND_SHA;
          const proofStartedAfter = process.env.PROOF_STARTED_AFTER;
          if (!accessToken || !projectId || !proofBackendSha || !proofStartedAfter) throw new Error("Live coverage inspection is not configured.");

          async function parsed(response) {
            const text = await response.text();
            try { return text ? JSON.parse(text) : {}; } catch { return { message: text }; }
          }
          async function get(url, headers, label) {
            const response = await fetch(url, { headers });
            const value = await parsed(response);
            if (!response.ok) throw new Error(`${label} failed with HTTP ${response.status}: ${JSON.stringify(value)}`);
            return value;
          }
          const keysResponse = await fetch(
            `https://api.supabase.com/v1/projects/${projectId}/api-keys?reveal=true`,
            { headers: { Authorization: `Bearer ${accessToken}` } },
          );
          const keys = await parsed(keysResponse);
          if (!keysResponse.ok || !Array.isArray(keys)) throw new Error(`Project key lookup failed with HTTP ${keysResponse.status}.`);
          const secretKey = keys.find((item) => item.type === "secret")?.api_key
            ?? keys.find((item) => item.type === "legacy" && /service.role/i.test(item.name ?? ""))?.api_key;
          if (!secretKey) throw new Error("Project secret key is unavailable.");
          const headers = { Authorization: `Bearer ${secretKey}`, apikey: secretKey };

          const runQuery = new URLSearchParams({
            select: "run_id,event_id,status,trigger_kind,provider_called,started_at,completed_at,source_event_identity,provider_event_count,complete_snapshot_count,missing_snapshot_count,provider_requests_remaining,diagnostics",
            trigger_kind: "eq.manual",
            started_at: `gte.${proofStartedAfter}`,
            order: "completed_at.desc.nullslast,created_at.desc",
            limit: "1",
          });
          const runs = await get(`https://${projectId}.supabase.co/rest/v1/pick_monitoring_runs?${runQuery}`, headers, "Run lookup");
          if (!Array.isArray(runs) || runs.length !== 1) throw new Error("Expected exactly one recent manual proof run.");
          const run = runs[0];

          const snapshotQuery = new URLSearchParams({
            select: "run_id,bout_id,matchup_identity,sportsbook,fighter_one_identity,fighter_two_identity,source_event_id",
            run_id: `eq.${run.run_id}`,
            order: "bout_id.asc",
          });
          const snapshots = await get(`https://${projectId}.supabase.co/rest/v1/pick_monitoring_odds_snapshots?${snapshotQuery}`, headers, "Snapshot lookup");
          const findingQuery = new URLSearchParams({
            select: "finding_type,severity,summary,matchup_identity,bout_id,source_details",
            run_id: `eq.${run.run_id}`,
            order: "detected_at.asc",
          });
          const findings = await get(`https://${projectId}.supabase.co/rest/v1/pick_monitoring_findings?${findingQuery}`, headers, "Finding lookup");
          const boutQuery = new URLSearchParams({
            select: "bout_id,red_fighter_name,blue_fighter_name,red_american_odds,blue_american_odds,odds_source",
            event_id: `eq.${run.event_id}`,
            order: "position.asc",
          });
          const bouts = await get(`https://${projectId}.supabase.co/rest/v1/pick_bouts?${boutQuery}`, headers, "Bout lookup");

          console.log(`LIVE_PICK_COVERAGE_DIAGNOSTIC ${JSON.stringify({
            proof_backend_sha: proofBackendSha,
            run,
            bouts,
            snapshots,
            findings,
          })}`);
          NODE