name: TEMP QB Source Audit

on:
  push:
    branches:
      - chatgpt/pfr-ranker-qb-consensus

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    if: github.ref == 'refs/heads/chatgpt/pfr-ranker-qb-consensus'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture temporary QB audit
        shell: bash
        run: |
          set +e
          npx vitest run src/features/back-room/qbConsensusSourceAudit.test.ts --reporter=verbose > /tmp/qb-audit.log 2>&1
          status=$?
          set -e
          {
            echo 'TEMPORARY QB SOURCE AUDIT'
            echo
            echo "head: $GITHUB_SHA"
            echo "vitest_status: $status"
            echo
            grep -E 'QB_RUNTIME_POOL|PFR_HOFM_QB_ORDER|RANKER_QB_H2_ORDER|QB_SOURCE_STATUS' /tmp/qb-audit.log || true
          } > /tmp/qb-comment.txt
          cat /tmp/qb-comment.txt
      - name: Post audit to draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 912 --body-file /tmp/qb-comment.txt
