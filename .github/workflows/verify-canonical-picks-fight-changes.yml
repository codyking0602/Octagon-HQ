name: Verify Canonical Picks Fight Changes

# Focused fresh-database proof for the canonical Picks fight mutation owner,
# repick evidence, notification delivery eligibility, live fight-by-fight owner controls,
# provider-driven Fight Night automation, and the owner-facing live-state projection.
on:
  pull_request:
    paths:
      - ".github/workflows/verify-canonical-picks-fight-changes.yml"
      - "supabase/migrations/202609140001_canonical_pick_fight_change_semantics.sql"
      - "supabase/migrations/202609140002_preserve_pick_replacement_evidence.sql"
      - "supabase/migrations/202612310005_live_pick_results_and_owner_lock_edits.sql"
      - "supabase/migrations/202612310019_append_added_pick_bouts.sql"
      - "supabase/migrations/202612310020_suppress_pick_deadline_change_push.sql"
      - "supabase/migrations/202612310048_fight_night_automation_behavior.sql"
      - "supabase/migrations/202612310049_fight_night_live_state_presentation.sql"
      - "supabase/migrations/202612310050_fight_night_espn_lock_authority.sql"
      - "supabase/migrations/202612310051_keep_fight_night_monitoring_through_live_window.sql"
      - "scripts/configure-monitoring-scheduler.mjs"
      - "supabase/tests/pick_monitoring_canonical_fight_changes.sql"
      - "supabase/tests/pick_monitoring_repick_evidence_repair.sql"
      - "supabase/tests/live_pick_results_and_owner_lock_edits.sql"
      - "supabase/tests/fight_night_automation_behavior.sql"
      - "supabase/tests/fight_night_live_state_presentation.sql"
      - "supabase/tests/fight_night_espn_lock_authority.sql"
      - "supabase/tests/fight_night_monitoring_live_window.sql"
      - "supabase/tests/pick_add_bout_append_sequence.sql"
      - "supabase/tests/notification_device_push_delivery.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify canonical fight changes on a fresh database
        shell: bash
        run: |
          set -euo pipefail
          supabase db start
          trap 'supabase stop --no-backup >/dev/null 2>&1 || true' EXIT

          db_url=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          if [ -z "$db_url" ]; then
            echo "::error title=Local Supabase database unavailable::The local database started, but its connection URL was not reported."
            exit 1
          fi

          psql "$db_url" --set ON_ERROR_STOP=on \
            --file supabase/tests/pick_monitoring_canonical_fight_changes.sql
          psql "$db_url" --set ON_ERROR_STOP=on \
            --file supabase/tests/pick_monitoring_repick_evidence_repair.sql
          psql "$db_url" --set ON_ERROR_STOP=on \
            --file supabase/tests/live_pick_results_and_owner_lock_edits.sql
          psql "$db_url" --set ON_ERROR_STOP=on \
            --file supabase/tests/fight_night_automation_behavior.sql
          psql "$db_url" --set ON_ERROR_STOP=on \
            --file supabase/tests/fight_night_live_state_presentation.sql
          psql "$db_url" --set ON_ERROR_STOP=on \
            --file supabase/tests/fight_night_espn_lock_authority.sql
          psql "$db_url" --set ON_ERROR_STOP=on \
            --file supabase/tests/fight_night_monitoring_live_window.sql
          psql "$db_url" --set ON_ERROR_STOP=on \
            --file supabase/tests/pick_add_bout_append_sequence.sql
          psql "$db_url" --set ON_ERROR_STOP=on \
            --file supabase/tests/notification_device_push_delivery.sql

          echo "Canonical Picks fight changes, ESPN Fight Night lock authority/live-window monitoring, automation/presentation, add-bout append semantics, repick evidence, notification push eligibility, and live owner controls passed on a fresh database."
