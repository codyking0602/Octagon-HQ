name: Temporary generate CFB coach source

on:
  push:
    branches:
      - feature/cfb-coach-relationships
    paths:
      - .github/workflows/_tmp-generate-cfb-coach-source.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cfb-coach-relationships
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests mwparserfromhell
      - run: python scripts/_tmp_generate_cfb_coach_source.py
      - name: Commit generated source snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/football/cfb/cfb-coach-assignments-2002-2025.source.json
          git diff --cached --quiet && { echo 'No generated diff'; exit 1; }
          git commit -m "data: pin CFB coach assignment source"
          git push origin HEAD:feature/cfb-coach-relationships
