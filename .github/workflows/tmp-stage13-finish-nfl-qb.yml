name: Temporary Stage 13 Finish NFL QB

on:
  push:
    branches:
      - stage13-6-finish-nfl-qb

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Hydrate historical NFL QB facts
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/back-room/footballFactualStatsExpansion.ts')
          text = path.read_text()
          marker = '  // NFL defenders: use position-appropriate objective production and award counts.\n'
          records = [
              ('nfl-bart-starr', 24718, 152, 138),
              ('nfl-bobby-layne', 26768, 196, 243),
              ('nfl-fran-tarkenton', 47003, 342, 266),
              ('nfl-jim-kelly', 35467, 237, 175),
              ('nfl-otto-graham', 23584, 174, 135),
              ('nfl-roger-staubach', 22700, 153, 109),
              ('nfl-sammy-baugh', 21886, 187, 203),
              ('nfl-sid-luckman', 14686, 137, 132),
              ('nfl-terry-bradshaw', 27989, 212, 210),
              ('nfl-y-a-tittle', 33070, 242, 248),
              ('nfl-boomer-esiason', 37920, 247, 184),
              ('nfl-george-blanda', 26920, 236, 277),
              ('nfl-joe-theismann', 25206, 160, 138),
          ]
          rows = ''.join(
              f'  record("{sid}", "nfl-player-career", "pfr-career-stat-lines", [["nfl-career-passing-yards", {yards}], ["nfl-career-passing-touchdowns", {tds}], ["nfl-career-interceptions-thrown", {ints}]]),\n'
              for sid, yards, tds, ints in records
          ) + '\n'
          if 'record("nfl-bart-starr"' not in text:
              text = text.replace(marker, rows + marker, 1)
          path.write_text(text)
          PY
      - run: npm run generate:football-cfb-player-seasons && npm run generate:football-factual-universe && npm run generate:football-ledger-audit
      - name: Commit canonical source, generated audit, and self-clean
        run: |
          rm .github/workflows/tmp-stage13-finish-nfl-qb.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/back-room/footballFactualStatsExpansion.ts docs/football-ledger-stage13-5-review.md .github/workflows/tmp-stage13-finish-nfl-qb.yml
          git commit -m 'Finish Stage 13.6 NFL QB factual hydration'
          git push origin HEAD:stage13-6-finish-nfl-qb
