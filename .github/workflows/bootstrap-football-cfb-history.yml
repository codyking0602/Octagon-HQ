name: Bootstrap Football CFB History

on:
  push:
    branches:
      - feature/football-knowledge-cfb-historical-adapter

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate compact historical CFB corpus
        run: node scripts/import-football-cfb-historical-player-stats.mjs
      - name: Verify generated outputs
        run: |
          test -s data/generated/football/cfb/player-seasons-2014-2025.json
          test -s data/generated/football/cfb/player-seasons-2014-2025.manifest.json
          test -s data/generated/football/cfb/player-seasons-2014-2025.coverage.json
      - name: Commit generated corpus to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/generated/football/cfb/player-seasons-2014-2025.json
          git add -f data/generated/football/cfb/player-seasons-2014-2025.manifest.json
          git add -f data/generated/football/cfb/player-seasons-2014-2025.coverage.json
          git commit -m "Generate historical CFB player-season corpus"
          git push origin HEAD:feature/football-knowledge-cfb-historical-adapter
