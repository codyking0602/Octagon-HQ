name: Stage 13 final repair

on:
  push:
    branches:
      - feat/football-ledger-stage13-factual-universe

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/football-ledger-stage13-factual-universe
      - name: Apply narrow canonical ownership repair
        run: node scripts/stage13-final-repair.mjs
      - name: Commit repair and remove temporary helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage13-final-repair.yml scripts/stage13-final-repair.mjs
          git add src/features/back-room/footballFactualStatsCore.ts
          git commit -m "Repair Stage 13 canonical factual gap fill"
          git push origin HEAD:feat/football-ledger-stage13-factual-universe
