name: Challenge Center Diagnostic

on:
  pull_request:
    paths:
      - "src/features/challenges/**"
      - "src/features/play/PlayPage.tsx"
      - ".github/workflows/challenge-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone exact branch head
        run: git clone --quiet --depth 1 --branch feature/play-challenge-center https://github.com/codyking0602/Octagon-HQ.git repo
      - name: Run focused test
        working-directory: repo
        run: |
          npm install --silent
          npm test -- src/features/challenges/challengeFlow.test.tsx --reporter=verbose > /tmp/challenge-test.log 2>&1 || {
            tail -n 100 /tmp/challenge-test.log
            exit 1
          }
