name: Challenge Branch Diagnostic

on:
  push:
    branches: [play-challenge-center]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Capture validation
        shell: bash
        run: |
          set +e
          : > challenge-ci.txt
          echo "HEAD=$GITHUB_SHA" >> challenge-ci.txt
          echo "== TYPECHECK ==" >> challenge-ci.txt
          npm run typecheck >> challenge-ci.txt 2>&1
          TYPECHECK=$?
          echo "TYPECHECK_EXIT=$TYPECHECK" >> challenge-ci.txt
          echo "== TEST ==" >> challenge-ci.txt
          npm test >> challenge-ci.txt 2>&1
          TEST=$?
          echo "TEST_EXIT=$TEST" >> challenge-ci.txt
          echo "== BUILD ==" >> challenge-ci.txt
          npm run build >> challenge-ci.txt 2>&1
          BUILD=$?
          echo "BUILD_EXIT=$BUILD" >> challenge-ci.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenge-ci.txt
          git commit -m "Record challenge validation [skip ci]"
          git push
