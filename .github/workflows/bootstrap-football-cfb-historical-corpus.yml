name: Bootstrap historical CFB corpus

on:
  push:
    branches:
      - feature/football-historical-cfb-player-seasons
    paths:
      - scripts/import-football-cfb-historical-player-seasons.mjs
      - scripts/football-cfb-historical-source-lock.json
      - .github/workflows/bootstrap-football-cfb-historical-corpus.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/football-historical-cfb-player-seasons
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate pinned historical CFB corpus
        run: node scripts/import-football-cfb-historical-player-seasons.mjs
      - name: Commit generated corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/football/cfb/historical-player-seasons
          git diff --cached --exit-code && exit 0
          git commit -m "data: generate historical CFB player-season corpus"
          git push origin HEAD:feature/football-historical-cfb-player-seasons
