name: Temporary Stage 13 Audit Artifact

on:
  push:
    branches:
      - stage13-6-nfl-historical-receiving

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - run: npm run generate:football-cfb-player-seasons && npm run generate:football-factual-universe && npm run generate:football-ledger-audit
      - name: Commit generated audit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/football-ledger-stage13-5-review.md
          git rm .github/workflows/tmp-stage13-audit-artifact.yml
          git commit -m "Refresh Stage 13.6 factual readiness artifact"
          git push origin HEAD:stage13-6-nfl-historical-receiving
