name: Repair Auction Release Proof Branch

on:
  push:
    branches:
      - agent/prove-auction-pr3-production-release

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/prove-auction-pr3-production-release

      - name: Patch canonical verification owner and focused test
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/verify-supabase-backend.yml')
          workflow = workflow_path.read_text()
          migration_anchor = '          require_remote_migration "202608200030" "Gable production repair migration not deployed"\n'
          migration_insert = '''          require_remote_migration "202608210002" "Auction private lifecycle migration not deployed"
          require_remote_migration "202608210003" "Auction lifecycle hardening migration not deployed"
          require_remote_migration "202608220001" "Auction playable server engine migration not deployed"
          require_remote_migration "202608220002" "Auction playable server hardening migration not deployed"
          require_remote_migration "202608220003" "Auction round notification hardening migration not deployed"
          require_remote_migration "202608220004" "Auction catalog version rotation migration not deployed"
'''
          if migration_insert not in workflow:
              if migration_anchor not in workflow:
                  raise SystemExit('Migration verification anchor not found')
              workflow = workflow.replace(
                  migration_anchor,
                  migration_anchor + migration_insert,
                  1,
              )

          summary_anchor = '            echo "- Event setup and card review migration: deployed remotely"\n'
          summary_insert = '            echo "- Auction lifecycle and playable server migrations 202608210002 through 202608220004: deployed remotely"\n'
          if summary_insert not in workflow:
              if summary_anchor not in workflow:
                  raise SystemExit('Verification summary anchor not found')
              workflow = workflow.replace(
                  summary_anchor,
                  summary_anchor + summary_insert,
                  1,
              )
          workflow_path.write_text(workflow)

          test_path = Path('src/app/supabaseBackendVerificationWorkflow.test.ts')
          test = test_path.read_text()
          foundation_old = '''    expect(deploymentWorkflow).toContain(
      "supabase/migrations/202608210002_auction_private_lifecycle.sql",
    );
    expect(deploymentWorkflow).toContain(
      'require_remote_migration "202608210002"',
    );
    expect(deploymentWorkflow).toContain(
      "supabase/migrations/202608210003_auction_private_lifecycle_hardening.sql",
    );
    expect(deploymentWorkflow).toContain(
      'require_remote_migration "202608210003"',
    );
'''
          foundation_new = '''    for (const owner of [deploymentWorkflow, workflow]) {
      expect(owner).toContain(
        'require_remote_migration "202608210002"',
      );
      expect(owner).toContain(
        'require_remote_migration "202608210003"',
      );
    }
    expect(deploymentWorkflow).toContain(
      "supabase/migrations/202608210002_auction_private_lifecycle.sql",
    );
    expect(deploymentWorkflow).toContain(
      "supabase/migrations/202608210003_auction_private_lifecycle_hardening.sql",
    );
'''
          if foundation_old in test:
              test = test.replace(foundation_old, foundation_new, 1)
          elif foundation_new not in test:
              raise SystemExit('Auction foundation source-contract anchor not found')

          playable_old = '''    for (const [version, path] of playableMigrations) {
      expect(deploymentWorkflow).toContain(path);
      expect(deploymentWorkflow).toContain(
        `require_remote_migration "${version}"`,
      );
    }
'''
          playable_new = '''    for (const [version, path] of playableMigrations) {
      expect(deploymentWorkflow).toContain(path);
      for (const owner of [deploymentWorkflow, workflow]) {
        expect(owner).toContain(
          `require_remote_migration "${version}"`,
        );
      }
    }
'''
          if playable_old in test:
              test = test.replace(playable_old, playable_new, 1)
          elif playable_new not in test:
              raise SystemExit('Playable Auction source-contract anchor not found')
          test_path.write_text(test)

          Path('.github/workflows/repair-auction-release-proof-branch.yml').unlink()
          PY

      - name: Commit narrow repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-supabase-backend.yml src/app/supabaseBackendVerificationWorkflow.test.ts .github/workflows/repair-auction-release-proof-branch.yml
          git commit -m "Require remote Auction migration proof"
          git push origin HEAD:agent/prove-auction-pr3-production-release
