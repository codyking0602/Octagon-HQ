name: TEMP PR6 materialize

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/generate-football-recognizability.mjs
      - .github/workflows/temp-pr6-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Skip materialization commit
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -Fq '[materialize-pr6]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Block unsafe identity merges and generate
        if: steps.guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-football-recognizability.mjs')
          s = p.read_text()
          s = s.replace('function projectCfbPlayer(p) {\n  const nflMatch = uniqueNflMatch(p.name);', 'function projectCfbPlayer(p) {\n  const years = yearsFor(p);\n  const collegeEndSeason = years.at(-1);\n  const nflNameMatch = uniqueNflMatch(p.name);\n  const nflMatch = nflNameMatch && collegeEndSeason != null && nflNameMatch.startSeason != null && nflNameMatch.startSeason >= collegeEndSeason && nflNameMatch.startSeason <= collegeEndSeason + 2 ? nflNameMatch : null;')
          s = s.replace('  const years = yearsFor(p);\n  return { id: `cfbfast-r-player-${p.sourceId}-${normalize(p.name)}`', '  return { id: `cfbfast-r-player-${p.sourceId}-${normalize(p.name)}`')
          s = s.replace('const cfbPeople = aggregate(cfb, "CFB");\nconst cfbProjected = cfbPeople.map(projectCfbPlayer);', 'const cfbPeople = aggregate(cfb, "CFB");\nconst cfbNameCounts = new Map();\nfor (const person of cfbPeople) { const key = normalize(person.name); cfbNameCounts.set(key, (cfbNameCounts.get(key) ?? 0) + 1); }\nconst cfbProjected = cfbPeople.map(projectCfbPlayer).map((record) => cfbNameCounts.get(normalize(record.name)) > 1 ? { ...record, tier: "D", evidence: ["ambiguous duplicate CFB source name; no safe canonical merge"], manualA: false } : record);')
          s = s.replace('- CFB defensive players without a unique NFL name reconciliation are deliberately not promoted from ambiguous defensive event stats alone.\\n', '- CFB defensive players without a unique, chronologically plausible NFL name reconciliation are deliberately not promoted from ambiguous defensive event stats alone.\\n- Duplicate CFB source names are left D until a stable identity key can reconcile them safely.\\n')
          p.write_text(s)
          if 'Math.random' in s:
              raise SystemExit('nondeterministic Math.random fallback remains')
          if '(strong && major)' in s:
              raise SystemExit('stat-only CFB recognition path remains')
          PY
          node scripts/generate-football-recognizability.mjs
      - name: Commit materialized artifacts
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-football-recognizability.mjs docs/football-recognizability-audit.md
          git add -f data/generated/football/recognizability-projection.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: materialize safe-identity PR6 projection [materialize-pr6]'
          git push origin HEAD:${{ github.head_ref }}
