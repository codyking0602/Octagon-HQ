name: Temporary ESPN headshot probe

on:
  push:
    branches:
      - chatgpt/play-thumbnail-completeness

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/play-thumbnail-completeness
      - name: Probe ESPN search endpoints
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          name = "Marvin Vettori"
          encoded = urllib.parse.quote(name)
          urls = [
              f"https://site.web.api.espn.com/apis/search/v2?region=us&lang=en&limit=10&page=1&query={encoded}",
              f"https://site.web.api.espn.com/apis/common/v3/search?query={encoded}&limit=10",
          ]
          results = []
          for url in urls:
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read().decode("utf-8", "replace")
                  results.append({"url": url, "ok": True, "body": body[:50000]})
              except Exception as exc:
                  results.append({"url": url, "ok": False, "error": repr(exc)})
          Path("tmp").mkdir(exist_ok=True)
          Path("tmp/espn-headshot-probe.json").write_text(json.dumps(results, indent=2), encoding="utf-8")
          PY
      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/espn-headshot-probe.json
          git commit -m "Record ESPN headshot probe" || exit 0
          git push origin HEAD:chatgpt/play-thumbnail-completeness
