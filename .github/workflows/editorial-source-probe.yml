name: Editorial source discovery diagnostic
on:
  push:
    branches: [preview/football-editorial-20261013]
    paths: [.github/workflows/editorial-source-probe.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install pillow --disable-pip-version-check
      - name: Inspect original MMA Mania event poster composition
        shell: python
        run: |
          import urllib.request,base64,io
          from PIL import Image
          url='https://platform.mmamania.com/wp-content/uploads/sites/110/2026/10/HTgg68BWAAAl9gb.jpeg?quality=90&strip=all&crop=0%2C3.4613147178592%2C100%2C93.077370564282&w=1200'
          with urllib.request.urlopen(url,timeout=20) as r:
            im=Image.open(io.BytesIO(r.read()))
            print('SOURCE SIZE',im.size)
            im.thumbnail((600,315))
            buf=io.BytesIO()
            im.convert('RGB').save(buf,'JPEG',quality=65)
            print('POSTER_PREVIEW_BASE64='+base64.b64encode(buf.getvalue()).decode())
