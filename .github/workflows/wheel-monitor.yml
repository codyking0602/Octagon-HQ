name: Wheel Monitor Read-Only (staged)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/wheel-monitor/**'
      - '.github/workflows/wheel-monitor.yml'
  push:
    branches: [main]
    paths:
      - "scripts/wheel-monitor/**"
      - ".github/workflows/wheel-monitor.yml"
      - ".github/workflows/monitor-wheel-cfb-ap-top25.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: wheel-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --silent --no-audit --no-fund
      - run: node --check scripts/wheel-monitor/run.mjs
      - run: node --test scripts/wheel-monitor/*.nodecheck.mjs
  monitor:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      SUPABASE_PROJECT_ID: rvbspcjvebgwqzssayts
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent --no-audit --no-fund
      - name: Verify conservative classifications
        run: node --test scripts/wheel-monitor/*.nodecheck.mjs
      - name: Restore last verified complete snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/wheel-monitor/previous
          # A successful *report-only* run has no promoted snapshot.
          # Query named artifacts directly; do not assume the newest green run
          # produced a checkpoint. Ignore expired and non-main artifacts.
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=wheel-monitor-snapshot&per_page=100" \
            > tmp/wheel-monitor/previous/artifacts.json
          id=$(node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {selectLatestCheckpointArtifact} from "./scripts/wheel-monitor/checkpoint-policy.mjs";
            const payload=JSON.parse(readFileSync("tmp/wheel-monitor/previous/artifacts.json","utf8"));
            process.stdout.write(String(selectLatestCheckpointArtifact(payload.artifacts)?.workflow_run.id ?? ""));
          ')
          if [[ -n "$id" ]]; then
            gh run download "$id" --name wheel-monitor-snapshot --dir tmp/wheel-monitor/previous
            echo "PREVIOUS_SNAPSHOT=tmp/wheel-monitor/previous/snapshot.json" >> "$GITHUB_ENV"
          else
            echo "PREVIOUS_SNAPSHOT=" >> "$GITHUB_ENV"
          fi
      - name: Restore latest ungraded observation (not a certified snapshot)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/wheel-monitor/observation-previous
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=wheel-monitor-observation&per_page=100" \
            > tmp/wheel-monitor/observation-previous/artifacts.json
          id=$(node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {selectLatestObservationArtifact} from "./scripts/wheel-monitor/checkpoint-policy.mjs";
            const payload=JSON.parse(readFileSync("tmp/wheel-monitor/observation-previous/artifacts.json","utf8"));
            process.stdout.write(String(selectLatestObservationArtifact(payload.artifacts)?.workflow_run.id ?? ""));
          ')
          if [[ -n "$id" ]]; then
            gh run download "$id" --name wheel-monitor-observation --dir tmp/wheel-monitor/observation-previous
            echo "PREVIOUS_OBSERVATION=tmp/wheel-monitor/observation-previous/observation.json" >> "$GITHUB_ENV"
          else
            echo "PREVIOUS_OBSERVATION=" >> "$GITHUB_ENV"
          fi
      - name: Collect and reconcile full populations
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Missing existing SUPABASE_ACCESS_TOKEN; cannot verify coverage."
            exit 1
          fi
          node scripts/wheel-monitor/run.mjs \
            --previous="$PREVIOUS_SNAPSHOT" \
            --previous-observation="$PREVIOUS_OBSERVATION" \
            --out=tmp/wheel-monitor/current
          if [[ -f tmp/wheel-monitor/current/snapshot.json ]]; then
            echo "snapshot_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Report-only run: review blockers prevent snapshot promotion."
          fi
      - name: Report checkpoints and blockers
        if: always()
        shell: bash
        run: |
          if [[ -f tmp/wheel-monitor/current/report.json ]]; then
            head -c 16000 tmp/wheel-monitor/current/report.json
          fi
          if [[ -f tmp/wheel-monitor/current/failure.json ]]; then
            cat tmp/wheel-monitor/current/failure.json
          fi
      - name: Preserve review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-monitor-run-report
          path: |
            tmp/wheel-monitor/current/report.json
            tmp/wheel-monitor/current/failure.json
          if-no-files-found: warn
          retention-days: 30
      - name: Archive ungraded observation after fully successful source collection
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wheel-monitor-observation
          path: tmp/wheel-monitor/current/observation.json
          if-no-files-found: error
          retention-days: 45
      - name: Promote only fully verified source snapshot
        if: steps.collect.outputs.snapshot_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wheel-monitor-snapshot
          path: tmp/wheel-monitor/current/snapshot.json
          if-no-files-found: error
          retention-days: 90
