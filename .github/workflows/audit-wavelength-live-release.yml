name: Audit Wavelength Live Release

on:
  pull_request:
    paths:
      - ".github/workflows/audit-wavelength-live-release.yml"

permissions:
  contents: read

jobs:
  verify-live-release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.base.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Verify backend credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing backend proof secret::$name is missing or empty."
              exit 1
            fi
          done

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify migration is live and nothing is pending
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          migration_list=$(supabase migration list --linked)
          printf '%s\n' "$migration_list"
          remote_version=$(printf '%s\n' "$migration_list" | sed 's/│/|/g' | awk -F '|' '
            {
              local_version = $1
              remote_version = $2
              gsub(/[^0-9]/, "", local_version)
              gsub(/[^0-9]/, "", remote_version)
              if (local_version == "202609140003") {
                print remote_version
                exit
              }
            }
          ')
          test "$remote_version" = "202609140003"
          supabase db push --linked --dry-run

      - name: Verify exact daily runtime deployment and today’s published game
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accessToken = process.env.SUPABASE_ACCESS_TOKEN;
          const projectId = process.env.SUPABASE_PROJECT_ID;
          const expectedSha = process.env.EXPECTED_SOURCE_SHA.toLowerCase();
          const origin = `https://${projectId}.supabase.co`;

          const deploymentResponse = await fetch(`${origin}/functions/v1/daily-challenge-runtime`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode: "deployment-info" }),
          });
          const deployment = await deploymentResponse.json();
          if (!deploymentResponse.ok || deployment?.deployment_sha?.toLowerCase() !== expectedSha) {
            throw new Error(`Daily runtime is not the exact current main SHA: ${JSON.stringify(deployment)}`);
          }

          const keysResponse = await fetch(
            `https://api.supabase.com/v1/projects/${projectId}/api-keys?reveal=true`,
            { headers: { Authorization: `Bearer ${accessToken}` } },
          );
          if (!keysResponse.ok) throw new Error(`Project key lookup failed: HTTP ${keysResponse.status}`);
          const keys = await keysResponse.json();
          const serviceKey = keys.find((item) => item.type === "secret")?.api_key
            ?? keys.find((item) => item.type === "legacy" && /service.role/i.test(item.name ?? ""))?.api_key;
          if (!serviceKey) throw new Error("Could not resolve the service-role project key for read-only release proof.");

          const materializationResponse = await fetch(
            `${origin}/rest/v1/rpc/get_daily_challenge_materialization_request`,
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${serviceKey}`,
                apikey: serviceKey,
                "Content-Type": "application/json",
              },
              body: "{}",
            },
          );
          const materialization = await materializationResponse.json();
          if (!materializationResponse.ok) {
            throw new Error(`Daily materialization read failed: HTTP ${materializationResponse.status} ${JSON.stringify(materialization)}`);
          }
          if (materialization.required !== false
            || materialization.expected_game !== "wavelength"
            || materialization.published_game !== "wavelength"
            || materialization.fallback_reason !== null) {
            throw new Error(`Today’s official Wavelength is not published cleanly: ${JSON.stringify(materialization)}`);
          }

          console.log(`Exact live daily backend ${expectedSha} verified with today’s official Wavelength published.`);
          NODE

      - name: Record live release proof
        shell: bash
        run: |
          {
            echo "### Wavelength live release verified"
            echo "- Exact current main SHA: \`$EXPECTED_SOURCE_SHA\`"
            echo "- Migration \`202609140003\`: recorded remotely"
            echo "- Linked dry run: no pending database changes"
            echo "- daily-challenge-runtime: exact current main SHA"
            echo "- Today’s expected and published game: Wavelength"
            echo "- Fallback reason: none"
          } >> "$GITHUB_STEP_SUMMARY"
