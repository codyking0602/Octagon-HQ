name: Repair Auction PR 6 SQL Trim

on:
  push:
    branches:
      - audit/pr276-main-backend-proof
    paths:
      - ".github/workflows/audit-pr6-snapshot-run.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: 72198b71febc73ce119fc4ca74aef14b276e594f
      TARGET_BRANCH: feat/auction-pr6-final-release
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply the focused SQL repair
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/octagon-pr6"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"
          cd "$target"
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          python - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/202609030001_auction_notifications_share_release.sql")
          text = migration.read_text()
          old = "pg_catalog.trim("
          new = "pg_catalog.btrim("
          if text.count(old) != 2:
              raise SystemExit(f"expected exactly 2 {old!r} calls, found {text.count(old)}")
          migration.write_text(text.replace(old, new))

          test_file = Path("src/app/auctionPr6ReleaseContract.test.ts")
          test_text = test_file.read_text()
          anchor = '    expect(migration).toContain("private.get_rich_preview_data_pr6_core");\n'
          addition = (
              '    expect(migration).toContain("pg_catalog.btrim(p_kind)");\n'
              '    expect(migration).toContain("pg_catalog.btrim(p_key)");\n'
              '    expect(migration).not.toContain("pg_catalog.trim(");\n'
          )
          if addition not in test_text:
              if anchor not in test_text:
                  raise SystemExit("focused test insertion anchor missing")
              test_text = test_text.replace(anchor, anchor + addition, 1)
              test_file.write_text(test_text)
          PY

          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/202609030001_auction_notifications_share_release.sql \
            src/app/auctionPr6ReleaseContract.test.ts
          git commit -m "Use PostgreSQL btrim in Auction preview RPC"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
