name: Materialize Wavelength source from PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-wavelength-source-pr.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate and commit non-workflow source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/materialize-wavelength-calibration.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, 'materialize-wavelength-calibration.py', 'exec'))
          PY

          git checkout HEAD -- .github/workflows
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/play-games-roadmap.md \
            src/features/play/WavelengthGame.tsx \
            src/features/play/officialScoreContract.test.ts \
            src/features/play/officialScoreContract.ts \
            src/features/play/todaysChallengeRuntime.test.ts \
            src/features/play/todaysChallengeRuntime.ts \
            src/features/play/wavelength.test.tsx \
            src/features/play/wavelengthEngine.ts \
            supabase/migrations/202609090001_calibrate_wavelength_scoring.sql \
            supabase/tests/wavelength_score_calibration.sql
          git commit -m "Calibrate Wavelength scoring"
          git push origin HEAD:agent/calibrate-wavelength-score
