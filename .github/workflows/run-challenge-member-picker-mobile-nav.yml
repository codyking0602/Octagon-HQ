name: Run challenge member picker and mobile nav repair

on:
  push:
    branches:
      - chatgpt/challenge-member-picker-mobile-nav

permissions:
  contents: write

concurrency:
  group: run-challenge-member-picker-mobile-nav
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/challenge-member-picker-mobile-nav
          fetch-depth: 1

      - name: Apply focused challenge and navigation fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          # Challenge profiles can carry the canonical member avatar projection.
          replace_once(
              "src/features/challenges/challengeModel.ts",
              "export interface ChallengeProfile {\n  id: string;\n  displayName: string;\n  initials: string;\n}",
              "export interface ChallengeProfile {\n  id: string;\n  displayName: string;\n  initials: string;\n  avatarPhotoData?: string | null;\n}",
          )

          Path("src/features/challenges/ChallengeMemberPicker.tsx").write_text(r'''import { useMemo, useState } from "react";
import type { MemberCardSummary } from "../members/memberProfilesModel";

function normalizeMemberName(value: string) {
  return value.trim().replace(/\s+/g, " ").toUpperCase();
}

export function challengeMemberOptions(
  members: readonly MemberCardSummary[],
  query: string,
  recentNames: readonly string[] = [],
) {
  const normalizedQuery = normalizeMemberName(query);
  const recentOrder = new Map(
    recentNames.map((name, index) => [normalizeMemberName(name), index]),
  );

  return members
    .filter((member) => !member.isCurrentUser)
    .filter((member) => (
      !normalizedQuery
      || normalizeMemberName(member.displayName).includes(normalizedQuery)
    ))
    .sort((left, right) => {
      const leftRecent = recentOrder.get(normalizeMemberName(left.displayName));
      const rightRecent = recentOrder.get(normalizeMemberName(right.displayName));
      if (leftRecent !== undefined || rightRecent !== undefined) {
        if (leftRecent === undefined) return 1;
        if (rightRecent === undefined) return -1;
        if (leftRecent !== rightRecent) return leftRecent - rightRecent;
      }
      return left.displayName.localeCompare(right.displayName);
    });
}

export function ChallengeMemberPicker({
  members,
  recentNames = [],
  selectedName = "",
  busy = false,
  onSelect,
}: {
  members: readonly MemberCardSummary[];
  recentNames?: readonly string[];
  selectedName?: string;
  busy?: boolean;
  onSelect: (member: MemberCardSummary) => void;
}) {
  const [query, setQuery] = useState("");
  const options = useMemo(
    () => challengeMemberOptions(members, query, recentNames),
    [members, query, recentNames],
  );
  const normalizedSelected = normalizeMemberName(selectedName);
  const recentSet = useMemo(
    () => new Set(recentNames.map(normalizeMemberName)),
    [recentNames],
  );

  return (
    <section className="challenge-member-picker" aria-label="Choose challenge opponent">
      <label className="challenge-member-picker__search">
        <span>CHOOSE MEMBER</span>
        <input
          autoCapitalize="characters"
          autoComplete="off"
          placeholder="SEARCH MEMBERS"
          value={query}
          onChange={(event) => setQuery(event.target.value.toUpperCase())}
        />
      </label>

      <div className="challenge-dialog__profiles challenge-member-picker__list" role="listbox" aria-label="Octagon HQ members">
        {options.map((member) => {
          const normalizedName = normalizeMemberName(member.displayName);
          const selected = normalizedName === normalizedSelected;
          return (
            <button
              className={selected ? "is-selected" : ""}
              type="button"
              role="option"
              aria-selected={selected}
              disabled={busy}
              key={member.displayName}
              onClick={() => onSelect(member)}
            >
              <i>
                {member.avatarPhotoData
                  ? <img src={member.avatarPhotoData} alt={`${member.displayName} profile`} />
                  : member.initials}
              </i>
              <span>
                <strong>{member.displayName}</strong>
                <small>{recentSet.has(normalizedName) ? "RECENT OPPONENT" : "OCTAGON HQ MEMBER"}</small>
              </span>
              <em aria-hidden="true" />
            </button>
          );
        })}
        {!options.length ? (
          <p className="challenge-member-picker__empty">
            {query ? "No members match that search." : "No other Octagon HQ members are available yet."}
          </p>
        ) : null}
      </div>
    </section>
  );
}
''')

          # Replace the exact-name composer with the one shared member picker.
          provider = Path("src/features/challenges/ChallengeProvider.tsx")
          provider_text = provider.read_text()
          provider_text = provider_text.replace(
              'import { useIdentity } from "../identity/IdentityProvider";\nimport type { PlayGameId } from "../play/playRegistry";',
              'import { useIdentity } from "../identity/IdentityProvider";\nimport type { MemberCardSummary } from "../members/memberProfilesModel";\nimport { createMemberProfilesRepository } from "../members/memberProfilesRepository";\nimport type { PlayGameId } from "../play/playRegistry";',
              1,
          )
          provider_text = provider_text.replace(
              'import {\n  challengeRepositoryError,',
              'import { ChallengeMemberPicker } from "./ChallengeMemberPicker";\nimport {\n  challengeRepositoryError,',
              1,
          )
          provider_text = provider_text.replace(
              '  profiles: readonly ChallengeProfile[];\n  activeProfile: ChallengeProfile | null;',
              '  profiles: readonly ChallengeProfile[];\n  members: readonly MemberCardSummary[];\n  activeProfile: ChallengeProfile | null;',
              1,
          )
          composer_start = provider_text.index("function ComposerDialog(")
          results_start = provider_text.index("function ResultsDialog(")
          new_composer = r'''function ComposerDialog({
  draft,
  activeProfile,
  repository,
  members,
  recentProfileNames,
  initialProfileName,
  onClose,
  onSend,
}: {
  draft: ChallengeComposerDraft;
  activeProfile: ChallengeProfile;
  repository: ChallengeRepository;
  members: readonly MemberCardSummary[];
  recentProfileNames: readonly string[];
  initialProfileName: string;
  onClose: () => void;
  onSend: (recipient: ChallengeProfile) => Promise<void>;
}) {
  const [recipient, setRecipient] = useState<ChallengeProfile | null>(null);
  const [selectedName, setSelectedName] = useState(initialProfileName);
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState("");

  async function lookupProfile(name: string, avatarPhotoData?: string | null) {
    const normalizedName = normalizeProfileName(name);
    if (normalizedName.length < 2) return;
    setSelectedName(normalizedName);
    setBusy(true);
    setStatus("");
    setRecipient(null);
    try {
      const match = await repository.findProfile(normalizedName, activeProfile.id);
      if (!match) {
        setStatus("NO PROFILE FOUND WITH THAT EXACT NAME");
        return;
      }
      setRecipient({ ...match, avatarPhotoData: avatarPhotoData ?? match.avatarPhotoData ?? null });
      setStatus(`${match.displayName} SELECTED`);
    } catch (error) {
      setStatus(challengeRepositoryError(error));
    } finally {
      setBusy(false);
    }
  }

  useEffect(() => {
    if (!initialProfileName) return;
    const member = members.find(
      (candidate) => normalizeProfileName(candidate.displayName) === normalizeProfileName(initialProfileName),
    );
    void lookupProfile(initialProfileName, member?.avatarPhotoData);
  }, [initialProfileName, members]);

  async function sendToProfile() {
    if (!recipient) return;
    setBusy(true);
    setStatus("");
    try {
      await onSend(recipient);
    } catch (error) {
      setStatus(challengeRepositoryError(error));
      setBusy(false);
    }
  }

  async function shareExternally() {
    setStatus(await shareDraft(draft));
  }

  return createPortal(
    <div className="challenge-overlay" role="presentation" onMouseDown={(event) => {
      if (event.currentTarget === event.target) onClose();
    }}>
      <section className="challenge-dialog" role="dialog" aria-modal="true" aria-labelledby="challenge-dialog-title">
        <header>
          <div>
            <p className="eyebrow">GAME CHALLENGE</p>
            <h2 id="challenge-dialog-title">Challenge Someone</h2>
            <p>Choose any Octagon HQ member below. Search is optional.</p>
          </div>
          <button type="button" className="challenge-dialog__close" aria-label="Close challenge dialog" onClick={onClose}>×</button>
        </header>

        <div className="challenge-dialog__summary">
          <span><small>{draft.gameTitle}</small><strong>{draft.summary}</strong></span>
          <b>LOCKED</b>
        </div>

        <ChallengeMemberPicker
          members={members}
          recentNames={recentProfileNames}
          selectedName={selectedName}
          busy={busy}
          onSelect={(member) => void lookupProfile(member.displayName, member.avatarPhotoData)}
        />

        <p className="challenge-dialog__status" role="status">{status}</p>
        <footer>
          <button type="button" disabled={busy} onClick={() => void shareExternally()}>TEXT / SHARE LINK</button>
          <button type="button" className="primary-action" disabled={!recipient || busy} onClick={() => void sendToProfile()}>
            {busy ? "SENDING…" : "SEND TO PROFILE"}
          </button>
        </footer>
      </section>
    </div>,
    document.body,
  );
}

'''
          provider_text = provider_text[:composer_start] + new_composer + provider_text[results_start:]
          provider_text = provider_text.replace(
