name: Materialize Auction photo repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-auction-photo-repair.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'chatgpt/repair-auction-photo-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/repair-auction-photo-quality
          fetch-depth: 0

      - name: Probe exact Canva asset delivery
        env:
          THUMB_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F70b348b7-77f5-4c98-9534-cea8102fd2e5/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACx6gg_ThhC4KthnTlSAQAwMR6VVtV126g9QdzugjNHg&exp=1785836373&osig=AAAAAAAAAAAAAAAAAAAAAAFrx-NAyqa6eRXdSpxqwq2FZsIPE7mZ2eQl2BuxP6nM&signer=media-rpc&x-canva-quality=thumbnail"
          FULL_URL: "https://media.canva.com/v2/image-resize/format:WEBP/height:405/quality:95/uri:ifs%3A%2F%2FM%2F70b348b7-77f5-4c98-9534-cea8102fd2e5/watermark:F/width:720?csig=AAAAAAAAAAAAAAAAAAAAACx6gg_ThhC4KthnTlSAQAwMR6VVtV126g9QdzugjNHg&exp=1785836373&osig=AAAAAAAAAAAAAAAAAAAAAAFrx-NAyqa6eRXdSpxqwq2FZsIPE7mZ2eQl2BuxP6nM&signer=media-rpc"
          SOURCE_URL: "https://media.canva.com/v2/image-resize/format:WEBP/uri:ifs%3A%2F%2FM%2F70b348b7-77f5-4c98-9534-cea8102fd2e5/watermark:F?csig=AAAAAAAAAAAAAAAAAAAAACx6gg_ThhC4KthnTlSAQAwMR6VVtV126g9QdzugjNHg&exp=1785836373&osig=AAAAAAAAAAAAAAAAAAAAAAFrx-NAyqa6eRXdSpxqwq2FZsIPE7mZ2eQl2BuxP6nM&signer=media-rpc"
        run: |
          for kind in thumb full source; do
            var="${kind^^}_URL"
            url="${!var}"
            code=$(curl --location --silent --show-error --output "/tmp/$kind" --write-out '%{http_code}' "$url")
            echo "$kind HTTP $code"
            file "/tmp/$kind"
            stat -c '%n %s bytes' "/tmp/$kind"
            identify "/tmp/$kind" || true
          done
          test "$(identify -format '%wx%h' /tmp/full 2>/dev/null || true)" = "720x405"
