name: One-off verify supplied Octagon HQ legacy production hostname
on:
  push:
    branches: [feat/ufc-home-ranked-espn-portraits-20261114]
    paths: [.github/workflows/ufc-home-verify-original-origin.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify all 83 exact WebPs at owner-supplied production hostname
        env:
          OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev
        run: node scripts/verify-live-ufc-home-portraits.mjs
