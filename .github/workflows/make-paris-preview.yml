name: Make Paris Spotlight Preview

on:
  push:
    branches:
      - fix/paris-spotlight-cutouts
    paths:
      - .github/workflows/make-paris-preview.yml

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paris-spotlight-cutouts
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Build contact sheet
        run: |
          python <<'PY'
          from PIL import Image, ImageDraw, ImageOps

          slugs = [
              ("dan-hooker", "HOOKER"),
              ("salahdine-parnasse", "PARNASSE"),
              ("daniil-donchenko", "DONCHENKO"),
              ("punahele-soriano", "SORIANO"),
          ]
          sheet = Image.new("RGB", (200, 200), (24, 24, 24))
          draw = ImageDraw.Draw(sheet)
          for index, (slug, label) in enumerate(slugs):
              image = Image.open(f"public/assets/fighters/{slug}-spotlight.webp").convert("RGBA")
              cell = Image.new("RGBA", (96, 96), (34, 34, 34, 255))
              fitted = ImageOps.contain(image, (90, 80), Image.Resampling.LANCZOS)
              x = (96 - fitted.width) // 2
              y = 2 + (80 - fitted.height)
              cell.alpha_composite(fitted, (x, y))
              draw_x = 2 + (index % 2) * 100
              draw_y = 2 + (index // 2) * 100
              sheet.paste(cell.convert("RGB"), (draw_x, draw_y))
              draw.text((draw_x + 4, draw_y + 82), label, fill=(245, 245, 245))
          sheet.save("public/assets/_paris-spotlight-preview.jpg", "JPEG", quality=72, optimize=True)
          PY
      - name: Commit preview and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/make-paris-preview.yml
          git add public/assets/_paris-spotlight-preview.jpg
          git commit -m "chore: add temporary Spotlight preview"
          git push origin HEAD:fix/paris-spotlight-cutouts
