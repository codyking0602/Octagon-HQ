name: Seed Heavyweight Blind Rank thumbnails

on:
  push:
    branches:
      - codex/heavyweight-blind-rank-depth
    paths:
      - .github/workflows/seed-heavyweight-thumbnails.yml

permissions:
  contents: write

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create ESPN fighter thumbnails
        run: |
          python -m pip install --disable-pip-version-check pillow
          python <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps

          fighters = {
              'ben-rothwell': '2473720',
              'travis-browne': '2504648',
              'gabriel-gonzaga': '2354239',
              'matt-mitrione': '2501702',
              'jairzinho-rozenstruik': '4410084',
              'brendan-schaub': '2500160',
              'walt-harris': '3023815',
              'antonio-silva': '2493018',
              'chase-sherman': '3952937',
          }
          out_dir = Path('public/assets/fighters')
          out_dir.mkdir(parents=True, exist_ok=True)

          for slug, espn_id in fighters.items():
              url = f'https://a.espncdn.com/i/headshots/mma/players/full/{espn_id}.png'
              req = Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urlopen(req, timeout=30) as response:
                  raw = response.read()
              image = Image.open(BytesIO(raw))
              image.load()
              if image.mode not in ('RGB', 'RGBA'):
                  image = image.convert('RGBA' if 'A' in image.getbands() else 'RGB')
              thumb = ImageOps.fit(
                  image,
                  (160, 160),
                  method=Image.Resampling.LANCZOS,
                  centering=(0.5, 0.42),
              )
              path = out_dir / f'{slug}-thumb.webp'
              thumb.save(path, 'WEBP', quality=92, method=6)
              data = path.read_bytes()
              if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise RuntimeError(f'Invalid WebP for {slug}')
              with Image.open(path) as check:
                  if check.size != (160, 160):
                      raise RuntimeError(f'Wrong size for {slug}: {check.size}')
              print(f'{slug}: {len(raw)} source bytes -> {len(data)} WebP bytes')
          PY
      - name: Commit thumbnails to PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/assets/fighters/*-thumb.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add Heavyweight Blind Rank thumbnails"
          git push origin HEAD:codex/heavyweight-blind-rank-depth
