name: Asset Ingest

on:
  push:
    paths:
      - '.asset-ingest/*.json'

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile asset processor
        run: python -m py_compile scripts/asset_ingest.py
      - run: python -m pip install --disable-pip-version-check pillow rembg onnxruntime
      - name: Process queued assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.asset-ingest/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No manifests."
            exit 0
          fi
          for manifest in "${files[@]}"; do
            python scripts/asset_ingest.py "$manifest"
            rm "$manifest"
          done
      - name: Commit generated assets
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/fighters .asset-ingest
          git commit -m "Generate approved fighter assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "generated=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or reuse asset PR
        if: steps.commit.outputs.generated == 'true'
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error title=Unsafe asset branch::Asset ingest must run from a focused branch, not main."
            exit 1
          fi

          pr_number=$(gh pr list             --repo "$GITHUB_REPOSITORY"             --head "$GITHUB_REF_NAME"             --base main             --state open             --json number             --jq '.[0].number')

          if [ -z "$pr_number" ]; then
            gh pr create               --repo "$GITHUB_REPOSITORY"               --base main               --head "$GITHUB_REF_NAME"               --title "Add automated fighter asset"               --body "Generated by the approved asset-ingest pipeline from an official ESPN/UFC source. The workflow will validate this exact generated head before merging."
            pr_number=$(gh pr list               --repo "$GITHUB_REPOSITORY"               --head "$GITHUB_REF_NAME"               --base main               --state open               --json number               --jq '.[0].number')
          fi

          if [ -z "$pr_number" ]; then
            echo "::error title=PR creation failed::No open PR was found after the create attempt."
            exit 1
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Validate exact generated head
        if: steps.commit.outputs.generated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list               --repo "$GITHUB_REPOSITORY"               --workflow validate.yml               --branch "$GITHUB_REF_NAME"               --event workflow_dispatch               --limit 10               --json databaseId,headSha               --jq ".[] | select(.headSha == \"$EXPECTED_SHA\") | .databaseId"               | head -n 1)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo "::error title=Validation run missing::Validate V2 did not start for $EXPECTED_SHA."
            exit 1
          fi

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

          current_sha=$(gh api             "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME"             --jq '.commit.sha')
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "::error title=Asset head moved::Expected $EXPECTED_SHA but branch is now $current_sha."
            exit 1
          fi

      - name: Merge validated asset PR
        if: steps.commit.outputs.generated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          pr_head=$(gh pr view "$PR_NUMBER"             --repo "$GITHUB_REPOSITORY"             --json headRefOid             --jq '.headRefOid')
          if [ "$pr_head" != "$EXPECTED_SHA" ]; then
            echo "::error title=PR head moved::Expected $EXPECTED_SHA but PR head is $pr_head."
            exit 1
          fi

          gh pr merge "$PR_NUMBER"             --repo "$GITHUB_REPOSITORY"             --merge             --match-head-commit "$EXPECTED_SHA"

      - name: Deploy merged fighter asset
        if: steps.commit.outputs.generated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --repo "$GITHUB_REPOSITORY" --ref main
