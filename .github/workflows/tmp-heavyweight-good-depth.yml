name: Temporary Heavyweight Good-tier depth generation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/heavyweight-good-tier-depth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Add Heavyweight Good-tier Play ratings and focused proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ratings_path = Path('src/features/play/playFighterRatings.ts')
          ratings = ratings_path.read_text()
          rows = [
            '  e("frank-mir", "Frank Mir", "men", ["Heavyweight"], "TUF Boom", "Former UFC heavyweight champion and interim champion with a long UFC title-level run", { career: 80, striking: 68, grappling: 91 }),',
            '  e("andrei-arlovski", "Andrei Arlovski", "men", ["Heavyweight"], "TUF Boom", "Former UFC heavyweight champion with exceptional UFC longevity", { career: 79, striking: 81, grappling: 52 }),',
            '  e("alistair-overeem", "Alistair Overeem", "men", ["Heavyweight"], "Fox / PPV Boom", "UFC heavyweight title challenger with a deep UFC contender win ledger", { career: 78, striking: 89, grappling: 68 }),',
            '  e("tim-sylvia", "Tim Sylvia", "men", ["Heavyweight"], "Pre-TUF Era", "Multiple-time UFC heavyweight champion with successful UFC title defenses", { career: 77, striking: 78, grappling: 50 }),',
            '  e("brock-lesnar", "Brock Lesnar", "men", ["Heavyweight"], "TUF Boom", "UFC heavyweight champion with a short but championship-heavy UFC run", { career: 76, striking: 66, grappling: 86 }),',
            '  e("derrick-lewis", "Derrick Lewis", "men", ["Heavyweight"], "ESPN+ Era", "UFC heavyweight title challenger with historic UFC knockout volume", { career: 74, striking: 87, grappling: 34 }),',
            '  e("shane-carwin", "Shane Carwin", "men", ["Heavyweight"], "TUF Boom", "UFC interim heavyweight champion and title challenger with a short elite UFC peak", { career: 73, striking: 88, grappling: 74 }),',
            '  e("josh-barnett", "Josh Barnett", "men", ["Heavyweight"], "Pre-TUF Era", "Former UFC heavyweight champion with additional UFC contender wins after returning", { career: 72, striking: 64, grappling: 84 }),',
          ]
          slugs = ['frank-mir','andrei-arlovski','alistair-overeem','tim-sylvia','brock-lesnar','derrick-lewis','shane-carwin','josh-barnett']
          for slug in slugs:
            assert f'e("{slug}"' not in ratings, f'duplicate Play-only fighter: {slug}'

          canonical_path = Path('src/features/rankings/data/generated/canonical-ranking-inputs-842ba06e.json')
          canonical = json.loads(canonical_path.read_text())
          ranked_names = {row['fighter'].lower() for row in canonical['fighters']}
          for row in rows:
            display = row.split('"')[3]
            assert display.lower() not in ranked_names, f'canonical ranking collision: {display}'

          marker = '  e("kris-moutinho", "Kris Moutinho"'
          assert marker in ratings
          ratings = ratings.replace(marker, '\n'.join(rows) + '\n' + marker, 1)
          ratings_path.write_text(ratings)

          test_path = Path('src/features/play/blindRankArchetypes.test.ts')
          test = test_path.read_text()
          lines = [
            '  it("adds Heavyweight depth at the Good tier", () => {',
            '    const expected = {',
            '      "frank-mir": { career: 80, striking: 68, grappling: 91 },',
            '      "andrei-arlovski": { career: 79, striking: 81, grappling: 52 },',
            '      "alistair-overeem": { career: 78, striking: 89, grappling: 68 },',
            '      "tim-sylvia": { career: 77, striking: 78, grappling: 50 },',
            '      "brock-lesnar": { career: 76, striking: 66, grappling: 86 },',
            '      "derrick-lewis": { career: 74, striking: 87, grappling: 34 },',
            '      "shane-carwin": { career: 73, striking: 88, grappling: 74 },',
            '      "josh-barnett": { career: 72, striking: 64, grappling: 84 },',
            '    } as const;',
            '    const heavyweightPool = blindRankPool("heavyweight");',
            '    const byId = new Map(heavyweightPool.map((fighter) => [fighter.id, fighter]));',
            '',
            '    for (const [id, ratings] of Object.entries(expected)) {',
            '      const fighter = byId.get(id);',
            '      expect(fighter, id).toBeDefined();',
            '      expect(fighter?.ratings, id).toEqual(ratings);',
            '    }',
            '',
            '    const goodCount = heavyweightPool.filter(',
            '      (fighter) => blindRankTier(blindRankRating(fighter, "heavyweight")) === "good",',
            '    ).length;',
            '    expect(goodCount).toBe(10);',
            '    expect(new Set(heavyweightPool.map((fighter) => fighter.id)).size).toBe(heavyweightPool.length);',
            '    expect(new Set(heavyweightPool.map((fighter) => fighter.name.toLowerCase())).size).toBe(heavyweightPool.length);',
            '  });',
            '',
          ]
          marker = '  it("adds Lightweight depth at the Below Average and Bad tiers"'
          assert marker in test
          assert 'adds Heavyweight depth at the Good tier' not in test
          test = test.replace(marker, '\n'.join(lines) + marker, 1)
          test_path.write_text(test)
          PY
      - name: Add missing ESPN headshots as local 160x160 WebPs
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps

          fighters = {
            'frank-mir': '2335301',
            'tim-sylvia': '2354048',
            'shane-carwin': '2335656',
            'josh-barnett': '2354241',
          }
          out = Path('public/assets/fighters')
          errors = []
          for slug, athlete_id in fighters.items():
            try:
              url = f'https://a.espncdn.com/i/headshots/mma/players/full/{athlete_id}.png'
              req = Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urlopen(req, timeout=30) as response:
                data = response.read()
              image = Image.open(BytesIO(data)).convert('RGBA')
              image = ImageOps.fit(image, (160, 160), method=Image.Resampling.LANCZOS, centering=(0.5, 0.38))
              target = out / f'{slug}-thumb.webp'
              image.save(target, 'WEBP', quality=95, method=6)
              check = Image.open(target)
              raw = target.read_bytes()
              assert check.size == (160, 160)
              assert raw[:4] == b'RIFF' and raw[8:12] == b'WEBP'
              print('OK', slug, len(raw))
            except Exception as error:
              errors.append((slug, athlete_id, repr(error)))
              print('MISS', slug, athlete_id, repr(error))
          assert not errors, errors
          PY
      - name: Commit clean PR3 branch and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-heavyweight-good-depth.yml
          git add src/features/play/playFighterRatings.ts src/features/play/blindRankArchetypes.test.ts public/assets/fighters/frank-mir-thumb.webp public/assets/fighters/tim-sylvia-thumb.webp public/assets/fighters/shane-carwin-thumb.webp public/assets/fighters/josh-barnett-thumb.webp
          git commit -m 'Add Heavyweight Good-tier Blind Rank depth'
          git push origin HEAD:codex/heavyweight-good-tier-depth
