name: Bootstrap UFC source transport

on:
  push:
    branches:
      - agent/restore-ufc-picks-source
    paths:
      - ".github/workflows/probe-ufc-source.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-ufc-picks-source

      - name: Patch canonical ownership and release wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"required patch anchor missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "worker/index.ts",
              'const UFC_SOURCE_PATH = "/internal/ufc-source";',
              'const UFC_SOURCE_PATH = "/picks";',
          )
          replace(
              "worker/index.ts",
              '    if (requestUrl.pathname === UFC_SOURCE_PATH) return serveUfcSource(request, env);',
              '''    if (\n      requestUrl.pathname === UFC_SOURCE_PATH\n      && request.method === "POST"\n      && request.headers.get("x-octagon-internal-action") === "ufc-source"\n    ) {\n      return serveUfcSource(request, env);\n    }''',
          )
          replace(
              "supabase/functions/sync-next-ufc-event/index.ts",
              'const UFC_SOURCE_TRANSPORT_PATH = "/internal/ufc-source";',
              'const UFC_SOURCE_TRANSPORT_PATH = "/picks";',
          )
          replace(
              "supabase/functions/sync-next-ufc-event/index.ts",
              '        "Content-Type": "application/json",\n        Accept: "text/html",',
              '        "Content-Type": "application/json",\n        Accept: "text/html",\n        "X-Octagon-Internal-Action": "ufc-source",',
          )

          cloudflare_anchor = '''      - name: Verify Cloudflare identity\n'''
          cloudflare_step = '''      - name: Publish UFC source transport token\n        shell: bash\n        run: |\n          set -euo pipefail\n          transport_token=$(printf 'octagon-ufc-source-v1:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | awk '{print $1}')\n          printf '%s' "$transport_token" | "$WRANGLER_BIN" secret put UFC_SOURCE_TRANSPORT_TOKEN --config "$GITHUB_WORKSPACE/wrangler.jsonc"\n\n'''
          replace(".github/workflows/deploy-cloudflare.yml", cloudflare_anchor, cloudflare_step + cloudflare_anchor)

          supabase_anchor = '''      - name: Apply database migrations\n'''
          supabase_step = '''      - name: Publish UFC source transport token\n        shell: bash\n        env:\n          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}\n          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}\n          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}\n        run: |\n          set -euo pipefail\n          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then\n            echo "::error title=Missing UFC transport seed::CLOUDFLARE_API_TOKEN is missing or empty."\n            exit 1\n          fi\n          transport_token=$(printf 'octagon-ufc-source-v1:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | awk '{print $1}')\n          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" UFC_SOURCE_TRANSPORT_TOKEN="$transport_token"\n\n'''
          replace(".github/workflows/deploy-supabase.yml", supabase_anchor, supabase_step + supabase_anchor)

          ui_helper_anchor = '''const scopeOptions: Array<{ value: PickSetupCardScope; label: string; note: string }> = ['''
          ui_helper = '''function visibleUfcSourceUrl(value: string | null) {\n  if (!value) return "";\n  try {\n    const url = new URL(value);\n    return url.protocol === "https:"\n      && /^(?:www\\.)?ufc\\.com$/i.test(url.hostname)\n      && /^\\/event\\/[a-z0-9-]+\\/?$/i.test(url.pathname)\n      ? value\n      : "";\n  } catch {\n    return "";\n  }\n}\n\n'''
          replace("src/features/picks-setup/PicksSetupPage.tsx", ui_helper_anchor, ui_helper + ui_helper_anchor)
          replace(
              "src/features/picks-setup/PicksSetupPage.tsx",
              '    setSourceUrl(draft.sourceUrl ?? "");',
              '    setSourceUrl(visibleUfcSourceUrl(draft.sourceUrl));',
          )
          replace(
              "src/features/picks-setup/PicksSetupPage.tsx",
              '        <p>CBS Sports supplies the event details, card sections, and fight order. Nothing becomes live until you publish it.</p>',
              '        <p>UFC.com supplies the event details, card sections, and fight order. Nothing becomes live until you publish it.</p>',
          )
          replace(
              "src/features/picks-setup/PicksSetupPage.tsx",
              '''            CBS SPORTS UFC EVENT URL (OPTIONAL)\n            <input\n              type="url"\n              aria-label="CBS SPORTS UFC EVENT URL (OPTIONAL) · MMA MANIA CARD URL (OPTIONAL)"''',
              '''            UFC.COM EVENT URL (OPTIONAL)\n            <input\n              type="url"\n              aria-label="UFC.COM EVENT URL (OPTIONAL)"''',
          )
          replace(
              "src/features/picks-setup/PicksSetupPage.tsx",
              '              placeholder="https://www.cbssports.com/ufc/event/..."',
              '              placeholder="https://www.ufc.com/event/..."',
          )
          PY

      - name: Commit corrective wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.ts supabase/functions/sync-next-ufc-event/index.ts src/features/picks-setup/PicksSetupPage.tsx .github/workflows/deploy-cloudflare.yml .github/workflows/deploy-supabase.yml
          git commit -m "Wire authenticated UFC source transport" || true
          git push origin HEAD:agent/restore-ufc-picks-source

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Bootstrap shared transport secret through GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing bootstrap secret::$name is missing or empty."
              exit 1
            fi
          done
          transport_token=$(printf 'octagon-ufc-source-v1:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | awk '{print $1}')
          printf '%s' "$transport_token" | npx --yes wrangler@4.123.0 secret put UFC_SOURCE_TRANSPORT_TOKEN --config wrangler.jsonc
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" UFC_SOURCE_TRANSPORT_TOKEN="$transport_token"
          echo "Shared UFC transport secret bootstrapped without exposing its value."
