name: Apply Picks Event Import Repair

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/repair-picks-event-import'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-picks-event-import
          fetch-depth: 1
      - name: Apply narrow source edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/sync-next-ufc-event/index.ts")
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one source match, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          replace_once(
              'import { adaptMmaManiaSource, adaptUfcSource, canonicalUfcEventFields } from "./sourceAdapters.ts";\n',
              'import { adaptMmaManiaSource, adaptUfcSource, canonicalUfcEventFields } from "./sourceAdapters.ts";\n'
              'import {\n'
              '  parseOfficialUfcSegmentTimes,\n'
              '  resolveImportedCardScope,\n'
              '  selectAndSequenceImportedBouts,\n'
              '  type CardScope,\n'
              '  type CardSection,\n'
              '  type EffectiveScope,\n'
              '} from "./importPolicy.ts";\n',
          )
          replace_once(
              'type CardScope = "auto" | "main" | "full";\n'
              'type EffectiveScope = "main" | "full";\n'
              'type CardSection = "main-event" | "main" | "prelim" | "early-prelim";\n',
              '',
          )
          replace_once(
              '  starts_at: string;\n  locks_at: string;\n  season: number;\n  normalized: NormalizedUfcEvent;\n',
              '  starts_at: string;\n  prelims_starts_at: string;\n  locks_at: string;\n  season: number;\n  normalized: NormalizedUfcEvent;\n',
          )
          replace_once(
              '  blue_fighter_name: string;\n  included: boolean;\n}\n\ninterface ParsedEvent {\n',
              '  blue_fighter_name: string;\n  included: boolean;\n  card_segment: "main" | "prelim";\n  segment_sequence: number;\n}\n\ninterface ParsedEvent {\n',
          )
          replace_once(
              '  starts_at: string;\n  locks_at: string;\n  season: number;\n  bouts: StagedBout[];\n',
              '  starts_at: string;\n  prelims_starts_at: string;\n  locks_at: string;\n  season: number;\n  bouts: StagedBout[];\n',
          )
          replace_once(
              '  const normalized = adaptUfcSource(html, sourceUrl, legacy);\n'
              '  return {\n'
              '    ...legacy,\n'
              '    ...canonicalUfcEventFields(normalized),\n'
              '    ufc_source_url: sourceUrl,\n'
              '    normalized,\n'
              '  };\n',
              '  const sourceNormalized = adaptUfcSource(html, sourceUrl, legacy);\n'
              '  const segmentTimes = parseOfficialUfcSegmentTimes(\n'
              '    bodyText,\n'
              '    sourceNormalized.startsAt || legacy.starts_at,\n'
              '    sourceNormalized.eventType === "numbered",\n'
              '    now,\n'
              '  );\n'
              '  const normalized = {\n'
              '    ...sourceNormalized,\n'
              '    startsAt: segmentTimes.mainCardStartsAt,\n'
              '    localEventDate: segmentTimes.localEventDate,\n'
              '  };\n'
              '  return {\n'
              '    ...legacy,\n'
              '    ...canonicalUfcEventFields(normalized),\n'
              '    prelims_starts_at: segmentTimes.prelimsStartsAt,\n'
              '    ufc_source_url: sourceUrl,\n'
              '    normalized,\n'
              '  };\n',
          )
          replace_once(
              'export function resolveCardScope(name: string, subtitle: string, requested: CardScope): EffectiveScope {\n'
              '  if (requested === "main" || requested === "full") return requested;\n'
              '  return /\\bUFC\\s+\\d{3,4}\\b/i.test(`${name} ${subtitle}`) ? "full" : "main";\n'
              '}\n\n'
              'function selectBouts(card: MmaManiaCard, scope: EffectiveScope) {\n'
              '  return card.bouts.filter((bout) => scope === "full" || bout.section === "main-event" || bout.section === "main");\n'
              '}\n\n'
              'function toStagedBouts(bouts: ParsedCardBout[]) {\n',
              'export function resolveCardScope(name: string, subtitle: string, requested: CardScope): EffectiveScope {\n'
              '  return resolveImportedCardScope(name, subtitle, requested);\n'
              '}\n\n'
              'function selectBouts(card: MmaManiaCard, scope: EffectiveScope) {\n'
              '  return selectAndSequenceImportedBouts(card.bouts, scope);\n'
              '}\n\n'
              'function toStagedBouts(bouts: ReturnType<typeof selectBouts>) {\n',
          )
          replace_once(
              '      blue_fighter_name: bout.blue_fighter_name,\n      included: true,\n',
              '      blue_fighter_name: bout.blue_fighter_name,\n      included: true,\n'
              '      card_segment: bout.card_segment,\n      segment_sequence: bout.segment_sequence,\n',
          )
          replace_once(
              '    ...canonicalMetadata,\n    source_url: card.sourceUrl,\n    subtitle,\n',
              '    ...canonicalMetadata,\n    source_url: card.sourceUrl,\n'
              '    prelims_starts_at: metadata.prelims_starts_at,\n    subtitle,\n',
          )
          replace_once(
              '      starts_at: event.starts_at,\n      locks_at: event.locks_at,\n',
              '      starts_at: event.starts_at,\n      prelims_starts_at: event.prelims_starts_at,\n'
              '      locks_at: event.locks_at,\n',
          )

          path.write_text(source)
          PY
          rm .github/agent/repair-picks-event-import.patch
          rm .github/workflows/apply-repair-picks-event-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Repair Picks event import source"
          git push origin HEAD:agent/repair-picks-event-import
