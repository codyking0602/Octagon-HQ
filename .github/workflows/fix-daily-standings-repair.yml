name: Fix Daily Standings Repair Guard

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-daily-standings-repair.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/repair-daily-standings-integration.yml')
          text = path.read_text()
          old_marker = "implementation_marker = dedent('''\\\n"
          old_replacement = "implementation_replacement = dedent('''\\\n"
          if text.count(old_marker) != 1 or text.count(old_replacement) != 1:
            raise SystemExit('repair guard owner changed')
          text = text.replace(old_marker, "implementation_marker = '''\\\n", 1)
          text = text.replace(old_replacement, "implementation_replacement = '''\\\n", 1)
          first_end = "              async loadDailyLeaderboard(day, scheduleVersion) {''')\n"
          second_end = "              async loadDailyLeaderboard(day, scheduleVersion) {''')\n"
          if text.count(first_end) != 2:
            raise SystemExit('repair guard closing points changed')
          text = text.replace(first_end, "              async loadDailyLeaderboard(day, scheduleVersion) {'''\n", 2)
          path.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/repair-daily-standings-integration.yml
          git commit -m "Preserve repository method indentation"
          git push origin HEAD:feature/daily-challenge-standings
