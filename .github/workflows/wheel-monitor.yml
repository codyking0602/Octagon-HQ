name: Wheel Monitor Read-Only (staged)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/wheel-monitor/**'
      - '.github/workflows/wheel-monitor.yml'
  push:
    branches: [main]
    paths:
      - "scripts/wheel-monitor/**"
      - ".github/workflows/wheel-monitor.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: wheel-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --silent --no-audit --no-fund
      - run: node --check scripts/wheel-monitor/run.mjs
      - run: node --test scripts/wheel-monitor/*.nodecheck.mjs
  # One manual dispatch builds all four independently sourced observations
  # in parallel. No cron is enabled while owner and source holds remain.
  source_coach:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/wheel-nfl-coach-current-review.yml
  source_performance:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/wheel-nfl-cross-source-review.yml
  source_gm:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/wheel-gm-contract-review.yml
  source_ufc:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/wheel-ufc-unranked-profile-review.yml
    secrets: inherit
  monitor:
    if: always() && needs.verify.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [verify, source_coach, source_performance, source_gm, source_ufc]
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      SUPABASE_PROJECT_ID: rvbspcjvebgwqzssayts
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent --no-audit --no-fund
      - name: Verify conservative classifications
        run: node --test scripts/wheel-monitor/*.nodecheck.mjs
      - name: Restore last verified complete snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/wheel-monitor/previous
          # A successful *report-only* run has no promoted snapshot.
          # Query named artifacts directly; do not assume the newest green run
          # produced a checkpoint. Ignore expired and non-main artifacts.
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=wheel-monitor-snapshot&per_page=100" \
            > tmp/wheel-monitor/previous/artifacts.json
          id=$(node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {selectLatestCheckpointArtifact} from "./scripts/wheel-monitor/checkpoint-policy.mjs";
            const payload=JSON.parse(readFileSync("tmp/wheel-monitor/previous/artifacts.json","utf8"));
            process.stdout.write(String(selectLatestCheckpointArtifact(payload.artifacts)?.workflow_run.id ?? ""));
          ')
          if [[ -n "$id" ]]; then
            gh run download "$id" --name wheel-monitor-snapshot --dir tmp/wheel-monitor/previous
            echo "PREVIOUS_SNAPSHOT=tmp/wheel-monitor/previous/snapshot.json" >> "$GITHUB_ENV"
          else
            echo "PREVIOUS_SNAPSHOT=" >> "$GITHUB_ENV"
          fi
      - name: Restore latest ungraded observation (not a certified snapshot)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/wheel-monitor/observation-previous
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=wheel-monitor-observation&per_page=100" \
            > tmp/wheel-monitor/observation-previous/artifacts.json
          id=$(node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {selectLatestObservationArtifact} from "./scripts/wheel-monitor/checkpoint-policy.mjs";
            const payload=JSON.parse(readFileSync("tmp/wheel-monitor/observation-previous/artifacts.json","utf8"));
            process.stdout.write(String(selectLatestObservationArtifact(payload.artifacts)?.workflow_run.id ?? ""));
          ')
          if [[ -n "$id" ]]; then
            gh run download "$id" --name wheel-monitor-observation --dir tmp/wheel-monitor/observation-previous
            echo "PREVIOUS_OBSERVATION=tmp/wheel-monitor/observation-previous/observation.json" >> "$GITHUB_ENV"
          else
            echo "PREVIOUS_OBSERVATION=" >> "$GITHUB_ENV"
          fi
      - name: Restore only exact-main successful staged source reports
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/wheel-monitor/staged
          # Absence is a mandatory certification blocker, not a collection
          # failure. No stale/PR/other-SHA artifact is allowed to certify.
          while IFS='|' read -r artifact workflow; do
            [[ -n "$artifact" ]] || continue
            candidates=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact&per_page=100")
            run_id=$(jq -r --arg sha "$GITHUB_SHA" --arg name "$artifact" '
              [.artifacts[] | select(.name == $name and .expired == false and
                .workflow_run.head_sha == $sha and
                .workflow_run.head_branch == "main")] |
              sort_by(.created_at) | reverse | .[0].workflow_run.id // empty
            ' <<<"$candidates")
            [[ -n "$run_id" ]] || continue
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            eligible=$(jq -r --arg sha "$GITHUB_SHA" --arg wf "$workflow" '
              .head_sha == $sha and .head_branch == "main" and
              .name == $wf and .event == "workflow_dispatch" and
              .status == "completed" and .conclusion == "success"
            ' <<<"$run")
            [[ "$eligible" == "true" ]] || continue
            folder="tmp/wheel-monitor/staged/$artifact"
            mkdir -p "$folder"
            if gh run download "$run_id" --name "$artifact" --dir "$folder"; then
              jq -n --arg artifactName "$artifact" --arg workflowName "$workflow" \
                --arg headSha "$GITHUB_SHA" --arg completedAt "$(jq -r .updated_at <<<"$run")" \
                --argjson runId "$run_id" '{
                  artifactName:$artifactName,workflowName:$workflowName,
                  headSha:$headSha,completedAt:$completedAt,runId:$runId,
                  headBranch:"main",status:"completed",conclusion:"success",
                  event:"workflow_dispatch"
                }' > "$folder/provenance.json"
            else
              rm -rf "$folder"
              echo "::warning::Could not retrieve $artifact; certification stays blocked."
            fi
          done <<'STAGED'
          wheel-nfl-current-coach-evidence|Wheel NFL Official Current Coach Evidence (staged)
          wheel-nfl-cross-source-evidence|Wheel NFL Cross-Source Evidence (staged)
          wheel-gm-contract-source-review|Wheel GM Contract Source Review (staged)
          wheel-ufc-unranked-profile-evidence|Wheel UFC Unranked Profile Evidence (staged)
          STAGED
      - name: Download reports from this same monitoring run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: false
          path: tmp/wheel-monitor/staged
      - name: Bind same-run evidence to successful independent source jobs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RESULT_COACH: ${{ needs.source_coach.result }}
          RESULT_PERFORMANCE: ${{ needs.source_performance.result }}
          RESULT_GM: ${{ needs.source_gm.result }}
          RESULT_UFC: ${{ needs.source_ufc.result }}
        run: |
          set -euo pipefail
          # No provenance receipt for skipped/failed source stages; a partial
          # upload can never silently become authoritative.
          while IFS='|' read -r kind artifact workflow file; do
            case "$kind" in
              coach) result="$RESULT_COACH" ;;
              performance) result="$RESULT_PERFORMANCE" ;;
              gm) result="$RESULT_GM" ;;
              ufc) result="$RESULT_UFC" ;;
            esac
            folder="tmp/wheel-monitor/staged/$artifact"
            if [[ "$result" != "success" || ! -f "$folder/$file" ]]; then
              echo "::notice::$kind staged source absent/failed: mandatory hold retained."
              continue
            fi
            jq -n --arg artifactName "$artifact" --arg workflowName "$workflow" \
              --arg headSha "$GITHUB_SHA" --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson runId "$GITHUB_RUN_ID" '{
                artifactName:$artifactName,workflowName:$workflowName,
                headSha:$headSha,completedAt:$completedAt,runId:$runId,
                headBranch:"main",status:"completed",conclusion:"success",
                event:"workflow_dispatch"
              }' > "$folder/provenance.json"
          done <<'STAGED'
          coach|wheel-nfl-current-coach-evidence|Wheel NFL Official Current Coach Evidence (staged)|current-coaches.json
          performance|wheel-nfl-cross-source-evidence|Wheel NFL Cross-Source Evidence (staged)|cross-source-review.json
          gm|wheel-gm-contract-source-review|Wheel GM Contract Source Review (staged)|comparison.json
          ufc|wheel-ufc-unranked-profile-evidence|Wheel UFC Unranked Profile Evidence (staged)|unranked-profiles.json
          STAGED
      - name: Collect and reconcile required NFL/UFC populations
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Missing existing SUPABASE_ACCESS_TOKEN; cannot verify coverage."
            exit 1
          fi
          node scripts/wheel-monitor/run.mjs \
            --previous="$PREVIOUS_SNAPSHOT" \
            --previous-observation="$PREVIOUS_OBSERVATION" \
            --stage-evidence-dir=tmp/wheel-monitor/staged \
            --out=tmp/wheel-monitor/current
          if [[ -f tmp/wheel-monitor/current/snapshot.json ]]; then
            echo "snapshot_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Report-only run: review blockers prevent snapshot promotion."
          fi
      - name: Report checkpoints and blockers
        if: always()
        shell: bash
        run: |
          if [[ -f tmp/wheel-monitor/current/report.json ]]; then
            head -c 16000 tmp/wheel-monitor/current/report.json
          fi
          if [[ -f tmp/wheel-monitor/current/failure.json ]]; then
            cat tmp/wheel-monitor/current/failure.json
          fi
      - name: Preserve review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-monitor-run-report
          path: |
            tmp/wheel-monitor/current/report.json
            tmp/wheel-monitor/current/failure.json
          if-no-files-found: warn
          retention-days: 30
      - name: Archive ungraded observation after fully successful source collection
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wheel-monitor-observation
          path: tmp/wheel-monitor/current/observation.json
          if-no-files-found: error
          retention-days: 45
      - name: Promote only fully verified source snapshot
        if: steps.collect.outputs.snapshot_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wheel-monitor-snapshot
          path: tmp/wheel-monitor/current/snapshot.json
          if-no-files-found: error
          retention-days: 90
