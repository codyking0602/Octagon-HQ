name: Temporary remaining Play thumbnail importer

on:
  push:
    branches:
      - chatgpt/play-thumbnail-completeness

permissions:
  contents: write

jobs:
  import-thumbnails:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/play-thumbnail-completeness
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Create remaining thumbnails
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import io
          import os
          import urllib.request
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFilter, ImageFont, ImageOps

          records = [
              {
                  "slug": "katlyn-chookagian",
                  "name": "Katlyn Chookagian",
                  "espnName": "Katlyn Cerminara",
                  "espnId": "4026490",
              },
              {
                  "slug": "joshua-culibao",
                  "name": "Joshua Culibao",
                  "espnName": "Josh Culibao",
                  "espnId": "4616087",
              },
          ]

          root = Path.cwd()
          output_dir = root / "public/assets/fighters"
          tmp_dir = root / "tmp"
          output_dir.mkdir(parents=True, exist_ok=True)
          tmp_dir.mkdir(exist_ok=True)

          def get_bytes(url: str) -> bytes:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; OctagonHQAssetAudit/1.0)",
                      "Accept": "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
                      "Referer": "https://www.espn.com/",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          def expanded_alpha_crop(image: Image.Image) -> Image.Image:
              rgba = ImageOps.exif_transpose(image).convert("RGBA")
              alpha = rgba.getchannel("A")
              bbox = alpha.getbbox()
              if not bbox or bbox == (0, 0, rgba.width, rgba.height):
                  return rgba
              left, top, right, bottom = bbox
              pad_x = max(4, round((right - left) * 0.08))
              pad_y = max(4, round((bottom - top) * 0.06))
              return rgba.crop((
                  max(0, left - pad_x),
                  max(0, top - pad_y),
                  min(rgba.width, right + pad_x),
                  min(rgba.height, bottom + pad_y),
              ))

          def make_thumbnail(source: bytes) -> Image.Image:
              with Image.open(io.BytesIO(source)) as opened:
                  image = expanded_alpha_crop(opened)
              alpha = image.getchannel("A")
              if alpha.getextrema()[0] < 255:
                  fitted = ImageOps.contain(image, (154, 154), Image.Resampling.LANCZOS)
                  canvas = Image.new("RGBA", (160, 160), (0, 0, 0, 0))
                  canvas.alpha_composite(fitted, ((160 - fitted.width) // 2, max(2, 158 - fitted.height)))
                  result = canvas
              else:
                  result = ImageOps.fit(image, (160, 160), Image.Resampling.LANCZOS, centering=(0.5, 0.42))
              return result.filter(ImageFilter.UnsharpMask(radius=0.55, percent=70, threshold=3))

          rendered = []
          for record in records:
              image_url = f"https://a.espncdn.com/i/headshots/mma/players/full/{record['espnId']}.png"
              profile_url = f"https://www.espn.com/mma/fighter/_/id/{record['espnId']}/" + record["espnName"].lower().replace(" ", "-")
              source = get_bytes(image_url)
              if len(source) < 3000:
                  raise RuntimeError(f"Unexpectedly small ESPN image for {record['name']}")
              thumb = make_thumbnail(source)
              output = output_dir / f"{record['slug']}-thumb.webp"
              thumb.save(output, "WEBP", quality=88, method=6)
              if output.stat().st_size < 2500:
                  raise RuntimeError(f"Unexpectedly small WebP for {record['name']}")
              record["profileUrl"] = profile_url
              record["imageUrl"] = image_url
              record["bytes"] = output.stat().st_size
              rendered.append((record["name"], thumb.copy()))

          docs_path = root / "docs/play-thumbnail-sources.md"
          docs = docs_path.read_text(encoding="utf-8").rstrip()
          for record in records:
              docs += f"\n- **{record['name']}** — [ESPN fighter profile]({record['profileUrl']}) · [source headshot]({record['imageUrl']})"
          docs_path.write_text(docs + "\n", encoding="utf-8")

          sheet = Image.new("RGB", (420, 220), (12, 12, 14))
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 16)
          for index, (name, thumb) in enumerate(rendered):
              x = index * 210
              draw.rounded_rectangle((x + 8, 8, x + 202, 212), radius=18, fill=(27, 27, 30), outline=(78, 78, 84), width=2)
              preview = Image.new("RGBA", (168, 168), (8, 8, 10, 255))
              preview.alpha_composite(thumb, (4, 4))
              sheet.paste(preview.convert("RGB"), (x + 21, 14))
              width = draw.textlength(name, font=font)
              draw.text((x + (210 - width) / 2, 188), name, font=font, fill=(245, 245, 247))
          sheet.save(tmp_dir / "play-thumbnail-missing-two-contact-sheet.jpg", quality=90, optimize=True)
          (tmp_dir / "play-thumbnail-missing-two-run-id.txt").write_text(os.environ["GITHUB_RUN_ID_VALUE"], encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: play-thumbnail-missing-two-audit
          path: tmp/play-thumbnail-missing-two-contact-sheet.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Commit remaining assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/fighters/katlyn-chookagian-thumb.webp public/assets/fighters/joshua-culibao-thumb.webp docs/play-thumbnail-sources.md tmp/play-thumbnail-missing-two-run-id.txt
          git commit -m "Add remaining Play fighter thumbnails" || exit 0
          git push origin HEAD:chatgpt/play-thumbnail-completeness
