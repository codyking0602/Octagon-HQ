name: Complete Ankalaev-Guskov Event

on:
  push:
    branches:
      - ops/complete-ankalaev-guskov-event
    paths:
      - .github/workflows/complete-ankalaev-guskov-event.yml
      - scripts/complete-ankalaev-guskov-event.mjs
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/complete-ankalaev-guskov-event.yml
      - scripts/complete-ankalaev-guskov-event.mjs

permissions:
  contents: read

concurrency:
  group: complete-ankalaev-guskov-event
  cancel-in-progress: false

jobs:
  complete:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V2_PROJECT_REF: rvbspcjvebgwqzssayts
      V2_SUPABASE_URL: https://rvbspcjvebgwqzssayts.supabase.co
      COMPLETION_REPORT: /tmp/ankalaev-guskov-completion.json
      COMPLETION_LOG: /tmp/ankalaev-guskov-completion.log

    steps:
      - name: Check out exact operational head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Resolve V2 service credential without printing it
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing Supabase management credential::SUPABASE_ACCESS_TOKEN is unavailable."
            exit 1
          fi
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${V2_PROJECT_REF}/api-keys")
          service_key=$(printf '%s' "$response" | jq -r '[.[] | select(.name == "service_role" or .name == "secret") | (.api_key // .key // empty)] | map(select(length > 0)) | first // empty')
          if [ -z "$service_key" ]; then
            echo "::error title=Service credential unavailable::No V2 service credential was returned."
            exit 1
          fi
          echo "::add-mask::$service_key"
          printf 'V2_SERVICE_ROLE_KEY=%s\n' "$service_key" >> "$GITHUB_ENV"

      - name: Complete exact recovered event
        shell: bash
        run: |
          set -euo pipefail
          node scripts/complete-ankalaev-guskov-event.mjs 2>&1 | tee "$COMPLETION_LOG"
          test -s "$COMPLETION_REPORT"

      - name: Upload one-day completion proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ankalaev-guskov-completion-${{ github.sha }}
          path: |
            /tmp/ankalaev-guskov-completion.json
            /tmp/ankalaev-guskov-completion.log
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0

      - name: Record exact completion boundary
        if: success()
        shell: bash
        run: |
          {
            echo "### Ankalaev-Guskov event completed"
            echo "- Exact operational source SHA: \`${GITHUB_SHA}\`"
            echo "- Recovered Cody and Shane selections were unchanged"
            echo "- Five official winners and one cancellation were recorded"
            echo "- Existing result and lifecycle RPCs performed every mutation"
            echo "- Cody: 4-1, 16 points"
            echo "- Shane: 3-2, 12 points"
            echo "- Second pass made zero mutations"
            echo "- No active event remained after completion"
            echo "- Unrelated V2 rows remained unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary runner files
        if: always()
        shell: bash
        run: rm -f "$COMPLETION_REPORT" "$COMPLETION_LOG"
