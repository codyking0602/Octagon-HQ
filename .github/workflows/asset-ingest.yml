name: Asset Ingest

on:
  push:
    paths:
      - '.asset-ingest/*.json'

permissions:
  contents: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow rembg onnxruntime
      - name: Process queued assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.asset-ingest/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No manifests."
            exit 0
          fi
          for manifest in "${files[@]}"; do
            python scripts/asset_ingest.py "$manifest"
            rm "$manifest"
          done
      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/fighters .asset-ingest
          git commit -m "Generate approved fighter assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
