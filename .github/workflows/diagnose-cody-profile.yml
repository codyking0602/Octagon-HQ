name: Diagnose CODY Profile

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-cody-profile.yml"
      - "scripts/diagnose-cody-profile.mjs"
      - "supabase/migrations/202607280001_pin_auth_status.sql"
      - "supabase/functions/pin-auth/**"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Inspect CODY without reading or testing the PIN
        run: node scripts/diagnose-cody-profile.mjs
