name: Prepare Sep 26 UFC fighter assets

on:
  push:
    branches:
      - chatgpt/ufc-prep-sep26-assets

permissions:
  contents: write

jobs:
  build-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ufc-prep-sep26-assets
          fetch-depth: 1

      - name: Resolve image tooling
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            echo "IMAGE_TOOL=magick" >> "$GITHUB_ENV"
          elif command -v convert >/dev/null 2>&1; then
            echo "IMAGE_TOOL=convert" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            echo "IMAGE_TOOL=convert" >> "$GITHUB_ENV"
          fi

      - name: Download real fighter photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ufc-prep-sources
          fetch() {
            local slug="$1"
            local url="$2"
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent "Mozilla/5.0" \
              --output ".ufc-prep-sources/$slug" "$url"
            test -s ".ufc-prep-sources/$slug"
          }

          fetch raul-rosas-jr.png 'https://gidstats.com/img/fighters/0/0/1-1596.png'
          fetch raoni-barcelos.png 'https://cbssports.cbsistatic.com/ufc/public-files/f18ee6e5-c1d5-496f-91e6-4b555940345b/BARCELOS_RAONI_R_06-14.png?gender=m&stance=r'
          fetch rodolfo-vieira.png 'https://gidstats.ru/img/fighters/460/700/1-341.png'
          fetch robert-bryczek.png 'https://gidstats.ru/img/fighters/460/700/1-1085.png'
          fetch brady-hiestand.png 'https://gidstats.com/img/fighters/460/700/1-472.png'
          fetch rinya-nakamura.webp 'https://www.neweracap.jp/cdn/shop/articles/br-mma-561618_1024x.webp?v=1748262234'
          fetch mehemmedeli-osmanli.jpg 'https://pbs.twimg.com/media/Gwo02kKWQAA33KY.jpg'
          fetch ilimbek-akylbek.jpg 'https://cdn-1.aki.kg/cdn-st-0/qi0/F/en-891042.1776244308.b.jpg'
          fetch melissa-amaya.jpg 'https://thumb.spokesman.com/QQdu-DUfe69zlQwD43Lq_LBOG-g%3D/2500x1875/smart/media.spokesman.com/photos/2025/06/18/68534e632a5e4.hires.jpg'
          fetch valesca-machado.png 'https://www.ufc.com/images/styles/athlete_bio_full_body/s3/2021-10/71799%252Fprofile-galery%252Ffullbodyright-picture%252FMACHADO_VALESCA_R.png?itok=NgaE-BgX'
          fetch josiah-harrell.png 'https://gidstats.com/img/fighters/0/0/2-1096.png'
          fetch elves-brener.png 'https://gidstats.com/img/fighters/0/0/1-1357.png'

          for file in .ufc-prep-sources/*; do
            identify "$file" >/dev/null
          done

      - name: Create canonical WebP assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/fighters
          image() {
            local slug="$1"
            local source="$2"

            # Preserve the existing approved Rosas thumb; only create missing thumbs.
            if [ ! -f "public/assets/fighters/$slug-thumb.webp" ]; then
              "$IMAGE_TOOL" "$source" \
                -auto-orient \
                -thumbnail '160x160^' \
                -gravity center \
                -extent 160x160 \
                -unsharp '0x0.6+0.6+0.02' \
                -quality 88 \
                "public/assets/fighters/$slug-thumb.webp"
            fi

            "$IMAGE_TOOL" "$source" \
              -auto-orient \
              -thumbnail '626x800>' \
              -gravity center \
              -background white \
              -extent 626x800 \
              -unsharp '0x0.6+0.6+0.02' \
              -quality 88 \
              "public/assets/fighters/$slug-spotlight.webp"

            identify "public/assets/fighters/$slug-thumb.webp"
            identify "public/assets/fighters/$slug-spotlight.webp"
          }

          image raul-rosas-jr .ufc-prep-sources/raul-rosas-jr.png
          image raoni-barcelos .ufc-prep-sources/raoni-barcelos.png
          image rodolfo-vieira .ufc-prep-sources/rodolfo-vieira.png
          image robert-bryczek .ufc-prep-sources/robert-bryczek.png
          image brady-hiestand .ufc-prep-sources/brady-hiestand.png
          image rinya-nakamura .ufc-prep-sources/rinya-nakamura.webp
          image mehemmedeli-osmanli .ufc-prep-sources/mehemmedeli-osmanli.jpg
          image ilimbek-akylbek .ufc-prep-sources/ilimbek-akylbek.jpg
          image melissa-amaya .ufc-prep-sources/melissa-amaya.jpg
          image valesca-machado .ufc-prep-sources/valesca-machado.png
          image josiah-harrell .ufc-prep-sources/josiah-harrell.png
          image elves-brener .ufc-prep-sources/elves-brener.png

      - name: Commit assets and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ufc-prep-sources
          rm -f .github/workflows/prepare-ufc-sep26-assets.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/fighters .github/workflows/prepare-ufc-sep26-assets.yml
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "UFC Prep: add Sep 26 fighter assets"
          git push origin HEAD:chatgpt/ufc-prep-sep26-assets
