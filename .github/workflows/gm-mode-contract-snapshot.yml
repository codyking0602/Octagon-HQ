name: GM Mode contract snapshot calibration

on:
  push:
    branches:
      - gm-mode-contract-economics
    paths:
      - scripts/generate-gm-mode-nfl-contracts.mjs
      - data/generated/football/wheel-football-priorities.json
      - .github/workflows/gm-mode-contract-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate current contract universe
        run: node scripts/generate-gm-mode-nfl-contracts.mjs
      - name: Show coverage
        run: |
          node -e "const x=require('./data/generated/football/gm-mode-nfl-contracts-2026.json'); console.log(x.expectedCanonicalPlayerIdentities, x.counts)"
      - uses: actions/upload-artifact@v4
        with:
          name: gm-mode-contract-snapshot
          path: data/generated/football/gm-mode-nfl-contracts-2026.json
          if-no-files-found: error
