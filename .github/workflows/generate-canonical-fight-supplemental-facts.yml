name: Generate Canonical UFCStats Fight Facts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/update-canonical-fight-supplemental-facts.mjs
      - .github/workflows/generate-canonical-fight-supplemental-facts.yml
      - src/features/rankings/data/generated/canonical-fight-supplemental-facts.json
      - src/features/rankings/data/canonicalFightSupplementalFactsSnapshot.ts
      - src/features/rankings/data/canonicalFightSupplementalFactsSnapshot.test.ts
      - src/features/rankings/data/rankingInputs.ts
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  UFCSTATS_REPOSITORY: Greco1899/scrape_ufc_stats
  UFCSTATS_COMMIT: 8e40eb945e1127bf0ef172ab211a34787948f312

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact checked-out SHA
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Exact SHA checkout failed::Expected $SOURCE_SHA but checked out $checked_out_sha."
            exit 1
          fi

      - name: Set up Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Download pinned UFCStats extract
        run: |
          mkdir -p "$RUNNER_TEMP/ufcstats"
          base="https://raw.githubusercontent.com/$UFCSTATS_REPOSITORY/$UFCSTATS_COMMIT"
          for file in \
            ufc_event_details.csv \
            ufc_fight_details.csv \
            ufc_fight_results.csv \
            ufc_fight_stats.csv
          do
            curl --fail --silent --show-error --location \
              "$base/$file" \
              --output "$RUNNER_TEMP/ufcstats/$file"
            test -s "$RUNNER_TEMP/ufcstats/$file"
          done

      - name: Generate UFCStats fight-fact snapshot
        env:
          CHECKED_AT: "2026-08-18"
          UFCSTATS_SOURCE_DIR: ${{ runner.temp }}/ufcstats
          UFCSTATS_SOURCE_REPOSITORY: ${{ env.UFCSTATS_REPOSITORY }}
          UFCSTATS_SOURCE_COMMIT: ${{ env.UFCSTATS_COMMIT }}
          UFCSTATS_OUTPUT: ${{ runner.temp }}/canonical-fight-supplemental-facts.json
        run: node scripts/update-canonical-fight-supplemental-facts.mjs

      - name: Compare committed snapshot
        if: ${{ hashFiles('src/features/rankings/data/generated/canonical-fight-supplemental-facts.json') != '' }}
        run: |
          cmp \
            src/features/rankings/data/generated/canonical-fight-supplemental-facts.json \
            "$RUNNER_TEMP/canonical-fight-supplemental-facts.json"

      - name: Upload generated snapshot
        uses: actions/upload-artifact@v4
        with:
          name: canonical-fight-supplemental-facts-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/canonical-fight-supplemental-facts.json
          if-no-files-found: error
          retention-days: 7
