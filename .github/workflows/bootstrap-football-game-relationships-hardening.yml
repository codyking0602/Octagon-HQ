name: Bootstrap Football Game Relationship Hardening

on:
  push:
    branches:
      - feature/football-knowledge-nonplayer-game-relationships-v6

permissions:
  contents: write

jobs:
  harden-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/football-knowledge-nonplayer-game-relationships-v6
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Harden sparse CFB championship semantics
        run: node scripts/tmp-harden-football-game-relationships.mjs
      - name: Regenerate relationship corpora
        run: node scripts/import-football-game-relationships.mjs
      - name: Commit hardened corpus and remove bootstrap files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/generated/football/relationships/*.json
          git add scripts/import-football-game-relationships.mjs public/data/football/football-game-relationships.source-manifest.json src/features/back-room/footballGameRelationshipsSource.test.ts
          git rm scripts/tmp-harden-football-game-relationships.mjs .github/workflows/bootstrap-football-game-relationships-hardening.yml
          git commit -m "Harden CFB championship relationship semantics"
          git push origin HEAD:feature/football-knowledge-nonplayer-game-relationships-v6
