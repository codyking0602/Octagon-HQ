name: Verify PIN Authentication Success

on:
  pull_request:
    paths:
      - ".github/workflows/verify-pin-auth-success.yml"
      - "scripts/verify-pin-preview.mjs"
      - "supabase/functions/pin-auth/**"
      - "supabase/migrations/**"
      - "src/features/identity/**"
      - "src/lib/supabase.ts"
      - "scripts/build-supabase-proxy.mjs"
      - "wrangler.jsonc"

permissions:
  contents: read

jobs:
  verify-success:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify direct PIN login through the live branch preview
        run: node scripts/verify-pin-preview.mjs
