name: CFB Who Am I Batch 3 Preflight

on:
  push:
    branches:
      - chatgpt/cfb-whoami-101-150-curation

permissions:
  contents: read

concurrency:
  group: cfb-whoami-batch3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- src/features/games/whoAmICfbBatch3Audit.test.ts --reporter=verbose
