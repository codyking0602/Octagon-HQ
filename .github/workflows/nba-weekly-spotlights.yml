name: NBA Weekly Spotlight Auto-Publisher

on:
  schedule:
    # Collect official video feeds daily near 5 AM Central; Tuesday publication and daily recovery.
    # GitHub can delay scheduled jobs; eligibility uses actual Central date, not exact 5 AM.
    - cron: '0 10,11 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nba-weekly-spotlights.yml'
      - 'scripts/generate-nba-weekly-spotlight.mjs'
      - 'scripts/generate-nba-weekly-spotlight.fixtures.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-weekly-spotlights.yml'
      - 'scripts/nba-weekly-clock.mjs'
      - 'scripts/nba-weekly-clock.fixtures.mjs'
      - 'scripts/generate-nba-weekly-spotlight.fixtures.mjs'
      - 'scripts/generate-nba-weekly-spotlight.mjs'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: nba-weekly-editorial
  cancel-in-progress: false

jobs:
  research-validate-publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # Need full ancestry to merge advancing main safely.
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Determine Central publication window without skipping delayed runs
        id: clock
        run: node scripts/nba-weekly-clock.mjs
      - name: Restore growing official YouTube video catalog
        if: steps.clock.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .nba-weekly-video-cache.json
          key: nba-weekly-youtube-${{ github.run_id }}
          restore-keys: nba-weekly-youtube-
      - name: Collect fresh videos from the official @NBA YouTube channel
        if: steps.clock.outputs.run == 'true'
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: node scripts/generate-nba-weekly-spotlight.mjs --collect-only
      - name: Retain official videos for upcoming verified weekly picks
        if: steps.clock.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: .nba-weekly-video-cache.json
          key: nba-weekly-youtube-${{ github.run_id }}
      - name: Verify weekly selection using offline ESPN and YouTube fixtures
        if: steps.clock.outputs.publish == 'true'
        run: node --test scripts/nba-weekly-clock.fixtures.mjs scripts/generate-nba-weekly-spotlight.fixtures.mjs
      - name: Install official YouTube archive metadata reader for keyless catch-up
        if: steps.clock.outputs.publish == 'true'
        run: python -m pip install --disable-pip-version-check --quiet yt-dlp
      - name: Gather last complete week's NBA results and verified YouTube highlights
        if: steps.clock.outputs.publish == 'true'
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: node scripts/generate-nba-weekly-spotlight.mjs
      - name: Reject falsely green overdue weekly content
        if: steps.clock.outputs.publish == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { finishedWeek } from "./scripts/generate-nba-weekly-spotlight.mjs";
          const expected = finishedWeek().weekEnd;
          const actual = JSON.parse(fs.readFileSync("public/nba-weekly/active.json", "utf8")).weekEnd;
          if (actual !== expected) {
            console.error(`::error::NBA weekly publication overdue: expected ${expected}, found ${actual}`);
            process.exit(1);
          }
          console.log(`Verified NBA weekly publication for ${expected}`);
          NODE
      - name: Propose verified weekly editorial update
        if: steps.clock.outputs.publish == 'true'
        id: propose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- public/nba-weekly/active.json; then
            echo "No new verified NBA weekly package"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha=$(git rev-parse HEAD)
          week=$(node -e 'console.log(require("./public/nba-weekly/active.json").weekEnd)')
          branch="bot/nba-weekly-${week}-${GITHUB_RUN_ID}"
          git config user.name "octagon-weekly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/nba-weekly/active.json "data/generated/nba/weekly-${week}.json"
          git commit -m "Publish sourced NBA player and team spotlights for ${week}"
          head_sha=$(git rev-parse HEAD)
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "Weekly NBA spotlights · ${week}" --body "Unattended editorial publication. ESPN completed game box scores and directly matched official @NBA YouTube highlights. Fail closed on unverifiable sources. Auto-merge only after exact-head Validate V2 passes.")
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "pr=$url" >> "$GITHUB_OUTPUT"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh advancing main, validate exact head, and merge only when green
        if: steps.propose.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.propose.outputs.branch }}
          PR_URL: ${{ steps.propose.outputs.pr }}
        run: |
          set -euo pipefail
          # Main changes frequently. Each change invalidates prior verification.
          # Incorporate the new base and rerun exact-head Validate V2.
          for attempt in $(seq 1 5); do
            git fetch origin main
            expected_main=$(git rev-parse origin/main)
            if ! git merge-base --is-ancestor "$expected_main" HEAD; then
              echo "Main advanced; safely merging current main before another exact-head validation (attempt $attempt)."
              git merge --no-edit origin/main || {
                echo "::error::NBA weekly conflict with advancing main; PR retained for review."
                exit 1
              }
              git push origin "HEAD:refs/heads/$BRANCH"
            fi
            head_sha=$(git rev-parse HEAD)
            actual=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
            [[ "$actual" == "$head_sha" ]] || {
              echo "::error::NBA weekly PR head unexpectedly changed."
              exit 1
            }
            gh workflow run validate.yml --ref "$BRANCH"
            id=""
            for i in $(seq 1 90); do
              id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?branch=$BRANCH&event=workflow_dispatch&per_page=20" |
                jq -r --arg sha "$head_sha" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .id // empty')
              [[ -n "$id" ]] && break
              sleep 8
            done
            [[ -n "$id" ]] || { echo "::error::Missing exact-head NBA weekly validation run"; exit 1; }
            validated=false
            for i in $(seq 1 170); do
              result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" | jq -r '.status + " " + (.conclusion // "")')
              if [[ "$result" == "completed success" ]]; then validated=true; break; fi
              if [[ "$result" == completed* ]]; then
                echo "::error::Exact NBA weekly validation not green: $result ($id)"
                exit 1
              fi
              sleep 10
            done
            [[ "$validated" == true ]] || { echo "::error::NBA weekly validation timed out"; exit 1; }
            latest_main=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ "$latest_main" != "$expected_main" ]]; then
              echo "Main advanced during validation; invalidating old pass and retrying."
              continue
            fi
            latest_head=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
            [[ "$latest_head" == "$head_sha" ]] || { echo "::error::PR head moved after validation"; exit 1; }
            gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$head_sha"
            echo "Verified exact-head NBA weekly package merged after $attempt attempt(s)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done
          echo "::error::Main kept advancing; leave NBA weekly PR open and fail rather than merging an unverified head."
          exit 1
      - name: Dispatch Cloudflare deployment for the exact merged commit
        if: steps.propose.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.propose.outputs.pr }}
        run: |
          set -euo pipefail
          merged=$(gh pr view "$PR_URL" --json mergeCommit --jq .mergeCommit.oid)
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ -z "$merged" || "$merged" != "$main_sha" ]]; then
            echo "::error::Main moved before exact deployment; no unverified claims."
            exit 1
          fi
          # GITHUB_TOKEN merges do not trigger regular push workflows.
          gh workflow run deploy-cloudflare.yml --ref main
          id=""
          for i in $(seq 1 60); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-cloudflare.yml/runs?event=workflow_dispatch&per_page=10" |
              jq -r --arg sha "$merged" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .id // empty')
            [[ -n "$id" ]] && break
            sleep 8
          done
          [[ -n "$id" ]] || { echo "::error::No exact merged deployment run"; exit 1; }
          for i in $(seq 1 140); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" | jq -r '.status + " " + (.conclusion // "")')
            if [[ "$result" == "completed success" ]]; then
              echo "Deployed and verified NBA weekly content at $merged" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$result" == completed* ]]; then echo "::error::Cloudflare deployment: $result"; exit 1; fi
            sleep 10
          done
          echo "::error::Exact Cloudflare delivery timed out"; exit 1

  verified-source-probe:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install keyless official NBA YouTube metadata reader
        run: python -m pip install --disable-pip-version-check --quiet yt-dlp
      - name: Verify NBA official archive source and ESPN end to end without publishing
        run: |
          node --test scripts/nba-weekly-clock.fixtures.mjs scripts/generate-nba-weekly-spotlight.fixtures.mjs
          node scripts/generate-nba-weekly-spotlight.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { finishedWeek } from "./scripts/generate-nba-weekly-spotlight.mjs";
          const data=JSON.parse(fs.readFileSync("public/nba-weekly/active.json","utf8"));
          if(data.weekEnd!==finishedWeek().weekEnd || data.player.highlightSourceChannelId!=="UCWJ2lWNubArHWmf3FIHbfcQ")
            throw Error("Keyless official NBA weekly source probe did not produce a fully verified current package");
          console.log("Verified current NBA spotlight:",data.weekEnd,data.player.name,data.team.name,data.player.highlightUrl);
          NODE
