name: Deploy Cloudflare Frontend

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact same-repository PR head SHA to deploy.
        required: true
        type: string
      pr_number:
        description: Open pull request number whose head must still match source_sha.
        required: true
        type: string
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "wrangler.jsonc"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: octagon-hq-cloudflare-production
  cancel-in-progress: false

jobs:
  resolve-public-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Supabase configuration credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is missing or empty."
              exit 1
            fi
          done

      - name: Resolve public Supabase browser configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          api_keys_file="$RUNNER_TEMP/supabase-api-keys.json"
          trap 'rm -f "$api_keys_file"' EXIT

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" \
            --output "$api_keys_file"

          public_config_dir="$RUNNER_TEMP/octagon-public-config"
          mkdir -p "$public_config_dir"

          node - "$api_keys_file" "$public_config_dir/octagon-public-config.env" <<'NODE'
          const fs = require('fs');
          const keys = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const publicKey = keys.find((key) => key.type === 'publishable')
            ?? keys.find((key) => key.type === 'legacy' && /anon/i.test(key.name ?? ''));
          const projectId = process.env.SUPABASE_PROJECT_ID;
          if (!/^[a-z0-9-]+$/.test(projectId ?? '')) throw new Error('Invalid Supabase project ID.');
          if (!publicKey?.api_key) throw new Error('No public browser key was returned.');
          fs.writeFileSync(process.argv[3], [
            `VITE_SUPABASE_URL=https://${projectId}.supabase.co`,
            `VITE_SUPABASE_PUBLISHABLE_KEY=${publicKey.api_key}`,
            `VITE_EXPECTED_SUPABASE_HOSTNAME=${projectId}.supabase.co`,
            '',
          ].join('\n'), { mode: 0o600 });
          NODE
          echo "Public browser configuration file resolved without checking out PR code or creating secret-derived job outputs."

      - name: Upload short-lived public browser configuration
        uses: actions/upload-artifact@v4
        with:
          name: octagon-public-config-${{ github.run_id }}
          path: ${{ runner.temp }}/octagon-public-config/octagon-public-config.env
          if-no-files-found: error
          retention-days: 1

  build-production-artifact:
    needs: resolve-public-config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SOURCE_PR_NUMBER: ${{ inputs.pr_number || '0' }}
    steps:
      - name: Revalidate requested PR head
        if: env.SOURCE_PR_NUMBER != '0'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          PR_NUMBER: ${{ env.SOURCE_PR_NUMBER }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedSha = process.env.EXPECTED_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== "open") {
              core.setFailed(`PR #${prNumber} is no longer open.`);
              return;
            }

            if (pr.base.ref !== "main") {
              core.setFailed(`PR #${prNumber} targets ${pr.base.ref}, not main.`);
              return;
            }

            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`PR #${prNumber} is not a same-repository pull request.`);
              return;
            }

            if (pr.head.sha !== expectedSha) {
              core.setFailed(
                `PR #${prNumber} moved from ${expectedSha} to ${pr.head.sha}. Reapply the deploy-frontend label to deploy the new head.`,
              );
            }

      - name: Check out exact application source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Exact SHA checkout failed::Expected $SOURCE_SHA but checked out $checked_out_sha."
            exit 1
          fi
          echo "Exact application source verified: $checked_out_sha"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install application dependencies
        run: npm install --silent

      - name: Download verified public browser configuration
        uses: actions/download-artifact@v4
        with:
          name: octagon-public-config-${{ github.run_id }}
          path: .public-config

      - name: Stamp exact deployment SHA
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          fs.writeFileSync(
            "public/deployment.json",
            `${JSON.stringify({ sha: process.env.SOURCE_SHA })}\n`,
          );
          NODE

      - name: Build production frontend without administrative credentials
        shell: bash
        run: |
          set -euo pipefail
          config_file="$GITHUB_WORKSPACE/.public-config/octagon-public-config.env"
          trap 'rm -rf "$GITHUB_WORKSPACE/.public-config"' EXIT
          test -s "$config_file"
          set -a
          . "$config_file"
          set +a
          npm run build 2>&1 | tee cloudflare-build.log
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/deployment.json
          grep -Fq "Cache-Control: no-cache" dist/_headers
          node --input-type=module - "$SOURCE_SHA" <<'NODE'
          import fs from "node:fs";
          const expectedSha = process.argv[2];
          const marker = JSON.parse(fs.readFileSync("dist/deployment.json", "utf8"));
          if (marker.sha !== expectedSha) {
            throw new Error(`Expected deployment marker ${expectedSha}, received ${marker.sha}`);
          }
          NODE
          grep -FRq "overscroll-behavior:contain" dist/assets/*.css
          grep -FRq "identity-overlay--viewport" dist/assets/*.js
          grep -FRq "NO PROFILE FOUND WITH THAT EXACT NAME" dist/assets/*.js
          grep -FRq "SIGN IN TO CHALLENGE" dist/assets/*.js
          grep -FRq "SIGN IN TO YOUR HQ" dist/assets/*.js
          grep -FRq "SIGN IN TO MAKE PICKS" dist/assets/*.js
          grep -FRq "vite:preloadError" dist/assets/*.js
          grep -FRq "list_my_find_leader_history" dist/assets/*.js
          grep -FRq "set_my_favorite_fighter" dist/assets/*.js
          grep -FRq "get_current_pick_event" dist/assets/*.js
          grep -FRq "save_my_event_pick" dist/assets/*.js
          echo "Production artifact contains the exact SHA marker and all current profile contracts."

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-diagnostics-${{ env.SOURCE_SHA }}
          path: cloudflare-build.log
          retention-days: 7

      - name: Upload exact production artifact
        uses: actions/upload-artifact@v4
        with:
          name: octagon-frontend-${{ env.SOURCE_SHA }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  deploy-production-artifact:
    needs:
      - resolve-public-config
      - build-production-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SOURCE_PR_NUMBER: ${{ inputs.pr_number || '0' }}
      OCTAGON_PRODUCTION_URL: https://octagon.hq-app.workers.dev
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Revalidate requested PR head before production credentials
        if: env.SOURCE_PR_NUMBER != '0'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          PR_NUMBER: ${{ env.SOURCE_PR_NUMBER }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedSha = process.env.EXPECTED_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== "open") {
              core.setFailed(`PR #${prNumber} is no longer open.`);
              return;
            }

            if (pr.base.ref !== "main") {
              core.setFailed(`PR #${prNumber} targets ${pr.base.ref}, not main.`);
              return;
            }

            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`PR #${prNumber} is not a same-repository pull request.`);
              return;
            }

            if (pr.head.sha !== expectedSha) {
              core.setFailed(
                `PR #${prNumber} moved from ${expectedSha} to ${pr.head.sha}. Reapply the deploy-frontend label to deploy the new head.`,
              );
            }

      - name: Check out trusted deployment configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TRUSTED_WORKFLOW_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            wrangler.jsonc
          sparse-checkout-cone-mode: false

      - name: Verify trusted deployment configuration source
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$TRUSTED_WORKFLOW_SHA" ]; then
            echo "::error title=Trusted workflow checkout failed::Expected $TRUSTED_WORKFLOW_SHA but checked out $checked_out_sha."
            exit 1
          fi
          test -f wrangler.jsonc
          echo "Trusted deployment configuration verified: $checked_out_sha"

      - name: Download exact production artifact
        uses: actions/download-artifact@v4
        with:
          name: octagon-frontend-${{ env.SOURCE_SHA }}
          path: dist

      - name: Download verified public browser configuration
        uses: actions/download-artifact@v4
        with:
          name: octagon-public-config-${{ github.run_id }}
          path: .public-config

      - name: Verify downloaded artifact SHA
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/_worker.js
          test -f dist/.assetsignore
          test -f dist/deployment.json
          grep -Fxq "_worker.js" dist/.assetsignore
          node --input-type=module - "$SOURCE_SHA" <<'NODE'
          import fs from "node:fs";
          const expectedSha = process.argv[2];
          const marker = JSON.parse(fs.readFileSync("dist/deployment.json", "utf8"));
          if (marker.sha !== expectedSha) {
            throw new Error(`Expected downloaded artifact ${expectedSha}, received ${marker.sha}`);
          }
          NODE
          echo "Exact production artifact verified: $SOURCE_SHA"

      - name: Set up trusted Wrangler runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install trusted Wrangler outside the application artifact
        shell: bash
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/octagon-wrangler"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          npm init --yes --silent >/dev/null
          npm install --silent --ignore-scripts wrangler@4
          wrangler_bin="$tool_dir/node_modules/.bin/wrangler"
          test -x "$wrangler_bin"
          echo "WRANGLER_BIN=$wrangler_bin" >> "$GITHUB_ENV"

      - name: Check Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is missing or empty."
              exit 1
            fi
          done

      - name: Verify Cloudflare identity
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$WRANGLER_BIN" whoami 2>&1 | tee wrangler-whoami.log

      - name: Deploy exact artifact with trusted configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$WRANGLER_BIN" deploy --config "$GITHUB_WORKSPACE/wrangler.jsonc" 2>&1 | tee wrangler-deploy.log

      - name: Upload Wrangler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-deploy-diagnostics-${{ env.SOURCE_SHA }}
          path: |
            wrangler-whoami.log
            wrangler-deploy.log
          retention-days: 7

      - name: Verify exact live frontend and profile-backed Picks
        shell: bash
        run: |
          set -euo pipefail
          config_file="$GITHUB_WORKSPACE/.public-config/octagon-public-config.env"
          trap 'rm -rf "$GITHUB_WORKSPACE/.public-config"' EXIT
          test -s "$config_file"
          set -a
          . "$config_file"
          set +a
          live_assets_dir="$RUNNER_TEMP/octagon-live-assets"
          bundle_file="$RUNNER_TEMP/octagon-all-live.js"
          shell_headers="$RUNNER_TEMP/octagon-shell-headers.txt"
          live_marker="$RUNNER_TEMP/octagon-deployment.json"
          markers=(
            "SIGN IN"
            "identity-overlay--viewport"
            "NO PROFILE FOUND WITH THAT EXACT NAME"
            "SIGN IN TO CHALLENGE"
            "SIGN IN TO YOUR HQ"
            "SIGN IN TO MAKE PICKS"
            "vite:preloadError"
            "list_my_find_leader_history"
            "set_my_favorite_fighter"
            "get_current_pick_event"
            "save_my_event_pick"
          )

          verify_live_assets() {
            local attempt="$1"
            local found_assets=0
            local missing_marker=""

            rm -rf "$live_assets_dir"
            mkdir -p "$live_assets_dir"

            if ! curl --fail --silent --show-error \
              --header "Cache-Control: no-cache" \
              --dump-header "$shell_headers" \
              --output "$RUNNER_TEMP/octagon-shell.html" \
              "${OCTAGON_PRODUCTION_URL}/?deployment=${SOURCE_SHA}&attempt=${attempt}"; then
              echo "The live SPA shell is not available yet."
              return 1
            fi

            if ! grep -Fiq "cache-control: no-cache" "$shell_headers"; then
              echo "The live SPA shell is missing the required no-cache policy."
              return 1
            fi

            if ! curl --fail --silent --show-error \
              --header "Cache-Control: no-cache" \
              "${OCTAGON_PRODUCTION_URL}/deployment.json?deployment=${SOURCE_SHA}&attempt=${attempt}" \
              --output "$live_marker"; then
              echo "The live exact-SHA marker is not available yet."
              return 1
            fi

            if ! node --input-type=module --eval '
              import fs from "node:fs";
              const [markerPath, expectedSha] = process.argv.slice(1);
              const marker = JSON.parse(fs.readFileSync(markerPath, "utf8"));
              if (marker.sha !== expectedSha) process.exit(1);
            ' "$live_marker" "$SOURCE_SHA"; then
              echo "The live deployment marker does not match $SOURCE_SHA yet."
              return 1
            fi

            for local_asset in dist/assets/*.js; do
              asset_name=$(basename "$local_asset")
              live_asset="$live_assets_dir/$asset_name"

              if ! curl --fail --silent --show-error \
                --header "Cache-Control: no-cache" \
                "${OCTAGON_PRODUCTION_URL}/assets/${asset_name}?deployment=${SOURCE_SHA}&attempt=${attempt}" \
                --output "$live_asset"; then
                echo "Live asset $asset_name is not available yet."
                return 1
              fi

              if grep -Fqi "<!doctype html" "$live_asset"; then
                echo "Live asset $asset_name still resolves to the SPA fallback."
                return 1
              fi

              found_assets=$((found_assets + 1))
            done

            if [ "$found_assets" -lt 1 ]; then
              echo "No JavaScript assets were available for verification."
              return 1
            fi

            cat "$live_assets_dir"/*.js > "$bundle_file"

            if ! grep -Fq "$VITE_EXPECTED_SUPABASE_HOSTNAME" "$bundle_file"; then
              echo "Live bundle is missing the expected Supabase project hostname."
              return 1
            fi

            if ! grep -Fq "$VITE_SUPABASE_PUBLISHABLE_KEY" "$bundle_file"; then
              echo "Live bundle is missing the validated public Supabase key."
              return 1
            fi

            if grep -Fq "your-project-id" "$bundle_file" || grep -Fq "your-publishable-key" "$bundle_file"; then
              echo "Live bundle contains forbidden placeholder Supabase configuration."
              return 1
            fi

            for marker in "${markers[@]}"; do
              if ! grep -Fq "$marker" "$bundle_file"; then
                missing_marker="$marker"
                break
              fi
            done

            if [ -n "$missing_marker" ]; then
              echo "Live bundle is not current yet; missing marker: $missing_marker"
              return 1
            fi

            return 0
          }

          verified=0
          for attempt in $(seq 1 12); do
            if verify_live_assets "$attempt"; then
              verified=1
              break
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Waiting for Cloudflare asset propagation (attempt $attempt of 12)..."
              sleep 5
            fi
          done

          if [ "$verified" -ne 1 ]; then
            echo "::error title=Live frontend verification failed::Exact SHA $SOURCE_SHA did not become the verified production build after 12 attempts."
            exit 1
          fi

          echo "Live Worker exactly matches $SOURCE_SHA and contains profile-backed UFC Picks plus automatic stale-chunk recovery."

      - name: Record deployment
        shell: bash
        run: |
          {
            echo "### Octagon HQ frontend deployed"
            echo "- Worker: octagon"
            echo "- Production URL: $OCTAGON_PRODUCTION_URL"
            echo "- Exact source SHA: \`$SOURCE_SHA\`"
            if [ "$SOURCE_PR_NUMBER" != "0" ]; then
              echo "- Source PR: #$SOURCE_PR_NUMBER"
            else
              echo "- Source event: $GITHUB_EVENT_NAME"
            fi
            echo "- PR application code built in a job with no administrative deployment credentials"
            echo "- Deployment used only the verified artifact, trusted workflow revision, and trusted Wrangler runtime"
            echo "- Exact live deployment marker and all production chunks were verified"
            echo "- Supabase browser configuration was resolved without printing administrative credentials"
            echo "- Challenge Center uses authenticated profiles and exact-name delivery"
            echo "- Your HQ uses profile history, Picks record, canonical favorite fighter data, and cached challenge rows"
            echo "- Picks uses the public current event and authenticated cross-device profile selections"
            echo "- Stale lazy chunks trigger one guarded reload instead of the React Router developer error screen"
            echo "- The SPA shell is served with Cache-Control: no-cache"
          } >> "$GITHUB_STEP_SUMMARY"
