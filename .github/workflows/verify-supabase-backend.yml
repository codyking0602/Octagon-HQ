name: Verify Supabase Backend

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-private-auction-preview:
    if: github.head_ref == 'fix/auction-private-preview-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/auction-private-preview-proof
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply focused private-Auction preview repair
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/octagon-private-preview"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"
          cd "$target"
          git checkout "$TARGET_BRANCH"

          python - <<'PY'
          from pathlib import Path

          model = Path("worker/previewModel.ts")
          text = model.read_text()
          old = (
              "  return staticGameChallenge(requestUrl, catalog) ?? DEFAULT_PREVIEW;\n"
              "}\n"
          )
          new = (
              "  if (requestUrl.pathname === \"/play/auction\" || requestUrl.pathname === \"/play/auction/\") {\n"
              "    return DEFAULT_PREVIEW;\n"
              "  }\n\n"
              "  return staticGameChallenge(requestUrl, catalog) ?? DEFAULT_PREVIEW;\n"
              "}\n"
          )
          if old not in text:
              if new not in text:
                  raise SystemExit("preview fallback anchor missing")
          else:
              model.write_text(text.replace(old, new, 1))

          test_file = Path("worker/previewModel.test.ts")
          test_text = test_file.read_text()
          import_anchor = 'import { describe, expect, it } from "vitest";\n'
          extra_import = 'import { ensureDestinationPreview } from "./previewCard";\n'
          if extra_import not in test_text:
              test_text = test_text.replace(import_anchor, import_anchor + extra_import, 1)

          test_anchor = '  it("renders only the completed public Auction result", () => {\n'
          addition = (
              '  it("routes private or unavailable Auctions through the canonical private card", () => {\n'
              '    const url = new URL(\n'
              '      "https://octagon.hq-app.workers.dev/play/auction?auction=123e4567-e89b-42d3-a456-426614174000",\n'
              '    );\n'
              '    const unresolved = resolveRichPreview(url, catalog);\n'
              '    expect(unresolved.kind).toBe("default");\n\n'
              '    const preview = ensureDestinationPreview(url, unresolved);\n'
              '    expect(preview).toMatchObject({\n'
              '      kind: "auction",\n'
              '      title: "Private Auction | Octagon HQ",\n'
              '      canonicalPath: "/play/auction?auction=123e4567-e89b-42d3-a456-426614174000",\n'
              '    });\n'
              '    expect(preview.description).toContain("Sign in as a participant");\n'
              '    expect(JSON.stringify(preview)).not.toMatch(/bid|rarity|formula|grade|deck|bankroll/i);\n'
              '  });\n\n'
          )
          if addition not in test_text:
              if test_anchor not in test_text:
                  raise SystemExit("preview test anchor missing")
              test_text = test_text.replace(test_anchor, addition + test_anchor, 1)
          test_file.write_text(test_text)
          PY

          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/verify-supabase-backend.yml
          git rm .github/workflows/repair-auction-private-preview-once.yml
          git diff --check HEAD
          test "$(git diff --name-only HEAD | wc -l | tr -d ' ')" = "4"

          npm install --no-package-lock --ignore-scripts
          npx vitest run worker/previewModel.test.ts worker/previewCard.test.ts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/verify-supabase-backend.yml \
            worker/previewModel.ts \
            worker/previewModel.test.ts
          git commit -m "Use the private Auction preview before completion"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
