name: Monitor CFB Wheel AP Top 25

on:
  workflow_dispatch:
  schedule:
    - cron: "15 21 * * 0"
    - cron: "15 15 * * 1"

permissions:
  contents: read

concurrency:
  group: octagon-hq-wheel-cfb-ap-top25-monitor
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Compare current AP Top 25 with Wheel authority
        run: node scripts/check-wheel-cfb-ap-top25.mjs
