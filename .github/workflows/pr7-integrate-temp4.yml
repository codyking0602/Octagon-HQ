name: PR7 temporary integration runner

on:
  push:
    branches:
      - tmp-pr7-integrate-run4

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-pr7-integrate-run4
          fetch-depth: 0
      - name: Materialize authoritative PR7 data
        run: python3 scripts/pr7-stage/integrate-pr7.py
      - name: Commit materialized output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/back-room/footballPersonIdentityKnowledge.ts \
                  src/features/back-room/footballPersonIdentityKnowledge.test.ts \
                  docs/who-am-i-pr7-nfl-b-person-identity-audit.md
          git commit -m "Materialize PR7 NFL B-tier person identity knowledge"
          git push origin HEAD:tmp-pr7-integrate-run4
