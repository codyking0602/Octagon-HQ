name: Temporary materialize CFB coach relationships

on:
  pull_request:
    types: [reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'feature/cfb-coach-relationships'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cfb-coach-relationships
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical relationship corpora
        run: node scripts/import-football-game-relationships.mjs
      - name: Commit generated CFB coach corpora and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/generated/football/relationships/cfb-coach-seasons-2002-2025.json \
            data/generated/football/relationships/cfb-coach-stints-2002-2025.json \
            data/generated/football/relationships/football-game-relationships.manifest.json \
            data/generated/football/relationships/football-game-relationships.coverage.json
          git rm .github/workflows/_tmp-materialize-cfb-coach-relationships.yml
          git diff --cached --quiet && { echo 'No generated diff'; exit 1; }
          git commit -m "data: materialize CFB coach relationships"
          git push origin HEAD:feature/cfb-coach-relationships
