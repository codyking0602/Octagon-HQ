name: Apply challenge formatting cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'chatgpt/challenge-member-picker-mobile-nav'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Clean generated JSX formatting
        run: python .github/challenge-format-cleanup.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies without creating a lockfile
        run: npm install --silent --no-package-lock

      - name: Verify cleanup
        run: |
          npm run typecheck
          npx vitest run src/features/challenges/ChallengeMemberPicker.test.ts src/app/mobileChallengeExperience.contract.test.ts

      - name: Commit clean implementation head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean challenge member picker formatting"
          git push origin HEAD:chatgpt/challenge-member-picker-mobile-nav
