name: Repair Sep 26 UFC portrait thumbs

on:
  push:
    branches:
      - chatgpt/ufc-sep26-assets-odds-fix

permissions:
  contents: write

jobs:
  repair-portrait-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ufc-sep26-assets-odds-fix
          fetch-depth: 1

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow "rembg[cpu]" onnxruntime

      - name: Download verified portrait sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ufc-portrait-src/espn .ufc-portrait-src/barcelos

          fetch() {
            local output="$1"
            local url="$2"
            curl --fail --location --retry 4 --retry-delay 2               --user-agent "Mozilla/5.0"               --output "$output" "$url"
            test -s "$output"
          }

          # ESPN canonical MMA headshots: tight transparent head-and-shoulders portraits.
          fetch .ufc-portrait-src/espn/raoni-barcelos.png 'https://a.espncdn.com/i/headshots/mma/players/full/3075570.png'
          fetch .ufc-portrait-src/espn/rodolfo-vieira.png 'https://a.espncdn.com/i/headshots/mma/players/full/4426250.png'
          fetch .ufc-portrait-src/espn/robert-bryczek.png 'https://a.espncdn.com/i/headshots/mma/players/full/4341572.png'
          fetch .ufc-portrait-src/espn/brady-hiestand.png 'https://a.espncdn.com/i/headshots/mma/players/full/4815974.png'
          fetch .ufc-portrait-src/espn/rinya-nakamura.png 'https://a.espncdn.com/i/headshots/mma/players/full/5068624.png'
          fetch .ufc-portrait-src/espn/valesca-machado.png 'https://a.espncdn.com/i/headshots/mma/players/full/4836549.png'
          fetch .ufc-portrait-src/espn/josiah-harrell.png 'https://a.espncdn.com/i/headshots/mma/players/full/5149546.png'
          fetch .ufc-portrait-src/espn/elves-brener.png 'https://a.espncdn.com/i/headshots/mma/players/full/5110006.png'

          # Separately verified current Raoni Barcelos UFC render for Spotlight.
          fetch .ufc-portrait-src/barcelos/raoni-barcelos.png 'https://gidstats.ru/img/fighters/0/0/2-296.png'

      - name: Build portrait thumbs and corrected Barcelos Spotlight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          from rembg import new_session, remove

          out = Path('public/assets/fighters')
          espn = Path('.ufc-portrait-src/espn')

          def alpha_crop(im):
              im = im.convert('RGBA')
              alpha = im.getchannel('A')
              box = alpha.getbbox()
              if not box:
                  raise RuntimeError('image has no visible subject')
              return im.crop(box)

          def fit(im, size, pad=8):
              im = alpha_crop(im)
              width, height = size
              max_w = width - pad * 2
              max_h = height - pad * 2
              scale = min(max_w / im.width, max_h / im.height)
              nw = max(1, round(im.width * scale))
              nh = max(1, round(im.height * scale))
              im = im.resize((nw, nh), Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=0.45, percent=35, threshold=2))
              canvas = Image.new('RGBA', size, (0, 0, 0, 0))
              x = (width - nw) // 2
              y = height - pad - nh
              canvas.alpha_composite(im, (x, y))
              return canvas

          # Use ESPN portrait photography for every Sep. 26 fighter ESPN covers.
          espn_slugs = [
              'raoni-barcelos','rodolfo-vieira','robert-bryczek','brady-hiestand',
              'rinya-nakamura','valesca-machado','josiah-harrell','elves-brener',
          ]
          for slug in espn_slugs:
              source = Image.open(espn / f'{slug}.png').convert('RGBA')
              extrema = source.getchannel('A').getextrema()
              if extrema[0] >= 255:
                  raise RuntimeError(f'{slug} ESPN source is not transparent: {extrema}')
              fit(source, (320, 320), pad=6).save(
                  out / f'{slug}-thumb.webp', 'WEBP', quality=94, method=6
              )

          # Newcomers do not yet have ESPN headshots. Their existing Spotlight files
          # are verified real fighter photography; turn only the upper portion into
          # a face/shoulders thumb instead of shrinking the full body into the tile.
          newcomer_slugs = ['mehemmedeli-osmanli','ilimbek-akylbek','melissa-amaya']
          for slug in newcomer_slugs:
              source = Image.open(out / f'{slug}-spotlight.webp').convert('RGBA')
              alpha = source.getchannel('A')
              l, t, r, b = alpha.getbbox()
              subject_h = b - t
              portrait_bottom = min(b, round(t + subject_h * 0.55))
              portrait = source.crop((l, t, r, portrait_bottom))
              fit(portrait, (320, 320), pad=6).save(
                  out / f'{slug}-thumb.webp', 'WEBP', quality=94, method=6
              )

          # Replace the incorrect Barcelos Spotlight source with a verified Barcelos render.
          raw = Path('.ufc-portrait-src/barcelos/raoni-barcelos.png').read_bytes()
          cut = remove(raw, session=new_session('u2net'))
          cutout_path = Path('.ufc-portrait-src/barcelos/raoni-barcelos-cut.png')
          cutout_path.write_bytes(cut)
          barcelos = Image.open(cutout_path).convert('RGBA')
          extrema = barcelos.getchannel('A').getextrema()
          if extrema[0] >= 255:
              raise RuntimeError(f'Barcelos Spotlight background removal failed: {extrema}')
          fit(barcelos, (626, 800), pad=10).save(
              out / 'raoni-barcelos-spotlight.webp', 'WEBP', quality=94, method=6
          )
          PY

      - name: Verify canonical assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          thumbs = [
              'raoni-barcelos','rodolfo-vieira','robert-bryczek','brady-hiestand',
              'rinya-nakamura','mehemmedeli-osmanli','ilimbek-akylbek','melissa-amaya',
              'valesca-machado','josiah-harrell','elves-brener',
          ]
          for slug in thumbs:
              path = Path('public/assets/fighters') / f'{slug}-thumb.webp'
              im = Image.open(path).convert('RGBA')
              assert im.size == (320, 320), (slug, im.size)
              extrema = im.getchannel('A').getextrema()
              assert extrema[0] < 255, (slug, extrema)
              box = im.getchannel('A').getbbox()
              assert box, (slug, box)
              print(path, im.size, extrema, box)

          spotlight = Path('public/assets/fighters/raoni-barcelos-spotlight.webp')
          im = Image.open(spotlight).convert('RGBA')
          assert im.size == (626, 800), im.size
          extrema = im.getchannel('A').getextrema()
          assert extrema[0] < 255, extrema
          print(spotlight, im.size, extrema, im.getchannel('A').getbbox())
          PY

      - name: Commit repaired portrait assets and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ufc-portrait-src
          rm -f .github/workflows/repair-ufc-sep26-portrait-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/fighters .github/workflows/repair-ufc-sep26-portrait-assets.yml
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "UFC Picks: correct Sep 26 portrait thumbs and Barcelos Spotlight"
          git push origin HEAD:chatgpt/ufc-sep26-assets-odds-fix
