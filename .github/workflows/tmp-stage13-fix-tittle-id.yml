name: Temporary Stage 13 Fix Tittle Identity

on:
  push:
    branches:
      - stage13-6-finish-nfl-qb

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Correct Tittle canonical subject id
        run: sed -i 's/nfl-y-a-tittle/nfl-ya-tittle/g' src/features/back-room/footballFactualStatsExpansion.ts
      - run: npm run generate:football-cfb-player-seasons && npm run generate:football-factual-universe && npm run generate:football-ledger-audit
      - name: Commit canonical correction, generated audit, and self-clean
        run: |
          rm .github/workflows/tmp-stage13-fix-tittle-id.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/back-room/footballFactualStatsExpansion.ts docs/football-ledger-stage13-5-review.md .github/workflows/tmp-stage13-fix-tittle-id.yml
          git commit -m 'Correct Tittle canonical factual identity'
          git push origin HEAD:stage13-6-finish-nfl-qb
