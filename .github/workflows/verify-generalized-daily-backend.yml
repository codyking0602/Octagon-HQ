name: Verify Generalized Daily Backend

on:
  pull_request:
    paths:
      - ".github/workflows/verify-generalized-daily-backend.yml"
      - "scripts/bundle-daily-challenge-runtime.mjs"
      - "scripts/verify-generalized-daily-concurrency.sh"
      - "src/features/play/dailyRuntimeBundle.ts"
      - "src/features/play/todaysChallengeRuntime.ts"
      - "src/features/play/todaysChallengeRuntime.test.ts"
      - "src/features/play/footballTodayChallengeRuntime.ts"
      - "src/features/play/footballTodayChallengeSession.ts"
      - "src/features/play/hitTheNumberDailyRuntime.ts"
      - "src/features/play/hitTheNumberDailyRuntime.test.ts"
      - "src/features/play/whoAmIDailyRuntime.ts"
      - "src/features/play/whoAmIDailyRuntime.test.ts"
      - "src/features/games/whoAmIEngine.ts"
      - "src/features/games/ufcWhoAmIAuthority.ts"
      - "src/features/games/footballWhoAmIAuthority.ts"
      - "src/features/games/whoAmIAuthorityShared.ts"
      - "supabase/config.toml"
      - "supabase/functions/daily-challenge-runtime/**"
      - "supabase/migrations/202609050001_generalized_todays_challenge_backend.sql"
      - "supabase/migrations/202609050002_generalized_todays_challenge_grader_compat.sql"
      - "supabase/migrations/202609060001_daily_challenge_runtime_progress.sql"
      - "supabase/migrations/202609080001_activate_daily_challenge_rotation.sql"
      - "supabase/migrations/202609090001_calibrate_wavelength_scoring.sql"
      - "supabase/migrations/202609140003_allow_wavelength_v2_publication.sql"
      - "supabase/migrations/202612310025_hit_the_number_daily_runtime.sql"
      - "supabase/migrations/202612310026_blind_resume_v3_daily_runtime.sql"
      - "supabase/migrations/202612310027_blind_resume_v3_publication.sql"
      - "supabase/migrations/202612310028_activate_six_game_daily_rotation.sql"
      - "supabase/migrations/202612310031_hit_the_number_daily_formats.sql"
      - "supabase/migrations/202612310034_allow_daily_rank_keep_combo_publication.sql"
      - "supabase/migrations/202612310035_daily_rank_keep_combo_rotation.sql"
      - "supabase/migrations/202612310040_hit_the_number_price_is_right_scoring.sql"
      - "supabase/migrations/202612310052_football_daily_challenge_persistence.sql"
      - "supabase/migrations/202612310081_football_daily_midday_release.sql"
      - "supabase/migrations/202612310069_reroll_august_30_daily_double.sql"
      - "supabase/migrations/202612310092_who_am_i_daily_runtime.sql"
      - "supabase/migrations/202612310093_future_daily_schedule.sql"
      - "supabase/migrations/202612310094_repair_football_daily_cutover.sql"
      - "supabase/migrations/202612310095_home_hq_cross_sport_streak.sql"
      - "supabase/tests/generalized_todays_challenge_backend.sql"
      - "supabase/tests/daily_challenge_runtime_progress.sql"
      - "supabase/tests/daily_challenge_rotation.sql"
      - "supabase/tests/daily_challenge_60_day_rotation.sql"
      - "supabase/tests/wavelength_score_calibration.sql"
      - "supabase/tests/hit_the_number_daily_runtime.sql"
      - "supabase/tests/blind_resume_v3_daily_runtime.sql"
      - "supabase/tests/football_daily_challenge_persistence.sql"
      - "supabase/tests/home_hq_cross_sport_streak.sql"
      - "supabase/tests/who_am_i_daily_runtime.sql"
      - "supabase/tests/future_daily_schedule.sql"
      - "supabase/tests/generalized_todays_challenge_legacy_seed.sql"
      - "supabase/tests/generalized_todays_challenge_legacy_assert.sql"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Supabase Backend
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  fresh-and-legacy-database-proof:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout and clean patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA...$SOURCE_SHA"
          else
            git diff --check HEAD^..HEAD
          fi

      - name: Install runtime bundler dependencies
        run: npm install --silent --ignore-scripts

      - name: Generate canonical daily runtime bundle
        run: node scripts/bundle-daily-challenge-runtime.mjs

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start isolated fresh Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/daily-challenge-runtime/runtime.generated.mjs

          isolated_functions="$RUNNER_TEMP/non-daily-edge-functions"
          mkdir -p "$isolated_functions"
          find supabase/functions -mindepth 1 -maxdepth 1 -type d \
            ! -name daily-challenge-runtime \
            ! -name _shared \
            -exec mv {} "$isolated_functions"/ \;

          cat > supabase/config.toml <<'EOF'
          project_id = "octagon-hq"

          [functions.daily-challenge-runtime]
          verify_jwt = false
          EOF

          supabase start
          db_url=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          if [ -z "$db_url" ]; then
            echo "::error title=Local database unavailable::Supabase did not report DB_URL."
            exit 1
          fi
          echo "DB_URL=$db_url" >> "$GITHUB_ENV"

      - name: Execute daily runtime Edge Function locally
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/daily-runtime-local.json"
          status=""
          for attempt in $(seq 1 90); do
            status=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"mode":"deployment-info"}' \
              "http://127.0.0.1:54321/functions/v1/daily-challenge-runtime" || true)
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 1
          done

          if [ "$status" != "200" ]; then
            supabase status || true
            echo "::error title=Daily runtime did not start::Expected HTTP 200 from the local deployment-info path, received ${status:-none}."
            exit 1
          fi
          grep -Fq '"deployment_sha":"daily-challenge-runtime-v1"' "$response_file"

      - name: Execute generalized SQL, RPC, RLS, scoring, DST, and replay proof
        shell: bash
        run: psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/generalized_todays_challenge_backend.sql

      - name: Execute deterministic rotation and fallback release proof
        shell: bash
        run: psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/daily_challenge_rotation.sql

      - name: Execute six-game 60-day rotation proof
        shell: bash
        run: psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/daily_challenge_60_day_rotation.sql

      - name: Execute calibrated Wavelength scoring and publication proof
        shell: bash
        run: psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/wavelength_score_calibration.sql

      - name: Execute Hit the Number scoring and supported-game proof
        shell: bash
        run: psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/hit_the_number_daily_runtime.sql

      - name: Execute Blind Resume V3 staged scoring and publication proof
        shell: bash
        run: psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/blind_resume_v3_daily_runtime.sql

      - name: Execute Who Am I Daily scoring and supported-game proof
        shell: bash
        run: psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/who_am_i_daily_runtime.sql

      - name: Execute Stage 11 future schedule and standings proof
        shell: bash
        run: psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/future_daily_schedule.sql

      - name: Execute progressive reveal, cross-device progress, and scheduler proof
        shell: bash
        run: psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/daily_challenge_runtime_progress.sql

      - name: Execute Football sport-scoped persistence and competition proof
        shell: bash
        run: psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/football_daily_challenge_persistence.sql

      - name: Execute Home HQ cross-sport streak proof
        shell: bash
        run: psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/home_hq_cross_sport_streak.sql

      - name: Execute realistic legacy-data migration and idempotency proof
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/generalized_todays_challenge_legacy_seed.sql
          for pass in 1 2; do
            echo "Reapplying generalized daily migrations for idempotency pass $pass"
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202609050001_generalized_todays_challenge_backend.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202609050002_generalized_todays_challenge_grader_compat.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202609060001_daily_challenge_runtime_progress.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202609080001_activate_daily_challenge_rotation.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202609090001_calibrate_wavelength_scoring.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202609140003_allow_wavelength_v2_publication.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202612310025_hit_the_number_daily_runtime.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202612310026_blind_resume_v3_daily_runtime.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202612310027_blind_resume_v3_publication.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202612310028_activate_six_game_daily_rotation.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202612310031_hit_the_number_daily_formats.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202612310034_allow_daily_rank_keep_combo_publication.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202612310035_daily_rank_keep_combo_rotation.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202612310052_football_daily_challenge_persistence.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202612310081_football_daily_midday_release.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202612310092_who_am_i_daily_runtime.sql
            psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/migrations/202612310095_home_hq_cross_sport_streak.sql
          done
          psql "$DB_URL" --set ON_ERROR_STOP=on --file supabase/tests/generalized_todays_challenge_legacy_assert.sql

      - name: Execute concurrent first-attempt proof
        shell: bash
        run: bash scripts/verify-generalized-daily-concurrency.sh "$DB_URL"

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

      - name: Record exact-head proof
        if: success()
        shell: bash
        run: |
          {
            echo "### Generalized Today’s Challenge backend verified"
            echo "- Exact source SHA: \`$SOURCE_SHA\`"
            echo "- Fresh database migrations: passed"
            echo "- Daily runtime Edge Function local bundle and execution: passed"
            echo "- Seven server-owned graders: passed"
            echo "- Seven deterministic runtime setup adapters: passed"
            echo "- Hit the Number hidden-value, explicit-lock, and normalized scoring contract: passed"
            echo "- Blind Resume V3 staged reveal, 100-point scoring, and V2 compatibility: passed"
            echo "- Who Am I deterministic setup, Recovery Board parity, and server grading: passed"
            echo "- Calibrated Wavelength v2 publication: passed"
            echo "- Legacy rotations plus Stage 11 UFC 24-slot / Football 20-slot future schedules: passed"
            echo "- Progressive reveal and hidden-evidence boundaries: passed"
            echo "- Cross-device optimistic progress restoration: passed"
            echo "- Football/UFC same-day sport isolation and shared records RPCs: passed"
            echo "- Home HQ cross-sport daily streak union: passed"
            echo "- Shared hourly materialization wake-up: passed"
            echo "- Central-time DST boundaries: passed"
            echo "- Immutable first attempt and replay isolation: passed"
            echo "- Real concurrent submissions: passed"
            echo "- Private table/RPC authorization boundary: passed"
            echo "- Realistic legacy Find the Leader migration: passed"
            echo "- Migration rerun/idempotency: passed"
          } >> "$GITHUB_STEP_SUMMARY"

  classify-backend-deployment:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deployed: ${{ steps.inspect.outputs.deployed }}
    steps:
      - name: Check whether the canonical workflow actually deployed Supabase
        id: inspect
        uses: actions/github-script@v7
        env:
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const runId = Number(process.env.DEPLOY_RUN_ID);
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const deployed = data.jobs.some((job) => (
              job.name === "deploy"
              && job.status === "completed"
              && job.conclusion === "success"
            ));
            core.setOutput("deployed", deployed ? "true" : "false");
            core.info(deployed
              ? "Canonical Supabase deploy job ran successfully; exact deployment proof is required."
              : "Backend release was unchanged; skipping Supabase post-deploy proof.");

  exact-deployment-proof:
    needs: classify-backend-deployment
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.classify-backend-deployment.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify exact migrations are recorded remotely with no pending database changes
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing backend verification secret::$name is missing or empty."
              exit 1
            fi
          done

          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          migration_list=$(supabase migration list --linked)
          printf '%s\n' "$migration_list"

          require_remote_migration() {
            local version="$1"
            local remote_version
            remote_version=$(printf '%s\n' "$migration_list" | sed 's/│/|/g' | awk -F '|' -v version="$version" '
              {
                local_version = $1
                remote_version = $2
                gsub(/[^0-9]/, "", local_version)
                gsub(/[^0-9]/, "", remote_version)
                if (local_version == version) {
                  print remote_version
                  exit
                }
              }
            ')
            if [ "$remote_version" != "$version" ]; then
              echo "::error title=Generalized daily migration not deployed::Migration $version is not recorded in the remote column."
              exit 1
            fi
          }

          require_remote_migration "202609050001"
          require_remote_migration "202609050002"
          require_remote_migration "202609060001"
          require_remote_migration "202609080001"
          require_remote_migration "202609090001"
          require_remote_migration "202609140003"
          require_remote_migration "202612310025"
          require_remote_migration "202612310026"
          require_remote_migration "202612310027"
          require_remote_migration "202612310028"
          require_remote_migration "202612310052"
          require_remote_migration "202612310069"
          require_remote_migration "202612310092"
          require_remote_migration "202612310093"
          require_remote_migration "202612310094"
          require_remote_migration "202612310095"
          supabase db push --linked --dry-run

      - name: Record exact deployed backend proof
        shell: bash
        run: |
          {
            echo "### Generalized Today’s Challenge backend deployment verified"
            echo "- Canonical deploy workflow run: ${{ github.event.workflow_run.html_url }}"
            echo "- Exact deployed source SHA: \`$SOURCE_SHA\`"
            echo "- Remote migrations: \`202609050001\`, \`202609050002\`, \`202609060001\`, \`202609080001\`, \`202609090001\`, \`202609140003\`, \`202612310025\`, \`202612310026\`, \`202612310027\`, \`202612310028\`, \`202612310052\`, \`202612310069\`, \`202612310092\`, \`202612310093\`, \`202612310094\` all present"
            echo "- Pending linked migrations: none"
          } >> "$GITHUB_STEP_SUMMARY"
