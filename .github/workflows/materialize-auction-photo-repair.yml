            ("wars.webp", "https://media.canva.com/v2/document-image/hash:624196016/height:335/id:DAHRTTm0exk/type:B/width:596?brand=BAGU9Bq9udo&csig=AAAAAAAAAAAAAAAAAAAAAJCHhQhAsOGoT7B2hLloPScO_HghgKSc3NntfgHGEbdN&disableexport=T&exp=1785823607&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2Fm0exk%2FDAHRTTm0exk%2F1%2Fthumbnail%2F0016.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260803%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260803T110802Z%26X-Amz-Expires%3D68325%26X-Amz-Signature%3D90c746f5590a21e262908321fea448f845dd609b84dfa1d13feab71ab1d2ffe6%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252004%2520Aug%25202026%252006%253A06%253A47%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAJ89frB_ftlrriEjZA5vOAKCa0DLEt0BAtCltdUXKp0u&page=16&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1"),
          ]

          target = Path("public/auction")
          target.mkdir(parents=True, exist_ok=True)
          hashes = []
          for filename, url in assets:
              request = Request(url, headers={"User-Agent": "Octagon-HQ-Auction-Repair/1"})
              with urlopen(request, timeout=45) as response:
                  source = Image.open(BytesIO(response.read())).convert("RGB")
              if source.size != (596, 335):
                  raise RuntimeError(f"{filename} source was {source.size}, expected 596x335")
              image = source.resize((720, 405), Image.Resampling.LANCZOS)
              output = target / filename
              image.save(output, "WEBP", quality=92, method=6)
              data = output.read_bytes()
              if image.size != (720, 405) or len(data) <= 20_000:
                  raise RuntimeError(f"{filename} failed quality gate: {image.size}, {len(data)} bytes")
              if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                  raise RuntimeError(f"{filename} is not a valid WebP")
              digest = sha256(data).hexdigest()
              hashes.append(digest)
              print(filename, len(data), digest)
          if len(set(hashes)) != 16:
              raise RuntimeError("Auction repair produced duplicate image files")
          PY
          python /tmp/materialize.py

      - name: Commit focused repaired assets
        run: |
