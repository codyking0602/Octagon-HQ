name: Import sealed V1 history

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/import-v1-history.yml
      - scripts/import-v1-history.py
      - supabase/imports/v1-history.encrypted.json

permissions:
  contents: read

concurrency:
  group: octagon-hq-v1-history-import
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event.pull_request.number == 51 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/member-profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      IMPORT_ENVELOPE: supabase/imports/v1-history.encrypted.json
      IMPORT_REPORT: /tmp/v1-import-report.json

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Install sealed-import runtime
        shell: bash
        run: python -m pip install --quiet cryptography requests

      - name: Derive private recipient key from V2 deployment secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ] || [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error title=Missing V2 import secrets::The canonical V2 deployment secrets are unavailable."
            exit 1
          fi
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF

          private_bytes = HKDF(
              algorithm=hashes.SHA256(),
              length=32,
              salt=os.environ["SUPABASE_PROJECT_ID"].encode(),
              info=b"octagon-v1-v2-import-private-key",
          ).derive(os.environ["SUPABASE_DB_PASSWORD"].encode())
          private_key = x25519.X25519PrivateKey.from_private_bytes(private_bytes)
          public_key = private_key.public_key().public_bytes(
              serialization.Encoding.Raw,
              serialization.PublicFormat.Raw,
          )
          private_b64 = base64.b64encode(private_bytes).decode()
          print(f"::add-mask::{private_b64}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"V2_IMPORT_PRIVATE_KEY={private_b64}\n")
          Path("/tmp/v2-import-recipient.json").write_text(json.dumps({
              "version": 1,
              "algorithm": "X25519-HKDF-SHA256-AES256GCM",
              "publicKey": base64.b64encode(public_key).decode(),
              "keyScope": "Octagon HQ V2 production import",
          }) + "\n", encoding="utf-8")
          PY

      - name: Upload one-day V2 recipient key
        uses: actions/upload-artifact@v4
        with:
          name: octagon-v2-import-recipient-${{ github.event.pull_request.head.sha }}
          path: /tmp/v2-import-recipient.json
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Validate importer syntax
        shell: bash
        run: python -m py_compile scripts/import-v1-history.py

      - name: Resolve V2 service credential without printing it
        if: hashFiles('supabase/imports/v1-history.encrypted.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error title=Missing V2 service credential::Canonical deployment credentials are unavailable."
            exit 1
          fi
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys")
          service_key=$(printf '%s' "$response" | jq -r '[.[] | select(.name == "service_role" or .name == "secret") | (.api_key // .key // empty)] | map(select(length > 0)) | first // empty')
          if [ -z "$service_key" ]; then
            echo "::error title=V2 service key unavailable::The Supabase management response did not include a service credential."
            exit 1
          fi
          echo "::add-mask::$service_key"
          printf 'V2_SERVICE_ROLE_KEY=%s\n' "$service_key" >> "$GITHUB_ENV"
          printf 'V2_SUPABASE_URL=https://%s.supabase.co\n' "$SUPABASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Import sealed V1 history without overwriting V2
        if: hashFiles('supabase/imports/v1-history.encrypted.json') != ''
        shell: bash
        env:
          V1_IMPORT_ENVELOPE: ${{ env.IMPORT_ENVELOPE }}
          V1_IMPORT_REPORT: ${{ env.IMPORT_REPORT }}
        run: |
          set -euo pipefail
          python scripts/import-v1-history.py
          test -s "$IMPORT_REPORT"

      - name: Upload one-day reconciliation report
        if: hashFiles('supabase/imports/v1-history.encrypted.json') != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: octagon-v1-import-report-${{ github.event.pull_request.head.sha }}
          path: /tmp/v1-import-report.json
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0

      - name: Record import state
        shell: bash
        run: |
          if [ -f "$IMPORT_ENVELOPE" ]; then
            echo "Sealed V1 import payload was processed on exact PR head ${{ github.event.pull_request.head.sha }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "V2 recipient key prepared. No sealed V1 payload is committed yet." >> "$GITHUB_STEP_SUMMARY"
          fi
