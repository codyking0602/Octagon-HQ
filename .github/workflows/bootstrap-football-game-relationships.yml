name: Bootstrap Football Game Relationships

on:
  push:
    branches:
      - feature/football-knowledge-nonplayer-game-relationships-v6

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/football-knowledge-nonplayer-game-relationships-v6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate relationship corpora
        run: node scripts/import-football-game-relationships.mjs
      - name: Commit generated corpora and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/generated/football/relationships/*.json
          git rm .github/workflows/bootstrap-football-game-relationships.yml
          git commit -m "Materialize Football game relationships"
          git push origin HEAD:feature/football-knowledge-nonplayer-game-relationships-v6
