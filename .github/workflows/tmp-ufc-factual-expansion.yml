name: Temporary UFC factual expansion

on:
  push:
    branches:
      - games/20q-factual-readiness-expansion
    paths:
      - data/ufc/factual-expansion-candidates-v1.json
      - scripts/generate-ufc-factual-expansion.mjs
      - .github/workflows/tmp-ufc-factual-expansion.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate spoiler-hidden UFC factual expansion
        run: node scripts/generate-ufc-factual-expansion.mjs
      - name: Commit generated factual snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/ufc/factual-expansion-v1.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate UFC factual expansion snapshot"
          git push origin HEAD:games/20q-factual-readiness-expansion
