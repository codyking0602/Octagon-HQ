name: TEMP Stage 13 Specialist Diagnostic

on:
  push:
    branches: [feat/football-ledger-stage13-factual-universe]
    paths:
      - .github/workflows/temp-stage13-final-repair.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/football-ledger-stage13-factual-universe
          fetch-depth: 1
      - name: Inspect promoted NFL specialists against source rows
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const rowsOf = (data) => data.rows.map((row) => Object.fromEntries(data.columns.map((name, i) => [name, row[i]])));
          const norm = (v) => String(v ?? '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]/g, '');
          const recognition = read('data/generated/football/recognizability-projection.json');
          const source = read('data/generated/football/nfl/player-seasons-1999-2025.json');
          const rows = rowsOf(source);
          const specialists = recognition.records.filter((r) => r.kind === 'player-career' && r.league === 'NFL' && r.tier !== 'D' && (r.position === 'K' || r.position === 'P'));
          console.log('COLUMNS', JSON.stringify(source.columns));
          console.log('SPECIALIST_COUNT', specialists.length);
          console.log('SPECIALISTS', JSON.stringify(specialists.slice(0, 50), null, 2));
          const positions = [...new Set(rows.map((r) => r.position).filter(Boolean))].sort();
          console.log('SOURCE_POSITIONS', JSON.stringify(positions));
          for (const subject of specialists.slice(0, 30)) {
            const direct = rows.filter((r) => String(r.sourcePlayerId) === String(subject.sourceId));
            const nameMatches = rows.filter((r) => [r.playerDisplayName, r.playerName, r.name].some((v) => norm(v) === norm(subject.name)));
            console.log('MATCH', JSON.stringify({
              subject: { id: subject.id, name: subject.name, sourceId: subject.sourceId, position: subject.position, startSeason: subject.startSeason, endSeason: subject.endSeason },
              directCount: direct.length,
              directSample: direct.slice(0, 2),
              nameCount: nameMatches.length,
              nameSample: nameMatches.slice(0, 3),
            }));
          }
          NODE
