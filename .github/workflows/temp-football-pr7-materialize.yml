name: TEMP Football PR7 materialize

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/temp-football-pr7-materialize.yml
      - scripts/temp-apply-football-pr7.mjs
      - scripts/generate-football-find-leader-runtime.mjs

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Wire PR7 into canonical owners
        run: node scripts/temp-apply-football-pr7.mjs
      - name: Generate compact runtime projection
        run: node scripts/generate-football-find-leader-runtime.mjs
      - name: Commit final PR7 materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/back-room/footballSubjectRegistry.ts src/features/back-room/footballFactualStatsCore.ts src/features/back-room/footballFindLeaderModel.ts src/features/back-room/footballFindLeaderModel.test.ts
          git add -f data/generated/football/find-leader-runtime-projection.json
          git rm scripts/temp-apply-football-pr7.mjs .github/workflows/temp-football-pr7-materialize.yml
          git commit -m 'feat: migrate Find the Leader to deep Football ledger [materialize-pr7]'
          git push origin HEAD:${{ github.head_ref }}
