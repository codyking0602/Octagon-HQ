name: Stage Vince transition

on:
  push:
    branches:
      - fix/football-vince-transition

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact approved clip
        shell: bash
        run: |
          set -euo pipefail
          url="https://drive.usercontent.google.com/download?id=1S5QmcDR5ihHWCDK_Ie6WnquwBwK3_1Ql&export=download&confirm=t"
          target="public/assets/football/vince-young-championship-run.mp4"
          curl --fail --location --silent --show-error "$url" --output "$target"
          test "$(wc -c < "$target" | tr -d ' ')" = "1304229"
          echo "79516279d0597b4aae7b55fad921a25fe79deb17752d2e38e5190e0451986a00  $target" | sha256sum --check --strict
      - name: Commit exact clip and remove transfer helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage-vince-transition.yml
          git add public/assets/football/vince-young-championship-run.mp4
          git commit -m "Use approved Vince Young transition clip"
          git push
