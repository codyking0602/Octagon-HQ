name: PR 887 media repair

on:
  push:
    branches:
      - chatgpt/football-media-hard-pass

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/football-media-hard-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        run: |
          python scripts/pr887-media-repair.py
          python scripts/pr887-cfb-media-repair.py
      - name: Regenerate runtime artifact
        run: node scripts/generate-football-find-leader-runtime.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run focused test
        run: npx vitest run src/features/back-room/footballSubjectAssets.test.ts
      - name: Commit repair
        run: |
          git rm .github/workflows/pr887-media-repair.yml scripts/pr887-media-repair.py scripts/pr887-cfb-media-repair.py
          git add scripts/generate-football-find-leader-runtime.mjs src/features/back-room/footballFindLeaderRuntimeProjection.ts src/features/back-room/footballSubjectRegistry.ts src/features/back-room/footballMediaIdentity.ts src/features/back-room/footballSubjectAssets.ts
          git add -f data/generated/football/find-leader-runtime-projection.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair Football historical media identity"
          git push origin HEAD:chatgpt/football-media-hard-pass
