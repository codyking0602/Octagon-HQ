name: Validate V2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: validate-v2-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  materialize-cfb-coaches:
    if: github.event.pull_request.head.ref == 'feature/cfb-coach-relationships'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize, restore temporary files, and push clean head
        run: node scripts/verify-todays-challenge-phone.mjs
