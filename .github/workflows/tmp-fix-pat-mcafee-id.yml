name: Temporary Fix Pat McAfee Identity

on:
  push:
    branches:
      - stage13-6-finish-nfl-specialists

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Correct McAfee canonical source id
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/features/back-room/footballFactualStatsExpansion.ts')
          source.write_text(source.read_text().replace('punter("pat-mcafee", 575, 26653, 46.4)', 'punter("nfl-pat-mcafee", 575, 26653, 46.4)'))
          test = Path('src/features/back-room/footballStage13_6FinishNflSpecialists.test.ts')
          test.write_text(test.read_text().replace('getFootballFact("pat-mcafee"', 'getFootballFact("nfl-pat-mcafee"'))
          PY
      - run: npm run generate:football-cfb-player-seasons && npm run generate:football-factual-universe && npm run generate:football-ledger-audit
      - name: Commit correction and self-clean
        run: |
          rm .github/workflows/tmp-fix-pat-mcafee-id.yml .github/workflows/tmp-find-pat-mcafee-id.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/back-room/footballFactualStatsExpansion.ts src/features/back-room/footballStage13_6FinishNflSpecialists.test.ts docs/football-ledger-stage13-5-review.md .github/workflows/tmp-fix-pat-mcafee-id.yml .github/workflows/tmp-find-pat-mcafee-id.yml
          git commit -m 'Correct Stage 13.6 McAfee canonical identity'
          git push origin HEAD:stage13-6-finish-nfl-specialists
