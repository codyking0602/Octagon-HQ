name: Monitor Three-Sport Daily Playability

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Cloudflare Frontend
      - Deploy Supabase Backend
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monitor-three-sport-daily-playability.yml"
      - "scripts/check-three-sport-daily-playability.mjs"
      - "scripts/check-three-sport-daily-playability.nodecheck.mjs"
      - "src/app/threeSportDailyPlayabilityGate.test.ts"

permissions:
  contents: read
  issues: write

concurrency:
  group: octagon-hq-daily-playability-monitor
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted production monitor
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test fail-closed Daily health policy
        run: node --test scripts/check-three-sport-daily-playability.nodecheck.mjs

      - name: Verify today's Football, UFC, and NBA published playable boards
        id: probe
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/check-three-sport-daily-playability.mjs

      - name: Raise a single incident on failure or close it on recovery
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE_RESULT: ${{ steps.probe.outcome }}
        with:
          script: |
            const title = "Octagon HQ Daily playability incident";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", per_page: 100,
            });
            const incident = issues.find(issue => !issue.pull_request && issue.title === title);
            const failed = process.env.PROBE_RESULT !== "success";
            if (failed && !incident) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title,
                body: [
                  "The independent three-sport Daily playability monitor failed.",
                  "This can mean a missing publication, mismatched game, incomplete playable evidence, or a failed monitoring request.",
                  "The existing five-minute scheduler remains the only game publisher.",
                  "Review the latest monitor run and repair the actual cause. No live Picks or player progress was changed.",
                  "Workflow: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/workflows/monitor-three-sport-daily-playability.yml",
                ].join("\n\n"),
              });
            } else if (!failed && incident) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: incident.number, state: "closed",
                state_reason: "completed",
              });
            }
