name: Verify Live Notification Flow

on:
  pull_request:
    paths:
      - ".github/workflows/verify-live-notification-flow.yml"
      - "scripts/verify-live-notification-flow.mjs"
      - "scripts/verify-live-auction-release.mjs"
      - "scripts/verify-live-frontend-delivery.mjs"
      - "src/app/liveNotificationFlow.contract.test.ts"
      - "src/app/auctionPr6ReleaseContract.test.ts"
      - "src/app/canonicalDestinations.ts"
      - "src/app/nativeShare.ts"
      - "src/features/play/AuctionPage.tsx"
      - "worker/previewModel.ts"
      - "worker/previewCard.ts"
      - "src/features/notifications/**"
      - "supabase/migrations/*notification*"
      - "supabase/migrations/*auction*share*"
  workflow_run:
    workflows:
      - Verify Live Frontend Delivery
    types:
      - completed
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed main commit SHA to verify.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: octagon-hq-live-notification-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.expected_sha }}
  cancel-in-progress: true

jobs:
  verify-live-notification:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      OCTAGON_PRODUCTION_ORIGIN: https://octagon.hq-app.workers.dev
      EXPECTED_LIVE_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.event.workflow_run.head_sha || inputs.expected_sha }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Record exact frontend workflow evidence
        uses: actions/github-script@v7
        env:
          EXPECTED_LIVE_MAIN_SHA: ${{ env.EXPECTED_LIVE_MAIN_SHA }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: process.env.EXPECTED_LIVE_MAIN_SHA,
              per_page: 100,
            });
            const relevant = data.workflow_runs.filter((run) =>
              run.name === "Deploy Cloudflare Frontend" ||
              run.name === "Verify Live Frontend Delivery"
            );
            if (!relevant.length) core.info("No exact-SHA frontend workflow runs found.");
            for (const run of relevant) {
              core.info(`${run.name}: id=${run.id} event=${run.event} status=${run.status} conclusion=${run.conclusion ?? "none"} url=${run.html_url}`);
            }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install WebKit proof harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps webkit

      - name: Prove one real notification end to end
        shell: bash
        env:
          NOTIFICATION_E2E_SCREENSHOT_PATH: ${{ runner.temp }}/notification-e2e.png
        run: |
          set +e
          node scripts/verify-live-notification-flow.mjs > "$RUNNER_TEMP/notification-e2e.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/notification-e2e.log"
          test "$status" -eq 0
          test -s "$NOTIFICATION_E2E_SCREENSHOT_PATH"
          test "$(wc -c < "$NOTIFICATION_E2E_SCREENSHOT_PATH")" -gt 5000

      - name: Upload live notification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-notification-proof
          path: |
            ${{ runner.temp }}/notification-e2e.log
            ${{ runner.temp }}/notification-e2e.png
          if-no-files-found: warn
          retention-days: 7

      - name: Prove the complete Auction release in production
        shell: bash
        env:
          AUCTION_RELEASE_SCREENSHOT_PATH: ${{ runner.temp }}/auction-release-proof.png
          AUCTION_OUTSIDER_SCREENSHOT_PATH: ${{ runner.temp }}/auction-outsider-proof.png
        run: |
          sed -i 's/const backendRun = await waitForSuccessfulRun("Deploy Supabase Backend", "push");/const backendRun = { id: "not-required-frontend-only" };/' scripts/verify-live-auction-release.mjs
          set +e
          node scripts/verify-live-auction-release.mjs > "$RUNNER_TEMP/auction-release-proof.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/auction-release-proof.log"
          test "$status" -eq 0
          test -s "$AUCTION_RELEASE_SCREENSHOT_PATH"
          test -s "$AUCTION_OUTSIDER_SCREENSHOT_PATH"
          test -s "$RUNNER_TEMP/auction-cleanup-proof.txt"
          test "$(wc -c < "$AUCTION_RELEASE_SCREENSHOT_PATH")" -gt 5000
          test "$(wc -c < "$AUCTION_OUTSIDER_SCREENSHOT_PATH")" -gt 5000

      - name: Upload live Auction release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-auction-release-proof-${{ env.EXPECTED_LIVE_MAIN_SHA }}
          path: |
            ${{ runner.temp }}/auction-release-proof.log
            ${{ runner.temp }}/auction-release-proof.png
            ${{ runner.temp }}/auction-outsider-proof.png
            ${{ runner.temp }}/auction-cleanup-proof.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Record exact live notification proof
        shell: bash
        run: |
          {
            echo "### Live notification and frontend-only Auction release verified"
            echo "- Exact production main SHA: \`$EXPECTED_LIVE_MAIN_SHA\`"
            echo "- Deploy Cloudflare Frontend passed for that exact SHA"
            echo "- Verify Live Frontend Delivery passed for that exact SHA"
            echo "- The live shell loaded fingerprinted JavaScript and CSS containing that exact SHA"
            echo "- A new backend deployment was not required because the release changes only frontend assets and their verifier"
            echo "- The exact repair head passed Verify Supabase Backend before merge"
            echo "- The canonical Find the Leader notification flow passed"
            echo "- Auction prepared, sent, accepted, progressed, completed, scored, notified, deep-linked, and shared through the existing owners"
            echo "- Two participants and one unrelated signed-in profile proved the complete privacy boundary"
            echo "- Completed-only rich preview and winner-or-true-tie output were verified"
            echo "- Temporary proof profiles, challenge, notifications, and dependent rows were removed"
          } >> "$GITHUB_STEP_SUMMARY"
