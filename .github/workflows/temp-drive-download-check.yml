name: Temp Football reveal asset bridge

on:
  push:
    branches:
      - fix/football-reveal-montage-final

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/football-reveal-montage-final
      - name: Bridge reveal assets
        shell: bash
        run: |
          set -u
          play_code=$(curl -L --silent --show-error -w '%{http_code}' 'https://drive.google.com/uc?export=download&id=18Lr-JL1IDdeCNdFOO4b7MyUXWq1Mur6D' -o /tmp/play.mp4 || true)
          picks_code=$(curl -L --silent --show-error -w '%{http_code}' 'https://drive.google.com/uc?export=download&id=1547oSbQooGuZkoTb_eRWby6WKVtMX7y7' -o /tmp/picks.mp4 || true)
          play_size=$(stat -c%s /tmp/play.mp4 2>/dev/null || echo 0)
          picks_size=$(stat -c%s /tmp/picks.mp4 2>/dev/null || echo 0)
          play_sha=$(sha256sum /tmp/play.mp4 2>/dev/null | cut -d' ' -f1 || echo missing)
          picks_sha=$(sha256sum /tmp/picks.mp4 2>/dev/null | cut -d' ' -f1 || echo missing)
          if [ "$play_size" = "1058822" ] && [ "$picks_size" = "1342927" ] && [ "$play_sha" = "6ff79235135cb5ef1f1c89b94a014c9e21b6cd1b0198bdb7412697893601a9df" ] && [ "$picks_sha" = "88f4204fd962c7ce2bb0aefbb026101ec3ae9fff797ecb0e61840d0e53241d56" ]; then
            cp /tmp/play.mp4 public/assets/football/football-play-reveal.mp4
            cp /tmp/picks.mp4 public/assets/football/football-picks-reveal.mp4
            git rm .github/workflows/temp-drive-download-check.yml
            git add public/assets/football/football-play-reveal.mp4 public/assets/football/football-picks-reveal.mp4
            msg='Install corrected Football reveal clips'
          else
            printf 'play_http=%s\nplay_size=%s\nplay_sha=%s\npicks_http=%s\npicks_size=%s\npicks_sha=%s\n' "$play_code" "$play_size" "$play_sha" "$picks_code" "$picks_size" "$picks_sha" > drive-diag.txt
            git rm .github/workflows/temp-drive-download-check.yml
            git add drive-diag.txt
            msg='Record Football reveal bridge diagnostics'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$msg"
          git push origin HEAD:fix/football-reveal-montage-final
