name: Repair Auction PR 6 Profile Cleanup

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feat/auction-pr6-final-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: feat/auction-pr6-final-release
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply focused Auction profile cleanup repair
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/octagon-pr6"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"
          cd "$target"
          git checkout "$TARGET_BRANCH"

          python - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/202609030001_auction_notifications_share_release.sql")
          text = migration.read_text()
          anchor = "-- inputs inside the canonical database transaction.\n\n"
          block = """-- Profile deletion already owns dependent public challenge cleanup. Keep that\n-- single cleanup boundary complete for private Auction state and every child row.\nalter table private.auction_games\n  drop constraint auction_games_challenger_id_fkey,\n  drop constraint auction_games_recipient_id_fkey,\n  drop constraint auction_games_challenge_id_fkey,\n  drop constraint auction_games_tie_priority_profile_id_fkey,\n  drop constraint auction_games_cancelled_by_fkey,\n  drop constraint auction_games_winner_profile_id_fkey;\n\nalter table private.auction_games\n  add constraint auction_games_challenger_id_fkey\n    foreign key (challenger_id) references public.profiles(id) on delete cascade,\n  add constraint auction_games_recipient_id_fkey\n    foreign key (recipient_id) references public.profiles(id) on delete cascade,\n  add constraint auction_games_challenge_id_fkey\n    foreign key (challenge_id) references public.play_challenges(id) on delete cascade,\n  add constraint auction_games_tie_priority_profile_id_fkey\n    foreign key (tie_priority_profile_id) references public.profiles(id) on delete cascade,\n  add constraint auction_games_cancelled_by_fkey\n    foreign key (cancelled_by) references public.profiles(id) on delete cascade,\n  add constraint auction_games_winner_profile_id_fkey\n    foreign key (winner_profile_id) references public.profiles(id) on delete cascade;\n\nalter table private.auction_pending_bids\n  drop constraint auction_pending_bids_bidder_id_fkey,\n  add constraint auction_pending_bids_bidder_id_fkey\n    foreign key (bidder_id) references public.profiles(id) on delete cascade;\n\nalter table private.auction_awards\n  drop constraint auction_awards_awarded_to_fkey,\n  add constraint auction_awards_awarded_to_fkey\n    foreign key (awarded_to) references public.profiles(id) on delete cascade;\n\n"""
          if block not in text:
              if anchor not in text:
                  raise SystemExit("migration insertion anchor missing")
              migration.write_text(text.replace(anchor, anchor + block, 1))

          test_file = Path("src/app/auctionPr6ReleaseContract.test.ts")
          test_text = test_file.read_text()
          test_anchor = '    expect(migration).toContain("award.resolved_round = v_resolved_round");\n'
          addition = (
              '    expect(migration).toContain("auction_games_challenger_id_fkey");\n'
              '    expect(migration).toContain("auction_games_challenge_id_fkey");\n'
              '    expect(migration).toContain("auction_pending_bids_bidder_id_fkey");\n'
              '    expect(migration).toContain("auction_awards_awarded_to_fkey");\n'
              '    expect(migration.match(/on delete cascade/g)?.length).toBeGreaterThanOrEqual(8);\n'
          )
          if addition not in test_text:
              if test_anchor not in test_text:
                  raise SystemExit("contract test insertion anchor missing")
              test_file.write_text(test_text.replace(test_anchor, test_anchor + addition, 1))
          PY

          if git diff --quiet; then
            echo "Focused Auction cleanup repair is already present."
            exit 0
          fi

          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/202609030001_auction_notifications_share_release.sql \
            src/app/auctionPr6ReleaseContract.test.ts
          git commit -m "Cascade Auction cleanup with profile deletion"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
