name: Temporary Football 20Q readiness probe

on:
  push:
    branches:
      - games/20q-factual-readiness-expansion
    paths:
      - .github/workflows/tmp-football-20q-readiness.yml
      - .github/scripts/tmp-football-20q-probe.py
      - .github/scripts/tmp-football-20q-finish.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build final Football 20Q factual readiness
        run: |
          cp src/features/games/twentyQuestionsFactualReadiness.audit.test.ts src/features/games/twentyQuestionsStrictPool.tmp.audit.test.ts
          python .github/scripts/tmp-football-20q-probe.py
          python .github/scripts/tmp-football-20q-finish.py
      - name: Verify final Football 20Q factual readiness
        run: npx vitest run src/features/games/twentyQuestionsStrictPool.tmp.audit.test.ts --reporter=verbose
      - name: Promote canonical audit
        run: |
          cp src/features/games/twentyQuestionsStrictPool.tmp.audit.test.ts src/features/games/twentyQuestionsFactualReadiness.audit.test.ts
          rm src/features/games/twentyQuestionsStrictPool.tmp.audit.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/games/twentyQuestionsFactualReadiness.audit.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Lock Football 20Q factual launch pool"
          git push origin HEAD:games/20q-factual-readiness-expansion
