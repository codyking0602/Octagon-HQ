name: Apply Picks Import DB Compatibility

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/repair-picks-event-import'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-picks-event-import
          fetch-depth: 1
      - name: Preserve legacy Event Setup callers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/202608290001_pick_event_import_segments.sql")
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one migration match, found {count}: {old[:100]!r}")
              source = source.replace(old, new, 1)

          stage_marker = """  with payload_bouts as (
    select value item
    from jsonb_array_elements(coalesce(p_payload->'bouts', '[]'::jsonb))
  )
  update public.pick_event_draft_bouts bout
  set card_segment = payload.item->>'card_segment',
      segment_sequence = (payload.item->>'segment_sequence')::smallint
  from payload_bouts payload
  where bout.draft_id = v_draft_id
    and bout.bout_id = public.slugify_pick_text(payload.item->>'bout_id');

  if exists (
"""
          stage_replacement = """  with payload_bouts as (
    select value item
    from jsonb_array_elements(coalesce(p_payload->'bouts', '[]'::jsonb))
  )
  update public.pick_event_draft_bouts bout
  set card_segment = payload.item->>'card_segment',
      segment_sequence = (payload.item->>'segment_sequence')::smallint
  from payload_bouts payload
  where bout.draft_id = v_draft_id
    and bout.bout_id = public.slugify_pick_text(payload.item->>'bout_id');

  -- Existing owner workflows and SQL tests may stage legacy main-card payloads
  -- without segment fields. Derive the same deterministic metadata from the
  -- canonical bout id and headline-first position instead of creating another
  -- staging path.
  with ranked as (
    select
      bout.draft_id,
      bout.bout_id,
      coalesce(
        bout.card_segment,
        case when bout.bout_id like 'prelim-%' then 'prelim' else 'main' end
      ) card_segment,
      row_number() over (
        partition by bout.draft_id, coalesce(
          bout.card_segment,
          case when bout.bout_id like 'prelim-%' then 'prelim' else 'main' end
        )
        order by bout.position desc
      )::smallint segment_sequence
    from public.pick_event_draft_bouts bout
    where bout.draft_id = v_draft_id
  )
  update public.pick_event_draft_bouts bout
  set card_segment = ranked.card_segment,
      segment_sequence = ranked.segment_sequence
  from ranked
  where ranked.draft_id = bout.draft_id
    and ranked.bout_id = bout.bout_id;

  if exists (
"""
          replace_once(stage_marker, stage_replacement)

          publish_marker = """declare
  v_event public.pick_events;
begin
  if exists (
"""
          publish_replacement = """declare
  v_event public.pick_events;
begin
  -- Draft editing predates segment metadata. Recompute it from the current
  -- canonical order immediately before the sole publication owner validates
  -- and copies the card.
  with ranked as (
    select
      bout.draft_id,
      bout.bout_id,
      coalesce(
        bout.card_segment,
        case when bout.bout_id like 'prelim-%' then 'prelim' else 'main' end
      ) card_segment,
      row_number() over (
        partition by bout.draft_id, coalesce(
          bout.card_segment,
          case when bout.bout_id like 'prelim-%' then 'prelim' else 'main' end
        )
        order by bout.position desc
      )::smallint segment_sequence
    from public.pick_event_draft_bouts bout
    where bout.draft_id = p_draft_id
  )
  update public.pick_event_draft_bouts bout
  set card_segment = ranked.card_segment,
      segment_sequence = ranked.segment_sequence
  from ranked
  where ranked.draft_id = bout.draft_id
    and ranked.bout_id = bout.bout_id;

  if exists (
"""
          replace_once(publish_marker, publish_replacement)

          path.write_text(source)
          PY
          rm .github/workflows/apply-picks-import-db-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Preserve legacy Picks staging compatibility"
          git push origin HEAD:agent/repair-picks-event-import
