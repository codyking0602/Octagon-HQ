name: Wheel UFC Unranked Profile Evidence (staged)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/wheel-monitor/ufc-profile-policy.mjs'
      - 'scripts/wheel-monitor/ufc-profile-policy.nodecheck.mjs'
      - 'scripts/wheel-monitor/ufc-unranked-profile-review.mjs'
      - '.github/workflows/wheel-ufc-unranked-profile-review.yml'

permissions:
  contents: read

concurrency:
  group: wheel-ufc-profile-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: rvbspcjvebgwqzssayts
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --silent --no-audit --no-fund
      - name: Test safe identity and profile status extraction
        run: |
          node --check scripts/wheel-monitor/ufc-unranked-profile-review.mjs
          node --test scripts/wheel-monitor/ufc-profile-policy.nodecheck.mjs
      - name: Read live unranked fighter identities and official profiles
        run: |
          node scripts/wheel-monitor/ufc-unranked-profile-review.mjs \
            --out=tmp/wheel-monitor/ufc/unranked-profiles.json
      - name: Preserve nonauthoritative UFC profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-ufc-unranked-profile-evidence
          path: tmp/wheel-monitor/ufc/unranked-profiles.json
          retention-days: 30
          if-no-files-found: warn
