name: PR7 scratch materialization

on:
  push:
    branches:
      - recovery/pr7-materialize-20260910

permissions:
  contents: write

concurrency:
  group: pr7-scratch-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Materialize and capture validation evidence
        run: |
          set +e
          node scripts/pr7-materialize-scratch.mjs > scripts/pr7-materialize-output.txt 2>&1
          status=$?
          echo "exit_status=$status" >> scripts/pr7-materialize-output.txt
          exit 0
      - name: Commit scratch recovery evidence and any materialized output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/pr7-materialize-output.txt
          test ! -f scripts/pr7-materialize-validation.json || git add scripts/pr7-materialize-validation.json
          test ! -f docs/who-am-i-pr7-nfl-b-person-identity-audit.md || git add docs/who-am-i-pr7-nfl-b-person-identity-audit.md
          git add src/features/back-room/footballPersonIdentityKnowledge.ts
          git diff --cached --quiet && exit 0
          git commit -m "Capture PR7 recovery validation evidence"
          git push origin HEAD:${{ github.ref_name }}
