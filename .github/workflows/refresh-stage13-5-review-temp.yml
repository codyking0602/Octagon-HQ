name: Refresh Stage 13.5 review artifact (temporary)

on:
  push:
    branches:
      - stage13-6-prep-recognition-games-eras
    paths:
      - .github/workflows/refresh-stage13-5-review-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: stage13-6-prep-recognition-games-eras
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund
      - name: Generate canonical Stage 13.5 artifacts
        run: |
          npm run generate:football-cfb-player-seasons
          npm run generate:football-factual-universe
          npm run generate:football-ledger-audit
      - name: Commit only the generated review artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/football-ledger-stage13-5-review.md
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Stage 13.5 ledger review artifact"
          git push origin HEAD:stage13-6-prep-recognition-games-eras
