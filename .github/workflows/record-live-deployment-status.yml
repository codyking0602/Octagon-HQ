name: Record Live Deployment Status

on:
  workflow_run:
    workflows:
      - Deploy Cloudflare Frontend
      - Deploy Supabase Backend
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  record:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record exact main deployment result
        uses: actions/github-script@v7
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOYMENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOYMENT_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const contexts = {
              "Deploy Cloudflare Frontend": "octagon/frontend-live",
              "Deploy Supabase Backend": "octagon/backend-live",
            };
            const workflowName = process.env.WORKFLOW_NAME;
            const deploymentSha = process.env.DEPLOYMENT_SHA;
            const conclusion = process.env.DEPLOYMENT_CONCLUSION;
            const contextName = contexts[workflowName];
            if (!contextName) {
              core.setFailed(`Unsupported deployment workflow: ${workflowName}`);
              return;
            }
            const state = conclusion === "success"
              ? "success"
              : conclusion === "failure"
                ? "failure"
                : "error";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: deploymentSha,
              state,
              context: contextName,
              description: conclusion === "success"
                ? `Exact ${workflowName === "Deploy Cloudflare Frontend" ? "frontend" : "backend"} production proof passed.`
                : `${workflowName} finished ${conclusion}.`,
              target_url: process.env.DEPLOYMENT_URL,
            });
            core.info(`${contextName}: ${state} for ${deploymentSha}`);
