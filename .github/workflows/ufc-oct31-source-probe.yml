name: QA UFC official card headshots
on:
  push:
    branches:
      - fix/ufc-oct31-official-ufc-thumb-discovery-20261027
    paths:
      - scripts/ufc-oct31-source-probe.py
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/ufc-oct31-source-probe.py
      - name: Commit official UFC source images for visual QA on this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/ufc-oct31-official-thumb-sources/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "QA four official UFC fight-result headshot assets"
          git push origin HEAD:fix/ufc-oct31-official-ufc-thumb-discovery-20261027
