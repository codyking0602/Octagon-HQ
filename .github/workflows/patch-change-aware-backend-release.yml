name: Patch Change-Aware Backend Release

on:
  push:
    branches:
      - agent/backend-change-aware-release
    paths:
      - .github/workflows/patch-change-aware-backend-release.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/backend-change-aware-release

      - name: Repair generalized backend workflow
        run: node scripts/repair-backend-release-workflows.mjs

      - name: Commit narrow workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-generalized-daily-backend.yml
          git diff --cached --check
          git commit -m "Fix backend verification job nesting"
          git push origin HEAD:agent/backend-change-aware-release
