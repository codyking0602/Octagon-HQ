name: Fast PR Feedback

on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: fast-pr-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  VITE_SUPABASE_URL: https://octagon-validation.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_octagon_validation_only_00000000000000000000
  VITE_EXPECTED_SUPABASE_HOSTNAME: octagon-validation.supabase.co

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  fast-feedback:
    name: fast feedback
    if: ${{ github.event.pull_request.draft == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact draft head with comparison history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify exact checked-out SHA
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error title=Exact SHA checkout failed::Expected $SOURCE_SHA but checked out $checked_out_sha."
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          echo "Fast feedback source verified: $checked_out_sha against base $BASE_SHA"

      - name: Set up Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Classify draft scope
        id: scope
        run: |
          # Compare against merge-base, not moving main tip (other PRs can land).
          pr_merge_base=$(git merge-base "$BASE_SHA" "$SOURCE_SHA")
          mapfile -t changed_files < <(git diff --name-only "$pr_merge_base" "$SOURCE_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"

          whoami_only=true
          saw_whoami=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              src/features/games/whoAmI*.ts|src/features/games/footballWhoAmI*.ts|src/features/games/ufcWhoAmI*.ts|src/features/back-room/footballPersonIdentity*.ts|src/features/back-room/ufcPersonIdentity*.ts)
                saw_whoami=true
                ;;
              package.json|.github/workflows/fast-pr-feedback.yml|.github/workflows/validate.yml|src/app/fastPrFeedbackWorkflow.contract.test.ts)
                ;;
              *)
                whoami_only=false
                break
                ;;
            esac
          done

          if [ "$saw_whoami" != true ]; then
            whoami_only=false
          fi

          echo "whoami_only=$whoami_only" >> "$GITHUB_OUTPUT"

          # NBA authored clue-only drafts use their complete targeted suite,
          # avoiding the enormous transitive --changed Vitest graph.
          nba_whoami_only=true
          saw_nba_whoami=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              src/features/games/nbaWhoAmIAuthored*.ts)
                saw_nba_whoami=true
                ;;
              .github/workflows/fast-pr-feedback.yml|src/app/fastPrFeedbackWorkflow.contract.test.ts)
                ;;
              *) nba_whoami_only=false; break ;;
            esac
          done
          if [ "$saw_nba_whoami" != true ]; then
            nba_whoami_only=false
          fi
          echo "nba_whoami_only=$nba_whoami_only" >> "$GITHUB_OUTPUT"

          # Ranking-only PRs should run the full ranking suite, rather than
          # Vitest's enormous transitive dependency graph for --changed.
          rankings_only=true
          saw_rankings=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              src/features/rankings/*)
                saw_rankings=true
                ;;
              .github/workflows/fast-pr-feedback.yml)
                ;;
              *)
                rankings_only=false
                break
                ;;
            esac
          done
          if [ "$saw_rankings" != true ]; then
            rankings_only=false
          fi
          echo "rankings_only=$rankings_only" >> "$GITHUB_OUTPUT"

          # NBA GM private game-only PRs already run exact-head dedicated
          # NBA/Football GM regressions and the full suite when ready.
          # Avoid Vitest --changed pulling the entire app through shared wheel imports.
          nba_gm_private_only=true
          saw_nba_gm=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              scripts/audit-nba-gm-cdn-private.mjs|src/features/nba/nbaGm*.ts|src/features/nba/nbaGmVisualParity.test.tsx|src/features/nba/nbaGmFootballParity.test.tsx|src/features/nba/nbaGmFinalPresentation.test.tsx|src/features/nba/NbaGmDevPage.tsx|src/features/nba/NbaGmFinalExperience.tsx|src/features/nba/nbaTeamBranding.tsx|src/features/back-room/FootballGmModePage.tsx|src/styles/nba-gm-dev.css|docs/nba-gm-*|data/curated/nba/gm-nba-development-profiles-*.json|supabase/migrations/202612310896_nba_gm_spin_first_private_franchise.sql|supabase/migrations/202612310898_nba_gm_dev_profiles_setup.sql|supabase/tests/nba_gm_private_playtest.sql|supabase/tests/nba_gm_development_profiles.sql|supabase/tests/nba_gm_scouting_reprice.sql|supabase/tests/nba_gm_three_season_balance.sql|supabase/migrations/202612310901_nba_gm_private_three_season_balance.sql|supabase/migrations/202612310900_nba_gm_scouting_reprice_signals.sql|.github/workflows/nba-gm-prototype-ci.yml|.github/workflows/verify-supabase-backend.yml|.github/workflows/fast-pr-feedback.yml)
                saw_nba_gm=true
                ;;
              *) nba_gm_private_only=false; break ;;
            esac
          done
          if [ "$saw_nba_gm" != true ]; then
            nba_gm_private_only=false
          fi
          echo "nba_gm_private_only=$nba_gm_private_only" >> "$GITHUB_OUTPUT"

          # A focused Bar Trivia-only draft does not need Vitest's enormous
          # --changed transitive graph; full Validate V2 still runs when ready.
          bar_trivia_only=true
          saw_bar_trivia=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              src/features/games/barTriviaEngine.ts|src/features/play/barTrivia*.ts|src/features/play/ufcBarTrivia*.ts|src/features/play/footballTeamThemeDailyPacks*.ts|docs/audits/football-bar-trivia*.md|docs/audits/ufc-bar-trivia*.md|.github/workflows/fast-pr-feedback.yml)
                saw_bar_trivia=true
                ;;
              *) bar_trivia_only=false; break ;;
            esac
          done
          if [ "$saw_bar_trivia" != true ]; then
            bar_trivia_only=false
          fi
          echo "bar_trivia_only=$bar_trivia_only" >> "$GITHUB_OUTPUT"

      - name: Standard typecheck
        if: steps.scope.outputs.whoami_only != 'true'
        run: npm run typecheck

      - name: Generate Who Am I source artifacts
        if: steps.scope.outputs.whoami_only == 'true'
        run: |
          npm run generate:football-recognizability
          npm run generate:football-cfb-player-seasons
          npm run generate:football-factual-universe

      - name: Run fast Who Am I semantic gate
        if: steps.scope.outputs.whoami_only == 'true'
        env:
          WHO_AM_I_AUDIT_SUBJECTS: all
        run: npm run test:whoami:fast

      - name: Run rankings test suite
        if: steps.scope.outputs.rankings_only == 'true'
        run: npx vitest run src/features/rankings

      - name: Run NBA Who Am I authored editorial suite
        if: steps.scope.outputs.nba_whoami_only == 'true'
        run: |
          npx vitest run src/features/games/nbaWhoAmIAuthoredScripts.test.ts src/features/games/nbaWhoAmIAuthoredBatch1.test.ts src/features/games/nbaWhoAmIAuthoredBatch2.test.ts src/features/games/nbaWhoAmIAuthoredBatch3.test.ts src/features/games/nbaWhoAmIAuthoredBatch4.test.ts src/features/games/nbaWhoAmIAuthoredIntegration.test.ts

      - name: Run tests affected by this PR
        if: steps.scope.outputs.whoami_only != 'true' && steps.scope.outputs.rankings_only != 'true' && steps.scope.outputs.nba_whoami_only != 'true'
        run: |
          pr_merge_base=$(git merge-base "$BASE_SHA" "$SOURCE_SHA")
          mapfile -t files < <(git diff --name-only "$pr_merge_base" "$SOURCE_SHA")
          millionaire_only=true
          saw_millionaire=false
          for file in "${files[@]}"; do
            case "$file" in
              src/features/play/millionaire*.ts|docs/audits/millionaire*.csv|docs/audits/millionaire*.md|supabase/tests/daily_challenge_standings.sql|.github/workflows/fast-pr-feedback.yml)
                saw_millionaire=true
                ;;
              *) millionaire_only=false; break ;;
            esac
          done
          if [ "${{ steps.scope.outputs.nba_gm_private_only }}" = true ]; then
            npm test -- src/features/nba/nbaGmVisualParity.test.tsx src/features/nba/nbaGmScoutingCalibration.test.ts src/features/nba/nbaGmThreeSeasonBalance.test.ts src/features/nba/nbaGmFinalPresentation.test.ts src/features/nba/nbaGmHistoricalCalibration.test.ts src/features/nba/nbaGmPostseasonCalibration.test.ts src/features/nba/nbaGmDraftCompletion.test.ts src/features/nba/nbaGmDevPrototype.test.ts src/features/nba/nbaGmDevelopmentProfiles.test.ts src/features/nba/nbaGmFoundation.test.ts src/features/nba/nbaGmSixSkillProposals.test.ts src/features/back-room/footballGmEngine.test.ts src/features/back-room/footballGmRosterFlow.test.ts src/features/back-room/footballGmLongFoundation.test.ts --run
          elif [ "$millionaire_only" = true ] && [ "$saw_millionaire" = true ]; then
            npm test -- src/features/play/millionaireDailyRuntime.test.ts src/features/play/millionaireEditorialFutureCandidates.test.ts src/features/play/millionaireSixMonthEditorialGate.test.ts --run
          elif [ "${{ steps.scope.outputs.bar_trivia_only }}" = true ]; then
            # Football + UFC Bar Trivia editorial, real published Daily replay,
            # themed pack and shared-engine regressions.
            npm test -- src/features/play/barTriviaContent.test.ts src/features/play/barTriviaEngine.test.ts src/features/play/barTriviaEditorialCuration.test.ts src/features/play/barTriviaDailyRuntime.test.ts src/features/play/barTriviaRecentRepeat.test.ts src/features/play/barTriviaFootballSixMonth.test.ts src/features/play/footballTeamThemeDailyPacks.test.ts src/features/play/barTriviaOct22CurrentEvents.test.ts src/features/play/ufcBarTriviaV3Editorial.test.ts src/features/play/ufcBarTriviaFocusedQuality20261029.test.ts --run
          else
            npm test -- --changed="$BASE_SHA" --passWithNoTests
          fi

      - name: Summarize fast feedback
        if: success()
        run: |
          {
            echo "### Fast draft feedback passed"
            echo "- Exact draft head: \`$SOURCE_SHA\`"
            echo "- Draft scope: Who Am I-only = \`${{ steps.scope.outputs.whoami_only }}\`"
            echo "- Draft validation stayed on the lightweight path"
            echo "- Fast semantic gate or affected tests passed"
            echo "- Full validation still runs once the PR is marked ready"
          } >> "$GITHUB_STEP_SUMMARY"
