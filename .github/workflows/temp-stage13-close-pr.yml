name: TEMP Stage 13 Closure Repair

on:
  push:
    branches: [feat/football-ledger-stage13-factual-universe]
    paths:
      - scripts/stage13-close-pr.mjs
      - .github/workflows/temp-stage13-close-pr.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/football-ledger-stage13-factual-universe
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Apply narrow closure repair
        run: node scripts/stage13-close-pr.mjs
      - name: Regenerate Stage 13 artifacts
        run: npm run generate:football-factual-universe
      - name: Run focused Stage 13 and comparison tests
        run: npx vitest run src/features/back-room/footballFactualUniverse.test.ts src/features/back-room/footballFactualStats.test.ts src/features/back-room/footballGenerationMaturity.test.ts
      - name: Commit permanent repair and remove temporary scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-stage13-close-pr.yml scripts/stage13-close-pr.mjs
          git add package.json scripts/generate-football-factual-universe.mjs data/generated/football/factual-universe-projection.json data/generated/football/factual-coverage-matrix.json src/features/back-room/footballFactualUniverse.test.ts src/features/back-room/footballFactualStatsCore.ts src/features/back-room/footballGenerationMaturity.test.ts
          git commit -m "Repair Stage 13 factual universe closure"
          git push origin HEAD:feat/football-ledger-stage13-factual-universe
