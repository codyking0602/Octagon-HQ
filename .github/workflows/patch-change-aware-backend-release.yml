name: Patch Change-Aware Backend Release

on:
  push:
    branches:
      - agent/backend-change-aware-release
    paths:
      - .github/workflows/patch-change-aware-backend-release.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/backend-change-aware-release

      - name: Repair generalized backend job nesting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/verify-generalized-daily-backend.yml')
          text = path.read_text()
          start = text.index('classify-backend-deployment:\n')
          end = text.index('    runs-on: ubuntu-latest\n', text.index('exact-deployment-proof:\n', start))
          replacement = '''  classify-backend-deployment:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deployed: ${{ steps.inspect.outputs.deployed }}
    steps:
      - name: Check whether the canonical workflow actually deployed Supabase
        id: inspect
        uses: actions/github-script@v7
        env:
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const runId = Number(process.env.DEPLOY_RUN_ID);
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const deployed = data.jobs.some((job) => (
              job.name === "deploy"
              && job.status === "completed"
              && job.conclusion === "success"
            ));
            core.setOutput("deployed", deployed ? "true" : "false");
            core.info(deployed
              ? "Canonical Supabase deploy job ran successfully; exact deployment proof is required."
              : "Backend release was unchanged; skipping Supabase post-deploy proof.");

  exact-deployment-proof:
    needs: classify-backend-deployment
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.classify-backend-deployment.outputs.deployed == 'true' }}
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit narrow formatting repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-generalized-daily-backend.yml
          git diff --cached --check
          git commit -m "Fix backend verification job nesting"
          git push origin HEAD:agent/backend-change-aware-release
