name: Validate V2

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --silent

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 7

      - name: Test
        run: npm test 2>&1 | tee test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
          retention-days: 7

      - name: Build
        env:
          VITE_SUPABASE_URL: https://octagonvalidation.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: validation-publishable-key
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee build.log
          test -f dist/index.html
          test -f dist/worker.js
          grep -Fq 'const PROJECT_REF = "octagonvalidation"' dist/worker.js
          grep -Fq 'x-octagon-supabase-proxy' dist/worker.js
          grep -Fq '/api/supabase/' dist/assets/*.js

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          retention-days: 7
