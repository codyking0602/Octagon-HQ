name: Challenge Center Diagnostic

on:
  pull_request:
    paths:
      - "src/features/challenges/**"
      - "src/features/play/PlayPage.tsx"
      - ".github/workflows/challenge-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --silent
      - run: npm test -- src/features/challenges/challengeFlow.test.tsx --reporter=verbose
