name: Verify owner-provided Football YouTube
on:
  push:
    branches: [diagnostic/football-seatgeek-discovery-20261020]
    paths: [.github/workflows/diagnose-spotlight-youtube.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check YouTube source titles
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json
          for ident in ("8YZfJ2YbOj4","MXGpVJDv-LY"):
            url="https://www.youtube.com/oembed?url="+urllib.parse.quote("https://www.youtube.com/watch?v="+ident,safe="")+"&format=json"
            try:
              request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(request,timeout=15) as response:
                data=json.loads(response.read())
              print("ID",ident,"TITLE",data.get("title"),"AUTHOR",data.get("author_name"))
            except Exception as exc:
              print("ID",ident,"ERROR",repr(exc))
          PY
