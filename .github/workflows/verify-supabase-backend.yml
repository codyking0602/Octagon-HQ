name: Verify Supabase Backend

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-cloudflare-worker-trigger:
    if: github.head_ref == 'fix/cloudflare-worker-deploy-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/cloudflare-worker-deploy-trigger
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare verified Cloudflare Worker trigger blobs
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/octagon-worker-trigger"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"
          cd "$target"
          git checkout "$TARGET_BRANCH"

          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/deploy-cloudflare.yml")
          workflow_text = workflow.read_text()
          old_paths = '      - "src/**"\n      - "public/**"\n'
          new_paths = '      - "src/**"\n      - "worker/**"\n      - "public/**"\n'
          if new_paths not in workflow_text:
              if old_paths not in workflow_text:
                  raise SystemExit("Cloudflare path-filter anchor missing")
              workflow.write_text(workflow_text.replace(old_paths, new_paths, 1))

          test_file = Path("src/app/deploymentWorkflowContract.test.ts")
          test_text = test_file.read_text()
          anchor = 'describe("feature deployment workflow contract", () => {\n'
          addition = (
              '  it("deploys Worker-only frontend changes through the canonical owner", () => {\n'
              '    expect(cloudflareWorkflow).toContain(\'- "worker/**"\');\n'
              '  });\n\n'
          )
          if addition not in test_text:
              if anchor not in test_text:
                  raise SystemExit("deployment workflow contract anchor missing")
              test_file.write_text(test_text.replace(anchor, anchor + addition, 1))
          PY

          git diff --check
          npm install --no-package-lock --ignore-scripts
          npx vitest run src/app/deploymentWorkflowContract.test.ts

          output=verification-artifacts/cloudflare-worker-trigger
          mkdir -p "$output"
          cp .github/workflows/deploy-cloudflare.yml "$output/deploy-cloudflare.yml.txt"
          cp src/app/deploymentWorkflowContract.test.ts "$output/deploymentWorkflowContract.test.ts.txt"
          git checkout -- .github/workflows/deploy-cloudflare.yml src/app/deploymentWorkflowContract.test.ts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output"
          git commit -m "Prepare verified Cloudflare Worker trigger blobs"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
