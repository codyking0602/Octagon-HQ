name: Bootstrap Football CFB Corpus

on:
  push:
    branches:
      - feature/football-cfb-data-ingestion
    paths:
      - "scripts/import-football-cfb-player-stats.mjs"
      - ".github/workflows/bootstrap-football-cfb-corpus.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/football-cfb-data-ingestion
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate pinned CFB player corpus
        run: node scripts/import-football-cfb-player-stats.mjs

      - name: Verify bulk depth
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('public/data/football/cfb/player-season-2025.manifest.json', 'utf8'));
          if (manifest.rowCount < 30000) throw new Error(`Expected 30,000+ CFB stat rows, got ${manifest.rowCount}.`);
          if (manifest.rowCount !== manifest.uniqueAthleteCount) throw new Error('CFB athlete ids are not unique.');
          if (manifest.source.commit !== '9789928e911091186bab979cc772e874c47a83f1') throw new Error('CFB source is not pinned to the approved dataset commit.');
          console.log(`Verified ${manifest.rowCount.toLocaleString()} unique CFB player-season stat rows.`);
          NODE

      - name: Commit generated corpus to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/football/cfb/player-season-2025.json public/data/football/cfb/player-season-2025.manifest.json
          if git diff --cached --quiet; then
            echo "Generated corpus is already current."
            exit 0
          fi
          git commit -m "Generate 2025 CFB bulk player corpus"
          git push origin HEAD:feature/football-cfb-data-ingestion
