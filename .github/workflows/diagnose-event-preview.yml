name: Diagnose Event Preview

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-event-preview.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract the browser diagnostic error
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/89893664240/logs" > "$RUNNER_TEMP/job.log"
          grep -E "Error:|PASS:|Timeout|visible Event Setup|browser request failures|waiting for|getByRole|strict mode" "$RUNNER_TEMP/job.log" | tail -n 40
