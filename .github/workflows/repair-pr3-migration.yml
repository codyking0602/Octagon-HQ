name: Repair PR 3 Migration Syntax

on:
  pull_request:
    paths:
      - ".github/workflows/repair-pr3-migration.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Repair exact declarations and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/202609140001_canonical_pick_fight_change_semantics.sql")
          text = migration.read_text()
          replacements = {
              "  v_action text := lower(trim(coalesce(p_action, ''));\n":
                  "  v_action text := lower(trim(coalesce(p_action, '')));\n",
              "  v_event_id text := lower(trim(coalesce(p_event_id, ''));\n":
                  "  v_event_id text := lower(trim(coalesce(p_event_id, '')));\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one declaration to repair: {old!r}")
              text = text.replace(old, new)
          migration.write_text(text)
          Path(".github/workflows/repair-pr3-migration.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202609140001_canonical_pick_fight_change_semantics.sql
          git add -u .github/workflows/repair-pr3-migration.yml
          git commit -m "Fix canonical fight-change normalization syntax"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
