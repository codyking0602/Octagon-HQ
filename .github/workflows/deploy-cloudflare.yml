name: Deploy Cloudflare Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: octagon-hq-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OCTAGON_PRODUCTION_URL: https://octagon.hq-app.workers.dev

    steps:
      - name: Check deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is missing or empty."
              missing=1
            else
              echo "$name is present."
            fi
          done
          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install application dependencies
        run: npm install --silent

      - name: Install Wrangler
        run: npm install --silent --no-save wrangler@4

      - name: Verify Cloudflare identity
        shell: bash
        run: npx wrangler whoami 2>&1 | tee wrangler-whoami.log

      - name: Resolve public Supabase browser configuration
        shell: bash
        run: |
          set -euo pipefail
          api_keys_file="$RUNNER_TEMP/supabase-api-keys.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" \
            --output "$api_keys_file"

          publishable_key=$(node - "$api_keys_file" <<'NODE'
          const fs = require('fs');
          const keys = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const publicKey = keys.find((key) => key.type === 'publishable')
            ?? keys.find((key) => key.type === 'legacy' && /anon/i.test(key.name ?? ''));
          if (!publicKey?.api_key) process.exit(1);
          process.stdout.write(publicKey.api_key);
          NODE
          )

          if [ -z "$publishable_key" ]; then
            echo "::error title=Supabase browser key unavailable::No publishable or legacy anon API key was returned for the V2 project."
            exit 1
          fi

          echo "::add-mask::$publishable_key"
          echo "VITE_SUPABASE_URL=https://${SUPABASE_PROJECT_ID}.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$publishable_key" >> "$GITHUB_ENV"

      - name: Build production frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee cloudflare-build.log
          test -f dist/index.html
          echo "Production dist is ready."

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-diagnostics
          path: cloudflare-build.log
          retention-days: 7

      - name: Deploy octagon Worker
        shell: bash
        run: npx wrangler deploy 2>&1 | tee wrangler-deploy.log

      - name: Upload Wrangler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-deploy-diagnostics
          path: |
            wrangler-whoami.log
            wrangler-deploy.log
          retention-days: 7

      - name: Verify live profile frontend
        shell: bash
        run: |
          set -euo pipefail
          html_file="$RUNNER_TEMP/octagon-index.html"
          curl --fail --silent --show-error \
            --header "Cache-Control: no-cache" \
            "${OCTAGON_PRODUCTION_URL}/?deployment=${GITHUB_SHA}" \
            --output "$html_file"

          script_path=$(grep -oE 'src="[^"]+\.js"' "$html_file" | head -n 1 | cut -d '"' -f 2)
          if [ -z "$script_path" ]; then
            echo "::error title=Live frontend verification failed::The production HTML did not reference a JavaScript bundle."
            cat "$html_file"
            exit 1
          fi

          case "$script_path" in
            http*) script_url="$script_path" ;;
            /*) script_url="${OCTAGON_PRODUCTION_URL}${script_path}" ;;
            *) script_url="${OCTAGON_PRODUCTION_URL}/${script_path}" ;;
          esac

          bundle_file="$RUNNER_TEMP/octagon-bundle.js"
          curl --fail --silent --show-error \
            --header "Cache-Control: no-cache" \
            "$script_url?deployment=${GITHUB_SHA}" \
            --output "$bundle_file"

          if ! grep -Fq "SIGN IN" "$bundle_file"; then
            echo "::error title=Stale production frontend::The live Worker bundle does not contain the merged profile control."
            exit 1
          fi

          echo "Live Worker bundle contains the canonical SIGN IN profile control."

      - name: Record deployment
        shell: bash
        run: |
          {
            echo "### Octagon HQ frontend deployed"
            echo "- Worker: octagon"
            echo "- Production URL: $OCTAGON_PRODUCTION_URL"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Supabase browser configuration was resolved from the V2 project without printing the key"
            echo "- Live production bundle contains the SIGN IN profile control"
          } >> "$GITHUB_STEP_SUMMARY"
