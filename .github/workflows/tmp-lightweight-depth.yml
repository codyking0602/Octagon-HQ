name: Temporary Lightweight Blind Rank depth generation

on:
  push:
    branches:
      - codex/lightweight-blind-rank-depth
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lightweight-blind-rank-depth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Add Lightweight Play-only ratings and focused test
        run: |
          python - <<'PY'
          from pathlib import Path

          ratings_path = Path('src/features/play/playFighterRatings.ts')
          ratings = ratings_path.read_text()
          additions = '''  e("efrain-escudero", "Efrain Escudero", "men", ["Lightweight"], "TUF Boom", "TUF winner with multiple UFC lightweight stints and an uneven UFC record", { career: 48, striking: 52, grappling: 64 }),
          e("mac-danzig", "Mac Danzig", "men", ["Lightweight"], "TUF Boom", "TUF winner and long UFC lightweight run with a losing UFC record", { career: 50, striking: 55, grappling: 61 }),
          e("daron-cruickshank", "Daron Cruickshank", "men", ["Lightweight"], "Fox / PPV Boom", "UFC lightweight veteran with an inconsistent UFC run and dangerous kicking offense", { career: 49, striking: 68, grappling: 38 }),
          e("ramsey-nijem", "Ramsey Nijem", "men", ["Lightweight"], "Fox / PPV Boom", "TUF finalist with a middling UFC lightweight run", { career: 46, striking: 50, grappling: 62 }),
          e("danny-castillo", "Danny Castillo", "men", ["Lightweight"], "Fox / PPV Boom", "UFC lightweight veteran with solid wins but a losing UFC record", { career: 53, striking: 55, grappling: 64 }),
          e("sam-stout", "Sam Stout", "men", ["Lightweight"], "TUF Boom", "Long UFC lightweight veteran with notable striking battles and a sub-.500 UFC record", { career: 54, striking: 69, grappling: 35 }),
          e("frank-camacho", "Frank Camacho", "men", ["Lightweight", "Welterweight"], "ESPN+ Era", "Two-win UFC run with six UFC losses and repeated stoppage defeats", { career: 30, striking: 60, grappling: 32 }),
          e("marcin-held", "Marcin Held", "men", ["Lightweight"], "ESPN+ Era", "One-win UFC lightweight run with limited UFC success despite a dangerous submission game", { career: 30, striking: 38, grappling: 70 }),
          e("justin-jaynes", "Justin Jaynes", "men", ["Lightweight", "Featherweight"], "ESPN+ Era", "One-win UFC run followed by four straight UFC losses", { career: 27, striking: 58, grappling: 38 }),
          e("cody-pfister", "Cody Pfister", "men", ["Lightweight"], "ESPN+ Era", "One-win UFC lightweight run with three UFC losses", { career: 24, striking: 40, grappling: 46 }),
          e("rafaello-oliveira", "Rafaello Oliveira", "men", ["Lightweight"], "TUF Boom", "Two-win UFC lightweight run with six UFC losses", { career: 27, striking: 44, grappling: 48 }),
          e("thibault-gouti", "Thibault Gouti", "men", ["Lightweight"], "ESPN+ Era", "One-win UFC lightweight run with five UFC losses", { career: 26, striking: 54, grappling: 35 }),
          '''
          marker = '  e("randa-markos", "Randa Markos"'
          assert marker in ratings
          slugs = [
              'efrain-escudero','mac-danzig','daron-cruickshank','ramsey-nijem','danny-castillo','sam-stout',
              'frank-camacho','marcin-held','justin-jaynes','cody-pfister','rafaello-oliveira','thibault-gouti',
          ]
          for slug in slugs:
              assert f'e("{slug}"' not in ratings, f'duplicate Play-only fighter: {slug}'
          ratings = ratings.replace(marker, additions + marker, 1)
          ratings_path.write_text(ratings)

          test_path = Path('src/features/play/blindRankArchetypes.test.ts')
          test = test_path.read_text()
          addition = '''  it("adds Lightweight depth at the Below Average and Bad tiers", () => {
            const expected = {
              "efrain-escudero": { career: 48, striking: 52, grappling: 64 },
              "mac-danzig": { career: 50, striking: 55, grappling: 61 },
              "daron-cruickshank": { career: 49, striking: 68, grappling: 38 },
              "ramsey-nijem": { career: 46, striking: 50, grappling: 62 },
              "danny-castillo": { career: 53, striking: 55, grappling: 64 },
              "sam-stout": { career: 54, striking: 69, grappling: 35 },
              "frank-camacho": { career: 30, striking: 60, grappling: 32 },
              "marcin-held": { career: 30, striking: 38, grappling: 70 },
              "justin-jaynes": { career: 27, striking: 58, grappling: 38 },
              "cody-pfister": { career: 24, striking: 40, grappling: 46 },
              "rafaello-oliveira": { career: 27, striking: 44, grappling: 48 },
              "thibault-gouti": { career: 26, striking: 54, grappling: 35 },
            } as const;
            const lightweightPool = blindRankPool("lightweight");
            const byId = new Map(lightweightPool.map((fighter) => [fighter.id, fighter]));

            for (const [id, ratings] of Object.entries(expected)) {
              const fighter = byId.get(id);
              expect(fighter, id).toBeDefined();
              expect(fighter?.ratings, id).toEqual(ratings);
            }

            const tierCounts = lightweightPool.reduce<Record<string, number>>((counts, fighter) => {
              const tier = blindRankTier(blindRankRating(fighter, "lightweight"));
              counts[tier] = (counts[tier] ?? 0) + 1;
              return counts;
            }, {});
            expect(tierCounts["below-average"]).toBe(9);
            expect(tierCounts.bad).toBe(6);
            expect(new Set(lightweightPool.map((fighter) => fighter.id)).size).toBe(lightweightPool.length);
            expect(new Set(lightweightPool.map((fighter) => fighter.name.toLowerCase())).size).toBe(lightweightPool.length);
          });

          '''
          marker = '  it("adds Women’s career depth at the missing Good and Bad tiers"'
          assert marker in test
          assert 'adds Lightweight depth at the Below Average and Bad tiers' not in test
          test = test.replace(marker, addition + marker, 1)
          test_path.write_text(test)
          PY
      - name: Download ESPN headshots and build local WebP thumbnails
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps

          fighters = {
              'efrain-escudero': '2335688',
              'mac-danzig': '2335685',
              'daron-cruickshank': '2512969',
              'ramsey-nijem': '2560086',
              'danny-castillo': '2486967',
              'sam-stout': '2354128',
              'frank-camacho': '3115841',
              'marcin-held': '2554001',
              'justin-jaynes': '3112009',
              'cody-pfister': '2517112',
              'rafaello-oliveira': '2504626',
              'thibault-gouti': '3965445',
          }
          out = Path('public/assets/fighters')
          errors = []
          for slug, athlete_id in fighters.items():
              try:
                  url = f'https://a.espncdn.com/i/headshots/mma/players/full/{athlete_id}.png'
                  req = Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urlopen(req, timeout=30) as response:
                      data = response.read()
                  image = Image.open(BytesIO(data)).convert('RGBA')
                  image = ImageOps.fit(image, (160, 160), method=Image.Resampling.LANCZOS, centering=(0.5, 0.38))
                  target = out / f'{slug}-thumb.webp'
                  image.save(target, 'WEBP', quality=95, method=6)
                  check = Image.open(target)
                  assert check.size == (160, 160)
                  raw = target.read_bytes()
                  assert raw[:4] == b'RIFF' and raw[8:12] == b'WEBP'
                  print('OK', slug, len(raw))
              except Exception as error:
                  errors.append((slug, athlete_id, repr(error)))
                  print('MISS', slug, athlete_id, repr(error))
          assert not errors, errors
          PY
      - name: Commit clean batch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-lightweight-depth.yml
          git add src/features/play/playFighterRatings.ts src/features/play/blindRankArchetypes.test.ts public/assets/fighters/*-thumb.webp
          git commit -m 'Add Lightweight Blind Rank fighter depth'
          git push origin HEAD:codex/lightweight-blind-rank-depth
