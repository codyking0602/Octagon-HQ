name: UFC Home ESPN athlete search probe
on:
  push:
    branches: [feat/ufc-home-ranked-espn-portraits-20261114]
    paths: [.github/workflows/ufc-home-portrait-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ESPN athlete search
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          urls=[
            'https://site.web.api.espn.com/apis/search/v2?query='+urllib.parse.quote('Jon Jones')+'&limit=5',
            'https://site.web.api.espn.com/apis/search/v2?query='+urllib.parse.quote('Kayla Harrison')+'&limit=5',
            'https://sports.core.api.espn.com/v2/sports/mma/leagues/ufc/athletes?limit=2',
          ]
          for url in urls:
            print('URL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req, timeout=25) as res:
                raw=res.read(14000)
                print('STATUS',res.status,'BODY',raw[:8000].decode('utf8','replace'),flush=True)
            except Exception as exc: print('ERROR',repr(exc),flush=True)
          PY
