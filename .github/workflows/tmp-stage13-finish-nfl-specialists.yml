name: Temporary Stage 13 Finish NFL Specialists

on:
  push:
    branches:
      - stage13-6-finish-nfl-specialists

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent --no-audit --no-fund
      - name: Hydrate historical NFL specialist facts
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/back-room/footballFactualStatsExpansion.ts')
          text = path.read_text()
          source_marker = '  {\n    id: "pfr-defensive-career",'
          source = '\n'.join([
              '  {',
              '    id: "pfr-specialist-career",',
              '    publisher: "Pro Football Reference",',
              '    title: "NFL kicker and punter career records",',
              '    url: "https://www.pro-football-reference.com/players/",',
              '    reviewedOn: "2026-08-29",',
              '    coverage: "Completed NFL kicker and punter career production used by the canonical Football factual ledger",',
              '  },',
              '',
          ])
          if 'id: "pfr-specialist-career"' not in text:
              text = text.replace(source_marker, source + source_marker, 1)
          helper_marker = 'const defender = (\n'
          helpers = '\n'.join([
              'const kicker = (subjectId: string, made: number, attempted: number, percentage: number) =>',
              '  record(subjectId, "nfl-player-career", "pfr-specialist-career", [',
              '    ["nfl-career-field-goals-made", made],',
              '    ["nfl-career-field-goals-attempted", attempted],',
              '    ["nfl-career-field-goal-percentage", percentage],',
              '  ]);',
              '',
              'const punter = (subjectId: string, punts: number, yards: number, average: number) =>',
              '  record(subjectId, "nfl-player-career", "pfr-specialist-career", [',
              '    ["nfl-career-punts", punts],',
              '    ["nfl-career-punting-yards", yards],',
              '    ["nfl-career-punting-average", average],',
              '  ]);',
              '',
          ])
          if 'const kicker = (' not in text:
              text = text.replace(helper_marker, helpers + helper_marker, 1)
          record_marker = '  // NFL receivers and tight ends: real career counting stats, not comparison ratings.\n'
          rows = '\n'.join([
              '  // NFL specialists: reviewed career kicking and punting facts.',
              '  kicker("nfl-jan-stenerud", 373, 558, 66.8),',
              '  kicker("nfl-mark-moseley", 300, 457, 65.6),',
              '  punter("nfl-ray-guy", 1049, 44493, 42.4),',
              '  punter("pat-mcafee", 575, 26653, 46.4),',
              '',
          ])
          if 'kicker("nfl-jan-stenerud"' not in text:
              text = text.replace(record_marker, rows + record_marker, 1)
          path.write_text(text)
          PY
      - run: npm run generate:football-cfb-player-seasons && npm run generate:football-factual-universe && npm run generate:football-ledger-audit
      - name: Commit canonical source, generated audit, and self-clean
        run: |
          rm .github/workflows/tmp-stage13-finish-nfl-specialists.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/back-room/footballFactualStatsExpansion.ts docs/football-ledger-stage13-5-review.md .github/workflows/tmp-stage13-finish-nfl-specialists.yml
          git commit -m 'Finish Stage 13.6 NFL specialist factual hydration'
          git push origin HEAD:stage13-6-finish-nfl-specialists
