name: Refresh UFCStats Supplemental Facts

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    paths:
      - scripts/bootstrap-ufcstats-reconciliation.mjs
      - scripts/bootstrap-ufcstats-finish-source.mjs
      - .github/workflows/refresh-ufcstats-supplemental.yml

permissions:
  contents: write

concurrency:
  group: ufcstats-supplemental-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REFRESH_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out exact refresh branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REFRESH_BRANCH }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked app dependencies
        run: npm ci

      - name: Apply one-time canonical reconciliation
        run: node scripts/bootstrap-ufcstats-reconciliation.mjs

      - name: Move finish ownership to UFCStats result method
        run: node scripts/bootstrap-ufcstats-finish-source.mjs

      - name: Refresh checked-in UFCStats supplemental snapshot
        run: node scripts/backfill-ufcstats-supplemental.mjs

      - name: Verify supplemental snapshot and TypeScript boundary
        run: |
          npm run typecheck
          npx vitest run src/features/rankings/data/ufcStatsSupplementalFacts.test.ts
          git diff --check

      - name: Commit reconciled snapshot and source owner changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/refresh-ufcstats-supplemental.yml \
            scripts/backfill-ufcstats-supplemental.mjs \
            scripts/bootstrap-ufcstats-reconciliation.mjs \
            scripts/bootstrap-ufcstats-finish-source.mjs \
            src/features/rankings/data/v2RankingRoster.ts \
            src/features/rankings/engine/schemas.ts \
            src/features/rankings/data/ufcStatsSupplementalFacts.test.ts \
            src/features/rankings/data/generated/ufcstats-supplemental-facts-v1.json
          git diff --cached --check
          git commit -m "Populate UFCStats supplemental fight facts"
          git push origin "HEAD:${REFRESH_BRANCH}"
